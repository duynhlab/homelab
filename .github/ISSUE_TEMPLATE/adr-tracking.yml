name: ADR implementation tracking
description: Track an accepted ADR with an independent delivery boundary. Shared initiatives can cover several ADRs.
title: "[ADR-NNN] "
type: adr
labels:
  - area/adr
projects:
  - duynhlab/1
body:
  - type: markdown
    attributes:
      value: |
        Use this form when an accepted ADR needs an independent tracker; otherwise link the shared initiative. Set the issue type to **adr** (`gh issue create --type adr`) and link it from the ADR's `Implementation tracking` row. The ADR keeps the decision; this issue keeps the working log. Process: `docs/proposals/adr/README.md` § Process.
  - type: input
    id: adr
    attributes:
      label: ADR
      description: Path or link to the ADR, with its current Adoption.
      placeholder: docs/proposals/adr/ADR-NNN-slug/ — Adoption Not started
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision in one paragraph
      description: What was decided, in the ADR's words. No rationale here; the ADR has it.
    validations:
      required: true
  - type: textarea
    id: obligations
    attributes:
      label: Obligations
      description: Map every adoption obligation to a verifiable task. Use native sub-issues for independently deliverable outcomes; related checks can share a task. Deferred commitments need a revisit trigger.
      placeholder: |
        | Obligation | Depends on | Gate |
        |---|---|---|
        | | | |
    validations:
      required: true
  - type: textarea
    id: owner
    attributes:
      label: Owner-only actions
      description: Steps only the repository owner can run (OIDC sessions, org settings, merges that need a grant) and what each one unblocks.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        **Tradeoff log.** When a choice is made during implementation that the ADR did not settle, add a comment on this issue in this shape, then reference the comment from the PR and from the ADR's History row:

        `**Tradeoff — <topic>** · chose X over Y · because … · evidence: <PR / gate row>`
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The observable state that lets the ADR's Adoption move to Complete and this issue close.
    validations:
      required: true
