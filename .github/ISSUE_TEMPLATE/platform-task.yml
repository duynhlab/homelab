name: Platform task or small change
description: Propose bounded maintenance, operational work, or a small platform change that does not need an RFC.
title: "[Task] "
type: Task
labels:
  - task
body:
  - type: markdown
    attributes:
      value: |
        Use this form for bounded work. For a substantial or contested architecture change, follow the RFC research and owner-approval process linked from the issue chooser first.
  - type: input
    id: parent
    attributes:
      label: Parent decision
      description: The ADR tracking issue this task belongs to, if any. Open the task as a sub-issue of it (`gh issue create --parent <issue>`) so progress shows on the parent.
      placeholder: "ADR-NNN · #issue"
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What needs attention, and why now?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result, not just the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Identify the affected area, relevant dependencies, and any explicit non-goals.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the checks that will demonstrate completion.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification or rollout notes
      description: Include the appropriate validation, rollout, and recovery considerations.
    validations:
      required: false
