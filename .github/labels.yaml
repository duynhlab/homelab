# Core GitHub labels managed by .github/workflows/sync-labels.yml.
# Automation-owned labels (for example size/* and review labels) stay outside
# this file; delete-other-labels remains false so label-sync preserves them.

- name: bug
  description: Something isn't working
  color: '#e60000'
- name: enhancement
  description: New feature or request
  color: '#80e27e'
- name: documentation
  description: Improvements or additions to documentation
  color: '#0075ca'
- name: dependencies
  description: Pull requests that update a dependency
  color: '#005cbf'
- name: github-actions
  description: Pull requests that update GitHub Actions workflows
  color: '#A3E89A'
