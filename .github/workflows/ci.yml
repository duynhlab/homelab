name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # 1. PR Checks (Branch Name Validation + Slack "PR Opened")
  pr-checks:
    if: github.event_name == 'pull_request'
    uses: duynhlab/gha-workflows/.github/workflows/pr-checks.yml@main
    with:
      slack_channel_id: "C0AD82A9A74"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  # 2. Validate Kubernetes Manifests
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup yq
        uses: fluxcd/pkg/actions/yq@dfc427c54394de76e0053c2eba45699fad01c3b4 # main 2026-08-19

      - name: Setup kubeconform
        uses: fluxcd/pkg/actions/kubeconform@992c220c423e137a6c1808828d8bc569249abc12 # main 2026-08-19

      - name: Setup kustomize
        uses: fluxcd/pkg/actions/kustomize@dfc427c54394de76e0053c2eba45699fad01c3b4 # main 2026-08-19

      # Pinned to the engine the cluster runs: chart 3.8.2 ships Kyverno
      # v1.18.2. A CLI ahead of the engine can agree with itself and disagree
      # with admission, which is worse than having no gate.
      - name: Setup Kyverno CLI
        env:
          KYVERNO_VERSION: v1.18.2
        run: |
          set -euo pipefail
          curl -fsSL -o kyverno.tar.gz \
            "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          tar -xzf kyverno.tar.gz kyverno
          sudo install -m 0755 kyverno /usr/local/bin/kyverno
          kyverno version

      - name: Validate manifests
        run: ./scripts/flux-validate.sh

  # 3. Validate links in Markdown added or changed by a pull request
  markdown-links:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Markdown links
        uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1.1.3
        with:
          use-quiet-mode: 'yes'
          check-modified-files-only: 'yes'
          base-branch: main
          config-file: .github/markdown-link-check.json

  # 4. Final Status Notification
  notify:
    if: always()
    needs: [pr-checks, validate, markdown-links]
    uses: duynhlab/gha-workflows/.github/workflows/status.yml@main
    with:
      slack_channel_id: "C0AD82A9A74"
      slack_thread_ts: ${{ needs.pr-checks.outputs.slack_thread_ts }}
      gsheet_spreadsheet_id: "1F2VUrAOyMGnETApp5yA-ldCW81ConiQXnWYZVxKas_0"
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      GSHEET_CLIENT_EMAIL: ${{ secrets.GSHEET_CLIENT_EMAIL }}
      GSHEET_PRIVATE_KEY: ${{ secrets.GSHEET_PRIVATE_KEY }}
