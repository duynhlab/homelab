name: Delete workflow runs

# Manual cleanup of finished Actions runs through the shared reusable workflow
# in gha-workflows. The first run is a dry run: it lists what would be deleted
# and changes nothing; run it again with dry_run unchecked to delete.
# retain_days: 0 deletes every finished run. The executing run is never deleted.

on:
  workflow_dispatch:
    inputs:
      retain_days:
        description: "Delete finished runs older than this many days. 0 deletes every finished run."
        required: false
        type: number
        default: 30
      dry_run:
        description: "Log the runs that would be deleted and do not delete them."
        required: false
        type: boolean
        default: true

# Deny-all baseline; the reusable job widens to actions: write (cicd.md § permissions).
permissions: {}

jobs:
  # Two jobs, not one with conditional expressions: the scheduled trigger has
  # no inputs, so it passes literals; the manual one forwards its own.
  scheduled:
    if: github.event_name == 'schedule'
    uses: duynhlab/gha-workflows/.github/workflows/delete-workflow-runs.yml@main
    with:
      retain_days: 30
      dry_run: false
    permissions:
      actions: write
      contents: read

  manual:
    if: github.event_name == 'workflow_dispatch'
    uses: duynhlab/gha-workflows/.github/workflows/delete-workflow-runs.yml@main
    with:
      # A dispatch from the API or `gh workflow run -f` delivers the inputs as
      # strings, and the called workflow's typed inputs reject "30" / "true"
      # ("Unexpected value '30'"). format() makes the value a string whatever
      # the source, fromJSON turns it back into a number / boolean.
      retain_days: ${{ fromJSON(format('{0}', inputs.retain_days)) }}
      dry_run: ${{ fromJSON(format('{0}', inputs.dry_run)) }}
    permissions:
      actions: write
      contents: read
