name: Delete workflow runs

# Prunes finished Actions runs through the shared reusable workflow in
# gha-workflows: every day at 02:17 Asia/Ho_Chi_Minh (19:17 UTC) it deletes
# finished runs older than 7 days. Runs still queued or in progress and the
# executing run itself are never deleted. No manual trigger: the window is a
# repository decision, not a per-run choice.

on:
  schedule:
    # Off the hour to dodge the top-of-hour cron stampede.
    - cron: "17 19 * * *"

# Deny-all baseline; the reusable job widens to actions: write (cicd.md § permissions).
permissions: {}

jobs:
  delete-runs:
    uses: duynhlab/gha-workflows/.github/workflows/delete-workflow-runs.yml@main
    with:
      retain_days: 7
      dry_run: false
    permissions:
      actions: write
      contents: read
