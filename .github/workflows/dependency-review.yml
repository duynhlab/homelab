name: Dependency review

# AI reads the release notes of a Renovate PR, maps them to how this repository
# uses the dependency, and leaves one structured comment plus impact/* labels.
# Guide and the owner-maintained review rules: docs/platform/dependency-review.md.
#
# Three jobs with separate permissions on purpose: the job that runs the AI has
# read-only access and a Copilot-only token, because release notes are
# third-party text. Posting happens in a different job from a validated file.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number, or 'all' for every open Renovate PR"
        required: false
        default: "all"
      max:
        description: "Maximum PRs to review in this run"
        required: false
        default: "10"
      force:
        description: "Re-review even if the current head SHA already has a review"
        type: boolean
        required: false
        default: false
      dry_run:
        description: "Print the comment and label plan instead of posting"
        type: boolean
        required: false
        default: true

# Deny-all baseline; each job widens only what it needs (cicd.md § permissions).
permissions: {}

concurrency:
  # One review per PR at a time; a push mid-review cancels the stale one.
  group: dependency-review-${{ github.event.pull_request.number || inputs.pr || 'all' }}
  cancel-in-progress: true

env:
  # Flip to "false" to let pull_request events post for real. workflow_dispatch
  # follows its own dry_run input.
  PULL_REQUEST_DRY_RUN: "true"

jobs:
  select:
    name: Select PRs
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/dependency-review

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Pick PRs
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr }}
          INPUT_MAX: ${{ inputs.max }}
          INPUT_FORCE: ${{ inputs.force }}
        run: node .github/dependency-review/select.mjs

  review:
    name: "Review #${{ matrix.pr.number }}"
    needs: select
    if: needs.select.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    steps:
      # Always main: the AI reads the repository, never executes the PR branch.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Fetch PR inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ matrix.pr.number }}
        run: |
          set -euo pipefail
          mkdir -p .review
          gh pr view "$PR" --json number,title,body,headRefOid,baseRefName,files,labels,url > .review/pr.json
          gh pr diff "$PR" > .review/pr.diff
          gh pr list --author app/renovate --state open --limit 100 \
            --json number,title,headRefName,url > .review/siblings.json
          jq -r '"PR #\(.number) \(.title) @ \(.headRefOid[0:7])"' .review/pr.json

      - name: Copilot review
        env:
          # Copilot Requests only; no repository write scope. Copilot reads it
          # before GH_TOKEN, so the job token below stays read-only for gh.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          GH_TOKEN: ${{ github.token }}
          COPILOT_MODEL: ${{ vars.DEPENDENCY_REVIEW_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "${COPILOT_GITHUB_TOKEN:-}" ]; then
            echo "::error::COPILOT_PAT secret is not set (fine-grained PAT with Copilot Requests)"
            exit 1
          fi
          model_args=()
          if [ -n "${COPILOT_MODEL:-}" ]; then model_args=(--model "$COPILOT_MODEL"); fi
          # Deny rules win over --allow-all-tools: no PR writes, no API calls,
          # no pushes, no outbound fetches from the job that reads untrusted text.
          copilot -p "$(cat .github/dependency-review/prompt.md)" \
            --allow-all-tools \
            --deny-tool='shell(gh pr)' \
            --deny-tool='shell(gh api)' \
            --deny-tool='shell(gh issue)' \
            --deny-tool='shell(git push)' \
            --deny-tool='shell(curl)' \
            --deny-tool='shell(wget)' \
            --output-format json --stream off --no-sandbox \
            --trust-folder "$PWD" \
            "${model_args[@]}" \
            > .review/copilot.jsonl 2> .review/copilot.stderr || true
          ls -l .review

      - name: Validate review.json (retry once through Copilot)
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if node .github/dependency-review/post.mjs .review/review.json --check; then exit 0; fi
          errors=$(node .github/dependency-review/post.mjs .review/review.json --check 2>&1 || true)
          copilot -p "Fix .review/review.json so it satisfies .github/dependency-review/schema.json. Validator output:
          $errors
          Keep every finding; only correct structure, enums and required keys. Write only .review/review.json." \
            --allow-all-tools \
            --deny-tool='shell(gh pr)' --deny-tool='shell(gh api)' --deny-tool='shell(gh issue)' \
            --deny-tool='shell(git push)' --deny-tool='shell(curl)' --deny-tool='shell(wget)' \
            --output-format json --stream off --no-sandbox --trust-folder "$PWD" \
            >> .review/copilot.jsonl 2>> .review/copilot.stderr || true
          node .github/dependency-review/post.mjs .review/review.json --check

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-${{ matrix.pr.number }}
          path: .review/
          if-no-files-found: warn
          retention-days: 14

  post:
    name: "Post #${{ matrix.pr.number }}"
    needs: [select, review]
    if: always() && needs.select.outputs.prs != '[]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/dependency-review

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Download review artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-${{ matrix.pr.number }}
          path: .review

      - name: Post comment and labels
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || env.PULL_REQUEST_DRY_RUN }}
        run: |
          set -euo pipefail
          if [ ! -f .review/review.json ]; then
            echo "::warning::no review.json for #$PR_NUMBER; the review job failed, nothing posted"
            exit 0
          fi
          node .github/dependency-review/post.mjs .review/review.json
