name: Renovate

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# Deny-all baseline; the job widens what it needs (cicd.md § permissions).
permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Renovate authenticates with RENOVATE_TOKEN; the checkout must not
          # leave the ambient GITHUB_TOKEN in .git/config (cicd.md § checkout
          # in privileged jobs).
          persist-credentials: false
      - uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        with:
          configurationFile: .renovaterc.json5
          token: ${{ secrets.RENOVATE_TOKEN }}
