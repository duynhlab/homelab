# Source of docs/architecture/databases/topology.drawio -- edit this, then regenerate:
#   python3 .agents/skills/homelab-drawio/scripts/generate.py docs/architecture/databases/topology.ir.yaml
# Verified on 2026-10-16 against kubernetes/apps/services/*.yaml (db_host,
# db_migration_host, db_sslmode), configs/databases/clusters/*/{instance,objectstore}.yaml,
# the PgDog HelmRelease (primary only, ADR-089) and PgBouncer Pooler,
# configs/databases/clusters/*/authz/ (role catalog Job + CronJob, pgroles policies),
# controllers/keycloak/deployment.yaml, controllers/temporal/helmrelease.yaml and
# platform-db/{openbao-db-config,vault-rotator}.yaml.
# Re-verified 2026-10-19 (ADR-089, after #1312) against apps/services/*.yaml
# (db_sslmode verify-full, db_ca_secret), */server-tls.yaml, */poolers/
# (pooler.yaml clientTLSSecret + client_tls_sslmode require; PgDog helmrelease
# tlsClientRequired, passthroughAuth, tlsVerify verify_full),
# {platform,product}-db/{openbao-db-config,vault-rotator}.yaml (sslmode=require,
# 4 + 6 static roles, rotation_period 720h), */services/*.yaml (ExternalSecrets on
# openbao-db every 15s, DatabaseRoles without passwordSecret) and */secrets/
# (the service-namespace copies).
# CDC added 2026-10-26 (RFC-0030) from configs/cdc/{catalog.yaml,bootstrap/
# bootstrap.py}, product-db/cdc/{pooler.yaml,bootstrap.sh,bootstrap.yaml} and
# openbao-bootstrap/configmap.yaml (peerdb_*, analytics_heartbeat, peerdb_catalog).
# Visual review 2026-10-19: e_mig_product label moved (label_pos) off the crowded
# entry into product-db; content unchanged.
diagram:
  id: databases
  title: "duynhlab homelab — Database connection and recovery paths"
  scope: "Every path into Postgres: which pooler or direct host each client uses, who manages the clusters, and where WAL and backups go, including the DR replica that recovers from them. Engine internals are out of scope."
  question: domain-topology
  level: L2
  animate: [data, replication]
  legend:
    roles:
      service: "Service clients"
      platform: "Platform client / controller"
      worker: "Jobs and CDC workers"
      data: "Pooler / database / bucket"
    edges:
      data: "SQL connection"
      control: "manages / rotates"
      replication: "WAL + backups / recovery"
      dependency: "migration (direct -rw)"

layers: [clients, poolers, clusters, storage, dr]

boundaries:
  - {id: f_cluster, label: "Kind cluster · homelab"}
  - {id: f_clients, label: "Clients", parent: f_cluster}
  - {id: f_cnpg, label: "cloudnative-pg namespace", parent: f_cluster}
  - {id: f_platform, label: "platform namespace", parent: f_cluster}
  - {id: f_product, label: "product namespace", parent: f_cluster}
  - {id: f_rustfs, label: "rustfs namespace", parent: f_cluster}

nodes:
  # Listed in the order dot starts from: the fewest crossings of ~600
  # orderings measured with validate.py on 2026-09-28. Payment joined the
  # product-db services' box on 2026-10-19 (same pooler, same TLS mode); all 720
  # client orders were then measured: 15 crossings is the floor, and this is that order.
  - {id: c_migrate, label: "Migration Jobs\nevery service, before rollout\nverify-full", role: worker, layer: clients, parent: f_clients}
  - {id: c_keycloak, label: "Keycloak (identity)\nJDBC, long-lived pool", role: platform, layer: clients, parent: f_clients, icon: keycloak}
  - {id: c_platform, label: "user · notification\nshipping · review", role: service, layer: clients, parent: f_clients, icon: go}
  - {id: c_product, label: "product · cart · order\ncheckout · inventory · payment", role: service, layer: clients, parent: f_clients, icon: go}
  - {id: c_temporal, label: "Temporal server (temporal)\ntemporal · temporal_visibility", role: platform, layer: clients, parent: f_clients, icon: temporal}
  - {id: c_authz, label: "Authorization executors\nauthz Job + CronJob per cluster\npgroles · as db_authz", role: platform, layer: clients, parent: f_clients}
  - {id: c_peerdb, label: "PeerDB (peerdb)\nflow-worker · snapshot-worker · flow-api\npeerdb_<db> · peerdb_catalog", role: worker, layer: clients, parent: f_clients}
  - {id: c_cdcboot, label: "CDC bootstrap Job + CronJob (10 min)\nheartbeat tables · pg_cron jobs\nSELECT on published tables", role: worker, layer: clients, parent: f_clients}

  - {id: openbao, label: "OpenBao database engine\nvault_rotator per cluster\n10 runtime static roles", role: platform, layer: poolers, parent: f_cluster, icon: openbao}
  - {id: pgbouncer, label: "platform-db-pooler-rw\nPgBouncer ×2 · transaction\nclient TLS required", role: data, layer: poolers, parent: f_platform}
  - {id: cnpg, label: "CloudNativePG operator\n+ barman-cloud plugin", role: platform, layer: poolers, parent: f_cnpg, icon: cloudnativepg}
  - {id: cdcpool, label: "product-db-pooler-cdc\nPgBouncer · session · replication\nclient TLS required", role: data, layer: poolers, parent: f_product}
  - {id: pgdog, label: "pgdog-product ×3 :6432\nprimary only · TLS required\npassthrough auth (ADR-089)", role: data, layer: poolers, parent: f_product, icon: pgdog}

  - {id: productdb, label: "product-db ×3 · sync any 1\nproduct · cart · order · payment\ncheckout · inventory", role: data, layer: clusters, parent: f_product, shape: datastore, icon: postgresql}
  - {id: platformdb, label: "platform-db ×3 · sync any 1\nuser · notification · shipping · review\nkeycloak · temporal · temporal_visibility\npeerdb_catalog", role: data, layer: clusters, parent: f_platform, shape: datastore, icon: postgresql}

  - {id: rustfs, label: "RustFS bucket pg-backups-cnpg\nplatform-db/ · product-db/ (30 d)\nproduct-db-replica/ (7 d)", role: data, layer: storage, parent: f_rustfs, shape: datastore}

  - {id: replica, label: "product-db-replica ×1\nDR: designated primary\n(3 on promotion)", role: data, layer: dr, parent: f_product, shape: datastore, icon: postgresql}

edges:
  - {id: e_platform, source: c_platform, target: pgbouncer, type: data, label: ":5432 verify-full"}
  - {id: e_product, source: c_product, target: pgdog, type: data, label: ":6432 verify-full"}
  - {id: e_keycloak, source: c_keycloak, target: platformdb, type: data, label: "direct"}
  - {id: e_temporal, source: c_temporal, target: platformdb, type: data, label: "direct"}
  - {id: e_mig_platform, source: c_migrate, target: platformdb, type: dependency, label: "platform-db-rw"}
  - {id: e_mig_product, source: c_migrate, target: productdb, type: dependency, label: "product-db-rw", label_pos: -0.3}
  - {id: e_authz_platform, source: c_authz, target: platformdb, type: control, label: "roles + grants"}
  - {id: e_authz_product, source: c_authz, target: productdb, type: control, label: "roles + grants"}

  - {id: e_peerdb_src, source: c_peerdb, target: cdcpool, type: data, label: ":5432 TLS · rootCa"}
  - {id: e_peerdb_cat, source: c_peerdb, target: platformdb, type: data, label: "catalog · verify-full"}
  - {id: e_cdcboot, source: c_cdcboot, target: productdb, type: control, label: "heartbeats + CDC grants"}
  - {id: e_cdcpool, source: cdcpool, target: productdb, type: data, label: "-rw · verify-full · replication"}
  - {id: e_pgbouncer, source: pgbouncer, target: platformdb, type: data, label: "primary · verify-full"}
  - {id: e_pgdog, source: pgdog, target: productdb, type: data, label: "-rw · verify-full"}

  - {id: e_rotate, source: openbao, target: platformdb, type: control, label: "rotates 4 runtimes (720 h)"}
  - {id: e_rotate_product, source: openbao, target: productdb, type: control, label: "rotates 6 runtimes (720 h)"}
  - {id: e_cnpg_platform, source: cnpg, target: platformdb, type: control, label: manages}
  - {id: e_cnpg_product, source: cnpg, target: productdb, type: control, label: manages}
  - {id: e_cnpg_replica, source: cnpg, target: replica, type: control, label: manages}

  - {id: e_wal_platform, source: platformdb, target: rustfs, type: replication, label: "WAL + base backups"}
  - {id: e_wal_product, source: productdb, target: rustfs, type: replication, label: "WAL + base backups"}
  - {id: e_recover, source: rustfs, target: replica, type: replication, label: "continuous WAL recovery"}

notes:
  - id: note_creds
    title: "Credentials"
    text: "All ten <service>_runtime passwords belong to the OpenBao database engine: one static role per runtime, rotated every 720 h by that cluster's vault_rotator (one openbao-db-config Job per cluster). External Secrets reads database/static-creds/<service>-runtime through the openbao-db store every 15 s into a Secret in the cluster namespace and in the service namespace; pods mount it and read DB_PASSWORD_FILE, and the DatabaseRoles carry no passwordSecret. OpenBao KV (store openbao, hourly) holds the migrators, db_authz, vault_rotator, Temporal and Keycloak, and the CDC logins: peerdb_<db>, analytics_heartbeat and peerdb_catalog. The CDC pooler (product-db-pooler-cdc, session mode, so PeerDB can open replication connections) looks logins up the same way; PeerDB reaches product-db only through it, and its catalog directly. pg_cron, inside product-db, writes the CDC heartbeats every 30 s. Neither application pooler holds a password: PgDog passes each login through to product-db, PgBouncer looks it up with auth_query over a client certificate. Every service, worker, migration and authz hop verifies the homelab-ca server certificate (verify-full); Keycloak, Temporal, OpenBao and pgroles do not yet (#1296, #1306). Backups authenticate to RustFS with pg-backup-rustfs-credentials."
  - id: note_dr
    title: "Why the DR replica reads from RustFS"
    text: "product-db-replica never connects to the primary: it bootstraps from product-db's base backup and then replays its WAL archive from the bucket, so it survives the loss of the product-db pods. Its designated primary keeps its own archive and a daily backup in product-db-replica/ (7 d). Migrations always target the -rw service directly, never a pooler."

tests:
  - {rule: no-public-datastore}
