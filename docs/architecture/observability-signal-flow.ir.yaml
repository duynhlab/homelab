# Source of docs/architecture/observability-signal-flow.drawio -- edit this, then regenerate:
#   python3 .agents/skills/homelab-drawio/scripts/generate.py docs/architecture/observability-signal-flow.ir.yaml
# Verified on 2026-09-28 against controllers/tracing/otel-collector/otel-collector.yaml
# (service.pipelines, exporter endpoints), the VMSingle/VLSingle/VTSingle
# retentionPeriod, the Pyroscope compactor retention and the clickhouse-schema DDL TTL.
diagram:
  id: signal-flow
  title: "duynhlab homelab — Observability signal flow and retention"
  scope: "Where every signal goes on the cluster: which OTel Collector pipeline carries it, which backend stores it, and for how long. Delivery order is a different question — see observability-delivery.drawio."
  question: domain-topology
  level: L3
  legend:
    roles:
      trace: "Traces pipeline / store"
      log: "Logs pipeline / store"
      metric: "Metrics pipeline / store"
      profile: "Profiles store"
      data: "SQL / object store"
      platform: "Scrape targets · Grafana"
    edges:
      data: "read / written (Grafana queries, cold tier)"

layers: [producers, receiver, pipelines, derived, ingest, stores, cold, view]

boundaries:
  - {id: f_src, label: "Producers"}
  - {id: f_col, label: "OTel Collector (tracing namespace)"}
  - {id: f_store, label: "Storage (monitoring namespace)"}

nodes:
  - {id: edge, label: "Envoy Gateway\nedge spans · access logs", role: edge, layer: producers, parent: f_src, icon: envoy}
  - {id: svc, label: "Go services ×10 · 2 workers · mockpay\ntraces · metrics · logs", role: service, layer: producers, parent: f_src, icon: go}
  - {id: pyrosdk, label: "Same Go processes\nPyroscope SDK", role: service, layer: producers, parent: f_src, icon: go}
  - {id: targets, label: "Scrape targets\nkube-state-metrics · cAdvisor · CNPG · Temporal", role: platform, layer: producers, parent: f_src}
  - {id: vector, label: "Vector DaemonSet\nplatform pod logs", role: collector, layer: producers, parent: f_src}

  - {id: otel, label: "OTLP receiver\ngRPC :4317 · HTTP :4318", role: collector, layer: receiver, parent: f_col, icon: opentelemetry}

  - {id: p_traces, label: "traces\nmemory_limiter · transform/privacy · batch", role: trace, layer: pipelines, parent: f_col}
  - {id: p_logs, label: "logs\ndrop edge access logs · privacy · k8sattributes", role: log, layer: pipelines, parent: f_col}
  - {id: p_logsch, label: "logs/clickhouse\nprivacy · k8sattributes (all logs)", role: log, layer: pipelines, parent: f_col}
  - {id: p_metrics, label: "metrics\nmemory_limiter · delta_to_cumulative", role: metric, layer: derived, parent: f_col}

  - {id: p_span, label: "metrics/spanmetrics\nspan_metrics connector · RED per span", role: metric, layer: derived, parent: f_col}

  - {id: vmagent, label: "vmagent\nscrape · OTLP ingest · remote write", role: metric, layer: ingest, parent: f_store, icon: victoriametrics}

  - {id: vt, label: "VictoriaTraces\n7 d", role: trace, layer: stores, parent: f_store, icon: victoriametrics}
  - {id: ch, label: "ClickHouse otel_traces · otel_logs\n7 d hot, cold volume, deleted at 90 d", role: data, layer: stores, parent: f_store, icon: clickhouse}
  - {id: vl, label: "VictoriaLogs\n7 d", role: log, layer: stores, parent: f_store, icon: victoriametrics}
  - {id: vm, label: "VictoriaMetrics (VMSingle)\n7 d", role: metric, layer: stores, parent: f_store, icon: victoriametrics}
  - {id: pyro, label: "Pyroscope\n7 d (168 h)", role: profile, layer: stores, parent: f_store, icon: pyroscope}

  - {id: rustfs, label: "RustFS buckets\nclickhouse-otel · pyroscope-profiles", role: data, layer: cold, parent: f_store, shape: datastore}

  - {id: grafana, label: "Grafana\none datasource per backend", role: platform, layer: view, icon: grafana}

edges:
  - {id: e_edge, source: edge, target: otel, type: telemetry, protocol: "OTLP/gRPC"}
  - {id: e_svc, source: svc, target: otel, type: telemetry, protocol: "OTLP/HTTP"}

  - {id: r_traces, source: otel, target: p_traces, type: telemetry, signal: trace}
  - {id: r_logs, source: otel, target: p_logs, type: telemetry, signal: log}
  - {id: r_logsch, source: otel, target: p_logsch, type: telemetry, signal: log}
  - {id: r_metrics, source: otel, target: p_metrics, type: telemetry, signal: metric}

  - {id: c_span, source: p_traces, target: p_span, type: telemetry, signal: trace, label: "connector"}
  - {id: x_vt, source: p_traces, target: vt, type: telemetry, signal: trace}
  - {id: x_cht, source: p_traces, target: ch, type: telemetry, signal: trace}
  - {id: x_vl, source: p_logs, target: vl, type: telemetry, signal: log}
  - {id: x_chl, source: p_logsch, target: ch, type: telemetry, signal: log}
  - {id: x_otlpm, source: p_metrics, target: vmagent, type: telemetry, signal: metric, label: "OTLP/HTTP"}
  - {id: x_rw, source: p_span, target: vmagent, type: telemetry, signal: metric, label: "remote write"}

  - {id: b_scrape, source: targets, target: vmagent, type: telemetry, signal: metric, label: "scraped"}
  - {id: b_vector, source: vector, target: vl, type: telemetry, signal: log, label: "HTTP jsonline"}
  - {id: b_pyro, source: pyrosdk, target: pyro, type: telemetry, signal: profile, label: "SDK push"}
  - {id: s_vm, source: vmagent, target: vm, type: telemetry, signal: metric, label: "remote write"}

  - {id: s_chcold, source: ch, target: rustfs, type: data, label: "cold volume after 7 d"}
  - {id: s_pyro, source: pyro, target: rustfs, type: data, label: "blocks"}

  - {id: q_vt, source: vt, target: grafana, type: data}
  - {id: q_ch, source: ch, target: grafana, type: data}
  - {id: q_vl, source: vl, target: grafana, type: data}
  - {id: q_vm, source: vm, target: grafana, type: data}
  - {id: q_pyro, source: pyro, target: grafana, type: data}

notes:
  - id: note
    title: "Retention"
    text: "VictoriaMetrics, VictoriaLogs, VictoriaTraces and Pyroscope keep 7 days. ClickHouse keeps the same traces and logs for 90 days (7 days on the hot volume, then the RustFS cold volume), which is where a question older than a week goes. Edge access logs reach ClickHouse only: the VictoriaLogs pipeline drops them. Every arrow into Grafana is a query, one datasource per backend."

tests:
  - {rule: telemetry-has-destination}
