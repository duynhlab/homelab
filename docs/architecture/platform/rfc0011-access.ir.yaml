notes:
- id: separate
  title: Access boundaries
  text: The LAN column is independent recovery, not a Tailscale Operator feature. A remote Talos/LAN route
    is still an open design. Access IdP is not selected; the Keycloak card represents application identity
    only. No WARP is required.
- id: policy
  title: Publication and authorization
  text: This view follows private web access. Explicit public web routes are a separate allowlist decision
    and retain application auth. Management APIs and datastores have no public Tunnel route. Selected
    private services need their own tailnet restrictions; this view shows the Kubernetes API path.
- id: origin
  title: Origin and recovery gates
  text: Validate Access tokens at cloudflared or the origin; preserve Host/SNI and TLS verification. Review
    forwarded headers and admin CIDR trust. Recovery credentials and LAN procedures must work without
    connectors or in-cluster identity.
tests:
- rule: no-public-datastore
