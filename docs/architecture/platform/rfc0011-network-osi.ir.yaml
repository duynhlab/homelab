notes:
- id: reading
  title: Read by network function
  text: L1 carries bits; L2 forwards frames; L3 routes IP; L4 carries TCP/UDP; L5–L7 describe session,
    representation and application functions. These OSI numbers differ from the five hosting bands in
    the stack preview. The physical and access views own connectivity and request paths.
- id: span
  title: Products span layers
  text: 'Tailscale carries IP at L3 over WireGuard, normally using UDP; relays may carry encrypted traffic
    when direct connectivity is unavailable. Its API proxy is L7. The depicted Cloudflare web proxy uses
    an outbound Tunnel connection: QUIC/UDP 7844 or HTTP/2/TCP 7844. No inbound management port forwarding
    is proposed.'
- id: homelab
  title: Tailscale homelab choices
  text: A supported host can run its own client. A subnet router extends access to selected LAN CIDRs;
    route approval and access policy are separate requirements. An Operator Connector can provide that
    router, but an in-cluster connector is not independent recovery. API proxy and subnet routing are
    separate roles, not consecutive mandatory hops.
- id: open
  title: Not yet selected
  text: No VLAN IDs, subnets, addresses, firewall implementation or CNI routing mode are chosen. A switch
    may also support L3 features, but none are selected here. L5/L6 are teaching analogies for modern
    protocols, not claims of dedicated OSI implementations. Cilium L7 policy is not selected by this view.
