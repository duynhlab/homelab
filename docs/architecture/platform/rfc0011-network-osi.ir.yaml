    target not deployed.
  question: domain-topology
  level: L4
  pin_order: true
  animate: []
  assumptions:
  - This is an OSI role map across local infrastructure and external providers, not a cluster placement
    or packet-path diagram.
  - Modern TCP/IP products span layers. L5/L6 are conceptual functions, not separate devices.
  - IP ranges, VLANs, LAN routes, CNI mode and connector placement remain undecided.
