# Sources: RFC-0011 draft + ADR-087; repo eea44b97, reviewed 2026-10-12.
# Preview only; planned means proposed, not approved.
diagram:
  id: rfc0011-platform
  title: 02 / duynhlab — Platform and access
  scope: RFC-0011 + ADR-087 reference design — proposed, not approved; not deployed.
    Logical components, not host placement.
  question: platform-landscape
  level: L2
  pin_order: false
  animate: []
  assumptions:
  - Lower domain frames are a component inventory, not a dependency graph. Unconnected
    inventory cards are intentional.
  - Products already present on Kind are proposed for the mini-PC substrate; replica
    counts and sizing are not chosen.
