notes:
- id: legend_state
  title: Proposed target / existing products
  text: Every planned card is uninstalled on mini PCs. Product names in lower frames
    reflect the repository baseline; those frames are an inventory, not packet paths.
- id: identity
  title: Authorization stays in place
  text: Access gates private web entry. Tailnet permissions, Kubernetes RBAC and application
    authorization remain separate. Public routes require explicit selection; WARP
    is not required.
- id: rescue
  title: Recovery and open choices
  text: Talos / LAN administration needs a separate route. Keep direct LAN access
    and offline emergency credentials. Hardware, OS, CNI, storage and unseal remain
    under review.
