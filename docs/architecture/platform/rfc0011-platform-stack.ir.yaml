notes:
- id: reading
  title: How to read the stack
  text: Read upward from hardware. Cards name installed-software candidates, not packet paths or pod placement.
    Domain rows inside layer 04 are peers. Dashed + planned means uninstalled on mini PCs, not an approved
    decision.
- id: choices
  title: Open choices and capacity
  text: Node 1 starts the rollout; nodes 2–3 are later expansion, not a claim of HA. Hardware, sizing,
    OS, CNI and storage remain open. Ubuntu + k3s is the OS fallback. Ceph and local persistence are alternatives;
    RustFS is the existing object-store baseline. Native database backups and restore gates remain required.
- id: palette
  title: Role colours
  text: 'Blue: edge • cyan: applications • amber: workers • purple: controllers • green: data. Observability:
    orange metrics, pale green logs, teal traces, violet profiles, light blue collectors.'
