diagram:
  id: rfc0011-stack
  title: 02 / duynhlab — Homelab stack
  scope: 'RFC-0011 reference • Read bottom → top: hardware supports OS, Kubernetes, platform, applications.
    Not deployed.'
  question: platform-landscape
  level: L2
  pin_order: true
  animate: []
  assumptions:
  - 'Owner-requested layered stack: L2 component inventory with explicit OS and physical support layers,
    not a runtime or placement graph.'
  - All mini-PC components are planned, not approved or installed. Existing product choices come from
    Kind; candidate choices remain open.
  - Cards in a band are peers; vertical band order expresses the hosting stack, not install order or packet
    paths.
