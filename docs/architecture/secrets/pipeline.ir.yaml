# Source of docs/architecture/secrets/pipeline.drawio -- edit this, then regenerate:
#   python3 .agents/skills/homelab-drawio/scripts/generate.py docs/architecture/secrets/pipeline.ir.yaml
# Verified on 2026-09-29 against controllers/secrets/{openbao,floci,external-secrets}/ (OpenBao 2.7:
# awskms KMS plugin, declarative audit device, telemetry + ServiceMonitor),
# configs/secrets/{openbao-bootstrap,cluster-secret-store*.yaml,cluster-external-secrets}/,
# configs/secrets/openbao-oidc-config/, platform-db/openbao-db-config.yaml,
# configs/cert-manager/{clusterissuers,bundles}.yaml, configs/envoy-gateway/certificate.yaml
# (+ the local homelab-ca patch in clusters/local/envoy-gateway-config.yaml) and every
# ExternalSecret / ClusterExternalSecret in the repo (30 + 4).
diagram:
  id: secrets-pipeline
  title: "duynhlab homelab — Secrets, TLS and trust pipeline"
  scope: "How a secret travels from OpenBao to the pods that use it, what keeps OpenBao unsealed and configured, how the notification database password rotates, and where the edge certificate and the homelab CA go. Local Kind only; the production cluster runs no secrets stack yet."
  question: domain-topology
  level: L2
  animate: [data]
  legend:
    roles:
      platform: "Platform component"
      data: "Secret / certificate / store"
      worker: "Bootstrap Job"
      service: "Consumers"
      edge: "Edge (TLS termination)"
    edges:
      data: "secret / certificate flow"
      control: "configures · unseals · rotates · signs"
      trust: "staff sign-in"

layers: [actors, store, sync, secret, use, cert, end]

boundaries:
  - {id: f_cluster, label: "Kind cluster · homelab"}
  - {id: f_openbao, label: "openbao namespace", parent: f_cluster}
  - {id: f_eso, label: "external-secrets-system namespace", parent: f_cluster}
  - {id: f_consumers, label: "Consumers", parent: f_cluster}
  - {id: f_certmgr, label: "cert-manager namespace", parent: f_cluster}
  - {id: f_edge, label: "envoy-gateway namespace", parent: f_cluster}

nodes:
  - {id: staff, label: "Staff operators\nKeycloak duynhlab-staff", role: external, layer: actors}
  - {id: bootstrap, label: "openbao-bootstrap Job\ninit · policies · KV seed · revoke root", role: worker, layer: actors, parent: f_openbao}
  - {id: floci, label: "floci KMS emulator\nawskms key alias/openbao-unseal", role: platform, layer: actors, parent: f_openbao}

  - {id: openbao, label: "OpenBao HA Raft ×3 · :8200 (TLS off)\nKV v2 secret/ · database/ engine\naudit → stdout · /v1/sys/metrics", role: platform, layer: store, parent: f_openbao, icon: openbao}

  - {id: eso, label: "External Secrets Operator\nstores: openbao (KV v2) · openbao-db", role: platform, layer: sync, parent: f_eso, icon: external-secrets}

  - {id: secrets, label: "Kubernetes Secrets\n30 ExternalSecrets · 4 ClusterExternalSecrets", role: data, layer: secret, parent: f_cluster, icon: kubernetes}

  - {id: apps, label: "10 Go services\nDB password: secretKeyRef or file", role: service, layer: use, parent: f_consumers, icon: go}
  - {id: platformapps, label: "Keycloak · Temporal · Grafana\nClickHouse · RustFS · Pyroscope", role: service, layer: use, parent: f_consumers}
  - {id: cnpg, label: "CNPG clusters\nDatabaseRole passwords · S3 backup creds", role: data, layer: use, parent: f_consumers, shape: datastore, icon: postgresql}
  - {id: certmgr, label: "cert-manager\nselfsigned → homelab-ca · Let's Encrypt (prod)", role: platform, layer: use, parent: f_certmgr, icon: cert-manager}

  - {id: edgecert, label: "platform-edge-tls\nduynh.me · *.duynh.me · homelab-ca locally", role: data, layer: cert, parent: f_edge}
  - {id: trust, label: "trust-manager Bundle\nhomelab-ca-bundle", role: platform, layer: cert, parent: f_certmgr}

  - {id: envoy, label: "Envoy Gateway\nTLS termination", role: edge, layer: end, parent: f_edge, icon: envoy}
  - {id: cabundle, label: "ConfigMap homelab-ca-bundle\nmonitoring only · no consumer yet", role: data, layer: end, parent: f_cluster}

edges:
  - {id: c_unseal, source: floci, target: openbao, type: control, label: "auto-unseal"}
  - {id: c_bootstrap, source: bootstrap, target: openbao, type: control, label: "configures once"}
  - {id: t_staff, source: staff, target: openbao, type: trust, label: "SSO · auth/oidc"}

  - {id: d_read, source: openbao, target: eso, type: data, label: "KV + static-creds · k8s auth"}
  - {id: c_rotate, source: openbao, target: cnpg, type: control, label: "rotates notification (720 h)"}
  - {id: d_write, source: eso, target: secrets, type: data, label: "writes"}

  - {id: d_apps, source: secrets, target: apps, type: data, label: "env / file"}
  - {id: d_platform, source: secrets, target: platformapps, type: data, label: "env · existingSecret"}
  - {id: d_cnpg, source: secrets, target: cnpg, type: data, label: "passwordSecret"}
  - {id: d_cf, source: secrets, target: certmgr, type: data, label: "cloudflare-api-token"}

  - {id: d_issue, source: certmgr, target: edgecert, type: data, label: "issues"}
  - {id: c_ca, source: certmgr, target: trust, type: control, label: "homelab-ca source"}
  - {id: d_edge, source: edgecert, target: envoy, type: data, label: "serves"}
  - {id: d_bundle, source: trust, target: cabundle, type: data, label: "distributes"}

notes:
  - id: note_how
    title: "How it holds together"
    text: "OpenBao never starts sealed for long: each pod unwraps its root key from floci (the local stand-in for a cloud KMS), so the bootstrap Job only initialises it once, writes the recovery key, seeds KV, creates the eso-reader / db-configurator / oidc-configurator roles and revokes the root token. External Secrets logs in with Kubernetes auth and re-reads every hour; notification's password comes from the database engine instead and is re-read every minute, because OpenBao rotates it. Since OpenBao 2.7 the awskms seal is an external KMS plugin, downloaded once and cached on the Raft PVC. Every request and response is written as one audit JSON line on stdout (active node only, secret values HMAC-ed), which Vector ships to VictoriaLogs and ClickHouse; vmagent scrapes /v1/sys/metrics."
  - id: note_planned
    title: "Planned, not deployed"
    text: "TLS on the OpenBao listener, a real cloud KMS instead of floci, AppRole for CI/CD, per-request dynamic database credentials and internal TLS on homelab-ca (RFC-0020). Locally the edge certificate is issued by homelab-ca; Let's Encrypt DNS-01 with the Cloudflare token is the production path."
