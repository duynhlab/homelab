# Source of docs/architecture/security/app-mesh.drawio -- edit this, then regenerate:
#   python3 .agents/skills/homelab-drawio/scripts/generate.py docs/architecture/security/app-mesh.ir.yaml
# Verified on 2026-09-28 against every ingress rule in
# kubernetes/infra/configs/network-policies/*.yaml (the :8080 / :9090 allows between
# envoy-gateway and the service namespaces). The DB tier is security/network-policies.
diagram:
  id: app-mesh
  title: "duynhlab homelab — NetworkPolicy: allowed app-mesh ingress"
  scope: "Which namespace may call which service namespace over HTTP :8080 or gRPC :9090, caller → callee. The DB tier and identity's scrape allows are the other NetworkPolicy diagram; egress is not fenced."
  question: domain-topology
  level: L4
  animate: [traffic]
  legend:
    roles:
      edge: "Namespace: gateway (no policy)"
      service: "Service namespace (deny-all + allow list)"
      platform: "Namespace: identity (Keycloak)"
    edges:
      traffic: "allowed ingress, caller → callee (unlabelled = :8080)"

layers: [edge, entry, core, leaf, sink]

boundaries:
  - {id: f_cluster, label: "Kind cluster · homelab"}
  - {id: f_open, label: "No NetworkPolicy", parent: f_cluster}
  - {id: f_fenced, label: "Fenced · deny-all", parent: f_cluster}

nodes:
  # Listed in the order dot starts from: the fewest crossings of ~600
  # orderings measured with validate.py on 2026-09-28.
  - {id: envoy, label: "envoy-gateway\nEnvoy Gateway proxies", role: edge, layer: edge, parent: f_open, icon: envoy}

  - {id: identity, label: "identity\nKeycloak", role: platform, layer: entry, parent: f_fenced, icon: keycloak}
  - {id: checkout, label: "checkout\ngRPC client only", role: service, layer: entry, parent: f_fenced, icon: go}
  - {id: user, label: "user", role: service, layer: entry, parent: f_fenced, icon: go}

  - {id: order, label: "order", role: service, layer: core, parent: f_fenced, icon: go}
  - {id: product, label: "product", role: service, layer: core, parent: f_fenced, icon: go}

  - {id: payment, label: "payment\n+ mockpay", role: service, layer: leaf, parent: f_fenced, icon: go}
  - {id: review, label: "review", role: service, layer: leaf, parent: f_fenced, icon: go}
  - {id: inventory, label: "inventory\npod-scoped allows", role: service, layer: leaf, parent: f_fenced, icon: go}
  - {id: cart, label: "cart", role: service, layer: leaf, parent: f_fenced, icon: go}
  - {id: shipping, label: "shipping", role: service, layer: leaf, parent: f_fenced, icon: go}

  - {id: notification, label: "notification", role: service, layer: sink, parent: f_fenced, icon: go}

edges:
  - {id: n_all, source: envoy, target: f_fenced, type: traffic, label: ":8080 into every namespace"}

  - {id: w_co_order, source: checkout, target: order, type: traffic, label: ":9090 CreateOrder"}
  - {id: w_co_cart, source: checkout, target: cart, type: traffic, label: ":9090"}
  - {id: w_co_ship, source: checkout, target: shipping, type: traffic, label: ":9090"}
  - {id: w_co_product, source: checkout, target: product, type: traffic, label: ":9090 pod-scoped"}
  - {id: w_co_inv, source: checkout, target: inventory, type: traffic, label: ":9090"}
  - {id: w_or_inv, source: order, target: inventory, type: traffic, label: ":9090"}
  - {id: w_pr_inv, source: product, target: inventory, type: traffic, label: ":9090"}
  - {id: w_or_cart, source: order, target: cart, type: traffic, label: ":8080"}
  - {id: w_or_ship, source: order, target: shipping, type: traffic, label: ":8080 · :9090"}
  - {id: w_or_pay, source: order, target: payment, type: traffic, label: ":9090"}
  - {id: w_or_notif, source: order, target: notification, type: traffic, label: ":8080 · :9090"}
  - {id: w_sh_notif, source: shipping, target: notification, type: traffic, label: ":8080 · :9090"}
  - {id: w_pr_review, source: product, target: review, type: traffic, label: ":8080 · :9090"}

notes:
  - id: note_more
    title: "Reading the gateway arrow, and what is not drawn"
    text: "The gateway's one arrow is ten allows: it reaches :8080 in every fenced namespace (identity for the id route and remoteJWKS; inventory's pods only), and also :9090 in review, notification and shipping, whose allow names no port. All ten service namespaces reach identity :8080 for the JWKS, since their pkg/authmw verifier is fail-closed; monitoring reaches identity :9000 / :8080 (the data-tier diagram); payment admits its own namespace on :8080 for mockpay. Allows into inventory and product's :9090 select only the service pods (pod-scoped)."
  - id: note_missing
    title: "The arrow that does not exist"
    text: "Nothing may call checkout on :9090: it is a gRPC client of the mesh, never a server to it. Only the gateway reaches checkout, on :8080."
