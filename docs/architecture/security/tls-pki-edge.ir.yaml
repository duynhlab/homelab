# Source of docs/architecture/security/tls-pki-edge.drawio -- edit this, then regenerate:
#   python3 .agents/skills/homelab-drawio/scripts/generate.py docs/architecture/security/tls-pki-edge.ir.yaml
# Verified on 2026-10-01 against: configs/cert-manager/{clusterissuers,bundles}.yaml,
# configs/envoy-gateway/{gateway,certificate,coredns}.yaml + routes/ + policies/security-jwt.yaml,
# clusters/local/envoy-gateway-config.yaml (local homelab-ca patch), configs/flux-web/certificate.yaml,
# configs/secrets/{cluster-secret-store*.yaml,openbao-bootstrap,openbao-oidc-config}/,
# controllers/secrets/openbao/helmrelease.yaml, apps/services/*.yaml (db_sslmode, db_host),
# apps/{order,checkout}-worker.yaml, databases/clusters/*/{instance,objectstore}.yaml + poolers/,
# platform-db/openbao-db-config.yaml, controllers/{keycloak,temporal,caching/valkey}/,
# controllers/tracing/otel-collector, clusters/local/flux-system/instance.yaml + sources/oci/,
# and duynhlab/pkg grpcx/client.go + server.go, temporalx/temporalx.go, obsx/setup.go.
# Per-hop file:line evidence lives in docs/secrets/cert-manager.md §12.1.
# Database hop states measured on Kind 2026-10-01 via pg_stat_ssl (client backends on both primaries).
# Database rows re-verified 2026-10-19 against manifests (ADR-089, after #1312):
# databases/clusters/{platform-db,product-db,product-db-replica}/server-tls.yaml + instance.yaml
# (serverTLSSecret, pg_hba hostssl; host for temporal, keycloak, vault_rotator),
# */poolers/{certificate,ca-trust,pooler,helmrelease}.yaml (11 *-db-ca-trust; PgBouncer
# client_tls_sslmode require + server_tls_sslmode verify-full; PgDog tlsClientRequired +
# tlsVerify verify_full), apps/services/*.yaml + apps/*-worker.yaml (db_sslmode verify-full),
# */authz/job.yaml (PGSSLMODE verify-full), */authz/policies/*.yaml (pgroles sslMode
# require, #1306) and */openbao-db-config.yaml (sslmode=require). Not re-measured on Kind.
# Split from tls-topology on 2026-10-22 (#1339): this view keeps the PKI, the edge and
# the east-west hops; database, pooler and store hops are in tls-data-tier.
diagram:
  id: tls-pki-edge
  title: "duynhlab homelab — TLS: PKI, edge and east-west (Kind, as deployed)"
  scope: "Who issues each certificate, and which request, identity and east-west hops are encrypted and verified. The hop state is written on every edge: TLS verified / TLS unverified / PLAINTEXT / planned. Database, pooler and store hops are in tls-data-tier; the full per-hop list is the §12.1 table in docs/secrets/cert-manager.md. local-stack is plaintext by design and is not drawn."
  question: domain-topology
  level: L4
  animate: [traffic, telemetry]
  legend:
    roles:
      platform: "Platform / PKI component"
      service: "Services · identity · Grafana"
      collector: "OTel Collector"
      edge: "Edge (TLS termination)"
      external: "Off-platform"
      planned: "RFC-0020 slices (planned)"
    edges:
      traffic: "request (state on the label)"
      data: "reads / writes (state on the label)"
      trust: "identity fetch: JWKS · OIDC · OAuth"
      control: "issues · signs · unseals"
      telemetry: "OTLP export (stores: tls-data-tier)"
      dependency: "planned work (RFC-0020)"

layers: [client, pki, edge, apps, platform, objects]

boundaries:
  - {id: f_cluster, label: "Kind cluster · homelab"}
  - {id: f_pki, label: "PKI", parent: f_cluster}
  - {id: f_edge, label: "Edge", parent: f_cluster}
  - {id: f_apps, label: "East-west · no mesh", parent: f_cluster}
  - {id: f_platform, label: "Platform", parent: f_cluster}

nodes:
  - {id: browser, label: "Browser\n*.duynh.me", role: external, layer: client}
  - {id: root, label: "homelab-ca root CA\nself-signed · 10y · no renewBefore\nregenerated every make up", role: platform, layer: pki, parent: f_pki}
  - {id: rfc, label: "RFC-0020 slices (planned)\nS0 · S1 · S5–S14 · provisional\nnot installed (S2–S4 via ADR-089)", role: planned, layer: pki, parent: f_pki, status: planned}
  - {id: issuer, label: "ClusterIssuer homelab-ca\n7 leaves + 14 ca.crt anchors\n90d · renew 15d", role: platform, layer: edge, parent: f_pki, icon: cert-manager}
  - {id: bundle, label: "trust-manager Bundle\ncommitted CA copy\nmonitoring only · no consumer", role: platform, layer: edge, parent: f_pki}
  - {id: eg, label: "Envoy Gateway\n:443 platform-edge-tls\n:80 → 301 https · HSTS", role: edge, layer: edge, parent: f_edge, icon: envoy}
  - {id: svc, label: "10 Go services + 2 workers\ngRPC :9090 between them:\nPLAINTEXT (insecure creds)", role: service, layer: apps, parent: f_apps, icon: go}
  - {id: kc, label: "Keycloak\n:8080 HTTP in-cluster", role: service, layer: apps, parent: f_apps, icon: keycloak}
  - {id: graf, label: "Grafana\nOAuth via Keycloak", role: service, layer: apps, parent: f_apps, icon: grafana}
  - {id: eso, label: "External Secrets Operator\n+ OpenBao config Jobs", role: platform, layer: platform, parent: f_platform, icon: external-secrets}
  - {id: bao, label: "OpenBao HA Raft\n:8200 tls_disable = 1", role: platform, layer: platform, parent: f_platform, icon: openbao}
  - {id: floci, label: "floci KMS emulator\n:4566 HTTP", role: platform, layer: platform, parent: f_platform}
  - {id: temporal, label: "Temporal frontend\n:7233", role: platform, layer: platform, parent: f_platform, icon: temporal}
  - {id: otel, label: "OTel Collector\n:4317 · :4318", role: collector, layer: platform, parent: f_platform, icon: opentelemetry}
  - {id: fluxop, label: "Flux Operator\nsync + web UI", role: platform, layer: platform, parent: f_platform, icon: flux}
  - {id: registry, label: "homelab-registry:5000\nOCI artifacts (Kind host)", role: external, layer: objects}

edges:
  - {id: t_browser, source: browser, target: eg, type: traffic, label: "TLS verified · HTTPS\n(once homelab-ca is trusted)"}
  - {id: c_sign, source: root, target: issuer, type: control, label: "signs"}
  - {id: c_bundle, source: root, target: bundle, type: control, status: optional, label: "committed copy\nstale after rebuild"}
  - {id: p_rfc, source: rfc, target: issuer, type: dependency, status: planned, label: "planned · more leaves\nfrom homelab-ca"}
  - {id: c_edge, source: issuer, target: eg, type: control, label: "issues platform-edge-tls"}
  - {id: c_baoleaf, source: issuer, target: bao, type: control, label: "openbao-idp-trust\n(ca.crt only)"}
  - {id: c_fluxleaf, source: issuer, target: fluxop, type: control, label: "flux-web-idp-trust\n(ca.crt only)"}
  - {id: t_backends, source: eg, target: svc, type: traffic, label: "PLAINTEXT · HTTP\nno BackendTLSPolicy\n(admin UIs too)"}
  - {id: r_egjwks, source: eg, target: kc, type: trust, label: "PLAINTEXT\nroute + remoteJWKS"}
  - {id: r_svcjwks, source: svc, target: kc, type: trust, label: "PLAINTEXT · JWKS"}
  - {id: r_graf, source: graf, target: kc, type: trust, label: "PLAINTEXT\nOAuth token"}
  - {id: r_bao, source: bao, target: eg, type: trust, label: "TLS verified · live CA\nOIDC discovery hairpin"}
  - {id: r_flux, source: fluxop, target: eg, type: trust, label: "TLS verified · live CA\nOIDC hairpin"}
  - {id: t_temporal, source: svc, target: temporal, type: traffic, label: "PLAINTEXT · gRPC"}
  - {id: m_otel, source: svc, target: otel, type: telemetry, label: "PLAINTEXT · OTLP\n(services + Envoy)"}
  - {id: d_eso, source: eso, target: bao, type: data, label: "PLAINTEXT\nSA JWT + reads"}
  - {id: c_unseal, source: bao, target: floci, type: control, label: "PLAINTEXT · awskms seal"}
  - {id: d_oci, source: fluxop, target: registry, type: data, label: "PLAINTEXT · OCI pull\ninsecure · no cosign"}

notes:
  - id: note_state
    title: "Reading the hop state"
    text: "TLS verified: the client checks the chain against a CA and checks the hostname. TLS unverified: the hop is encrypted, but the client does not check who answers. PLAINTEXT: nothing is encrypted on the hop. Behind the edge every request, identity and east-west hop is plaintext: Envoy has no BackendTLSPolicy, Keycloak serves HTTP in-cluster, gRPC between services uses insecure credentials, and OpenBao runs tls_disable. Only the two OIDC hairpins (OpenBao, Flux web UI) verify, against the live homelab-ca. Operator-managed TLS (OpenBao Raft cluster port, Envoy Gateway xDS, chart webhook Issuers) uses each operator's own CA. kubelet and kube-apiserver scrapes use TLS with insecureSkipVerify."
  - id: note_planned
    title: "Planned, not installed (RFC-0020, provisional)"
    text: "S0 edge issuer decouple · S1 OpenBao listener TLS · S6 gRPC + Temporal mTLS · S7 intermediate CA · S8 Keycloak HTTPS · S10 Envoy BackendTLSPolicy · S13 OCI registry TLS + cosign · S14 KMS over HTTPS (production). S2–S4 shipped through ADR-089 and are drawn in tls-data-tier."

tests:
  - {rule: entry-via-edge}
