# Candidate pin from gha-workflows PR #119. Replace with the immutable v2
# release commit before rolling this caller out to service repositories.
name: Check

on:
  pull_request:
    branches: [dev, main]

permissions: {}

jobs:
  check:
    name: PR Gate
    uses: duynhlab/gha-workflows/.github/workflows/check.yml@088207a7b6acf45db1e8e10324d1b6855f60cc12
    with:
      image-name: ${{ github.event.repository.name }}
      sonar-project-key: duynhlab_${{ github.event.repository.name }}
      sonar-organization: duynhlab
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
