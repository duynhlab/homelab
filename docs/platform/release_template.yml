# Candidate pin from gha-workflows PR #119. Replace with the immutable v2
# release commit before rolling this caller out to service repositories.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    name: Production Release
    uses: duynhlab/gha-workflows/.github/workflows/release.yml@088207a7b6acf45db1e8e10324d1b6855f60cc12
    with:
      image-name: ${{ github.event.repository.name }}
      publish-binaries: true
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
      pull-requests: read
      security-events: write
