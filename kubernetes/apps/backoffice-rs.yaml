apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: rs-backoffice
  # `default`, like every domain ResourceSet — this is where the apps-local
  # Kustomization health-checks it. The workload it generates lives in
  # `backoffice`; the ResourceSet object itself is control-plane state.
  namespace: default
spec:
  inputs:
    - name: admin-service
      replicaCount: 1
  resources:
    # RFC-0023 Backoffice Admin Portal — the operator SPA (ADR-048: no BFF, the
    # browser calls the services through the edge; ADR-049: TanStack SPA).
    #
    # BUILD-TIME CONTRACT, enforced in the SPA's own CI (admin-service
    # .github/workflows/build.yml `build-args`), not here: the bundle bakes
    # API_BASE_URL=https://gateway.duynh.me, KEYCLOAK_URL=https://id.duynh.me,
    # KEYCLOAK_REALM=duynhlab-staff, KEYCLOAK_CLIENT_ID=admin-portal. The chart
    # passes no build args and the image is not built here, so a tag
    # pinned below is only deployable if its build carried those four values —
    # otherwise the portal loads and then talks to localhost from the
    # operator's browser.
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: << inputs.name >>
        namespace: backoffice
      spec:
        interval: 10m
        timeout: 10m
        chartRef:
          kind: OCIRepository
          name: duynh-chart-oci
          namespace: flux-system
        releaseName: << inputs.name >>
        install:
          remediation:
            retries: 3
        upgrade:
          remediation:
            retries: 3
        values:
          nameOverride: << inputs.name >>
          containerName: << inputs.name >>
          # The selector is immutable and mop selected on `app` as well;
          # keeping it lets the release upgrade in place.
          extraSelectorLabels:
            app: << inputs.name >>
          podLabels:
            app.kubernetes.io/component: api
          replicaCount: << inputs.replicaCount | int >>
          image:
            repository: ghcr.io/duynhlab/admin-service/admin-service
            # 0.3.0 must not land before order 2.2.0: the case view reads
            # `version` and `status_history`, which only the newer order-service
            # returns. Both pins move in the same change for that reason.
            # 0.4.0: ADR-053 — page-level Receive-first-stock bootstrap for
            # untracked SKUs and the warn-never-gate publish notice (protected
            # balances read). gha-workflows pins aligned to e321897. Compose
            # gate 2026-08-19; Playwright bootstrap + publish-warning rows pass.
            tag: "0.4.4" # {"$imagepolicy": "flux-system:admin-service:tag"}
            pullPolicy: IfNotPresent
          # Nginx listens on 80; the chart default containerPort is also 80,
          # but state it so a chart default change cannot move it silently.
          containerPort: 80
          service:
            type: ClusterIP
            port: 80
            appProtocol: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
