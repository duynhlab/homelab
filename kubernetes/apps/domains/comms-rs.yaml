apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: rs-comms
  namespace: default
spec:
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          platform.duynhlab.dev/domain: comms
  resourcesTemplate: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: << inputs.namespace >>
      labels:
        environment: local
        <<- if (index inputs "platform_backup_label") >>
        platform.duynhlab/backup: << index inputs "platform_backup_label" | quote >>
        <<- end >>
    ---
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: << inputs.name >>
      namespace: << inputs.namespace >>
    spec:
      interval: 10m
      timeout: 10m
      chartRef:
        kind: OCIRepository
        name: mop-chart-oci
        namespace: flux-system
      releaseName: << inputs.name >>
      install:
        remediation:
          retries: 3
      upgrade:
        remediation:
          retries: 3
      values:
        name: << inputs.name >>
        replicaCount: << inputs.replicaCount | int >>
        image:
          repository: << index inputs "registry_url" | default "ghcr.io/duynhlab" >>/<< inputs.name >>-service/<< inputs.name >>-service
          tag: "<< inputs.image_tag >>"
          pullPolicy: IfNotPresent
        service:
          enabled: true
          type: ClusterIP
          # Edge resilience now lives at the gateway: the resilience-default
          # BackendTrafficPolicy (configs/envoy-gateway/policies/btp-api.yaml)
          # carries the timeouts/retries/health checks the KongUpstreamPolicy +
          # konghq.com annotations used to (removed at the RFC-0024 P2.3 cutover).
          http:
            port: 8080
            containerPort: 8080
          <<- if (index inputs "grpc_server") >>
          grpc:
            enabled: true
            port: 9090
            containerPort: 9090
          <<- end >>
        # RFC-0014 P4: this pod ships its own logs over OTLP (otelzap tee) —
        # the label tells the Vector DaemonSet to skip its stdout (double-
        # ingest guard). Tied to the same input as OTEL_LOGS_ENABLED so a
        # kill-switch flip also hands the pod back to Vector.
        labels:
          platform.duynhlab.dev/otlp-logs: << index inputs "otel_logs_enabled" | default "true" | quote >>
        <<- if (index inputs "db_password_file") >>
        # RFC-0008 / ADR-025 pattern A: mount the DB Secret as a file so the app
        # reads a rotated password per connection (mop chart adds DB_PASSWORD_FILE).
        dbCredentials:
          enabled: true
          secretName: << inputs.db_secret >>
        <<- end >>
        env:
          - name: SERVICE_NAME
            value: << inputs.name >>
          - name: PORT
            value: "8080"
          - name: ENV
            value: "production"
          - name: OTEL_COLLECTOR_ENDPOINT
            value: << index inputs "otel_endpoint" | default "otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318" >>
          - name: OTEL_SAMPLE_RATE
            value: "0.1"
          # Authoritative service identity — the OTel SDK reads OTEL_SERVICE_NAME
          # (not SERVICE_NAME); without it service.name falls back to brittle
          # hostname parsing. Downward API also sets namespace + instance id.
          - name: OTEL_SERVICE_NAME
            value: << inputs.name >>
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "service.namespace=$(POD_NAMESPACE),service.instance.id=$(POD_NAME)"
          # RFC-0014 D-2: obsx reads these exact names for the Kubernetes
          # resource attributes on the OTLP path (k8s.namespace.name and
          # k8s.pod.name are on vmagent's promote allowlist).
          - name: K8S_NAMESPACE_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: K8S_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: DEPLOYMENT_ENVIRONMENT
            value: "production"
          # RFC-0014 P4: OTLP logs — default on (fleet cutover); the RSIP
          # input is the per-service kill switch (also flips the Vector label).
          - name: OTEL_LOGS_ENABLED
            value: << index inputs "otel_logs_enabled" | default "true" | quote >>
          # RFC-0014 P3: OTLP is the only metrics pipeline — default on
          # fleet-wide; the RSIP input remains as a per-service kill switch.
          - name: OTEL_METRICS_ENABLED
            value: << index inputs "otel_metrics_enabled" | default "true" | quote >>
          - name: PYROSCOPE_ENDPOINT
            value: << index inputs "pyroscope_endpoint" | default "http://pyroscope.monitoring.svc.cluster.local:4040" >>
          - name: LOG_LEVEL
            value: << index inputs "log_level" | default "info" >>
          - name: LOG_FORMAT
            value: << index inputs "log_format" | default "json" >>
          - name: TRACING_ENABLED
            value: << index inputs "tracing_enabled" | default "true" | quote >>
          - name: PROFILING_ENABLED
            value: "true"
          - name: METRICS_ENABLED
            value: "true"
          - name: DB_HOST
            value: << inputs.db_host >>
          - name: DB_PORT
            value: << index inputs "db_port" | default "5432" | quote >>
          - name: DB_NAME
            value: << inputs.name >>
          - name: DB_USER
            value: << index inputs "db_user" | default inputs.name >>
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: << inputs.db_secret >>
                key: password
          - name: DB_SSLMODE
            value: << index inputs "db_sslmode" | default "require" >>
          - name: DB_POOL_MAX_CONNECTIONS
            value: << inputs.pool_max | quote >>
          - name: DB_POOL_MODE
            value: "transaction"
          <<- if (index inputs "cache_enabled") >>
          - name: CACHE_ENABLED
            value: "true"
          - name: CACHE_HOST
            value: "valkey.cache-system.svc.cluster.local"
          - name: CACHE_PORT
            value: "6379"
          <<- end >>
          <<- if (index inputs "review_grpc_addr") >>
          - name: REVIEW_GRPC_ADDR
            value: << inputs.review_grpc_addr >>
          <<- end >>
          <<- if (index inputs "shipping_grpc_addr") >>
          - name: SHIPPING_GRPC_ADDR
            value: << inputs.shipping_grpc_addr >>
          <<- end >>
          <<- if (index inputs "notification_grpc_addr") >>
          - name: NOTIFICATION_GRPC_ADDR
            value: << inputs.notification_grpc_addr >>
          <<- end >>
          <<- if (index inputs "authmw") >>
          # RFC-0024 P3 (identity cutover; RFC-0022 design record): authmw
          # (pkg v0.37.0) verifies Keycloak realm tokens. The compiled defaults
          # already point at the realm — set both explicitly at cutover so the
          # trusted issuer is auditable in the manifest. JWKS is fetched
          # in-cluster over plain HTTP (TLS terminates at the edge, which is
          # for browsers; empty OIDC_JWKS_URL would derive <issuer>/protocol/
          # openid-connect/certs and hairpin through the public host).
          - name: OIDC_ISSUER
            value: "https://id.duynh.me/realms/duynhlab"
          - name: OIDC_JWKS_URL
            value: "http://keycloak.identity.svc.cluster.local:8080/realms/duynhlab/protocol/openid-connect/certs"
          <<- end >>
        # PSS restricted fields — commented out 2026-08-17 together with the
        # pss-restricted-apps policy itself (see that file's header for why and
        # for the two conditions that bring both back). Left in place rather
        # than deleted: these three cost nothing and apply cleanly to these
        # images, so re-enabling is uncommenting.
        # securityContext:
        #   allowPrivilegeEscalation: false
        #   capabilities:
        #     drop:
        #       - ALL
        #   seccompProfile:
        #     type: RuntimeDefault
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "50m"
        livenessProbe:
          enabled: true
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          enabled: true
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        migrations:
          enabled: true
          env:
            DB_HOST: << inputs.db_migration_host >>
            DB_PORT: "5432"
            DB_NAME: << inputs.name >>
            DB_USER: << index inputs "db_user" | default inputs.name >>
            DB_SSLMODE: "require"
          envFrom:
            secretRef: << inputs.db_secret >>
        slo:
          enabled: true
