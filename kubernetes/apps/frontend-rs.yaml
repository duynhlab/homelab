apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: rs-frontend
  # `default`, like every other ResourceSet — and, more to the point, where
  # clusters/*/apps.yaml health-checks it. While this object lived in
  # `frontend` that health check named an object that did not exist, so
  # `apps-local` (wait: true) would have blocked on it forever the first time
  # a cluster was actually brought up. The HelmRelease it renders still targets
  # the `frontend` namespace, so nothing about the workload moves.
  namespace: default
spec:
  inputs:
    - name: frontend
      replicaCount: 1
  resources:
    # RFC-0024 P3 build-arg contract (frontend#90): the SPA logs in with
    # keycloak-js, and the Keycloak origin/realm/client are baked in at image
    # build time (Dockerfile ARGs KEYCLOAK_URL / KEYCLOAK_REALM /
    # KEYCLOAK_CLIENT_ID → VITE_*). The cluster image pinned below MUST be
    # built with KEYCLOAK_URL=https://id.duynh.me, KEYCLOAK_REALM=duynhlab,
    # KEYCLOAK_CLIENT_ID=customer-spa — homelab does not build this image and
    # the mop chart passes no build args, so there is nothing to set here;
    # this comment records the CI contract the tag must satisfy.
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: << inputs.name >>
        namespace: frontend
      spec:
        interval: 10m
        timeout: 10m
        chartRef:
          kind: OCIRepository
          name: mop-chart-oci
          namespace: flux-system
        releaseName: << inputs.name >>
        install:
          remediation:
            retries: 3
        upgrade:
          remediation:
            retries: 3
        values:
          name: << inputs.name >>
          replicaCount: << inputs.replicaCount | int >>
          image:
            repository: ghcr.io/duynhlab/frontend/frontend
            tag: "2.0.0" # {"$imagepolicy": "flux-system:frontend:tag"}
            # 1.2.1: one paced, jittered retry on 503 + Retry-After in the checkout funnel (frontend#84). Also picks up the 1.2.0 single-entry checkout that was released but never repinned.
            pullPolicy: IfNotPresent
          # mop >=0.14 values schema: the HTTP port pair lives under
          # service.http (the old top-level port/targetPort/containerPort keys
          # are silently ignored and the chart default 8080 wins — which broke
          # this SPA behind the edge gateway, since nginx listens on 80).
          service:
            enabled: true
            type: ClusterIP
            http:
              port: 80
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            enabled: true
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            enabled: true
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          migrations:
            enabled: false
