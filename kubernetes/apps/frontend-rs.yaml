apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: rs-frontend
  # `default`, like every other ResourceSet — and, more to the point, where
  # clusters/*/apps.yaml health-checks it. While this object lived in
  # `frontend` that health check named an object that did not exist, so
  # `apps-local` (wait: true) would have blocked on it forever the first time
  # a cluster was actually brought up. The HelmRelease it renders still targets
  # the `frontend` namespace, so nothing about the workload moves.
  namespace: default
spec:
  inputs:
    - name: frontend
      replicaCount: 1
  resources:
    # RFC-0024 P3 build-arg contract (frontend#90): the SPA logs in with
    # keycloak-js, and the Keycloak origin/realm/client are baked in at image
    # build time (Dockerfile ARGs KEYCLOAK_URL / KEYCLOAK_REALM /
    # KEYCLOAK_CLIENT_ID → VITE_*). The cluster image pinned below MUST be
    # built with KEYCLOAK_URL=https://id.duynh.me, KEYCLOAK_REALM=duynhlab,
    # KEYCLOAK_CLIENT_ID=customer-spa — homelab does not build this image and
    # the mop chart passes no build args, so there is nothing to set here;
    # this comment records the CI contract the tag must satisfy.
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: << inputs.name >>
        namespace: frontend
      spec:
        interval: 10m
        timeout: 10m
        chartRef:
          kind: OCIRepository
          name: mop-chart-oci
          namespace: flux-system
        releaseName: << inputs.name >>
        install:
          remediation:
            retries: 3
        upgrade:
          remediation:
            retries: 3
        values:
          name: << inputs.name >>
          replicaCount: << inputs.replicaCount | int >>
          image:
            repository: ghcr.io/duynhlab/frontend/frontend
            # 3.2.0: ADR-053 — words ITEM_NOT_ORDERABLE (persistent conflict,
            # no retry affordance) and drops the dead 503-with-session handling.
            # Same train as checkout 0.9.0. Compose gate 2026-08-19; Playwright
            # 22/22 on the audited stack.
            tag: "3.2.0" # {"$imagepolicy": "flux-system:frontend:tag"}
            # 3.0.0 converged the storefront on the Backoffice stack — TanStack
            # Router + Query, TypeScript, Tailwind + shadcn, no mock layer at all
            # (RFC-0025 / ADR-052, frontend#96). It is skipped here on purpose:
            # this pin was still open when 3.1.0 landed, so no cluster ever ran
            # 3.0.0 and there is nothing to step through.
            #
            # 3.1.0 gives the storefront a home page (frontend#97). The catalog
            # moves to /products and / becomes a search box plus the category
            # buckets; the address bar no longer carries ?page=1 on a plain
            # visit. Nothing 404s in either direction: /products links from 2.x
            # are correct again and / still renders.
            #
            # Serving is unchanged across both — same nginx image shape, same
            # build args, same HTTPRoute PathPrefix: /.
            # Rollback: repin 2.0.0; nothing else moves with it.
            pullPolicy: IfNotPresent
          # mop >=0.14 values schema: the HTTP port pair lives under
          # service.http (the old top-level port/targetPort/containerPort keys
          # are silently ignored and the chart default 8080 wins — which broke
          # this SPA behind the edge gateway, since nginx listens on 80).
          service:
            enabled: true
            type: ClusterIP
            http:
              port: 80
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            enabled: true
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            enabled: true
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          migrations:
            enabled: false
