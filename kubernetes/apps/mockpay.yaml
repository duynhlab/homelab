# mockpay — the mock payment provider, run as the `mockpay` subcommand of the
# payment image (ADR-008: same one-image/second-deployment pattern as
# order-worker). Unlike the worker it serves traffic: payment charges against
# it over HTTP and the reconciliation job pages its GET /transactions, so the
# Service stays enabled. It is unauthenticated by design — the NetworkPolicy
# admitting only the payment namespace is the fence (ADR-008), and it gets no
# gateway route of any kind.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mockpay
  namespace: payment
spec:
  interval: 10m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: mop-chart-oci
    namespace: flux-system
  releaseName: mockpay
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    name: mockpay
    replicaCount: 1
    image:
      # Same image as the payment API — just a different subcommand, so the tag
      # MUST track payment's. It did not: this pin sat at 1.0.0 from PR #438
      # while payment reached 1.5.0, and 1.0.0's GET /transactions accepts
      # `page`/`page_size` only — it discards the `from`/`to` bounds and returns
      # the whole ledger. Windowed reconciliation (ADR-035) asks both sides for
      # the same bounds, so an unbounded provider reply made every charge older
      # than the window read as `missing_internal`: a permanent phantom
      # PaymentReconciliationDiscrepancy, found by GameDay drill G5. The
      # imagepolicy marker below is deliberately payment's, not a mockpay-only
      # one, so the two cannot drift apart again.
      repository: ghcr.io/duynhlab/payment-service/payment-service
      # NOTE: this tracks payment's release only by hand — image automation is not
      # active, so each payment release needs this bumped too. Now aligned with
      # payment 1.5.3, closing a drift that had reached three patches. Verified
      # rather than assumed: `internal/mockpay/` changed by zero lines across
      # 1.5.0..1.5.3, and the F-1/F-2 access-log fix does not reach this process
      # at all — mockpay serves through otelhttp.NewHandler, not the Gin
      # middleware chain that changed. So the bump carries no behaviour change;
      # it exists so the drift cannot accumulate silently again. The F1 GameDay
      # finding was exactly an image skew here (1.0.0 discarded the
      # reconciliation window bounds).
      # 2.3.0: the drift the paragraph above exists to prevent re-accumulated
      # anyway — payment moved 1.5.3 → 2.3.0 (five minors) while this pin sat
      # still. Re-aligned as an ADR-053-train ride-along BEFORE the first Kind
      # bring-up, because mockpay is on that path (the saga charges through it,
      # and the F1 GameDay finding was precisely an image skew here).
      tag: "2.5.0" # {"$imagepolicy": "flux-system:payment:tag"}
      pullPolicy: IfNotPresent
    args: ["mockpay"]
    service:
      enabled: true
    env:
      - name: SERVICE_NAME
        value: mockpay
      - name: PORT
        value: "8080"
      - name: ENV
        value: "production"
      - name: LOG_LEVEL
        value: info
      - name: LOG_FORMAT
        value: json
      # RFC-0031 Task 1.2 / ADR-074: mockpay is a Go process that already wires
      # obsx (runMockpay installs the tracer provider + W3C propagator), but it
      # had no telemetry environment at all, so it exported to nowhere and
      # profiled nothing. Same contract as the domain ResourceSets. The version
      # is pinned by hand like the image tag above — bump both together.
      - name: OTEL_SERVICE_NAME
        value: mockpay
      - name: OTEL_COLLECTOR_ENDPOINT
        value: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318
      - name: POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: POD_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: "service.namespace=$(POD_NAMESPACE),service.instance.id=$(POD_NAME),service.version=2.5.0"
      - name: K8S_NAMESPACE_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: K8S_POD_NAME
        valueFrom:
          fieldRef:
            fieldPath: metadata.name
      - name: DEPLOYMENT_ENVIRONMENT
        value: "production"
      - name: TRACING_ENABLED
        value: "true"
      - name: OTEL_SAMPLE_RATE
        value: "0.1"
      - name: OTEL_LOGS_ENABLED
        value: "true"
      - name: PYROSCOPE_ENDPOINT
        value: http://pyroscope.monitoring.svc.cluster.local:4040
      - name: PROFILING_ENABLED
        value: "true"
      # Signs every webhook it emits; payment verifies with the same secret
      # (ExternalSecret payment-webhook-hmac, seeded in OpenBAO).
      - name: MOCKPAY_WEBHOOK_SECRET
        valueFrom:
          secretKeyRef:
            name: payment-webhook-hmac
            key: secret
      # Webhooks go straight to payment's public receiver — the HMAC signature
      # is the credential, so the in-cluster hop needs no gateway leg
      # (local-stack routes via Envoy Gateway only to exercise the edge).
      - name: MOCKPAY_WEBHOOK_URL
        value: http://payment.payment.svc.cluster.local:8080/payment/v1/public/payments/webhooks/mockpay
    resources:
      requests:
        memory: "32Mi"
        cpu: "10m"
      limits:
        memory: "64Mi"
        cpu: "50m"
    livenessProbe:
      enabled: true
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
    readinessProbe:
      enabled: true
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 3
      periodSeconds: 5
