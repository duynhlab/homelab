# Order worker: the controller derives Build IDs, injects worker identity,
# and owns rollout/draining. Do not set TEMPORAL_DEPLOYMENT_NAME or
# TEMPORAL_WORKER_BUILD_ID by hand. Drain live histories before renaming.
# This is a raw PodSpec; chart-default changes do not propagate here.
# Operations and ownership: docs/api/temporal.md (ADR-054/ADR-055).
---
apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: order-fulfillment
  namespace: order
  labels:
    app.kubernetes.io/name: order-worker
    app.kubernetes.io/component: worker
    platform.duynhlab.dev/rfc: "0026"
spec:
  # Omit replicas so KEDA owns active-version scaling (ADR-055). Setting it
  # makes the controller fight the autoscaler; the minimum belongs in
  # order-fulfillment-scaler.yaml, not here.

  workerOptions:
    # The cluster-wide connection (configs/temporal/clusterconnection.yaml).
    connectionRef:
      objectRef:
        apiGroup: temporal.io
        kind: ClusterConnection
        name: temporal-mop
    temporalNamespace: mop

  # Keep rollout within apps-local's 10m timeout; pauseDuration has a 30s floor.
  # No gate.workflowType: an explicit side-effect-free gate must exist in the
  # service first (RFC-0026); a business workflow is not a safe substitute.
  rollout:
    strategy: Progressive
    steps:
      - rampPercentage: 10
        pauseDuration: 30s
      - rampPercentage: 50
        pauseDuration: 30s

  # A drained version scales to zero after 1h; deleteDelay 0s bounds the fight
  # with KEDA minReplicaCount to at most one poll before deletion. Delays add,
  # so equal nonzero delays do not remove that window (ADR-055).
  sunset:
    scaledownDelay: 1h
    deleteDelay: 0s

  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-worker
        app.kubernetes.io/component: worker
        # RFC-0014 P4: the worker ships its own logs over OTLP — Vector skips pods
        # carrying this label. Dropping it double-ingests every worker log line.
        platform.duynhlab.dev/otlp-logs: "true"
    spec:
      containers:
        - name: worker
          # Worker and API pins may differ to freeze workflow code. The API owns schema
          # migrations; widen version skew only after replay and migration checks.
          image: ghcr.io/duynhlab/order-service/order-service:2.10.2
          imagePullPolicy: IfNotPresent
          args: ["worker"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OTEL_LOGS_ENABLED
              value: "true"
            - name: SERVICE_NAME
              value: order-worker
            - name: PORT
              value: "8080"
            - name: ENV
              value: "production"
            - name: OTEL_COLLECTOR_ENDPOINT
              value: otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318
            - name: OTEL_SAMPLE_RATE
              value: "0.1"
            # OTel SDK reads OTEL_SERVICE_NAME (not SERVICE_NAME); without it
            # service.name falls back to brittle hostname parsing.
            - name: OTEL_SERVICE_NAME
              value: order-worker
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # service.version carries the Build ID so outcomes and latency split by
            # worker version during a drain — without it two versions are
            # indistinguishable in every signal except pod name. Read from the
            # label the controller stamps on each versioned pod rather than typed
            # here, or a release would edit two lines instead of one.
            - name: BUILD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['temporal.io/build-id']
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=$(POD_NAMESPACE),service.instance.id=$(POD_NAME),service.version=$(BUILD_ID)"
            # RFC-0014 D-2: obsx reads these exact names for the Kubernetes
            # resource attributes on the OTLP path. OTEL_METRICS_ENABLED stays
            # unset — the worker follows the fleet flip, not the product canary.
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DEPLOYMENT_ENVIRONMENT
              value: "production"
            - name: PYROSCOPE_ENDPOINT
              value: http://pyroscope.monitoring.svc.cluster.local:4040
            - name: LOG_LEVEL
              value: info
            - name: LOG_FORMAT
              value: json
            - name: TRACING_ENABLED
              value: "true"
            - name: PROFILING_ENABLED
              value: "true"
            # DB — the worker's ConfirmOrder/FailOrder activities update the order
            # row (same pooler as the order API).
            - name: DB_HOST
              value: pgdog-product.product.svc.cluster.local
            - name: DB_PORT
              value: "6432"
            - name: DB_NAME
              value: order
            - name: DB_USER
              value: order
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-db-order-secret
                  key: password
            - name: DB_SSLMODE
              value: disable
            - name: DB_POOL_MAX_CONNECTIONS
              value: "10"
            - name: DB_POOL_MODE
              value: transaction
            # Temporal — the address order-service reads, and the queue it polls.
            # The controller also injects TEMPORAL_ADDRESS and TEMPORAL_NAMESPACE
            # with the same values from the Connection above; order-service reads
            # these names, so both are kept rather than relying on the injected
            # pair.
            - name: TEMPORAL_HOSTPORT
              value: temporal-frontend.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: mop
            - name: TASK_QUEUE
              value: order-fulfillment
            # The inventory reconciler and the two outbox dispatchers.
            #
            # BOTH RUN ON EVERY LIVE VERSION, and that is the change — not these
            # two lines. One pod template serves every version, so neither can be
            # `false` on a draining build the way ADR-030 required.
            #
            # Neither line switches anything on. ORDER_RECONCILER_ENABLED was
            # already `true` on the Current build, and ORDER_START_DISPATCHERS_ENABLED
            # DEFAULTS to true in order-service (config/config.go: flagx.MustEnum
            # with `flagOn` as the default), so the dispatchers were already running
            # on the old manifest, which never set it. Both are written out here to
            # state the posture rather than inherit it.
            #
            # Verified safe rather than assumed: the dispatchers claim with
            # FOR UPDATE SKIP LOCKED, and order-service documents extra instances
            # as "correct — just unnecessary"; the reconciler has no lease but is
            # documented "SAFE but noisy" — inventory serializes on the reservation
            # row and short-circuits on status, so a second repair is a no-op RPC
            # and the cost is a duplicated repair counter, not a wrong action.
            #
            # The real fix is to move both out of the worker: neither is workflow
            # code, so neither needs pinning. That is order-service work, tracked
            # in ADR-054 § Negative consequences.
            - name: ORDER_RECONCILER_ENABLED
              value: "true"
            - name: ORDER_START_DISPATCHERS_ENABLED
              value: "true"
            # The saga's only stock authority since RFC-0021 P4.
            - name: INVENTORY_GRPC_ADDR
              value: dns:///inventory.inventory.svc.cluster.local:9090
            # Downstream services the activities call (gRPC east-west + cart REST).
            # No PRODUCT_GRPC_ADDR: this build has no product stock activity to
            # dial, and the binary does not read the variable (RFC-0021 P4).
            - name: SHIPPING_GRPC_ADDR
              value: dns:///shipping.shipping.svc.cluster.local:9090
            - name: NOTIFICATION_GRPC_ADDR
              value: dns:///notification.notification.svc.cluster.local:9090
            # Payment gRPC — the saga's money transport. Dialed unconditionally
            # (lazy); whether the steps run is decided by the workflow input's
            # PaymentEnabled, stamped by the order API.
            - name: PAYMENT_GRPC_ADDR
              value: dns:///payment.payment.svc.cluster.local:9090
            - name: CART_SERVICE_URL
              value: http://cart.cart.svc.cluster.local:8080
          # Kyverno require-probes and require-resources both match the `order`
          # namespace, so these are admission requirements here, not hygiene.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "48Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "300m"
