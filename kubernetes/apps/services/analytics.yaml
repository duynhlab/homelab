apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-analytics
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: analytics
spec:
  type: Static
  defaultValues:
    name: analytics
    # The edge route and Admin navigation are live (RFC-0030 phases 9-10).
    image_tag: "0.1.0" # {"$imagepolicy": "flux-system:analytics:tag"}
    namespace: analytics
    replicaCount: 1
    # Serves only /protected/ (staff realm); there is no customer-realm
    # surface, so no `authmw` input.
    staffauthmw: true
