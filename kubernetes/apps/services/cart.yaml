apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-cart
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: checkout
spec:
  type: Static
  defaultValues:
    name: cart
    # 1.4.1: pkg v0.35.0 wave (2026-08-07): dependency-only patch release, fleet aligned on one shared-library version.
    # 1.4.2: telemetry-audit fix for the HTTP access log (F-1/F-2) on top of the
    # per-module pkg v0.36.1 migration and the dependency CVE round. The access
    # log now emits from the trace-carrying logger, skips routine successful
    # probes while keeping failing ones, logs the span trace id or none rather
    # than a fabricated one, and treats 4xx as warn. Local-stack E2E #2: probe
    # access logs 513664 -> 0, native trace id on 51/51 HTTP access records.
    image_tag: "1.4.2" # {"$imagepolicy": "flux-system:cart:tag"}
    namespace: cart
    # RFC-0024 P3: authmw consumer — the domain template injects the explicit
    # OIDC_ISSUER/OIDC_JWKS_URL pair (Keycloak realm; pkg v0.37.0 contract).
    authmw: true
    platform_backup_label: "cnpg"
    replicaCount: 1
    db_host: "pgdog-product.product.svc.cluster.local"
    db_port: "6432"
    db_migration_host: "product-db-rw.product.svc.cluster.local"
    db_secret: "product-db-cart-secret"
    db_sslmode: "disable"
    pool_max: "30"
    # Internal gRPC server (:9090) — checkout reads the cart over cart.v1
    # (RFC-0015). The mop chart adds a grpc:9090 port to the cart Service.
    grpc_server: true
    # MUST stay the string "false": the template guard is truthiness-based,
    # so a boolean false would drop the env entirely — leaving reflection ON.
    grpc_reflection: "false"
