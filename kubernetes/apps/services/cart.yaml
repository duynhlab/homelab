apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-cart
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: checkout
spec:
  type: Static
  defaultValues:
    name: cart
    image_tag: "2.4.4" # {"$imagepolicy": "flux-system:cart:tag"}
    namespace: cart
    # RFC-0024 P3: authmw consumer — the domain template injects the explicit
    # OIDC_ISSUER/OIDC_JWKS_URL pair (Keycloak realm; pkg v0.37.0 contract).
    authmw: true
    replicaCount: 1
    db_host: "pgdog-product.product.svc.cluster.local"
    db_port: "6432"
    # Below PgDog's 70s preStop: clients leave a pod before SIGINT (#1350).
    db_pool_max_conn_lifetime: "45s"
    db_migration_host: "product-db-rw.product.svc.cluster.local"
    # RFC-0029: the service runs as cart_runtime through PgDog; the migrate
    # init container logs in as cart_migrator, which becomes cart_owner.
    db_runtime_secret: "product-db-cart-runtime-secret"
    db_migrator_secret: "product-db-cart-migrator-secret"
    # ADR-089: verify PgDog (and, from migrate, the primary); PgDog refuses
    # plaintext.
    db_sslmode: "verify-full"
    db_ca_secret: "product-db-ca-trust"
    # ADR-025 pattern A: the runtime reads its rotated password from this file
    # (OpenBAO static role → ESO → mounted Secret), never from the env.
    db_password_file: "/etc/db/secret/password"
    pool_max: "30"
    # Internal gRPC server (:9090) — checkout reads the cart over cart.v1
    # (RFC-0015). The domain template adds a grpc:9090 port to the cart Service.
    grpc_server: true
    # MUST stay the string "false": the template guard is truthiness-based,
    # so a boolean false would drop the env entirely — leaving reflection ON.
    grpc_reflection: "false"
