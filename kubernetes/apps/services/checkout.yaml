apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-checkout
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: checkout
spec:
  type: Static
  defaultValues:
    name: checkout
    # Inventory is the sole availability authority; do not restore product fallback.
    # Keep storefront error handling compatible with docs/api/checkout.md.
    image_tag: "0.13.2" # {"$imagepolicy": "flux-system:checkout:tag"}
    namespace: checkout
    # RFC-0024 P3: authmw consumer — the domain template injects the explicit
    # OIDC_ISSUER/OIDC_JWKS_URL pair (Keycloak realm; pkg v0.37.0 contract).
    authmw: true
    # Single replica for local host capacity; the confirm flow is
    # multi-replica-safe by design (idempotency claims, session↔claim
    # binding, stale-lock takeover — all in the database, RFC-0015 P2),
    # so scaling this up is a values change, not a design change.
    replicaCount: 1
    db_host: "pgdog-product.product.svc.cluster.local"
    db_port: "6432"
    db_migration_host: "product-db-rw.product.svc.cluster.local"
    db_secret: "product-db-checkout-secret"
    db_sslmode: "disable"
    pool_max: "25"
    # Client-only gRPC: use the multi-port Services below, not the absent
    # <service>-grpc Services assumed by old application defaults.
    cart_grpc_addr: "dns:///cart.cart.svc.cluster.local:9090"
    product_grpc_addr: "dns:///product.product.svc.cluster.local:9090"
    order_grpc_addr: "dns:///order.order.svc.cluster.local:9090"
    shipping_grpc_addr: "dns:///shipping.shipping.svc.cluster.local:9090"
    inventory_grpc_addr: "dns:///inventory.inventory.svc.cluster.local:9090"
    # Temporal default (temporal-frontend.temporal:7233) is correct as-is.
