apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-inventory
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: fulfillment
spec:
  type: Static
  defaultValues:
    name: inventory
    # 0.4.0 stops reporting an untracked SKU as a shortage. A requested SKU with no
    # balance row in ANY warehouse now comes back in `unknown_sku_ids` instead of as
    # a Shortage at available_to_promise 0 — a quantity claim this service cannot
    # make about a SKU it has never heard of, and the reason a missing row used to
    # reach the shopper as "no longer available".
    #
    # Pin this BEFORE checkout 0.6.0: checkout fails closed on the new field, and it
    # can only do that once inventory sends it. The reverse order is harmless but
    # pointless — checkout would keep blocking the lines instead.
    #
    # 0.3.0 RETIRED the phase-2 `backfill` subcommand (RFC-0021 phase 4) together
    # with its PRODUCT_DB_* config surface. It read products.stock_quantity through
    # a cross-service grant, and phase 4 removes both — so the subcommand had
    # nothing to read and no way to connect.
    #
    # THIS PIN MUST LAND BEFORE product 1.10.0, which carries the migration that
    # drops the column and revokes the grant: remove the reader, then the read.
    # Running the retired verb now refuses loudly instead of falling through to
    # serving the app inside a one-shot Job.
    #
    # 0.2.3 carried the subcommand-config fix: the init container runs `migrate`
    # with only DB_* env (the contract every service here runs under) and 0.1.0
    # validated the full config first, so this Deployment sat in
    # Init:CrashLoopBackOff on the cluster with "SERVICE_NAME is required".
    # 0.4.1: 0.4.1: Reserve answers SKU_NOT_FOUND for a SKU with no balance row anywhere, instead of a fabricated INSUFFICIENT_STOCK at ATP 0 (inventory#23).
    # 0.4.2: telemetry-audit fix for the HTTP access log (F-1/F-2) on top of the
    # per-module pkg v0.36.1 migration and the dependency CVE round. The access
    # log now emits from the trace-carrying logger, skips routine successful
    # probes while keeping failing ones, logs the span trace id or none rather
    # than a fabricated one, and treats 4xx as warn. Local-stack E2E #2: probe
    # access logs 513664 -> 0, native trace id on 51/51 HTTP access records.
    # 0.4.3: RFC-0024 wave (2026-08-13): pkg/proto v0.37.0 pin alignment
    # (string user_id in the notification/payment protos); no behaviour
    # change in this service beyond the shared-contract bump.
    image_tag: "0.5.0" # {"$imagepolicy": "flux-system:inventory:tag"}
    namespace: inventory
    # No platform_backup_label: that label routes CNPG/barman S3 credentials to
    # namespaces hosting a database cluster — inventory's data lives on
    # product-db in the product namespace, which is already backed up.
    replicaCount: 1
    # Runtime through the PgDog pooler (house pattern, RFC-0020 target: all
    # app→DB via pooler); migrations go direct to CNPG (product-db-rw) like
    # every other product-db tenant.
    db_host: "pgdog-product.product.svc.cluster.local"
    db_port: "6432"
    db_migration_host: "product-db-rw.product.svc.cluster.local"
    db_secret: "product-db-inventory-secret"
    db_sslmode: "disable"
    pool_max: "25"
    # Internal gRPC server (:9090) — inventory reservations for the checkout
    # confirm path and the order saga (RFC-0021). The mop chart adds a
    # grpc:9090 port to the inventory Service.
    grpc_server: true
    # No chart-rendered SLO: the mop chart only knows how to build HTTP SLIs
    # (http_server_request_duration_seconds), and this service serves gRPC
    # only — no Kong route, and the health/ready endpoints are not
    # instrumented. All three rendered SLOs therefore had ZERO series behind
    # them: 0/0 SLI, no error budget, no burn-rate alert that could ever fire.
    # Verified on the cluster 2026-08-06:
    #   count(http_server_request_duration_seconds_count{app="inventory"}) -> 0
    #   slo:sli_error:ratio_rate5m{sloth_service="inventory"}              -> 0
    # Replaced by a hand-written gRPC PrometheusServiceLevel at
    # kubernetes/infra/configs/observability/sloth/inventory-grpc-slo.yaml.
    # These two MUST stay mutually exclusive — dropping this flag brings the
    # dead HTTP SLOs back alongside the gRPC ones.
    slo_disabled: "true"
    # Reflection off in the cluster: this API surface reserves stock (grpcx
    # registers reflection unless told otherwise — fail-open default). MUST
    # stay the string "false": the template guard is truthiness-based, so a
    # boolean false would drop the env entirely — leaving reflection ON.
    grpc_reflection: "false"
