apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-notification
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: comms
spec:
  type: Static
  defaultValues:
    name: notification
    image_tag: "2.4.1" # {"$imagepolicy": "flux-system:notification:tag"}
    namespace: notification
    # RFC-0024 P3: authmw consumer — the domain template injects the explicit
    # OIDC_ISSUER/OIDC_JWKS_URL pair (Keycloak realm; pkg v0.37.0 contract).
    authmw: true
    grpc_server: true
    replicaCount: 1
    db_host: "platform-db-pooler-rw.platform.svc.cluster.local"
    db_port: "5432"
    db_migration_host: "platform-db-rw.platform.svc.cluster.local"
    db_secret: "platform-db-notification-secret"
    db_sslmode: "disable"
    pool_max: "30"
    # RFC-0008 / ADR-025 pattern A: presence of this input makes the domain
    # template mount the DB Secret as a directory and set DB_PASSWORD_FILE, so
    # the app reads a rotated password per connection (no pod restart).
    db_password_file: "/etc/db/secret/password"
