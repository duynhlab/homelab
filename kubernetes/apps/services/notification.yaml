apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-notification
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: comms
spec:
  type: Static
  defaultValues:
    name: notification
    # 1.5.1: pkg v0.35.0 wave (2026-08-07): dependency-only patch release, fleet aligned on one shared-library version.
    # 1.5.2: telemetry-audit fix for the HTTP access log (F-1/F-2) on top of the
    # per-module pkg v0.36.1 migration and the dependency CVE round. The access
    # log now emits from the trace-carrying logger, skips routine successful
    # probes while keeping failing ones, logs the span trace id or none rather
    # than a fabricated one, and treats 4xx as warn. Local-stack E2E #2: probe
    # access logs 513664 -> 0, native trace id on 51/51 HTTP access records.
    image_tag: "1.5.2" # {"$imagepolicy": "flux-system:notification:tag"}
    namespace: notification
    # RFC-0024 P3: authmw consumer — the domain template injects the explicit
    # OIDC_ISSUER/OIDC_JWKS_URL pair (Keycloak realm; pkg v0.37.0 contract).
    authmw: true
    grpc_server: true
    replicaCount: 1
    db_host: "platform-db-pooler-rw.platform.svc.cluster.local"
    db_port: "5432"
    db_migration_host: "platform-db-rw.platform.svc.cluster.local"
    db_secret: "platform-db-notification-secret"
    db_sslmode: "disable"
    pool_max: "30"
    # RFC-0008 / ADR-025 pattern A: presence of this input makes the mop chart
    # mount the DB Secret as a file and set DB_PASSWORD_FILE, so the app reads a
    # rotated password per connection (no pod restart). Needs mop chart >= 0.17.0.
    db_password_file: "/etc/db/secret/password"
