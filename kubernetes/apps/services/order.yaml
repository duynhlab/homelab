apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-order
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: checkout
spec:
  type: Static
  defaultValues:
    name: order
    # 1.13.0 removes the saga's product-service stock branch (RFC-0021 P4).
    # inventory-service has been the only stock authority since the W7 write
    # cutover; this deletes the code that could still write stock at
    # product-service, and with it order's last reason to call product at all.
    #
    # An order recorded on the product branch — or with no participant, which
    # means the same thing for every history predating P3 — is REFUSED rather
    # than re-routed. Re-routing would reserve stock inventory never reserved
    # and orphan the real hold, so instead no saga is created and the order's
    # outbox row goes terminal with PARTICIPANT_UNSERVABLE (runbook:
    # FulfillmentStartOutboxFailed).
    #
    # THE WORKER BUILD MUST BE CURRENT BEFORE THIS PIN LANDS. This image stamps
    # new orders and refuses old ones at the start seam, but the saga steps run
    # in the worker: with 1.12.0 still Current, a new order starts on a worker
    # that still has both branches — harmless, since the input pins inventory —
    # while an operator reading these manifests believes the branch is gone.
    # Verified on the cluster before this pin: CurrentVersionBuildID = 1.13.0,
    # and an order driven end to end came back Pinned to BuildId 1.13.0.
    #
    # order_stock_participant is REMOVED in the same commit, and the coupling is
    # not cosmetic: 1.12.0 defaults that flag to `product`, so dropping the input
    # while the older image is deployed would silently send new orders back to the
    # branch this phase deleted. 1.13.0 does not read it at all — there is one
    # servable participant left, so there is nothing to select.
    #
    # 1.13.1: pkg v0.35.0 wave (2026-08-07) - dependency-only patch release.
    # Worker build 1-13-1 is staged alongside this pin (1-13-0 retired in the
    # same change; the cluster was down, so there was nothing to drain) and
    # MUST be activated at the next bring-up: gate on
    # `temporal worker deployment list` showing order-fulfillment, then run
    # the set-current-version CronJob (ADR-030) - pod Ready is NOT the gate.
    # 1.13.2: 1.13.2: G2b fault hook (ORDER_FAULT_COMMIT_PAUSE, GameDay-only, default off) + UNKNOWN_SKU failure reason - a data gap stops hiding inside stockout statistics (order#180).
    image_tag: "1.13.2" # {"$imagepolicy": "flux-system:order:tag"}
    namespace: order
    platform_backup_label: "cnpg"
    replicaCount: 1
    db_host: "pgdog-product.product.svc.cluster.local"
    db_port: "6432"
    db_migration_host: "product-db-rw.product.svc.cluster.local"
    db_secret: "product-db-order-secret"
    db_sslmode: "disable"
    pool_max: "30"
    # order calls shipping + publishes notifications over gRPC (headless :9090).
    shipping_grpc_addr: "dns:///shipping.shipping.svc.cluster.local:9090"
    notification_grpc_addr: "dns:///notification.notification.svc.cluster.local:9090"
    # The API dials payment for the order-details enrichment (GetPayment).
    # Explicit because the code default points at the (correct) plain
    # `payment` Service name — kept explicit for auditability. The saga's payment steps are
    # always on (no feature flag); the worker uses its own PAYMENT_GRPC_ADDR.
    payment_grpc_addr: "dns:///payment.payment.svc.cluster.local:9090"
    # Internal gRPC server (:9090) — checkout's confirm handoff calls
    # order.v1/CreateOrder (RFC-0015, ADR-018). The mop chart adds a
    # grpc:9090 port to the order Service.
    grpc_server: true
    # MUST stay the string "false": the template guard is truthiness-based,
    # so a boolean false would drop the env entirely — leaving reflection ON.
    grpc_reflection: "false"
