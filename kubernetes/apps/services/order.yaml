apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-order
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: checkout
spec:
  type: Static
  defaultValues:
    name: order
    # Legacy product-participant orders are refused, not rerouted to inventory.
    # Keep API/worker compatibility; the controller owns worker activation.
    # See docs/api/temporal.md and the FulfillmentStartOutboxFailed runbook.
    image_tag: "2.10.2" # {"$imagepolicy": "flux-system:order:tag"}
    namespace: order
    # RFC-0024 P3: authmw consumer — the domain template injects the explicit
    # OIDC_ISSUER/OIDC_JWKS_URL pair (Keycloak realm; pkg v0.37.0 contract).
    authmw: true
    # Serves /protected/ (staff realm). The staff JWKS must be set for the
    # same reason as the customer one: left empty the service derives it
    # from the staff ISSUER, which is the public host.
    staffauthmw: true
    replicaCount: 1
    db_host: "pgdog-product.product.svc.cluster.local"
    db_port: "6432"
    db_migration_host: "product-db-rw.product.svc.cluster.local"
    db_secret: "product-db-order-secret"
    db_sslmode: "disable"
    pool_max: "30"
    # The API calls shipping over gRPC (headless :9090). It does not call
    # notification: only the worker does (apps/order-worker.yaml sets its own
    # NOTIFICATION_GRPC_ADDR), so the API carries no notification address.
    shipping_grpc_addr: "dns:///shipping.shipping.svc.cluster.local:9090"
    # The API dials inventory for the order-details enrichment
    # (GetReservation). Same value as the code default; explicit so the
    # call graph can be read off this file, like payment below.
    inventory_grpc_addr: "dns:///inventory.inventory.svc.cluster.local:9090"
    # The API dials payment for the order-details enrichment (GetPayment).
    # Explicit because the code default points at the (correct) plain
    # `payment` Service name — kept explicit for auditability. The saga's payment steps are
    # always on (no feature flag); the worker uses its own PAYMENT_GRPC_ADDR.
    payment_grpc_addr: "dns:///payment.payment.svc.cluster.local:9090"
    # Internal gRPC server (:9090) — checkout's confirm handoff calls
    # order.v1/CreateOrder (RFC-0015, ADR-018). The domain template adds a
    # grpc:9090 port to the order Service.
    grpc_server: true
    # MUST stay the string "false": the template guard is truthiness-based,
    # so a boolean false would drop the env entirely — leaving reflection ON.
    grpc_reflection: "false"
