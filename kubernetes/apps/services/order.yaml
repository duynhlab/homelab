apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-order
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: checkout
spec:
  type: Static
  defaultValues:
    name: order
    # 1.12.0 makes cancellation fail closed when payment does not know what the
    # provider did (RFC-0021 P6). A `processing` payment used to fall into the
    # "nothing to move" arm, so the order was settled `cancelled` while the money
    # was unaccounted for — the customer sees a cancellation and nobody ever
    # returns the funds. It now parks in manual_review, and the park reason
    # separates an unknown outcome from a decided failure so an operator is not
    # sent looking for a fate that is already known.
    #
    # Each refund also carries its own identity, so an order can owe both a saga
    # compensation and a cancellation remainder; keyed on the order alone those
    # two shared one name and the second was rejected outright.
    #
    # THIS API PIN MUST LAND BEFORE PAYMENT 1.5.0. Payment 1.5.0 is what can
    # produce a `processing` payment, and an order service that does not handle it
    # would settle those cancellations with the money still out.
    #
    # The activity signature change rides a NEW Worker Deployment Version
    # (order-worker-1-12-0.yaml + the activation CronJob's --build-id): it is a
    # rollout boundary even though the replay gate passes, because Temporal
    # compares commands rather than activity payloads.
    image_tag: "1.12.0" # {"$imagepolicy": "flux-system:order:tag"}
    namespace: order
    platform_backup_label: "cnpg"
    replicaCount: 1
    db_host: "pgdog-product.product.svc.cluster.local"
    db_port: "6432"
    db_migration_host: "product-db-rw.product.svc.cluster.local"
    db_secret: "product-db-order-secret"
    db_sslmode: "disable"
    pool_max: "30"
    # order calls shipping + publishes notifications over gRPC (headless :9090).
    shipping_grpc_addr: "dns:///shipping.shipping.svc.cluster.local:9090"
    notification_grpc_addr: "dns:///notification.notification.svc.cluster.local:9090"
    # The API dials payment for the order-details enrichment (GetPayment).
    # Explicit because the code default points at the (correct) plain
    # `payment` Service name — kept explicit for auditability. The saga's payment steps are
    # always on (no feature flag); the worker uses its own PAYMENT_GRPC_ADDR.
    payment_grpc_addr: "dns:///payment.payment.svc.cluster.local:9090"
    # Internal gRPC server (:9090) — checkout's confirm handoff calls
    # order.v1/CreateOrder (RFC-0015, ADR-018). The mop chart adds a
    # grpc:9090 port to the order Service.
    grpc_server: true
    # MUST stay the string "false": the template guard is truthiness-based,
    # so a boolean false would drop the env entirely — leaving reflection ON.
    grpc_reflection: "false"
    # RFC-0021 P3: which stock participant NEW workflows take. The order API reads
    # this and stamps it into the workflow input at the single fulfillment.Start
    # seam; the WORKER never reads it, so a workflow that reserved in inventory
    # always compensates and commits in inventory even if this is reverted
    # afterwards (participant pinned per workflow — ADR-030).
    #
    # Explicit rather than omitted, so the write cutover is a one-line,
    # greppable, reviewable diff instead of an env var appearing from nowhere.
    # `inventory` = the RFC-0021 W7 write cutover (2026-07-30): NEW workflows
    # reserve/commit/release in inventory-service; in-flight product-path sagas
    # drain on their own branch (participant is pinned per workflow in the
    # input, and every replay resolves it from the order's row). Reverting this
    # line only redirects NEW workflows — it is never a data rollback; see the
    # cutover doc before touching it under pressure.
    order_stock_participant: "inventory"
