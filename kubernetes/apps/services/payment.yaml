apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-payment
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: checkout
spec:
  type: Static
  defaultValues:
    name: payment
    # The API and order worker must support unknown payment outcomes before rollout.
    # The migration init container must use this image before the app starts.
    # Compatibility gates: docs/proposals/rfc/RFC-0021/cutover-rollback.md.
    image_tag: "2.8.0" # {"$imagepolicy": "flux-system:payment:tag"}
    namespace: payment
    # RFC-0024 P3: authmw consumer — the domain template injects the explicit
    # OIDC_ISSUER/OIDC_JWKS_URL pair (Keycloak realm; pkg v0.37.0 contract).
    authmw: true
    # Serves /protected/ (staff realm). The staff JWKS must be set for the
    # same reason as the customer one: left empty the service derives it
    # from the staff ISSUER, which is the public host.
    staffauthmw: true
    # Single replica, still deliberately — but the reason has narrowed. The
    # reconciler IS now fenced: every pass takes a session-level advisory lease,
    # so a second replica would stand down rather than run a concurrent pass
    # (ADR-036). What remains is migration 000007 (idempotency_keys.payment_id →
    # subject_id), which is not rolling-safe. The outbox relay was never the
    # constraint (FOR UPDATE SKIP LOCKED). So: the lease is not a licence to
    # scale — 000007 is the blocker to clear first.
    replicaCount: 1
    # Payment's config refuses cleartext DB in production (DB_SSLMODE must not
    # be "disable") and PgDog terminates no TLS yet — so payment connects to
    # CNPG directly over TLS (sslmode=require; CNPG serves its own certs).
    # PgDog already carries payment backend entries — move payment behind the
    # pooler when PgDog TLS lands.
    db_host: "product-db-rw.product.svc.cluster.local"
    db_port: "5432"
    db_migration_host: "product-db-rw.product.svc.cluster.local"
    db_secret: "product-db-payment-secret"
    db_sslmode: "require"
    pool_max: "25"
    # Internal gRPC server (:9090) — the order saga's money transport. The domain
    # template adds a grpc:9090 port to the payment Service.
    grpc_server: true
    # Reflection off in the cluster: this API surface moves money (grpcx
    # registers reflection unless told otherwise). MUST stay the string
    # "false": the template guard is truthiness-based, so a boolean false
    # would drop the env entirely — leaving reflection ON.
    grpc_reflection: "false"
    # Real provider hop: the mockpay deployment in this namespace (empty would
    # select the in-memory stub and disable reconciliation).
    mockpay_url: "http://mockpay.payment.svc.cluster.local:8080"
    # Shared HMAC secret (ExternalSecret payment-webhook-hmac): mockpay signs
    # webhooks, payment verifies. Required — the config fails closed without it.
    webhook_secret: "payment-webhook-hmac"
    # Auto-heal ON (ADR-012). It converges exactly ONE drift class — internal
    # `authorized` while the provider says `captured`, the lost-capture-response
    # window — by re-driving the idempotent, CAS-guarded capture BY PAYMENT ID.
    # It never calls the provider, so it cannot move money that has not already
    # moved; the worst case is a lost CAS race, recorded as `skipped` and
    # re-detected next pass.
    #
    # Enabled only now, and the order is the point: a heal nobody can see is
    # worse than a discrepancy nobody heals. Since RFC-0021 P6 the pass is
    # observable — PaymentReconciliationDiscrepancy on the drift itself,
    # PaymentReconciliationStale if the detector stops, and heal failures are
    # their own series (payment_reconciliation_heal_failures_total{kind}) rather
    # than a log line nobody greps.
    #
    # Quoted, not a boolean: the ResourceSet guard is truthiness-based, so a YAML
    # `false` would drop the env entirely instead of disabling the feature.
    recon_heal_enabled: "true"
