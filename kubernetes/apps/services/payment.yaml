apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-payment
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: checkout
spec:
  type: Static
  defaultValues:
    name: payment
    # 1.5.0 lets payment say it does NOT know what the provider did, instead of
    # guessing (RFC-0021 P6, ADR-034). An unknown outcome parks the intent in
    # `processing` and records the round-trip in payment_attempts with the key it
    # used; it never triggers the semantic opposite operation, so a capture whose
    # response was lost is no longer reversed against money the provider took.
    # Resolution re-asks the same question under that same key — on the request
    # path, and on a bounded one-minute sweep for the doubt nobody retries.
    #
    # ORDER 1.12.0 MUST ALREADY BE CURRENT before this lands. This image is what
    # can produce a `processing` payment, and an order service that does not
    # handle it settles cancellations with the money still out. Verified on the
    # cluster before this pin: CurrentVersionBuildID = 1.12.0.
    #
    # Reconciliation is also bounded to a time window with a completion-gated
    # frontier (ADR-035) and runs under a cross-process lease (ADR-036), and each
    # refund carries a caller-supplied identity (ADR-037).
    #
    # Migrations 000010-000012 ride the mop chart's init container, which reuses
    # this image and runs `migrate` BEFORE the app container starts — so the
    # schema cannot lag the code. Confirmed the hard way in the local-stack
    # audit: rebuilding the service without its migrator left the reconciler
    # querying a payment_attempts table that did not exist yet.
    # 1.5.1: pkg v0.35.0 wave (2026-08-07): dependency-only patch release, fleet aligned on one shared-library version.
    # 1.5.2: 1.5.2: reconciliation verifies the provider honoured its window (violations excluded + counted, watermark held); provider-unknown counter gains stage=park|resolve; discrepancy metrics emit class, matching the DB column (payment#56).
    # 1.5.3: telemetry-audit fix for the HTTP access log (F-1/F-2) on top of the
    # per-module pkg v0.36.1 migration and the dependency CVE round. The access
    # log now emits from the trace-carrying logger, skips routine successful
    # probes while keeping failing ones, logs the span trace id or none rather
    # than a fabricated one, and treats 4xx as warn. Local-stack E2E #2: probe
    # access logs 513664 -> 0, native trace id on 51/51 HTTP access records.
    image_tag: "1.5.3" # {"$imagepolicy": "flux-system:payment:tag"}
    namespace: payment
    # No platform_backup_label: that label routes CNPG/barman S3 credentials to
    # namespaces hosting a database cluster — payment's data lives on product-db
    # in the product namespace, which is already backed up.
    # Single replica, still deliberately — but the reason has narrowed. The
    # reconciler IS now fenced: every pass takes a session-level advisory lease,
    # so a second replica would stand down rather than run a concurrent pass
    # (ADR-036). What remains is migration 000007 (idempotency_keys.payment_id →
    # subject_id), which is not rolling-safe. The outbox relay was never the
    # constraint (FOR UPDATE SKIP LOCKED). So: the lease is not a licence to
    # scale — 000007 is the blocker to clear first.
    replicaCount: 1
    # Payment's config refuses cleartext DB in production (DB_SSLMODE must not
    # be "disable") and PgDog terminates no TLS yet — so payment connects to
    # CNPG directly over TLS (sslmode=require; CNPG serves its own certs).
    # PgDog already carries payment backend entries — move payment behind the
    # pooler when PgDog TLS lands.
    db_host: "product-db-rw.product.svc.cluster.local"
    db_port: "5432"
    db_migration_host: "product-db-rw.product.svc.cluster.local"
    db_secret: "product-db-payment-secret"
    db_sslmode: "require"
    pool_max: "25"
    # Internal gRPC server (:9090) — the order saga's money transport. The mop
    # chart adds a grpc:9090 port to the payment Service.
    grpc_server: true
    # Reflection off in the cluster: this API surface moves money (grpcx
    # registers reflection unless told otherwise). MUST stay the string
    # "false": the template guard is truthiness-based, so a boolean false
    # would drop the env entirely — leaving reflection ON.
    grpc_reflection: "false"
    # Real provider hop: the mockpay deployment in this namespace (empty would
    # select the in-memory stub and disable reconciliation).
    mockpay_url: "http://mockpay.payment.svc.cluster.local:8080"
    # Shared HMAC secret (ExternalSecret payment-webhook-hmac): mockpay signs
    # webhooks, payment verifies. Required — the config fails closed without it.
    webhook_secret: "payment-webhook-hmac"
    # Auto-heal ON (ADR-012). It converges exactly ONE drift class — internal
    # `authorized` while the provider says `captured`, the lost-capture-response
    # window — by re-driving the idempotent, CAS-guarded capture BY PAYMENT ID.
    # It never calls the provider, so it cannot move money that has not already
    # moved; the worst case is a lost CAS race, recorded as `skipped` and
    # re-detected next pass.
    #
    # Enabled only now, and the order is the point: a heal nobody can see is
    # worse than a discrepancy nobody heals. Since RFC-0021 P6 the pass is
    # observable — PaymentReconciliationDiscrepancy on the drift itself,
    # PaymentReconciliationStale if the detector stops, and heal failures are
    # their own series (payment_reconciliation_heal_failures_total{kind}) rather
    # than a log line nobody greps.
    #
    # Quoted, not a boolean: the ResourceSet guard is truthiness-based, so a YAML
    # `false` would drop the env entirely instead of disabling the feature.
    recon_heal_enabled: "true"
