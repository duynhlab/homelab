apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-product
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: catalog
spec:
  type: Static
  defaultValues:
    name: product
    # 1.7.0 removes the stock write RPCs (RFC-0021 phase 4): ReserveStock and
    # ReleaseStock are gone from the gRPC surface, and so is the removal-gate
    # instrument product_stock_surface_calls_total that watched them.
    #
    # The two-week-zero gate on that instrument was WAIVED by the owner on
    # 2026-08-05 in favour of code evidence. Read the waiver in
    # docs/proposals/rfc/RFC-0021/cutover-rollback.md § Contract removal before
    # inferring anything from an empty panel — the query cannot be re-run now,
    # and empty reads exactly like zero.
    #
    # A straggler caller gets Unimplemented, which grpcx logs at ERROR level.
    # That is the only detection channel left, and it only fires after
    # something has already broken. There is no rollback for this removal.
    #
    # Still served: the stock READ surface (stock_quantity in catalog payloads,
    # /details stock.available/quantity, GetProducts.available_qty) answers from
    # a column FROZEN since the W7 write cutover. Removing it is the next slice;
    # what this pin does is stop it being the ONLY answer — see
    # product_availability_source below.
    image_tag: "1.7.0" # {"$imagepolicy": "flux-system:product:tag"}
    namespace: product
    platform_backup_label: "cnpg"
    replicaCount: 1
    db_host: "pgdog-product.product.svc.cluster.local"
    db_port: "6432"
    db_migration_host: "product-db-rw.product.svc.cluster.local"
    db_secret: "product-db-secret"
    db_sslmode: "disable"
    pool_max: "50"
    cache_enabled: "true"
    review_grpc_addr: "dns:///review.review.svc.cluster.local:9090"
    # RFC-0021 P2-6, turned on now (phase 4): the detail page asks INVENTORY for
    # availability instead of only reporting product's own frozen column. The
    # NetworkPolicy for this hop already exists (allow-inventory-grpc admits the
    # product namespace); it was written for this enrichment and has been unused.
    #
    # Explicit address, not the code default: that default is
    # `inventory-grpc.inventory`, a Service this cluster does not have, and an
    # unreachable inventory soft-fails to status=unknown — so a wrong address
    # degrades the page quietly instead of failing loudly.
    inventory_grpc_addr: "dns:///inventory.inventory.svc.cluster.local:9090"
    # `inventory` makes /details carry an `availability` block sourced from the
    # authority. It does NOT remove the frozen `stock` block yet — the SPA still
    # reads that one, so the switch is expand-then-contract: enable here, move the
    # frontend, then drop `stock` from the response.
    product_availability_source: "inventory"
    # product serves gRPC on :9090 (ReserveStock/ReleaseStock — the saga's
    # stock steps, dialed by order-worker); the chart renders the product-grpc
    # headless Service from this.
    grpc_server: true
