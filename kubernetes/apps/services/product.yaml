apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-product
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: catalog
spec:
  type: Static
  defaultValues:
    name: product
    # 1.6.0 ships the phase-4 removal-gate instrument:
    # product_stock_surface_calls_total{rpc} counts every touch of the stock
    # surface being removed (ReserveStock/ReleaseStock, before validation).
    # The gate reads TWO WEEKS OF ZERO on it, and the clock starts when this
    # pin converges on the cluster — not at merge, not at tag.
    image_tag: "1.6.0" # {"$imagepolicy": "flux-system:product:tag"}
    namespace: product
    platform_backup_label: "cnpg"
    replicaCount: 1
    db_host: "pgdog-product.product.svc.cluster.local"
    db_port: "6432"
    db_migration_host: "product-db-rw.product.svc.cluster.local"
    db_secret: "product-db-secret"
    db_sslmode: "disable"
    pool_max: "50"
    cache_enabled: "true"
    review_grpc_addr: "dns:///review.review.svc.cluster.local:9090"
    # product serves gRPC on :9090 (ReserveStock/ReleaseStock — the saga's
    # stock steps, dialed by order-worker); the chart renders the product-grpc
    # headless Service from this.
    grpc_server: true
