apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-product
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: catalog
spec:
  type: Static
  defaultValues:
    name: product
    # Migration 000006 drops stock data; rollback requires a restore-tested backup,
    # not just a down-migration. Retire inventory backfill before that migration.
    # See docs/proposals/rfc/RFC-0021/cutover-rollback.md for gates and recovery.
    image_tag: "1.16.1" # {"$imagepolicy": "flux-system:product:tag"}
    namespace: product
    # Runs pkg/authmw (cmd/main.go) and serves /protected/, so both realm
    # pairs belong in the manifest rather than in compiled defaults.
    authmw: true
    staffauthmw: true
    replicaCount: 1
    db_host: "pgdog-product.product.svc.cluster.local"
    db_port: "6432"
    db_migration_host: "product-db-rw.product.svc.cluster.local"
    db_secret: "product-db-secret"
    db_sslmode: "disable"
    pool_max: "50"
    cache_enabled: "true"
    review_grpc_addr: "dns:///review.review.svc.cluster.local:9090"
    # RFC-0021 P2-6, turned on now (phase 4): the detail page asks INVENTORY for
    # availability instead of only reporting product's own frozen column. The
    # NetworkPolicy for this hop already exists (allow-inventory-grpc admits the
    # product namespace); it was written for this enrichment and has been unused.
    #
    # Explicit address, not the code default: that default is
    # `inventory-grpc.inventory`, a Service this cluster does not have, and an
    # unreachable inventory soft-fails to status=unknown — so a wrong address
    # degrades the page quietly instead of failing loudly.
    inventory_grpc_addr: "dns:///inventory.inventory.svc.cluster.local:9090"
    # NO product_availability_source input any more: 1.11.0 DELETED the flag and
    # always asks inventory. Its `product` position had become a trap — since 1.8.0
    # it meant the detail page carried no availability at all, and 1.10.0 dropped the
    # column underneath it. Third default in this migration to point at an authority
    # that was already removed.
    #
    # The pin and the input removal ride together on purpose. Dropping the input
    # while 1.10.0 was still pinned would trip exactly that default; env and image
    # live in the same Deployment template, so each pod rolls with both at once.
    # product serves gRPC on :9090 — one RPC, BatchGetCurrentPrices, dialed by
    # checkout for price re-validation. ReserveStock/ReleaseStock/GetProducts left
    # the contract in 1.7.0/1.8.0, so order-worker no longer dials product at all.
    # The chart renders the product-grpc headless Service from this.
    grpc_server: true
