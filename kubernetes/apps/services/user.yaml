apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-user
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: identity
spec:
  type: Static
  defaultValues:
    name: user
    image_tag: "2.5.1" # {"$imagepolicy": "flux-system:user:tag"}
    namespace: user
    # RFC-0024 P3: authmw consumer — the domain template injects the explicit
    # OIDC_ISSUER/OIDC_JWKS_URL pair (Keycloak realm; pkg v0.37.0 contract).
    authmw: true
    # Serves /protected/ (staff realm). The staff JWKS must be set for the
    # same reason as the customer one: left empty the service derives it
    # from the staff ISSUER, which is the public host.
    staffauthmw: true
    replicaCount: 1
    db_host: "platform-db-pooler-rw.platform.svc.cluster.local"
    db_port: "5432"
    db_migration_host: "platform-db-rw.platform.svc.cluster.local"
    db_secret: "platform-db-user-secret"
    db_sslmode: "disable"
    pool_max: "30"
