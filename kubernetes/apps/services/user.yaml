apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: rsip-user
  namespace: default
  labels:
    app.kubernetes.io/part-of: backend-services
    platform.duynhlab.dev/domain: identity
spec:
  type: Static
  defaultValues:
    name: user
    image_tag: "2.5.6" # {"$imagepolicy": "flux-system:user:tag"}
    namespace: user
    # RFC-0024 P3: authmw consumer — the domain template injects the explicit
    # OIDC_ISSUER/OIDC_JWKS_URL pair (Keycloak realm; pkg v0.37.0 contract).
    authmw: true
    # Serves /protected/ (staff realm). The staff JWKS must be set for the
    # same reason as the customer one: left empty the service derives it
    # from the staff ISSUER, which is the public host.
    staffauthmw: true
    replicaCount: 1
    db_host: "platform-db-pooler-rw.platform.svc.cluster.local"
    db_port: "5432"
    db_migration_host: "platform-db-rw.platform.svc.cluster.local"
    db_runtime_secret: "platform-db-user-runtime-secret"
    db_migrator_secret: "platform-db-user-migrator-secret"
    # ADR-089: TLS to PgBouncer, and from migrate to the primary, verified
    # against the CA in db_ca_secret.
    db_sslmode: "verify-full"
    db_ca_secret: "platform-db-ca-trust"
    # ADR-025 pattern A: the runtime reads its rotated password from this file
    # (OpenBAO static role → ESO → mounted Secret), never from the env.
    db_password_file: "/etc/db/secret/password"
    pool_max: "30"
