---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  timeout: 5m
  retryInterval: 2m
  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci
  path: ./configs/cert-manager
  prune: true
  wait: true
  dependsOn:
    - name: controllers-local
    - name: secrets-local
  # The former kong-proxy-tls homelab-ca patch left with the Kong cutover
  # (RFC-0024 P2.3). The edge cert (platform-edge-tls) carries its own LOCAL
  # issuer patch in envoy-gateway-config.yaml (debugs.md Bug 9).
