# ClickHouse OLAP backend for OTel logs+traces SQL (RFC-0019 Phase B / ADR-023).
# Its own Kustomization so it can dependsOn secrets-local (the ESO-managed
# clickhouse-credentials Secret) without deadlocking controllers-local (wait:true)
# — same split as tracing-local / profiling-local. The Altinity operator + its
# CRDs are installed in the controllers wave, so this only needs controllers-local
# (CRDs) + secrets-local (credentials). Uses a local PVC, so no storage-local dep.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clickhouse-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: observability
spec:
  interval: 10m
  # 25m, up from 15m: this wave now brings up six pods with six PVCs (three
  # ClickHouse replicas + three keepers) instead of one pod with one PVC, and it
  # gates tracing-local behind all of them. There is a second reason too — the
  # operator waits for the referenced CHK's pods before it can resolve keeper
  # endpoints (readyTimeout, default 120s) and fails the CHI reconcile with an
  # ErrKeeperNotReady Event if they are not up yet. Both CRs land in this one
  # wave, so on a cold node pulling two images that will happen at least once
  # and retry; 15m left no room for it.
  timeout: 25m
  retryInterval: 2m
  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci
  path: ./configs/clickhouse
  prune: true
  # NO `wait: true` here, and that is the whole point (RFC-0028).
  #
  # `wait` and `healthChecks` are mutually exclusive in Flux, and `wait` wins.
  # This overlay applies exactly two objects — the CHI and the CHK — and kstatus
  # cannot assess a custom resource that publishes no standard conditions, so it
  # calls them Current the instant they are applied. Measured on 2026-08-28 with
  # `wait: true` still set: this wave reconciled in **371ms** and reported
  # success while ZERO StatefulSets existed; the operator created the first one a
  # minute later. tracing-local then applied on that green light, and the
  # collector ran `CREATE ... ON CLUSTER` against a cluster where replicas 1 and
  # 2 had not yet joined the distributed-DDL queue. A host that joins later
  # SKIPS earlier queue entries, and `IF NOT EXISTS` makes every retry a no-op —
  # so the schema was created on replica 0 only, permanently and silently.
  # `system.replicas` read total_replicas=1 while all six pods were Running.
  #
  # Dropping `wait` is what makes the healthChecks below actually evaluated, and
  # they are the only thing that can gate on operator-created StatefulSets, which
  # are never part of this overlay's applied set.
  dependsOn:
    - name: controllers-local
    - name: secrets-local
  healthChecks:
    # StatefulSets generated by the operator: chi-<chi>-<cluster>-<shard>-<replica>.
    # All THREE are listed on purpose (RFC-0028): a replica missing from this
    # list is a replica nobody gates on, and downstream would be released while
    # it is still starting. These only take effect because `wait` is absent —
    # see the note above it.
    - apiVersion: apps/v1
      kind: StatefulSet
      name: chi-clickhouse-otel-0-0
      namespace: monitoring
    - apiVersion: apps/v1
      kind: StatefulSet
      name: chi-clickhouse-otel-0-1
      namespace: monitoring
    - apiVersion: apps/v1
      kind: StatefulSet
      name: chi-clickhouse-otel-0-2
      namespace: monitoring
    # Keeper StatefulSets: chk-<chk>-<cluster>-<shard>-<replica>, one per host,
    # structurally identical to the CHI pattern that yields the known-good
    # chi-clickhouse-otel-0-0 above. Read off the operator's own naming patterns
    # rather than guessed. Gating on these is what makes "keeper before the CHI's
    # consumers" true at the wave level; without them the quorum can still be
    # forming when tracing-local is released, and the collector's ON CLUSTER DDL
    # is what pays for that.
    - apiVersion: apps/v1
      kind: StatefulSet
      name: chk-keeper-keeper-0-0
      namespace: monitoring
    - apiVersion: apps/v1
      kind: StatefulSet
      name: chk-keeper-keeper-0-1
      namespace: monitoring
    - apiVersion: apps/v1
      kind: StatefulSet
      name: chk-keeper-keeper-0-2
      namespace: monitoring
