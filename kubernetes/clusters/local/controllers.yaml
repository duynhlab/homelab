---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: controllers-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 2m
  
  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci
  
  path: ./controllers
  
  prune: false
  wait: true
  
  # Health checks for namespaces and operators
  healthChecks:
    # Namespaces (now included in controllers path)
    - apiVersion: v1
      kind: Namespace
      name: monitoring
    - apiVersion: v1
      kind: Namespace
      name: database
    - apiVersion: v1
      kind: Namespace
      name: cloudnative-pg
    # CRDs (must exist before configs can create instances)
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: clusters.postgresql.cnpg.io
    # Prometheus CRDs (required by VM Prometheus auto-conversion + other charts)
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: prometheus-operator-crds
      namespace: monitoring
    # Monitoring operators
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: victoria-metrics-operator
      namespace: monitoring
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: grafana-operator
      namespace: monitoring
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: metrics-server
      namespace: kube-system
    # Database operators
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnative-pg
      namespace: cloudnative-pg
    # SLO operator
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: sloth
      namespace: monitoring
    # Secrets management (OpenBAO HA + ESO)
    - apiVersion: v1
      kind: Namespace
      name: openbao
    - apiVersion: v1
      kind: Namespace
      name: external-secrets-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: openbao
      namespace: openbao
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: external-secrets-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: trust-manager
      namespace: cert-manager
    # Envoy Gateway namespace (workloads deployed by gateway-api-crds-local +
    # envoy-gateway-local — RFC-0024 P2).
    - apiVersion: v1
      kind: Namespace
      name: envoy-gateway
    # Identity namespace (Keycloak workload deployed by keycloak-local).
    - apiVersion: v1
      kind: Namespace
      name: identity
    # Kyverno admission policy engine
    - apiVersion: v1
      kind: Namespace
      name: kyverno
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: kyverno
    # Temporal operator health checks REMOVED (ADR-030 revision): the operator is
    # retired in favour of the official temporalio chart, which needs no CRDs.
    # Leaving them would block controllers-local forever — and everything
    # dependsOn it. Temporal readiness is now owned by temporal-local
    # (HelmRelease + frontend Deployment health checks).
    # ClickHouse operator (CRDs must exist before clickhouse-local applies the
    # CHI and the CHK). Both CRDs are gated: the chart installs them together,
    # but "together" is not "atomically", and clickhouse-local applies both CRs
    # in one wave (RFC-0028).
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: clickhouse-operator
      namespace: monitoring
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: clickhouseinstallations.clickhouse.altinity.com
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: clickhousekeeperinstallations.clickhouse-keeper.altinity.com
