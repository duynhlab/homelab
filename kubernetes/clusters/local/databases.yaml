---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: databases-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 2m
  
  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci
  
  path: ./configs/databases
  
  prune: false
  wait: true

  # pg_stat_ch's ClickHouse password is a PostgreSQL postmaster GUC, which CNPG
  # only takes as a literal in Cluster.spec.postgresql.parameters. Flux fills
  # ${PG_STAT_CH_CLICKHOUSE_PASSWORD} at apply time from the Secret ESO lands in
  # flux-system (configs/secrets/cluster-external-secrets/clickhouse-pg-stat-ch.yaml),
  # so no manifest carries the value. Only the ${var} form is substituted; the
  # shell scripts under configs/databases use $VAR and are untouched (checked
  # 2026-10-13: no other ${ in this path). An undefined ${var} becomes an empty
  # string, which is why the Secret is not optional.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: pg-stat-ch-clickhouse
        optional: false

  dependsOn:
    - name: secrets-local
    - name: monitoring-local
    - name: cnpg-barman-plugin-local
    - name: storage-local
    # Ordering hygiene: bring DB namespaces up behind their NetworkPolicies so
    # the CNPG operator never races an un-fenced namespace.
    - name: network-policies-local

  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: platform-db
      namespace: platform
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: product-db
      namespace: product
