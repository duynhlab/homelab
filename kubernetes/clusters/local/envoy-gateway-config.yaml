# Envoy Gateway edge configuration (RFC-0024 P2) — GatewayClass + EnvoyProxy +
# Gateway + HTTPRoutes + SecurityPolicies + BackendTrafficPolicies, the
# Gateway API translation of configs/kong/. Runs AFTER:
#   - envoy-gateway-local: controller + CRDs Ready
#   - cert-manager-local:  ClusterIssuers exist for the platform-edge-tls cert
#   - keycloak-local:      the SecurityPolicy remoteJWKS endpoint
#     (http://keycloak.identity:8080/realms/duynhlab/...) resolves
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-config-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  timeout: 10m
  retryInterval: 2m
  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci
  path: ./configs/envoy-gateway
  prune: true
  wait: true
  dependsOn:
    - name: envoy-gateway-local
    - name: cert-manager-local
    - name: keycloak-local
  patches:
    # LOCAL-ONLY: issue platform-edge-tls from the self-signed `homelab-ca`
    # instead of `letsencrypt-prod`. Kind has no real duynh.me DNS zone /
    # Cloudflare token, so LE DNS-01 can't complete. Prod keeps
    # letsencrypt-prod. (Same shape the retired kong-proxy-tls patch had in
    # cert-manager-config.yaml — debugs.md Bug 9.)
    - target:
        kind: Certificate
        name: platform-edge-tls
        namespace: envoy-gateway
      patch: |
        - op: replace
          path: /spec/issuerRef/name
          value: homelab-ca
    # LOCAL-ONLY: sample 100% of edge traces on Kind (base = 10% for the
    # cluster, matching the Kong tracing_sampling_rate 0.1 model — EG's
    # samplingRate is a PERCENT, 0-100). Local full sampling makes the E2E
    # trace-continuity audit deterministic.
    - target:
        kind: EnvoyProxy
        name: platform
        namespace: envoy-gateway
      patch: |
        - op: replace
          path: /spec/telemetry/tracing/samplingRate
          value: 100
