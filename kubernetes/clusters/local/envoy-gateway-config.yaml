# Envoy Gateway edge configuration (RFC-0024 P2) — GatewayClass + EnvoyProxy +
# Gateway + HTTPRoutes + SecurityPolicies + BackendTrafficPolicies: the whole
# routed edge surface in configs/envoy-gateway/. Runs AFTER:
#   - envoy-gateway-local: controller + CRDs Ready
#   - cert-manager-local:  ClusterIssuers exist for the platform-edge-tls cert
#   - keycloak-local:      the SecurityPolicy remoteJWKS endpoint
#     (http://keycloak.identity:8080/realms/duynhlab/...) resolves
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-config-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  timeout: 10m
  retryInterval: 2m
  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci
  path: ./configs/envoy-gateway
  prune: true
  wait: true
  dependsOn:
    - name: envoy-gateway-local
    - name: cert-manager-local
    - name: keycloak-local
  patches:
    # LOCAL-ONLY: issue platform-edge-tls from the self-signed `homelab-ca`
    # instead of `letsencrypt-prod`. Kind has no real duynh.me DNS zone /
    # Cloudflare token, so LE DNS-01 can't complete. Prod keeps
    # letsencrypt-prod.
    - target:
        kind: Certificate
        name: platform-edge-tls
        namespace: envoy-gateway
      patch: |
        - op: replace
          path: /spec/issuerRef/name
          value: homelab-ca
    # LOCAL-ONLY: sample 100% of edge traces on Kind (base = 50% for the
    # cluster). EG's samplingRate is a PERCENT, 0-100. Local full sampling
    # makes the E2E trace-continuity audit deterministic.
    - target:
        kind: EnvoyProxy
        name: platform
        namespace: envoy-gateway
      patch: |
        - op: replace
          path: /spec/telemetry/tracing/samplingRate
          value: 100
    # LOCAL-ONLY: pin the Envoy data plane to the control-plane node.
    # The generated Service is a NodePort with externalTrafficPolicy: Local,
    # which only answers on nodes that host a backing pod — while kind's
    # extraPortMappings (80->30080, 443->30443, scripts/kind-up.sh) exist on
    # the control-plane node alone. Scheduled anywhere else, the edge is
    # healthy in-cluster and unreachable from the host, which reads as a TLS
    # or routing fault. This honours the `ingress-ready=true` label kind-up.sh
    # already sets and nothing else consumed; the toleration is required
    # because the node carries node-role.kubernetes.io/control-plane:NoSchedule.
    # Not a prod concern: prod fronts the Gateway with a real load balancer.
    # externalTrafficPolicy stays Local on purpose — Cluster would SNAT the
    # client address that security-admin-cidr.yaml's clientCIDRs fence reads.
    - target:
        kind: EnvoyProxy
        name: platform
        namespace: envoy-gateway
      # Patch the CHILD paths, not `pod` itself. A JSON Patch `add` on an
      # existing object path REPLACES it, so `op: add` on /pod silently dropped
      # the base's pod.labels (the ADR-060 otlp-logs guard) -- the CR applied
      # cleanly and Vector kept tailing the edge. `pod` already exists in the
      # base, which is what makes these child adds valid.
      patch: |
        - op: add
          path: /spec/provider/kubernetes/envoyDeployment/pod/nodeSelector
          value:
            ingress-ready: "true"
        - op: add
          path: /spec/provider/kubernetes/envoyDeployment/pod/tolerations
          value:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
