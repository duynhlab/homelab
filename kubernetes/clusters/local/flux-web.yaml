---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-web-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  timeout: 5m
  retryInterval: 2m

  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci

  # SSO for the Flux Operator web UI (ADR-062 recipe, third staff client):
  # rendered Web Config Secret + live-CA trust Certificate + group RBAC.
  # The operator consumes the Secret via --web-config-secret-name, wired in
  # terraform/main.tf — this wave only provides the objects it reads.
  path: ./configs/flux-web

  prune: true
  wait: true

  dependsOn:
    # ExternalSecret needs ESO + the openbao ClusterSecretStore.
    - name: secrets-local
    # Certificate needs cert-manager + the homelab-ca ClusterIssuer.
    - name: cert-manager-local
