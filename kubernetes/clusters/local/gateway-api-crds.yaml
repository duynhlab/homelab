# Gateway API + Envoy Gateway CRDs (RFC-0024 P2). Own Kustomization so the
# envoy-gateway controller can dependsOn applied CRDs, and so a controller
# rollback never prunes CRDs (prune: false — deleting Gateway API CRDs would
# cascade-delete every HTTPRoute/policy).
#
# The CRDs are vendored manifests applied with server-side apply, NOT a
# HelmRelease: the upstream gateway-crds-helm chart ships them in templates/,
# so Helm's release Secret would need ~2.06 MB against a 1 MiB limit and the
# install can never succeed. See controllers/gateway-api-crds/README.md.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  timeout: 5m
  retryInterval: 2m
  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci
  path: ./controllers/gateway-api-crds
  prune: false
  # wait: true makes kustomize-controller wait for every applied object to
  # become ready — for CRDs that is the Established condition — so no explicit
  # healthChecks block is needed (the two are mutually exclusive in Flux).
  wait: true
  dependsOn:
    - name: controllers-local # `envoy-gateway` namespace (controllers/namespaces.yaml)
