---
# Grafana folders from the as-code artifact, applied as their own wave so the
# dashboards can depend on them.
#
# Splitting this out is not tidiness. The Grafana Operator applies each
# GrafanaManifest independently and in no guaranteed order, so a dashboard whose
# `grafana.app/folder` annotation names a folder that does not exist yet fails
# outright with:
#
#   applying resource: creating resource:
#   folders.folder.grafana.app "<uid>" not found
#
# and then waits for the operator's next resync. At resyncPeriod 10m against a
# wave timeout of 5m the retry always lands after the deadline, so the wave sits
# red rather than riding it out. Ordering inside one Kustomization guarantees
# nothing; only `dependsOn` between two does.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-dashboards-as-code-folders-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: observability
spec:
  interval: 10m
  timeout: 5m
  retryInterval: 2m

  sourceRef:
    kind: OCIRepository
    name: grafana-dashboards-as-code-oci

  path: ./folders
  targetNamespace: monitoring

  prune: true

  dependsOn:
    - name: monitoring-local

  healthChecks:
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: GrafanaManifest
      name: kubernetes-folder
      namespace: monitoring
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: GrafanaManifest
      name: databases-folder
      namespace: monitoring
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: GrafanaManifest
      name: observability-folder
      namespace: monitoring
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: GrafanaManifest
      name: microservices-folder
      namespace: monitoring
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: GrafanaManifest
      name: platform-folder
      namespace: monitoring
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: GrafanaManifest
      name: api-gateway-folder
      namespace: monitoring

  # GrafanaManifest reports ManifestSynchronized rather than the conventional
  # Ready condition, so kstatus cannot infer readiness without this contract.
  healthCheckExprs:
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: GrafanaManifest
      inProgress: >-
        !has(status.conditions) ||
        status.conditions.filter(e,
          e.type == 'ManifestSynchronized' &&
          e.observedGeneration == metadata.generation).size() == 0
      failed: >-
        status.conditions.exists(e,
          e.type == 'ManifestSynchronized' &&
          e.status == 'False' &&
          e.observedGeneration == metadata.generation)
      current: >-
        status.conditions.exists(e,
          e.type == 'ManifestSynchronized' &&
          e.status == 'True' &&
          e.observedGeneration == metadata.generation)
