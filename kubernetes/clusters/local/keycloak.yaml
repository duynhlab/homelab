---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  timeout: 10m  # first boot builds + imports the realm — slower than a plain start
  retryInterval: 2m

  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci

  path: ./controllers/keycloak

  prune: true
  wait: true

  dependsOn:
    - name: controllers-local    # `identity` namespace (controllers/namespaces.yaml)
    - name: databases-local      # platform-db Ready + keycloak DB/role triplet + identity-ns secret copy
    - name: secrets-local        # OpenBAO bootstrapped so the keycloak-bootstrap-admin ExternalSecret syncs
    - name: monitoring-local     # ServiceMonitor CRD + Grafana/VM stack for the keycloak scrape

  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: keycloak
      namespace: identity
