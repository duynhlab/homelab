---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - flux-system/
  - sources/
  - controllers.yaml     # Namespaces + operators (monitoring, databases, slo)
  - cert-manager-config.yaml
  - cnpg-barman-plugin.yaml # Barman Cloud Plugin + ObjectStore CRD before CNPG clusters
  - gateway-api-crds.yaml    # Gateway API + Envoy Gateway CRDs (RFC-0024 P2)
  - envoy-gateway.yaml       # Envoy Gateway control plane (depends on gateway-api-crds + cert-manager)
  - envoy-gateway-config.yaml # Gateway/HTTPRoutes/policies (depends on envoy-gateway + cert-manager + keycloak)
  - secrets.yaml         # Vault + ESO (Must be before databases)
  - openbao-oidc-config.yaml # OpenBAO staff OIDC (ADR-062; depends on secrets + envoy-gateway-config)
  - flux-web.yaml        # Flux web UI SSO objects (configs/flux-web; depends on secrets + cert-manager)
  - caching.yaml         # Valkey (depends on monitoring-local for ServiceMonitor CRD)
  - storage.yaml         # RustFS (depends on secrets-local for ESO-managed credentials)
  - tracing.yaml         # OTel Collector (depends on clickhouse-local; Tempo/Jaeger retired, RFC-0027)
  - profiling.yaml       # Pyroscope (depends on secrets-local + storage-local; RustFS-backed profiles)
  - clickhouse-keeper.yaml # ClickHouse Keeper quorum — must be Ready before the CHI is applied (RFC-0028)
  - clickhouse.yaml      # ClickHouse OLAP for OTel logs+traces SQL (depends on controllers-local + secrets-local + clickhouse-keeper-local)
  - clickhouse-schema.yaml # ClickHouse DDL bootstrap Job (gates tracing-local; RFC-0028)
  - databases.yaml       # DB Instances (Must be before apps)
  - databases-cnpg-dr.yaml  # CNPG DR replica (depends on databases-local)
  - monitoring.yaml      # Grafana + Prometheus Configs
  - kyverno.yaml         # Admission policies (depends on controllers + monitoring)
  - policy-reporter.yaml # Kyverno's PolicyReports, browsable (depends on kyverno-policies-local)
  - network-policies.yaml   # Ingress NetworkPolicies (inert on kindnet; depends on controllers)
  # - mcp.yaml           # DISABLED 2026-08-21 — owner: the MCP servers are not in use, and they were
  # the biggest idle consumers on the Kind host (victoria-metrics-mcp alone held
  # 662Mi). Re-enable by uncommenting this line; nothing else is needed.
  - temporal.yaml        # Temporal server chart (controllers/temporal)
  - temporal-config.yaml # its ingress + alerts (configs/temporal, after temporal-local)
  - keycloak.yaml        # Keycloak identity provider (controllers/keycloak, RFC-0024 P1)
  - apps.yaml            # Microservices