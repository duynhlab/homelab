---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  timeout: 10m
  retryInterval: 2m
  
  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci
  
  path: ./configs/observability
  
  prune: true
  wait: true
  
  dependsOn:
    - name: controllers-local
  
  healthChecks:
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: Grafana
      name: grafana
      namespace: monitoring
    # Trace-backend readiness is NOT gated here. It was a `HelmRelease/tempo`
    # check that referenced a resource which did not exist and would fail
    # monitoring-local (debugs.md Bug 6 / Bug 7); the gate moved to tracing-local,
    # and Tempo itself is retired (RFC-0027). Grafana is the only health check this
    # wave needs.
