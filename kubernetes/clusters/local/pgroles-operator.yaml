---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgroles-operator-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  timeout: 10m
  retryInterval: 2m
  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci
  path: ./controllers/databases/pgroles-operator
  prune: true
  wait: true
  dependsOn:
    - name: controllers-local
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: pgroles-operator
      namespace: pgroles-system
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: postgrespolicies.pgroles.io
    - apiVersion: apps/v1
      kind: Deployment
      name: pgroles-operator
      namespace: pgroles-system
