---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policy-reporter-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 2m
  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci
  path: ./controllers/policy-reporter
  prune: true
  wait: true
  # Its own wave, not controllers-local, for the reason debugs.md Bug 6 records
  # and tracing-local / profiling-local / caching-local were each split out for:
  # this chart needs CRDs that controllers-local itself installs -- PolicyReport
  # (from Kyverno) and ServiceMonitor (from prometheus-operator-crds) -- and
  # ordering WITHIN a Kustomization is not guaranteed, so a HelmRelease that
  # waits on a sibling's CRDs can deadlock a wave that has wait: true.
  #
  # kyverno-policies-local is the right single dependency: it already depends on
  # monitoring-local, so both CRDs plus the policies whose reports this reads are
  # in place by the time this applies.
  dependsOn:
    - name: kyverno-policies-local
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: policy-reporter
      namespace: policy-reporter
