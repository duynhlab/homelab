---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # OCI Repositories
  - oci/infrastructure-oci.yaml
  - oci/apps-oci.yaml
  - oci/mop-chart-oci.yaml
  - oci/grafana-dashboards-chart-oci.yaml
  - oci/grafana-operator-oci.yaml
  - oci/obs-as-code-oci.yaml
  - oci/victoria-metrics-operator-oci.yaml
  - oci/cronjobs-oci.yaml
  - oci/victoria-metrics-mcp-oci.yaml
  - oci/victoria-logs-mcp-oci.yaml
  - oci/flux-operator-mcp-oci.yaml
  - oci/grafana-mcp-oci.yaml
  - oci/envoy-gateway-oci.yaml
  # CRDs chart first — the controller HelmRelease dependsOn it (ADR-054).
  - oci/temporal-worker-controller-crds-oci.yaml
  - oci/temporal-worker-controller-oci.yaml
  
  # Helm Repositories
  - helm/prometheus-community.yaml
  - helm/metrics-server.yaml
  - helm/cnpg.yaml
  - helm/grafana.yaml
  - helm/sloth.yaml
  - helm/vector.yaml
  - helm/opentelemetry.yaml
  - helm/pgdog.yaml
  - helm/rustfs.yaml
  - helm/valkey.yaml
  - helm/external-secrets.yaml
  - helm/openbao.yaml
  - helm/jetstack.yaml
  - helm/kyverno.yaml
  - helm/policy-reporter.yaml
  # temporal-operator source retired with the operator; kept as
  # helm/temporal-operator.yaml.bak (ADR-030).
  - helm/temporalio.yaml
  - helm/altinity.yaml
# RFC-0027 / ADR-058: the jaegertracing Helm repository retired with Jaeger
# (helm/jaegertracing.yaml.bak).
# RFC-0027 / ADR-059: grafana-community existed only to ship the Tempo chart
# (ADR-040). No HelmRelease references it now, so it retired with Tempo
# (helm/grafana-community.yaml.bak). grafana-mcp is unrelated — it comes from an
# OCIRepository (sources/oci/grafana-mcp-oci.yaml), not this HTTP repo.
