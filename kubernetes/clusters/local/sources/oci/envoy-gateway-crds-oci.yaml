---
# OCIRepository for the Envoy Gateway CRDs chart (RFC-0024 P2).
# Chart: oci://docker.io/envoyproxy/gateway-crds-helm — ships BOTH the
# Gateway API CRDs (standard channel) and the Envoy Gateway extension CRDs;
# which sets render is chosen by chart values (see
# controllers/gateway-api-crds/helmrelease.yaml).
# Docs: https://gateway.envoyproxy.io/docs/install/gateway-crds-helm-api/
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoy-gateway-crds-oci
  namespace: flux-system
  labels:
    app.kubernetes.io/component: helm-chart
spec:
  interval: 10m
  url: oci://docker.io/envoyproxy/gateway-crds-helm
  ref:
    # Tag kept for human readability; the digest is the actual pin (when both
    # are set, Flux resolves the digest). Verified 2026-08-11.
    tag: v1.8.3
    digest: sha256:99b14db0bc57c8f413023d66145a2c53e8ed47f85fe0163b675c04165ff242d4
