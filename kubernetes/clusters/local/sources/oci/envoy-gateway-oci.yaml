---
# OCIRepository for the Envoy Gateway control-plane chart (RFC-0024 P2).
# Chart: oci://docker.io/envoyproxy/gateway-helm — the envoy-gateway
# controller Deployment. The chart carries CRDs in its `crds` subchart; that
# subchart is disabled outright (`crds.enabled: false`) because
# controllers/gateway-api-crds/ owns the CRD lifecycle as vendored manifests
# (see that directory's README).
# Docs: https://gateway.envoyproxy.io/docs/install/install-helm/
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoy-gateway-oci
  namespace: flux-system
  labels:
    app.kubernetes.io/component: helm-chart
spec:
  interval: 10m
  url: oci://docker.io/envoyproxy/gateway-helm
  ref:
    # Tag kept for human readability; the digest is the actual pin (when both
    # are set, Flux resolves the digest). Verified 2026-10-28 against the
    # Docker Hub tags API for docker.io/envoyproxy/gateway-helm:v1.9.3. Keep
    # the v-prefixed tag: upstream also pushes `1.9.3`, a different artifact
    # (sha256:da69a5e0...) whose chart version string drops the `v`;
    # .renovaterc.json5 restricts this chart to v-prefixed tags for that reason.
    tag: v1.9.3
    digest: sha256:be1b8f163a338f94e7d6532336c08d6856fc70a0b790ac14a2826a54d23e0dd3
