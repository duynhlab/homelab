---
# OCIRepository for VictoriaMetrics Operator chart
# Chart: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-operator
# Docs: https://docs.victoriametrics.com/helm/victoria-metrics-operator/
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-metrics-operator-oci
  namespace: flux-system
  labels:
    app.kubernetes.io/component: helm-chart
spec:
  interval: 10m
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-operator
  ref:
    # Chart 0.67.2 ships operator v0.74.0 and matching rendered CRDs
    # (adds the VLDistributed CRD + VLSingle networkPolicy field; defaults:
    # VictoriaMetrics v1.148.0, VictoriaLogs v1.52.0 — the bare-filter-pipe
    # LogsQL fix that local-stack already pins).
    semver: "0.67.2"
