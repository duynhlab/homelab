---
# OCIRepository for VictoriaMetrics Operator chart
# Chart: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-operator
# Docs: https://docs.victoriametrics.com/helm/victoria-metrics-operator/
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: victoria-metrics-operator-oci
  namespace: flux-system
  labels:
    app.kubernetes.io/component: helm-chart
spec:
  interval: 10m
  url: oci://ghcr.io/victoriametrics/helm-charts/victoria-metrics-operator
  ref:
    # Chart 0.68.1 ships operator v0.75.0 and its rendered CRDs (adds the
    # VTAgent CRD). Its defaults set the cluster's versions: VictoriaMetrics
    # v1.152.0, VictoriaLogs v1.52.0 (docs/observability/README.md inventory).
    semver: "0.68.1"
