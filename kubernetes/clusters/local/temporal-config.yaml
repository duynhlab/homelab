---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: temporal-config-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  retryInterval: 2m

  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci

  # Config half: the Web UI route and the server alerts. The chart is temporal-local.
  path: ./configs/temporal

  prune: true
  wait: true

  dependsOn:
    # The chart first — alerts on a server that does not exist yet are noise.
    # Same edge envoy-gateway-config-local has on envoy-gateway-local. (The
    # temporal-ui route now lives in configs/envoy-gateway/routes/temporal.yaml.)
    - name: temporal-local
