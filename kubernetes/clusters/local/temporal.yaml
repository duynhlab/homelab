---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: temporal-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  timeout: 20m  # > the HelmRelease timeout (15m) so a slow cold install is a retry, not a hard fail
  retryInterval: 2m

  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci

  # Excluded from controllers/kustomization.yaml and applied here instead, the same
  # way kong-local is: this component needs ordering that the umbrella cannot
  # express (a database, and CRDs for the ServiceMonitors the chart renders), and
  # apps-local needs to depend on it being Ready.
  #
  # Nothing else lives in this path: the Web UI route is one more entry in
  # configs/kong/ingress-infra.yaml with every other infra UI, and the alerts are
  # one more directory under configs/observability/metrics/prometheusrules/ with
  # every other rule. Both are applied by the Kustomizations that already own those
  # object types, so Temporal needs no second Kustomization of its own.
  path: ./controllers/temporal

  prune: true
  wait: true

  dependsOn:
    # No cert-manager dependency any more: it existed for the retired operator's
    # admission-webhook certificate (ADR-030 revision — the official chart has
    # no webhook).
    # controllers-local carries BOTH the `temporal` namespace
    # (controllers/namespaces.yaml) and the ServiceMonitor/PrometheusRule CRDs
    # (controllers/metrics/prometheus-operator-crds.yaml) — the chart renders four
    # ServiceMonitors (server.metrics.serviceMonitor), so that CRD must exist first.
    # It is controllers-local, not monitoring-local, that satisfies that.
    - name: controllers-local
    # platform-db Ready, plus the platform-db-temporal-secret ESO secret in the
    # temporal namespace — the schema job cannot connect without either.
    - name: databases-local
    # Not required for the ServiceMonitors to be ACCEPTED (see above) — this is so
    # that a Ready Temporal is already being scraped, rather than sitting
    # unmonitored until the metrics stack catches up.
    - name: monitoring-local

  healthChecks:
    # The operator CRs are retired (ADR-030 revision), so health is the
    # HelmRelease plus the frontend Deployment. helm-controller waits for the
    # release's resources by default (install.disableWait=false), and the chart
    # registers namespace `mop` with a Job — so a Ready HelmRelease also means
    # that Job completed. That preserves the ordering guarantee the retired
    # TemporalNamespace health check gave apps-local, whose order-worker dials
    # namespace `mop` at startup (debugs BUGS-4). It is not a strict equivalence:
    # the chart gives `temporal-worker` no readinessProbe, so Available there is
    # weaker than the operator's TemporalCluster Ready condition.
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: temporal
      namespace: temporal
    - apiVersion: apps/v1
      kind: Deployment
      name: temporal-frontend
      namespace: temporal
