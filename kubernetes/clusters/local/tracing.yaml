---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tracing-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 2m
  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci
  path: ./controllers/tracing
  prune: true
  wait: true
  # Kept OUT of controllers-local to avoid a wave deadlock: controllers-local
  # (wait:true) would block on this wave, which transitively needs a Secret that
  # secrets-local (dependsOn controllers-local) cannot create until
  # controllers-local is Ready. See debugs.md Bug 6.
  #
  # secrets-local + storage-local date from Tempo, which stored blocks in RustFS
  # (S3) via the ESO-managed tempo-rustfs-credentials Secret. Tempo is retired
  # (RFC-0027), so nothing in ./controllers/tracing reads RustFS any more and
  # these two edges are now only needed transitively, through clickhouse-local.
  dependsOn:
    - name: secrets-local
    - name: storage-local
    # RFC-0019: the OTel Collector's clickhouse exporter runs CREATE DATABASE/TABLE
    # in its start() (create_schema: true). If ClickHouse is unreachable when the
    # collector starts, the WHOLE collector fails to start — taking VictoriaTraces
    # and VictoriaLogs down with it (Tempo and Jaeger retired, RFC-0027). Order ClickHouse first (this mirrors
    # local-stack's `depends_on: clickhouse: service_healthy`). Note: this guards
    # cold-start ordering only; a collector restart while ClickHouse is down still
    # crash-loops until it recovers — switch the exporter to create_schema:false +
    # a schema-bootstrap Job to fully decouple when this goes beyond a pilot.
    - name: clickhouse-local
  # RFC-0027 / ADR-059: gated on Tempo until Tempo was retired. The collector is
  # the right gate anyway — it is what every trace, log and metric passes through.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: otel-collector-opentelemetry-collector
      namespace: monitoring
