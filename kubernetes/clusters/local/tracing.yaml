---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tracing-local
  namespace: flux-system
  labels:
    app.kubernetes.io/component: infrastructure
spec:
  interval: 10m
  timeout: 15m
  retryInterval: 2m
  sourceRef:
    kind: OCIRepository
    name: infrastructure-oci
  path: ./controllers/tracing
  prune: true
  wait: true
  # Kept OUT of controllers-local to avoid a wave deadlock: controllers-local
  # (wait:true) would block on this wave, which transitively needs a Secret that
  # secrets-local (dependsOn controllers-local) cannot create until
  # controllers-local is Ready. See debugs.md Bug 6.
  #
  # storage-local was removed 2026-08-24: it dated from Tempo, which stored
  # blocks in RustFS, and nothing under ./controllers/tracing reads RustFS any
  # more -- ClickHouse does not use S3 either. A dependsOn edge that is not real
  # is misinformation in the one file whose job is to encode ordering: it sends
  # whoever asks "why is tracing waiting?" to look at RustFS. (RustFS still comes
  # up regardless, because profiling-local genuinely needs it.)
  #
  # secrets-local STAYS, and not for Tempo's reason. The collector has its own
  # non-optional secretKeyRef on clickhouse-credentials (see extraEnvs below in
  # otel-collector.yaml) -- an ESO-managed Secret from
  # configs/secrets/cluster-external-secrets/clickhouse.yaml, which this wave
  # applies. Strictly the edge is redundant for ORDERING, because
  # clickhouse-local already dependsOn secrets-local. It is kept because
  # dependsOn is documentation as much as sequence: drop it and the ordering
  # hangs off an indirect path, so the day someone removes secrets-local from
  # clickhouse-local this wave breaks with CreateContainerConfigError and nothing
  # in THIS file hints why.
  dependsOn:
    - name: secrets-local
    # RFC-0019 used to order this behind clickhouse-local because the collector's
    # exporter ran CREATE DATABASE/TABLE in its start() (create_schema: true), so
    # an unreachable ClickHouse failed the WHOLE collector and took VictoriaTraces
    # and VictoriaLogs with it (Tempo and Jaeger retired, RFC-0027).
    #
    # RFC-0028 did what that note prescribed: create_schema is false and a
    # bootstrap Job owns the DDL, so the collector no longer runs any DDL and a
    # restart during a ClickHouse outage costs only the ClickHouse sink.
    #
    # The dependency moves to the SCHEMA wave, and it has to: the collector can
    # no longer create what it is missing, so starting before the schema exists
    # produces failing INSERTs instead of self-healing. clickhouse-schema-local
    # itself dependsOn clickhouse-local, so the store is still ordered first.
    - name: clickhouse-schema-local
  # RFC-0027 / ADR-059: gated on Tempo until Tempo was retired. The collector is
  # the right gate anyway — it is what every trace, log and metric passes through.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: otel-collector-opentelemetry-collector
      namespace: monitoring
