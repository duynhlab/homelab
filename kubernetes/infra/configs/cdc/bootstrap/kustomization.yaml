apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - jobs.yaml

configMapGenerator:
  - name: peerdb-bootstrap
    namespace: peerdb
    files:
      - bootstrap.py
      - allowlist.json
  - name: analytics-views
    namespace: monitoring
    files:
      - views.sh
      - views.sql
