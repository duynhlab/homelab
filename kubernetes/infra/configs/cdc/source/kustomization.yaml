apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The column-listed CDC publications on product-db. They name app tables, so
# they fail until the service migrations create them, then converge; the
# SELECT grants follow them (product-db-cdc-bootstrap) and peerdb-bootstrap
# waits for both.
resources:
  - publications.yaml
