# Schema bootstrap for the ClickHouse OTel store (RFC-0028 / ADR-065).
#
# Runs the DDL shipped in the clickhouse-ddl image (duynhlab/images repo,
# mounted read-only at /sql as an image volume, ADR-077) so the otel-collector
# can run with create_schema: false. Why that matters is in that image's
# README; what matters here is the shape of the work:
#
#   1. Assert against the INTENDED replica count, not a discovered one. The first
#      version trusted `system.clusters`, and a clean bring-up proved that wrong
#      twice over: the operator publishes the cluster definition asynchronously,
#      so at the moment this Job starts — after clickhouse-local is Ready, after
#      all three StatefulSets report ready — the definition can still list two
#      hosts. The Job then "verified" 2 of 2 and went green on a 2-replica store.
#      It also returns DUPLICATE rows per host (5 rows for 3 hosts, measured), so
#      any count must be DISTINCT. EXPECTED_REPLICAS below is the intent, and
#      `make validate` fails if it drifts from the CHI's replicasCount.
#   2. Create the DATABASE on every replica individually — no ON CLUSTER, so the
#      distributed-DDL queue that lost replica 2 twice is never involved.
#   3. Create the TABLES once. The Replicated database engine propagates them.
#   4. PROVE it. A Job that exits 0 without checking is a green light for a
#      broken store: both earlier failures had every table present on the
#      replica the collector happened to talk to. The verify step below asserts
#      total_replicas on EVERY replica and fails the Job otherwise.
#
# Idempotent: every statement is IF NOT EXISTS, and the verify step is a read.
# Re-running after a schema change needs no manual step: editing the SQL means a
# new image digest in the volume reference below, i.e. a new pod template, and
# kustomize.toolkit.fluxcd.io/force lets Flux delete and re-create this
# immutable Job on exactly that change. force acts only when an apply fails on
# an immutable field, so an unchanged digest never re-runs it (measured: three
# reconciles kept rustfs-setup-buckets-init's UID, 2026-09-28).
#
# Image volume, not a ConfigMap (ADR-077): pinned by tag AND digest (Kyverno
# disallow-latest-tag requires the digest on image volumes), released signed by
# duynhlab/images; platform-images.yml verifies tag, digest and signature on
# every pull request. Never pair an image volume with hostUsers: false --
# containerd cannot idmap the mount and the pod does not start.
#
# No ttlSecondsAfterFinished on purpose: clickhouse-schema-local gates on this
# Job with wait: true, and a TTL-deleted Job cannot be health-checked.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-schema
  namespace: monitoring
  labels:
    app.kubernetes.io/name: clickhouse-schema
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: observability
  annotations:
    # A new DDL digest changes the pod template; Jobs are immutable, so force
    # lets Flux re-create the Job instead of failing the apply. See the header.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # High because this Job legitimately races its dependency: the CHI's replicas
  # come up one at a time, and the wave's health checks gate on StatefulSets,
  # which go Ready slightly before every server answers queries.
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-schema
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema
          # Same tag as the CHI: the server image ships clickhouse-client, so
          # the client is never older than the server it talks to, and the
          # logs DDL's keyValuePairs text index needs 26.9+.
          image: clickhouse/clickhouse-server:26.9
          env:
            # Must equal spec.configuration.clusters[0].layout.replicasCount in
            # configs/clickhouse/clickhouseinstallation.yaml. Duplicated on
            # purpose: the alternative is discovering it at runtime, which is
            # exactly what shipped a green Job over a 2-replica store. The
            # duplication is policed statically — scripts/flux-validate.sh fails
            # when the two numbers disagree.
            - name: EXPECTED_REPLICAS
              value: "3"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: password
            # clickhouse-client writes history and temp files under $HOME.
            - name: HOME
              value: /tmp
          command: [sh, -c]
          args:
            - |
              set -eu
              # An image that mounts but carries no files (an OCI artifact rather
              # than an image, ADR-077) gives an EMPTY /sql with no error. Fail
              # here, loudly, instead of "applying" nothing and verifying a store
              # that was never created.
              # Two Replicated databases share one bootstrap: `otel` (collector
              # logs+traces) and `pg_stat_ch` (PostgreSQL query events from the
              # pg_stat_ch extension). Per database: the file applied on EVERY
              # replica, the table files applied ONCE, and the object count that
              # proves the schema landed (a TO-style MV counts as two objects:
              # the view and its target table).
              DB_FILES_otel="00-database.sql"
              TABLE_FILES_otel="10-otel_logs.sql 20-otel_traces.sql 30-otel_traces_trace_id_ts.sql 40-otel_traces_trace_id_ts_mv.sql"
              OBJECTS_otel=4
              DB_FILES_pg_stat_ch="05-pg_stat_ch_database.sql"
              TABLE_FILES_pg_stat_ch="50-pg_stat_ch_events_raw.sql 60-pg_stat_ch_query_stats_5m.sql 70-pg_stat_ch_db_app_user_1m.sql 80-pg_stat_ch_errors_recent.sql"
              OBJECTS_pg_stat_ch=7
              DATABASES="otel pg_stat_ch"
              echo "==> DDL files in /sql:"
              for f in $DB_FILES_otel $TABLE_FILES_otel $DB_FILES_pg_stat_ch $TABLE_FILES_pg_stat_ch; do
                [ -s "/sql/$f" ] || { echo "FAIL: /sql/$f missing or empty -- is the image volume a real image?"; ls -la /sql; exit 1; }
                echo "    $f ($(wc -c < "/sql/$f") bytes)"
              done
              LB=clickhouse-clickhouse.monitoring.svc.cluster.local
              cli() { host=$1; shift; clickhouse-client --host "$host" --password "$CLICKHOUSE_PASSWORD" "$@" ; }

              echo "==> waiting for the cluster definition to be servable"
              n=0
              until cli "$LB" -q "SELECT 1" >/dev/null 2>&1; do
                n=$((n+1)); [ "$n" -ge 60 ] && { echo "FAIL: $LB never answered"; exit 1; }
                sleep 5
              done

              EXPECTED=$EXPECTED_REPLICAS
              echo "==> intended replicas: $EXPECTED"

              # The operator publishes remote_servers asynchronously, so wait for
              # the cluster definition to CATCH UP with the intent rather than
              # trusting whatever it says right now. DISTINCT because the
              # generated config lists each host more than once.
              echo "==> waiting for the cluster definition to list $EXPECTED distinct hosts"
              n=0
              while :; do
                HOSTS=$(cli "$LB" -q "SELECT DISTINCT host_name FROM system.clusters WHERE cluster='otel' ORDER BY host_name FORMAT TSV" 2>/dev/null || true)
                got=$(printf '%s\n' "$HOSTS" | grep -c . || true)
                [ "$got" = "$EXPECTED" ] && break
                n=$((n+1))
                [ "$n" -ge 60 ] && { echo "FAIL: cluster 'otel' lists $got distinct hosts, want $EXPECTED"; echo "$HOSTS" | sed 's/^/    /'; exit 1; }
                sleep 5
              done
              echo "==> cluster otel lists $EXPECTED hosts:"; echo "$HOSTS" | sed 's/^/    /'

              echo "==> waiting for every replica to answer, not just the Service"
              for h in $HOSTS; do
                n=0
                until cli "$h.monitoring.svc.cluster.local" -q "SELECT 1" >/dev/null 2>&1; do
                  n=$((n+1)); [ "$n" -ge 60 ] && { echo "FAIL: replica $h never answered"; exit 1; }
                  sleep 5
                done
                echo "    $h ok"
              done

              # PREFLIGHT. `CREATE DATABASE IF NOT EXISTS ... ENGINE = Replicated`
              # does NOT convert an existing Atomic database — it is a no-op, and
              # the verify at the end would then fail on the engine after this Job
              # had already created tables inside the wrong database. Catch it
              # here, before touching anything, and say what to do about it.
              echo "==> preflight: no pre-existing non-Replicated database ($DATABASES)"
              stale=0
              for db in $DATABASES; do
                for h in $HOSTS; do
                  eng=$(cli "$h.monitoring.svc.cluster.local" -q \
                    "SELECT engine FROM system.databases WHERE name='$db' FORMAT TSV" 2>/dev/null || true)
                  if [ -n "$eng" ] && [ "$eng" != "Replicated" ]; then
                    echo "    $h: $db exists with engine '$eng'"
                    stale=1
                  fi
                done
              done
              if [ "$stale" = "1" ]; then
                cat <<'MSG'
              FAIL: a database above already exists with a non-Replicated engine
              (the text below says `otel`; substitute the name printed).

              This is not repairable in place: CREATE DATABASE IF NOT EXISTS will
              not change the engine of an existing database, so this Job cannot
              build the replicated schema on top of it.

              The rollout is fresh-only by decision (RFC-0028: demo data is
              disposable). Drop the database on EVERY replica, then re-run:

                PW=$(kubectl -n monitoring get secret clickhouse-credentials \
                      -o jsonpath='{.data.password}' | base64 -d)
                for p in $(kubectl -n monitoring get po \
                      -l clickhouse.altinity.com/chi=clickhouse -o name); do
                  kubectl -n monitoring exec "${p#pod/}" -c clickhouse -- \
                    clickhouse-client --password "$PW" -q "DROP DATABASE IF EXISTS otel SYNC"
                done
                kubectl -n monitoring delete job clickhouse-schema
                flux -n flux-system reconcile kustomization clickhouse-schema-local

              Per replica, not ON CLUSTER: a partial drop leaves exactly the
              split-brain schema this design exists to prevent.
              MSG
                exit 1
              fi

              # The cold tier's storage policy comes from the CHI
              # (03-storage-rustfs.xml). A CREATE naming a policy the server
              # does not have fails, and so would the ALTERs below, so refuse
              # to start until every replica has finished rolling onto it.
              echo "==> preflight: storage policy hot_cold on every replica"
              for h in $HOSTS; do
                np=$(cli "$h.monitoring.svc.cluster.local" -q \
                  "SELECT count() FROM system.storage_policies WHERE policy_name='hot_cold' AND volume_name IN ('hot','cold') FORMAT TSV" 2>/dev/null || echo 0)
                [ "$np" = "2" ] || { echo "FAIL: $h lacks storage policy hot_cold with volumes hot+cold. Has the operator finished rolling the CHI?"; exit 1; }
              done

              FIRST=$(echo "$HOSTS" | head -1)
              for db in $DATABASES; do
                eval "db_files=\$DB_FILES_$db; table_files=\$TABLE_FILES_$db; want=\$OBJECTS_$db"

                echo "==> [$db] CREATE DATABASE on each replica (no ON CLUSTER, no DDL queue)"
                for h in $HOSTS; do
                  for f in $db_files; do
                    cli "$h.monitoring.svc.cluster.local" --queries-file "/sql/$f"
                  done
                  echo "    $h database ready"
                done

                echo "==> [$db] CREATE TABLES once; the Replicated database propagates them"
                for f in $table_files; do
                  echo "    applying $f on $FIRST"
                  cli "$FIRST.monitoring.svc.cluster.local" --queries-file "/sql/$f"
                done

                echo "==> [$db] waiting for $want objects to land on every replica"
                for h in $HOSTS; do
                  n=0
                  until [ "$(cli "$h.monitoring.svc.cluster.local" -q \
                      "SELECT count() FROM system.tables WHERE database='$db' FORMAT TSV" 2>/dev/null || echo 0)" = "$want" ]; do
                    n=$((n+1)); [ "$n" -ge 36 ] && { echo "FAIL: $h never reached $want objects in $db"; exit 1; }
                    sleep 5
                  done
                done
              done

              echo "==> VERIFY — the step that makes a green Job mean something"
              rc=0
              for h in $HOSTS; do
                host="$h.monitoring.svc.cluster.local"
                disks=$(cli "$host" -q "SELECT count() FROM system.disks WHERE name IN ('s3','s3_cache') FORMAT TSV")
                [ "$disks" = "2" ] || { echo "FAIL: $h lacks disks s3/s3_cache"; rc=1; }
                for db in $DATABASES; do
                  eng=$(cli "$host" -q "SELECT engine FROM system.databases WHERE name='$db' FORMAT TSV")
                  [ "$eng" = "Replicated" ] || { echo "FAIL: $h $db engine is '$eng', want Replicated"; rc=1; }
                  bad=$(cli "$host" -q "SELECT count() FROM system.replicas WHERE database='$db' AND (total_replicas != $EXPECTED OR active_replicas != $EXPECTED OR is_readonly != 0) FORMAT TSV")
                  [ "$bad" = "0" ] || { echo "FAIL: $h has $bad replicated tables in $db not at ${EXPECTED}/${EXPECTED} or read-only"; rc=1; }
                  plain=$(cli "$host" -q "SELECT count() FROM system.tables WHERE database='$db' AND engine IN ('MergeTree','AggregatingMergeTree') FORMAT TSV")
                  [ "$plain" = "0" ] || { echo "FAIL: $h has $plain unreplicated MergeTree tables in $db"; rc=1; }
                  echo "    $h: $db engine=$eng replicated_tables_ok=$([ "$bad" = 0 ] && echo yes || echo NO)"
                done
                # Cold-tier evidence, by name: the tables that carry a TO VOLUME tail.
                tiered=$(cli "$host" -q "SELECT count() FROM system.tables WHERE (database='otel' AND name IN ('otel_logs','otel_traces')) OR (database='pg_stat_ch' AND name='events_raw') AND storage_policy='hot_cold' AND position(create_table_query,'TO VOLUME') > 0 FORMAT TSV")
                [ "$tiered" = "3" ] || { echo "FAIL: $h has $tiered/3 tables on hot_cold with a cold-volume TTL"; rc=1; }
                echo "    $h: tiered=$tiered/3"
              done
              [ "$rc" -eq 0 ] || { echo "SCHEMA BOOTSTRAP FAILED"; exit 1; }

              cli "$LB" -q "SELECT database, table, disk_name, count() AS parts, formatReadableSize(sum(bytes_on_disk)) AS on_disk FROM system.parts WHERE database IN ('otel','pg_stat_ch') AND active GROUP BY database, table, disk_name ORDER BY database, table, disk_name FORMAT PrettyCompact"

              cli "$LB" -q "SELECT database, table, is_readonly, total_replicas, active_replicas FROM system.replicas WHERE database IN ('otel','pg_stat_ch') ORDER BY database, table FORMAT PrettyCompact"
              echo "==> schema bootstrap complete on $EXPECTED replicas"
          volumeMounts:
            - name: sql
              mountPath: /sql
              # An image volume mounts the IMAGE ROOT; the files live under
              # /sql inside it. Without subPath they appear at /sql/sql/ and the
              # file check above fails (measured on the first run).
              subPath: sql
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: sql
          image:
            reference: ghcr.io/duynhlab/images/clickhouse-ddl:2.0.0@sha256:3551ad6cabfcf0ff13d5cf35d77c1890532f052e11fc6a296aa76385d31179b8
            pullPolicy: IfNotPresent
        - name: tmp
          emptyDir: {}
