# ClickHouseInstallation — the supplementary OLAP backend for OTel logs+traces
# SQL (RFC-0019 Phase B / ADR-023). Single shard x THREE replicas on local PVCs
# for the hot window, with parts older than 7 days moved to the in-cluster RustFS
# object store (03-storage-rustfs.xml below; owner decision 2026-09-07, no RFC),
# coordinated by the `keeper` CHK in this same directory (RFC-0028 / ADR-065);
# the OTel Collector fans out logs+traces here alongside
# VictoriaLogs / VictoriaTraces (metrics stay on VictoriaMetrics — never here).
#
# Replication is why the CHK exists: losing one pod or one PVC is now a failover
# rather than the loss of 90 days of edge access logs (ClickHouse-only per
# ADR-061) and every long-retention trace.
#
# The `default` user's password comes from the ESO-managed clickhouse-credentials
# Secret (OpenBAO secret/local/infra/clickhouse/admin). Both the schema Job and
# the Collector connect as `default`.
#
# Schema ownership lives elsewhere: the `clickhouse-schema` Job in
# configs/clickhouse-schema/ creates the `otel` database (ENGINE = Replicated,
# per replica, no ON CLUSTER) and its tables, with the DDL committed to git. The
# Collector runs create_schema: false and only INSERTs (ADR-065). Exporter-owned
# DDL was tried and rejected — it cannot reach a replica that joins the
# distributed-DDL queue late — and that history is in ADR-065's Alternatives.
# Access control: ClickHouse is never on a public Ingress and the `default` user's
# password is the access control. It is NOT NetworkPolicy-fenced — the `monitoring`
# namespace gets no Kyverno default-deny (that targets app-tier only) and netpol is
# inert on kindnet. A NetworkPolicy restricting :9000/:8123 to the collector +
# Grafana is a follow-up for an enforcing CNI.
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: clickhouse
  namespace: monitoring
  labels:
    app.kubernetes.io/component: olap
    app.kubernetes.io/part-of: observability
spec:
  defaults:
    templates:
      podTemplate: clickhouse
      dataVolumeClaimTemplate: data-volume
  configuration:
    # By-name reference to the ClickHouseKeeperInstallation (operator >= 0.27.0,
    # per the Altinity release notes: "Reference CHK from CHI by a name"):
    # the operator resolves the keeper endpoints itself. serviceType defaults to
    # `replicas`, i.e. the per-pod addresses rather than one Service VIP — which
    # is what a raft client wants.
    #
    # It resolves ONCE, and it fails open: if the keeper pods are not up yet the
    # rendered config gets an empty `<zookeeper>` and the reconcile still reports
    # success, with no re-resolution afterwards. `clickhouse-keeper-local` is a
    # separate Flux wave that this one dependsOn precisely so that cannot happen
    # — see the header of configs/clickhouse-keeper/clickhousekeeperinstallation.yaml.
    zookeeper:
      keeper:
        name: keeper
    users:
      # default user password sourced from the ESO-managed Secret
      default/password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-credentials
            key: password
      # in-cluster access (pods reach the native/HTTP ports); the password is the
      # control — see the access-control note in the header. Tighten to the pod CIDR
      # or add a NetworkPolicy when running on an enforcing CNI.
      default/networks/ip:
        - "0.0.0.0/0"
        - "::/0"
      default/profile: default
      default/quota: default
    # The engine's own Prometheus endpoint, finally enabled. At 1x1 the Altinity
    # metrics-exporter's chi_* series were the whole engine view and a per-pod
    # scrape would have duplicated them; with three replicas the per-pod series
    # are what separate "one replica is sick" from "the shared exporter is sick",
    # and ClickHouseMetrics_ReadonlyReplica — a replica that lost Keeper — has no
    # equivalent in the exporter's view at all. Key set mirrors the local-stack
    # twin (local-stack/observability/clickhouse/metrics.xml); status_info was
    # removed from the server and must not be re-added.
    settings:
      prometheus/endpoint: /metrics
      prometheus/port: "9363"
      prometheus/metrics: "true"
      prometheus/events: "true"
      prometheus/asynchronous_metrics: "true"
      prometheus/errors: "true"
    # Retention for the engine's OWN log tables (SIX of them; query_views_log
    # joined 2026-09-06). Until this landed the repo
    # configured none, and what TTL existed came from two places we do not own:
    # ClickHouse upstream defaults, and three files the Altinity operator injects
    # (config.d/01-clickhouse-0{3,4,5}-*.xml, giving query_log / part_log /
    # trace_log 30 days and removing query_thread_log). That left FIVE tables
    # with no expiry at all, growing for the life of the cluster -- and
    # system.* tables are plain local MergeTree, so per replica, on each node's
    # own filesystem. metric_log is the one that matters: ~1,900 columns and one
    # row per second whether or not anything queries, a fixed cost that does not
    # scale down when idle.
    #
    # PARTITION BY moves WITH the TTL, and that pairing is the point. These five
    # ship monthly-partitioned (toYYYYMM). A 7-day TTL on a monthly partition is
    # the misaligned case in docs/observability/clickhouse/fundamentals.md:
    # ttl_only_drop_parts is 0 by default (verified on this cluster) so expiry
    # deletes ROWS, which means rewriting month-sized parts to trim 7-day-old
    # data. Daily partitions make each expiry a bounded, one-day rewrite. This is
    # exactly what the operator does for its own three tables -- it re-partitions
    # them daily at the same time as it gives them a TTL.
    #
    # `replace="1"` swaps the whole section, so every non-default setting each
    # table had must be repeated here or it silently reverts. Read off the live
    # config, and note asynchronous_metric_log flushes at 7000ms, not 7500.
    #
    # Verified on clickhouse-server 26.7.3.19 before committing: all five tables
    # come up with PARTITION BY event_date, TTL 7d, their original sorting key
    # (asynchronous_metric_log keeps `metric, event_date, event_time`), and their
    # collect_interval / level / duration_threshold intact.
    #
    # 2026-09-06, after auditing a 14-hour-old cluster instead of a fresh one, two
    # more tables joined. Note the prose stays HERE, in YAML: XML forbids `--`
    # inside a comment, and an em-dash in an XML comment inside this string
    # crash-loops the server with `SAXParseException: Invalid token`. `make
    # validate` cannot catch it -- it checks the YAML, not the XML embedded in it.
    #
    # query_views_log is the SIXTH table with no expiry, and it was missed the
    # first time for a reason worth keeping: system log tables are created LAZILY,
    # on first write, and this one is only born when a materialized view runs.
    # There is exactly one on this platform, otel.otel_traces_trace_id_ts_mv, and
    # every row in the table names it -- so it grows with our own trace ingestion,
    # one row per insert batch. An audit that enumerates `system.tables` cannot see
    # a table that has not been born; enumerate the server's declared <*_log>
    # sections instead (24 declared, 13 born). Upstream ships no TTL for this one,
    # unlike asynchronous_insert_log (3 d) or blob_storage_log (30 d). Its only
    # non-default setting is the 7500 ms flush, read off the live config.
    #
    # trace_log is the OPERATOR's table, overridden here for one reason: size.
    # Measured at 14 hours: 6.3 M rows, 145 MiB, the largest system.* table,
    # projecting to 7.3 GiB PER REPLICA at the operator's 30 days = 22 GiB across
    # three, against 10 Gi PVCs that local-path does not enforce. It is not query
    # traffic: query_log saw 2-40 queries in those hours while 95% of trace_log
    # samples were Memory/MemoryPeak, the memory profiler firing every 4 MiB of
    # allocation by any thread, merges included. Seven days rather than disabling
    # the profiler, because this cluster runs a 1.12 GiB self-cap that has already
    # refused ad-hoc admin queries, so the samples are worth a week. Everything but
    # the TTL is copied from the operator verbatim, INCLUDING `ORDER BY event_time`
    # rather than this file's usual (event_date, event_time): changing a sorting
    # key is a different decision than changing an expiry. The override works
    # because config.d loads lexicographically and this file is `02-` against the
    # operator's `01-clickhouse-05-trace_log.xml`. COST: a future operator change
    # to its own trace_log template is silently ignored here, so re-read that file
    # on operator bumps.
    #
    # metric_log collect_interval_milliseconds: 1000 -> 15000 (2026-09-06).
    #
    # This is the root-cause half of the ClickHouse memory problem; raising
    # limits.memory to 2Gi was the symptom half. Merge memory scales with COLUMN
    # count, and metric_log has 1,914 columns against 24-35 for every other system
    # log table -- which is why it produced 32,477 of the 32,614 merge failures in
    # a 24-hour window, a 400:1 skew over the next table. Fewer rows means fewer
    # and smaller parts to merge.
    #
    # Nothing on this platform reads system.metric_log. The engine's metrics are
    # consumed from its Prometheus endpoint at :9363, scraped by a ServiceMonitor
    # every 30 s, so a once-per-second in-table copy is paid for and never read.
    # 15 s still leaves twice the resolution of the only consumer, while cutting
    # the row rate 15x: measured before the change, 594 rows per 10 minutes and
    # 35.79 MiB on disk per replica.
    #
    # error_log keeps its 1000 ms. Its cost is driven by how many errors occur,
    # not by the interval -- 1 row in the same 10-minute window, 490 KiB total --
    # and per-second resolution on errors is worth having.
    #
    # ONE OPTIONAL CLEANUP STEP REMAINS -- see docs/observability/clickhouse/README.md
    # "The engine's own log tables". Changing a system table's engine definition
    # does not ALTER it: ClickHouse renames the old table to `<name>_N` and
    # creates a fresh one. The renamed copy keeps its OLD engine, including its
    # old TTL when one existed. It therefore self-drains; dropping it only
    # reclaims space immediately. A prior table with no TTL (query_metric_log)
    # does require an explicit drop on upgraded clusters because remove="1"
    # stops future writes but does not delete an already-born table. The rename
    # is also LAZY -- measured, it happens at each table's first write after the
    # config change, so an optional cleanup is not a single pass after apply.
    # Match `_log_[0-9]+$`, not `_0`: a cleanup that matched `LIKE '%\_0'`
    # missed `trace_log_1` holding 153 MiB.
    #
    # 2026-09-07, from the live audit in issue #1025 (four findings, one
    # engine-string change so the lazy rename above happens ONCE):
    #
    #   * `SETTINGS ttl_only_drop_parts = 1` on every engine string. With a daily
    #     partition and a day-granular TTL, every row in a part expires at the
    #     same instant, so the part is entirely expired -- the case a whole-part
    #     DROP exists for. At the default 0 the server still reads and rewrites
    #     the part to reach an empty one. The setting has to live INSIDE the
    #     engine string: once <engine> is declared, partition_by/ttl/order_by/
    #     settings are refused as siblings.
    #   * processors_profile_log, aggregated_zookeeper_log,
    #     zookeeper_connection_log and blob_storage_log shipped monthly
    #     (toYYYYMM) with a 30-day TTL:
    #     the misaligned case, 30 distinct event_dates per partition expiring on
    #     30 different days, a rewrite pass each. No `replace="1"` on these
    #     four, on purpose: no <engine> is declared, so partition_by / ttl /
    #     settings MERGE into upstream's block and the sorting key, flush and
    #     collect intervals stay whatever upstream ships. Sized on 2026-09-07:
    #     12 MiB, 6 MiB and 7 KiB, so the win is correctness, not bytes. The 30 d
    #     TTLs first fire ~2026-10-05 on that cluster; this lands before that.
    #   * query_metric_log removed. Seventh table with no TTL, 1,391 columns
    #     (second only to metric_log), no reader on this platform. Removing the
    #     section is upstream's documented off switch; a TTL would have kept the
    #     merge cost of a table nobody queries.
    #   * text_log level trace -> information. Measured at ~60 k rows/hour flat
    #     AFTER the merge retry storm ended, so the storm was not what filled it:
    #     trace is simply that expensive (135 MiB in two days, the largest
    #     system.* table). Information keeps every warning and error line.
    #   * metric_log schema_type transposed_with_wide_view (25.x+). Stores one
    #     row per (metric, value) instead of ~1,900 columns. On the deployed
    #     26.7 server this does NOT expose a compatibility view under the old
    #     wide column names; that is safe only because this platform has no SQL
    #     reader of system.metric_log. Merge memory scales with column count --
    #     this is the root fix for a merge that peaked at 1.27 GiB of a 1.80 GiB
    #     self-cap in the clean window.
    #
    # part_log and query_log (operator-owned, daily, 30 d) still run
    # ttl_only_drop_parts = 0. Their operator XML has not been read off a pod
    # yet, and overriding a section without repeating every setting in it
    # silently reverts the rest -- follow-up, not this change.
    files:
      02-system-log-retention.xml: |
        <clickhouse>
            <metric_log replace="1">
                <database>system</database>
                <table>metric_log</table>
                <engine>ENGINE = MergeTree PARTITION BY event_date ORDER BY (event_date, event_time) TTL event_date + INTERVAL 7 DAY SETTINGS ttl_only_drop_parts = 1</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
                <collect_interval_milliseconds>15000</collect_interval_milliseconds>
                <schema_type>transposed_with_wide_view</schema_type>
            </metric_log>
            <asynchronous_metric_log replace="1">
                <database>system</database>
                <table>asynchronous_metric_log</table>
                <engine>ENGINE = MergeTree PARTITION BY event_date ORDER BY (metric, event_date, event_time) TTL event_date + INTERVAL 7 DAY SETTINGS ttl_only_drop_parts = 1</engine>
                <flush_interval_milliseconds>7000</flush_interval_milliseconds>
            </asynchronous_metric_log>
            <text_log replace="1">
                <database>system</database>
                <table>text_log</table>
                <engine>ENGINE = MergeTree PARTITION BY event_date ORDER BY (event_date, event_time) TTL event_date + INTERVAL 7 DAY SETTINGS ttl_only_drop_parts = 1</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
                <level>information</level>
            </text_log>
            <error_log replace="1">
                <database>system</database>
                <table>error_log</table>
                <engine>ENGINE = MergeTree PARTITION BY event_date ORDER BY (event_date, event_time) TTL event_date + INTERVAL 7 DAY SETTINGS ttl_only_drop_parts = 1</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
                <collect_interval_milliseconds>1000</collect_interval_milliseconds>
            </error_log>
            <background_schedule_pool_log replace="1">
                <database>system</database>
                <table>background_schedule_pool_log</table>
                <engine>ENGINE = MergeTree PARTITION BY event_date ORDER BY (event_date, event_time) TTL event_date + INTERVAL 7 DAY SETTINGS ttl_only_drop_parts = 1</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
                <duration_threshold_milliseconds>30</duration_threshold_milliseconds>
            </background_schedule_pool_log>
            <query_views_log replace="1">
                <database>system</database>
                <table>query_views_log</table>
                <engine>ENGINE = MergeTree PARTITION BY event_date ORDER BY (event_date, event_time) TTL event_date + INTERVAL 7 DAY SETTINGS ttl_only_drop_parts = 1</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </query_views_log>
            <trace_log replace="1">
                <database>system</database>
                <table>trace_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + INTERVAL 7 DAY SETTINGS ttl_only_drop_parts = 1</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </trace_log>
            <processors_profile_log>
                <partition_by>event_date</partition_by>
                <ttl>event_date + INTERVAL 30 DAY DELETE</ttl>
                <settings>ttl_only_drop_parts = 1</settings>
            </processors_profile_log>
            <aggregated_zookeeper_log>
                <partition_by>event_date</partition_by>
                <ttl>event_date + INTERVAL 30 DAY DELETE</ttl>
                <settings>ttl_only_drop_parts = 1</settings>
            </aggregated_zookeeper_log>
            <zookeeper_connection_log>
                <partition_by>event_date</partition_by>
                <ttl>event_date + INTERVAL 30 DAY DELETE</ttl>
                <settings>ttl_only_drop_parts = 1</settings>
            </zookeeper_connection_log>
            <blob_storage_log>
                <partition_by>event_date</partition_by>
                <ttl>event_date + INTERVAL 30 DAY DELETE</ttl>
                <settings>ttl_only_drop_parts = 1</settings>
            </blob_storage_log>
            <query_metric_log remove="1"/>
        </clickhouse>
      # Cold tier on RustFS (2026-09-07). Prose here, not in the XML: XML forbids
      # `--` inside a comment and a malformed file crash-loops every replica.
      #
      # WHAT THIS BUYS ON KIND, HONESTLY: the production shape and a bounded hot
      # tier, not capacity. The `default` disk, the s3 metadata, the cache path
      # and RustFS's own PV are all hostPath directories on the same node
      # filesystem, and without zero-copy each replica uploads its own objects,
      # so cold bytes exist three times. The rehearsal is the point; the
      # capacity story starts on a real object store.
      #
      # Disk `s3`: endpoint is the RustFS Service, plain HTTP in-cluster, path
      # style (bucket in the path, like every other consumer here), region
      # us-east-1 because RustFS wants one. The `{replica}` macro gives each
      # replica its own prefix so `mc ls` shows ownership and a lost PVC's
      # orphans are one `mc rm -r` on that prefix. UNVERIFIED that the server
      # expands macros in a disk endpoint: check with `mc ls rustfs/clickhouse-otel/`
      # after the roll and, if there is a literal `{replica}/` prefix, drop it
      # for a shared prefix (object names are random either way).
      # skip_access_check stays at its default (false): a wrong bucket or
      # credential fails pod 1 at start, with two replicas still serving, instead
      # of failing the first TTL move a week later. The cost is that a pod
      # restarting while RustFS is down stays down until RustFS returns.
      #
      # Disk `s3_cache`: a local cache over `s3`, on the PVC path. 1Gi is 10% of
      # the nominal PVC and enough for marks, index segments and repeated 30/90
      # day panel scans; it duplicates cold bytes, so it must not eat the hot
      # budget.
      #
      # Policy `hot_cold`: `hot` MUST be the `default` disk, because ALTER TABLE
      # MODIFY SETTING storage_policy is only accepted when the new policy
      # contains every disk of the old one. move_factor 0: the "hot" disk is the
      # quota-less node filesystem, the default 0.1 would fire at node < 10% free
      # and then write to that same filesystem; only TTL drives moves here.
      # perform_ttl_move_on_insert false: an INSERT of a late row never waits on
      # RustFS; it lands hot and moves in the background.
      #
      # Zero-copy replication off explicitly (upstream DR advice): each replica
      # owns its objects. No table references the policy until the schema
      # change (PR 3 of 4) lands, so reverting this file is safe until then.
      # Once parts sit on s3_cache, never remove this file while they do.
      #
      # Not set, noted: background_move_pool_size is the throttle if RustFS CPU
      # (2.5 limit) saturates when three replicas move a day's parts at once.
      03-storage-rustfs.xml: |
        <clickhouse>
            <storage_configuration>
                <disks>
                    <s3>
                        <type>s3</type>
                        <endpoint>http://rustfs-svc.rustfs.svc.cluster.local:9000/clickhouse-otel/{replica}/</endpoint>
                        <access_key_id from_env="CLICKHOUSE_S3_ACCESS_KEY_ID"/>
                        <secret_access_key from_env="CLICKHOUSE_S3_SECRET_ACCESS_KEY"/>
                        <region>us-east-1</region>
                        <metadata_path>/var/lib/clickhouse/disks/s3/</metadata_path>
                        <skip_access_check>false</skip_access_check>
                    </s3>
                    <s3_cache>
                        <type>cache</type>
                        <disk>s3</disk>
                        <path>/var/lib/clickhouse/disks/s3_cache/</path>
                        <max_size>1Gi</max_size>
                    </s3_cache>
                </disks>
                <policies>
                    <hot_cold>
                        <volumes>
                            <hot>
                                <disk>default</disk>
                            </hot>
                            <cold>
                                <disk>s3_cache</disk>
                                <perform_ttl_move_on_insert>false</perform_ttl_move_on_insert>
                            </cold>
                        </volumes>
                        <move_factor>0</move_factor>
                    </hot_cold>
                </policies>
            </storage_configuration>
            <merge_tree>
                <allow_remote_fs_zero_copy_replication>0</allow_remote_fs_zero_copy_replication>
            </merge_tree>
        </clickhouse>
    clusters:
      - name: otel
        layout:
          shardsCount: 1
          replicasCount: 3
  templates:
    podTemplates:
      - name: clickhouse
        spec:
          # One replica per node. Three copies sharing a node survive nothing that
          # matters, which would make the whole change ceremonial. Kind runs three
          # workers, so `required` fits exactly — and an unschedulable replica is a
          # signal worth seeing rather than a silent co-location.
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      clickhouse.altinity.com/chi: clickhouse
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:26.8
              # Named so the PodMonitor can reference it: the operator-generated
              # Services carry only the native/HTTP/interserver ports, so :9363
              # is reachable for scraping through the pod, not through a Service
              # (same reason the Envoy proxy fleet uses a PodMonitor).
              ports:
                - name: metrics
                  containerPort: 9363
              # RustFS credentials for the s3 disk in 03-storage-rustfs.xml, read
              # there via from_env so no key is ever written into this manifest
              # (the Altinity-documented pattern). Deliberately NOT named AWS_*:
              # the S3 SDK's default credential chain would then pick them up for
              # any unrelated s3() table function too. Secret is landed by the
              # clickhouse-rustfs ClusterExternalSecret (same OpenBAO RustFS keys
              # Pyroscope and CNPG use).
              env:
                - name: CLICKHOUSE_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-rustfs-credentials
                      key: ACCESS_KEY_ID
                - name: CLICKHOUSE_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-rustfs-credentials
                      key: ACCESS_SECRET_KEY
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              # The memory limit is not just a ceiling here: ClickHouse ships
              # max_server_memory_usage=0 with max_server_memory_usage_to_ram_ratio=0.9
              # and reads the cgroup, so it sizes its own budget at 0.9x this
              # value. Lowering it lowers what the server will ever take, which
              # on a Kind node -- where every node container advertises the whole
              # VM and the scheduler cannot see the real ceiling -- is the
              # difference between a bounded process and one that helps starve
              # the host.
              #
              # 1280Mi was measured against 711-739Mi steady state on 2026-09-02,
              # before any real data had accumulated. Raised to 2Gi on 2026-09-06
              # because that ceiling started refusing work: 15,678
              # MEMORY_LIMIT_EXCEEDED, and in a two-hour window **2,222 failed
              # merges on system.metric_log** plus **6 rejected INSERTs into
              # otel.otel_traces**. The second one is data loss -- spans the
              # collector delivered and the server would not take.
              #
              # It is not the container limit that refuses; it is ClickHouse's own
              # budget. max_server_memory_usage_to_ram_ratio is 0.9 and the server
              # reads the cgroup, so 1280Mi self-caps at ~1152Mi. Working set peaks
              # at 887-899Mi across the replicas, which leaves too little burst room
              # for merging metric_log -- ~1,900 columns, one row per second per
              # replica. 2Gi self-caps at ~1843Mi.
              #
              # The other lever, pulled separately on 2026-09-06: metric_log's
              # collect_interval_milliseconds went 1000 -> 15000. See the note on
              # that setting below. Raising this ceiling stopped the bleeding;
              # widening the interval is what removes the pressure.
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  memory: 2Gi
              livenessProbe:
                httpGet:
                  path: /ping
                  port: 8123
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
              readinessProbe:
                httpGet:
                  path: /ping
                  port: 8123
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 5
    volumeClaimTemplates:
      - name: data-volume
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: standard
          resources:
            requests:
              storage: 10Gi
