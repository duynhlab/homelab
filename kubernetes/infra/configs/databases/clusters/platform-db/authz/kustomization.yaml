apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Database authorization (ADR-088): the db_authz login, the Job + CronJob that
# apply the role catalog and review's grants, and the pgroles policies that own
# the other databases' grants. The hashed ConfigMap name changes with the SQL,
# which recreates the Job.
resources:
  - db-authz.yaml
  - job.yaml
  - policies/user.yaml
  - policies/shipping.yaml
  - policies/notification.yaml

configMapGenerator:
  - name: platform-db-authz
    namespace: platform
    files:
      - apply.sh
      - roles.sql
      - grants.sql
    # apply.sh is bash full of ${...}; keep databases-local's postBuild
    # substitution (pg_stat_ch password) off it, or the wave fails to build.
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
