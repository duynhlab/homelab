apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Database authorization (ADR-087): the db_authz login, and the Job + CronJob
# that apply the role catalog and the Job-owned in-database grants. The hashed
# ConfigMap name changes with the SQL, which recreates the Job.
resources:
  - db-authz.yaml
  - job.yaml

configMapGenerator:
  - name: platform-db-authz
    namespace: platform
    files:
      - apply.sh
      - roles.sql
      - grants.sql
