# In-database grants for notification (ADR-088), owned by pgroles in adopt mode. The
# catalog Job creates notification_owner and notification_migrator; CNPG creates notification_runtime.
# The table wildcard also covers schema_migrations: pgroles cannot exclude one
# table from a wildcard (PGR-10), so the runtime holds it here, by decision.
apiVersion: pgroles.io/v1alpha1
kind: PostgresPolicy
metadata:
  name: platform-db-notification
  namespace: platform
spec:
  connection:
    params:
      host: platform-db-rw
      dbname: notification
      sslMode: require
      usernameSecret:
        name: platform-db-db-authz-secret
        key: username
      passwordSecret:
        name: platform-db-db-authz-secret
        key: password
      # authz_admin inherits notification_owner, so it can grant on every object.
      setRole: authz_admin
  mode: apply
  reconciliation_mode: adopt
  approval: auto
  interval: 5m
  roles:
    - name: notification_owner
      external: true
    - name: notification_migrator
      external: true
    - name: notification_runtime
      external: true
  default_privileges:
    - owner: notification_owner
      schema: public
      grant:
        - role: notification_runtime
          on_type: table
          privileges: [SELECT, INSERT, UPDATE, DELETE]
        - role: notification_runtime
          on_type: sequence
          privileges: [USAGE, SELECT]
    # Global, not schema-scoped: only a global entry cancels PUBLIC EXECUTE (PGR-05).
    - owner: notification_owner
      scope:
        type: global
      grant:
        - role: PUBLIC
          on_type: function
          privileges: [EXECUTE]
          ensure: absent
  grants:
    - role: notification_runtime
      object: { type: database, name: notification }
      privileges: [CONNECT]
    - role: notification_migrator
      object: { type: database, name: notification }
      privileges: [CONNECT]
    - role: notification_runtime
      object: { type: schema, name: public }
      privileges: [USAGE]
    # Existing objects; adopt would revoke anything undeclared.
    - role: notification_runtime
      object: { type: table, schema: public, name: "*" }
      privileges: [SELECT, INSERT, UPDATE, DELETE]
    - role: notification_runtime
      object: { type: sequence, schema: public, name: "*" }
      privileges: [USAGE, SELECT]
