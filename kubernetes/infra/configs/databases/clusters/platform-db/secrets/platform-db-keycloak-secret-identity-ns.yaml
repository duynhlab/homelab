# ExternalSecret for platform-db keycloak credentials — deployed to identity namespace.
# Same Vault path as platform-namespace copy; the Keycloak Deployment needs a local
# secret for KC_DB_USERNAME/KC_DB_PASSWORD (RFC-0022 / RFC-0024 P1).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-db-keycloak-secret
  namespace: identity
  labels:
    app.kubernetes.io/name: platform-db-keycloak-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: platform-db-keycloak-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: platform-db-keycloak-secret
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/local/databases/platform-db/keycloak
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/local/databases/platform-db/keycloak
        property: password
