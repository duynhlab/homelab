# The runtime credential for notification, in the notification namespace (service pods).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-db-notification-runtime-secret
  namespace: notification
  labels:
    app.kubernetes.io/name: platform-db-notification-runtime-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao-db
    kind: ClusterSecretStore
  target:
    name: platform-db-notification-runtime-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: platform-db-notification-runtime-secret
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: database/static-creds/notification-runtime
        property: username
    - secretKey: password
      remoteRef:
        key: database/static-creds/notification-runtime
        property: password
