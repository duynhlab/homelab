# The runtime credential for shipping, in the shipping namespace (service pods).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-db-shipping-runtime-secret
  namespace: shipping
  labels:
    app.kubernetes.io/name: platform-db-shipping-runtime-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: platform-db-shipping-runtime-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: platform-db-shipping-runtime-secret
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/local/databases/platform-db/shipping-runtime
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/local/databases/platform-db/shipping-runtime
        property: password
