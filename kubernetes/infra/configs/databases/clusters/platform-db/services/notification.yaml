# notification — owner / migrator / runtime roles (RFC-0029, ADR-084).
# Conventions: docs/databases/authorization.md.
#
# The Secrets are basic-auth because they double as each login's
# passwordSecret; the owner has no password and no pg_hba line.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-db-notification-runtime-secret
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-db-notification-runtime-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao-db
    kind: ClusterSecretStore
  target:
    name: platform-db-notification-runtime-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/name: platform-db-notification-runtime-secret
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: database/static-creds/notification-runtime
        property: username
    - secretKey: password
      remoteRef:
        key: database/static-creds/notification-runtime
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-db-notification-migrator-secret
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-db-notification-migrator-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: platform-db-notification-migrator-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/name: platform-db-notification-migrator-secret
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/local/databases/platform-db/notification-migrator
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/local/databases/platform-db/notification-migrator
        property: password
---
# Every attribute written out: adoption resets anything left out.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: platform-db-role-notification-owner
  namespace: platform
spec:
  cluster:
    name: platform-db
  name: notification_owner
  comment: "notification: owns the schema; nobody logs in"
  login: false
  superuser: false
  createdb: false
  createrole: false
  inherit: true
  replication: false
  bypassrls: false
  connectionLimit: -1
  inRoles: []
  databaseRoleReclaimPolicy: retain
---
# inherit: false makes CNPG's plain GRANT give the f/f/t membership
# (lab CNPG-07); the ADR-086 guard watches the edge.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: platform-db-role-notification-migrator
  namespace: platform
spec:
  cluster:
    name: platform-db
  name: notification_migrator
  comment: "notification: runs migrations as notification_owner via SET ROLE"
  login: true
  superuser: false
  createdb: false
  createrole: false
  inherit: false
  replication: false
  bypassrls: false
  connectionLimit: -1
  inRoles: [notification_owner]
  passwordSecret:
    name: platform-db-notification-migrator-secret
  databaseRoleReclaimPolicy: retain
---
# No passwordSecret: OpenBAO's static role owns the runtime password
# (ADR-025); CNPG manages only its attributes.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: platform-db-role-notification-runtime
  namespace: platform
spec:
  cluster:
    name: platform-db
  name: notification_runtime
  comment: "notification: the service; CRUD only"
  login: true
  superuser: false
  createdb: false
  createrole: false
  inherit: true
  replication: false
  bypassrls: false
  connectionLimit: -1
  inRoles: []
  databaseRoleReclaimPolicy: retain
---
# notification_owner owns the database, which on PostgreSQL 15+ is what gives it
# CREATE on the public schema.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: notification-database
  namespace: platform
spec:
  name: notification
  owner: notification_owner
  cluster:
    name: platform-db
  extensions:
    - name: pgaudit
    - name: pg_stat_statements
  databaseReclaimPolicy: retain
