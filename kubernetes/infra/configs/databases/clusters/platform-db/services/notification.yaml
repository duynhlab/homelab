# notification — runtime login + database (RFC-0029, ADR-084, ADR-088).
# notification_owner and notification_migrator are created by the role catalog Job
# (../authz), which also reads the migrator Secret below; its pgroles policy
# (../authz/policies/notification.yaml) owns the grants; CNPG keeps the
# runtime login and the Database. Conventions: docs/databases/authorization.md.
# The runtime password belongs to OpenBAO's static role (ADR-025): vault_rotator
# rotates it, ESO reads it every 15s, and the DatabaseRole has no
# passwordSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-db-notification-runtime-secret
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-db-notification-runtime-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: openbao-db
    kind: ClusterSecretStore
  target:
    name: platform-db-notification-runtime-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/name: platform-db-notification-runtime-secret
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: database/static-creds/notification-runtime
        property: username
    - secretKey: password
      remoteRef:
        key: database/static-creds/notification-runtime
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-db-notification-migrator-secret
  namespace: platform
  labels:
    app.kubernetes.io/name: platform-db-notification-migrator-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: platform-db-notification-migrator-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/name: platform-db-notification-migrator-secret
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/local/databases/platform-db/notification-migrator
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/local/databases/platform-db/notification-migrator
        property: password
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: platform-db-role-notification-runtime
  namespace: platform
spec:
  cluster:
    name: platform-db
  name: notification_runtime
  comment: "notification: the service; CRUD only"
  login: true
  superuser: false
  createdb: false
  createrole: false
  inherit: true
  replication: false
  bypassrls: false
  connectionLimit: -1
  inRoles: []
  databaseRoleReclaimPolicy: retain
---
# notification_owner owns the database, which on PostgreSQL 15+ is what gives it
# CREATE on the public schema. CNPG retries until the catalog Job creates it.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: notification-database
  namespace: platform
spec:
  name: notification
  owner: notification_owner
  cluster:
    name: platform-db
  extensions:
    - name: pgaudit
    - name: pg_stat_statements
  databaseReclaimPolicy: retain
