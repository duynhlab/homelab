# DR Replica Cluster (CloudNativePG)
# A single designated primary continuously recovering from the product-db WAL
# archive. Promotable to standalone primary for DR.
#
# Why 1 instance (it was 3 from 2026-09-01 to 2026-09-29): on the Kind host the
# three standbys each ran restore_command against RustFS every few seconds, and
# every attempt forks the manager plus a Python barman-cloud-wal-restore, so the
# spare cost more CPU than the serving cluster. The owner chose 1 (2026-09-29).
# Accepted trade-off: once PROMOTED this cluster is a single point of failure
# with no quorum. Promotion therefore includes raising `instances` back to 3
# (see docs/databases/runbooks/cnpg-dr-replica-bootstrap.md); CNPG adds the two
# standbys from the new primary.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: product-db-replica
  namespace: product
spec:
  instances: 1
  # ADR-089: serve the homelab-ca certificate (server-tls.yaml); the operator
  # keeps managing the replication client certificates.
  certificates:
    serverTLSSecret: product-db-replica-server-tls
    serverCASecret: product-db-replica-server-tls
  # Same operand as product-db (../product-db/image-catalog.yaml): pg_cron
  # available, NOT preloaded — the cron schema arrives through WAL; preload is
  # a promotion-time decision.
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: postgresql-cron
    major: 18

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: product-db-replica-backup-store
        serverName: product-db-replica-cluster

  # Must match or exceed product-db primary for recovery-critical GUCs.
  # PostgreSQL refuses recovery when replica values < primary pg_controldata.
  postgresql:
    # The same pg_stat_ch extension image as product-db, NOT preloaded: the
    # extension's catalog objects arrive through WAL, and a promoted replica
    # must be able to resolve them. Preload + pg_stat_ch.* parameters are a
    # promotion-time decision (docs/databases/runbooks/cnpg-dr-replica-bootstrap.md).
    extensions:
      - name: pg_stat_ch
        image:
          reference: ghcr.io/duynhlab/images/pg-stat-ch:0.1.0@sha256:0a7595c74478972efc25b43c79cd5c6f7b9f35decb793f22d7722bb3caed6c7b
    # A promoted replica takes product-db's clients, so it admits them the
    # same way (ADR-015, ADR-089). The list must equal product-db's
    # (../product-db/instance.yaml); `make validate` fails when they differ.
    pg_hba:
      # Every product-db database admits its runtime and migrator only
      # (RFC-0029); <svc>_owner never logs in, and the bootstrap role `product`
      # has no line at all.
      - hostssl payment   payment_runtime    all scram-sha-256
      - hostssl payment   payment_migrator   all scram-sha-256
      - hostssl product   product_runtime    all scram-sha-256
      - hostssl product   product_migrator   all scram-sha-256
      - hostssl inventory inventory_runtime  all scram-sha-256
      - hostssl inventory inventory_migrator all scram-sha-256
      - hostssl cart      cart_runtime       all scram-sha-256
      - hostssl cart      cart_migrator      all scram-sha-256
      - hostssl order     order_runtime      all scram-sha-256
      - hostssl order     order_migrator     all scram-sha-256
      - hostssl checkout  checkout_runtime   all scram-sha-256
      - hostssl checkout  checkout_migrator  all scram-sha-256
      # db_authz applies the role catalog in `postgres` and each database's
      # grants, as the Job or as pgroles (ADR-088). One line per database.
      - hostssl postgres  db_authz all scram-sha-256
      - hostssl product   db_authz all scram-sha-256
      - hostssl inventory db_authz all scram-sha-256
      - hostssl cart      db_authz all scram-sha-256
      - hostssl order     db_authz all scram-sha-256
      - hostssl checkout  db_authz all scram-sha-256
      - hostssl payment   db_authz all scram-sha-256
      # OpenBAO's rotation administrator (ADR-025) logs in to `product` only;
      # ALTER ROLE is cluster-wide, so one database is enough.
      - hostssl product   vault_rotator all scram-sha-256
      - host    all     all     all reject
    parameters:
      max_connections: "200"
      max_worker_processes: "12"
      max_wal_senders: "10"
      wal_level: "logical"
      min_wal_size: "2GB"
      max_wal_size: "8GB"
      wal_buffers: "16MB"
      wal_compression: "on"

  bootstrap:
    recovery:
      source: product-db-primary
      # Must match product-db's initdb. A recovery bootstrap does NOT create
      # these -- the databases arrive in the restored data directory -- but CNPG
      # reads them as the name of the application database, and that is what the
      # metrics exporter connects to. Left unset, the CRD defaults both to `app`,
      # which does not exist here (the restore carries product, cart, order,
      # payment, checkout, inventory), so every default monitoring query failed
      # with `FATAL: database "app" does not exist` on every scrape cycle.
      database: product
      owner: product

  replica:
    enabled: true
    source: product-db-primary

  externalClusters:
    - name: product-db-primary
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: product-db-backup-store
          serverName: product-db-cluster

  storage:
    size: 10Gi
    storageClass: standard

  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
