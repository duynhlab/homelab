# DR Replica Cluster (CloudNativePG)
# Designated primary (instance 1) continuously recovering from the product-db WAL
# archive, with two cascading standbys. Promotable to standalone primary for DR.
#
# Why 3 instances and not 1: promotion is the moment the cluster stops being a
# spare and becomes the system of record. At 1 instance the promoted cluster is a
# single point of failure with no quorum -- HA would have to be built during the
# incident. The standbys cascade from the designated primary and cost only local
# replication.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: product-db-replica
  namespace: product
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: product-db-replica-backup-store
        serverName: product-db-replica-cluster

  # Must match or exceed product-db primary for recovery-critical GUCs.
  # PostgreSQL refuses recovery when replica values < primary pg_controldata.
  postgresql:
    parameters:
      max_connections: "200"
      max_worker_processes: "8"
      max_wal_senders: "10"
      wal_level: "logical"
      min_wal_size: "2GB"
      max_wal_size: "8GB"
      wal_buffers: "16MB"
      wal_compression: "on"

  bootstrap:
    recovery:
      source: product-db-primary
      # Must match product-db's initdb. A recovery bootstrap does NOT create
      # these -- the databases arrive in the restored data directory -- but CNPG
      # reads them as the name of the application database, and that is what the
      # metrics exporter connects to. Left unset, the CRD defaults both to `app`,
      # which does not exist here (the restore carries product, cart, order,
      # payment, checkout, inventory), so every default monitoring query failed
      # with `FATAL: database "app" does not exist` on every scrape cycle.
      database: product
      owner: product

  replica:
    enabled: true
    source: product-db-primary

  externalClusters:
    - name: product-db-primary
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: product-db-backup-store
          serverName: product-db-cluster

  storage:
    size: 10Gi
    storageClass: standard

  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "250m"
