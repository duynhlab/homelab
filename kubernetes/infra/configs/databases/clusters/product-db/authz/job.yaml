apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-db-authz
  namespace: product
  labels:
    app.kubernetes.io/name: product-db-authz
    app.kubernetes.io/component: database
automountServiceAccountToken: false
---
# Applies authorization as soon as the SQL changes (new service, new rule).
apiVersion: batch/v1
kind: Job
metadata:
  name: product-db-authz
  namespace: product
  annotations:
    # The pod template is immutable; the ConfigMap hash in it changes with the
    # SQL, and Flux recreates the Job.
    kustomize.toolkit.fluxcd.io/force: enabled
  labels:
    app.kubernetes.io/name: product-db-authz
    app.kubernetes.io/component: database
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-db-authz
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: product-db-authz
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authz
          image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
          command: ["bash", "/authz/apply.sh"]
          env:
            # ADR-089: names every session apply.sh opens (psql reads PGAPPNAME).
            - name: PGAPPNAME
              value: db-authz
            # apply.sh is shared with platform-db; its PGHOST default is that cluster.
            - name: PGHOST
              value: product-db-rw.product.svc.cluster.local
            # Services whose owner/migrator roles the catalog owns, and those
            # whose in-database grants it owns (the rest use pgroles).
            - name: ROLE_SERVICES
              value: "product inventory"
            - name: GRANT_SERVICES
              value: ""
            - name: DB_AUTHZ_USER
              valueFrom:
                secretKeyRef:
                  name: product-db-db-authz-secret
                  key: username
            - name: DB_AUTHZ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-db-db-authz-secret
                  key: password
            - name: PRODUCT_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-db-product-migrator-secret
                  key: password
            - name: INVENTORY_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: product-db-inventory-migrator-secret
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: authz
              mountPath: /authz
              readOnly: true
      volumes:
        - name: authz
          configMap:
            name: product-db-authz
---
# Re-applies the same SQL to undo drift. A failed run is the drift signal for
# what the executor may not repair (docs/databases/authorization.md).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: product-db-authz
  namespace: product
  labels:
    app.kubernetes.io/name: product-db-authz
    app.kubernetes.io/component: database
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # A failed run fires KubeJobFailed; the TTL lets it resolve an hour after
      # the cause is fixed instead of waiting for the history limit to rotate.
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: product-db-authz
            app.kubernetes.io/component: database
        spec:
            serviceAccountName: product-db-authz
            automountServiceAccountToken: false
            restartPolicy: OnFailure
            enableServiceLinks: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 26
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: authz
                image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
                command: ["bash", "/authz/apply.sh"]
                env:
                  - name: PGAPPNAME
                    value: db-authz
                  # apply.sh is shared with platform-db; its PGHOST default is that cluster.
                  - name: PGHOST
                    value: product-db-rw.product.svc.cluster.local
                  # Services whose owner/migrator roles the catalog owns, and those
                  # whose in-database grants it owns (the rest use pgroles).
                  - name: ROLE_SERVICES
                    value: "product inventory"
                  - name: GRANT_SERVICES
                    value: ""
                  - name: DB_AUTHZ_USER
                    valueFrom:
                      secretKeyRef:
                        name: product-db-db-authz-secret
                        key: username
                  - name: DB_AUTHZ_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: product-db-db-authz-secret
                        key: password
                  - name: PRODUCT_MIGRATOR_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: product-db-product-migrator-secret
                        key: password
                  - name: INVENTORY_MIGRATOR_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: product-db-inventory-migrator-secret
                        key: password
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    memory: 64Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - name: authz
                    mountPath: /authz
                    readOnly: true
            volumes:
              - name: authz
                configMap:
                  name: product-db-authz
