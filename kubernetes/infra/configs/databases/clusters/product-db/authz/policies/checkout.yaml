# In-database grants for checkout (ADR-088), owned by pgroles in adopt mode.
# The catalog Job creates checkout_owner and checkout_migrator; CNPG creates
# checkout_runtime.
# The table wildcard also covers schema_migrations: pgroles cannot exclude one
# table from a wildcard (PGR-10), so the runtime holds it here, by decision.
apiVersion: pgroles.io/v1alpha1
kind: PostgresPolicy
metadata:
  name: product-db-checkout
  namespace: product
spec:
  connection:
    params:
      host: product-db-rw.product.svc
      dbname: checkout
      sslMode: require
      usernameSecret:
        name: product-db-db-authz-secret
        key: username
      passwordSecret:
        name: product-db-db-authz-secret
        key: password
      # authz_admin inherits checkout_owner, so it can grant on every object.
      setRole: authz_admin
  mode: apply
  reconciliation_mode: adopt
  approval: auto
  interval: 5m
  roles:
    - name: checkout_owner
      external: true
    - name: checkout_migrator
      external: true
    - name: checkout_runtime
      external: true
  default_privileges:
    - owner: checkout_owner
      schema: public
      grant:
        - role: checkout_runtime
          on_type: table
          privileges: [SELECT, INSERT, UPDATE, DELETE]
        - role: checkout_runtime
          on_type: sequence
          privileges: [USAGE, SELECT]
    # Global, not schema-scoped: only a global entry cancels PUBLIC EXECUTE (PGR-05).
    - owner: checkout_owner
      scope:
        type: global
      grant:
        - role: PUBLIC
          on_type: function
          privileges: [EXECUTE]
          ensure: absent
  grants:
    - role: checkout_runtime
      object: { type: database, name: checkout }
      privileges: [CONNECT]
    - role: checkout_migrator
      object: { type: database, name: checkout }
      privileges: [CONNECT]
    - role: checkout_runtime
      object: { type: schema, name: public }
      privileges: [USAGE]
    # Existing objects; adopt would revoke anything undeclared.
    - role: checkout_runtime
      object: { type: table, schema: public, name: "*" }
      privileges: [SELECT, INSERT, UPDATE, DELETE]
    - role: checkout_runtime
      object: { type: sequence, schema: public, name: "*" }
      privileges: [USAGE, SELECT]
