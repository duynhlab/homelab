apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CDC source on product-db (RFC-0030 phase 3): roles, publications, heartbeat
# bootstrap and the session-mode PgBouncer pooler PeerDB connects through.
resources:
  - secrets.yaml
  - roles.yaml
  - bootstrap.yaml
  - publications.yaml
  - pooler.yaml

configMapGenerator:
  - name: product-db-cdc-bootstrap
    namespace: product
    files:
      - bootstrap.sh
