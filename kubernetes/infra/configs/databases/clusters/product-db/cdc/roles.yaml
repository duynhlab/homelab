# CDC roles (RFC-0030). REPLICATION is a superuser-only attribute, so CNPG —
# not the db-authz catalog Job — owns these. Their grants follow the
# publications (bootstrap.sh); the HBA lines in ../instance.yaml.
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: product-db-role-peerdb-order
  namespace: product
spec:
  cluster:
    name: product-db
  name: peerdb_order
  comment: "PeerDB source for order: logical replication + exact-table SELECT (ADR-067)"
  login: true
  superuser: false
  createdb: false
  createrole: false
  inherit: true
  replication: true
  bypassrls: false
  connectionLimit: 5
  inRoles: []
  passwordSecret:
    name: product-db-peerdb-order-secret
  databaseRoleReclaimPolicy: retain
---
apiVersion: postgresql.cnpg.io/v1
