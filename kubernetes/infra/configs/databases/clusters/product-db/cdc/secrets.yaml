# Credentials for the CDC roles on product-db (RFC-0030 / ADR-067, ADR-068).
# OpenBAO: secret/data/local/databases/product-db/<name>. The peerdb_<db>
# values are also synced into the peerdb namespace for PeerDB's source peers.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: product-db-peerdb-order-secret
  namespace: product
  labels:
    app.kubernetes.io/name: product-db-peerdb-order-secret
    app.kubernetes.io/component: cdc
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: product-db-peerdb-order-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/name: product-db-peerdb-order-secret
          app.kubernetes.io/component: cdc
          app.kubernetes.io/managed-by: external-secrets
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/local/databases/product-db/peerdb-order
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/local/databases/product-db/peerdb-order
        property: password
---
