# Consolidated Primary Database Cluster (CloudNativePG)
# Merged from product-db + transaction-shared-db into single HA cluster
# Databases: product, cart, order, payment, checkout, inventory — per-service triplets
# under services/ (RFC-0012, ADR-013); this file is infrastructure only.
# The bootstrap.initdb database/owner/secret are structural placeholders on
# a fresh cluster — the product triplet adopts them declaratively.
# HA: 3 instances, quorum sync ANY 1 (either standby acknowledges)
# DR: WAL archived to RustFS for product-db-replica continuous recovery
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: product-db
  namespace: product
spec:
  instances: 3
  # ADR-089: serve the homelab-ca certificate (server-tls.yaml); the operator
  # keeps managing the replication client certificates.
  certificates:
    serverTLSSecret: product-db-server-tls
    serverCASecret: product-db-server-tls
  # PostgreSQL 18.6 + pg_cron for the CDC heartbeats (image-catalog.yaml).
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ImageCatalog
    name: postgresql-cron
    major: 18

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: product-db-backup-store
        serverName: product-db-cluster

  replicationSlots:
    highAvailability:
      synchronizeLogicalDecoding: true

  postgresql:
    # pg_stat_ch (query telemetry → ClickHouse) arrives as an image-volume
    # extension, not in the operand image: CNPG mounts it at /extensions/pg_stat_ch
    # and appends its lib/ and share/ to dynamic_library_path and
    # extension_control_path, so the preload entry below resolves. The image is
    # built against this exact operand digest (duynhlab/images, pg-stat-ch);
    # move the two together. Changing the image reference replaces the pods.
    extensions:
      - name: pg_stat_ch
        image:
          reference: ghcr.io/duynhlab/images/pg-stat-ch:0.1.0@sha256:0a7595c74478972efc25b43c79cd5c6f7b9f35decb793f22d7722bb3caed6c7b

    shared_preload_libraries:
      - pgaudit
      - pg_stat_statements
      - auto_explain
      - pg_stat_ch
      # Heartbeat scheduler (ADR-068); needs the postgresql-cron operand above.
      - pg_cron

    # Connection isolation (RFC-0012 P4, ADR-015): each service role connects
    # only to its own database. CNPG inserts these BETWEEN its fixed rules
    # (local peer for instance manager/exporter, cert-based hostssl for
    # streaming_replica) and its default host-all catch-all — so the trailing
    # reject preempts the catch-all without touching operator paths.
    # First match wins. Every allow line is hostssl: PgDog, migrate and the
    # authz Job all verify this server (ADR-089), and a plaintext login falls
    # through to the reject. Applied by reload, not restart.
    # Adding a service? Add its allow line ABOVE the reject (the one
    # exception to "never touch instance.yaml" — HBA is cluster infra).
    pg_hba:
      # Every product-db database admits its runtime and migrator only
      # (RFC-0029); <svc>_owner never logs in, and the bootstrap role `product`
      # has no line at all.
      - hostssl payment   payment_runtime    all scram-sha-256
      - hostssl payment   payment_migrator   all scram-sha-256
      - hostssl product   product_runtime    all scram-sha-256
      - hostssl product   product_migrator   all scram-sha-256
      - hostssl inventory inventory_runtime  all scram-sha-256
      - hostssl inventory inventory_migrator all scram-sha-256
      - hostssl cart      cart_runtime       all scram-sha-256
      - hostssl cart      cart_migrator      all scram-sha-256
      - hostssl order     order_runtime      all scram-sha-256
      - hostssl order     order_migrator     all scram-sha-256
      - hostssl checkout  checkout_runtime   all scram-sha-256
      - hostssl checkout  checkout_migrator  all scram-sha-256
      # db_authz applies the role catalog in `postgres` and each database's
      # grants, as the Job or as pgroles (ADR-088). One line per database.
      - hostssl postgres  db_authz all scram-sha-256
      - hostssl product   db_authz all scram-sha-256
      - hostssl inventory db_authz all scram-sha-256
      - hostssl cart      db_authz all scram-sha-256
      - hostssl order     db_authz all scram-sha-256
      - hostssl checkout  db_authz all scram-sha-256
      - hostssl payment   db_authz all scram-sha-256
      # OpenBAO's rotation administrator (ADR-025) logs in to `product` only;
      # ALTER ROLE is cluster-wide, so one database is enough.
      - hostssl product   vault_rotator all scram-sha-256
      - host    all     all     all reject

    synchronous:
      method: any
      number: 1
      dataDurability: required

    parameters:
      # Connection settings
      max_connections: "200"

      # Memory settings (production-tuned)
      shared_buffers: "256MB"
      effective_cache_size: "1.5GB"
      maintenance_work_mem: "512MB"
      work_mem: "32MB"

      # Query planner (SSD optimization)
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"

      # Checkpoint settings
      checkpoint_completion_target: "0.9"
      checkpoint_timeout: "15min"

      # WAL settings (optimized for backup + replication)
      wal_buffers: "16MB"
      wal_level: "logical"
      wal_compression: "on"
      archive_timeout: "5min"
      max_wal_senders: "10"
      # CDC (RFC-0030): three PeerDB slots plus headroom; a stalled mirror may
      # retain at most 1GB of WAL before its slot is invalidated (G6/G7).
      max_replication_slots: "10"
      max_slot_wal_keep_size: "1GB"
      wal_keep_size: "1GB"
      min_wal_size: "2GB"
      max_wal_size: "8GB"

      # Parallelism settings
      # 8 for queries plus pg_cron's background workers (max 4 at once).
      max_worker_processes: "12"

      # pg_cron (ADR-068): installed in `postgres`, schedules into the source
      # databases with cron.schedule_in_database as analytics_heartbeat.
      cron.database_name: "postgres"
      cron.use_background_workers: "on"
      cron.max_running_jobs: "4"
      cron.timezone: "UTC"
      cron.enable_superuser_jobs: "off"
      max_parallel_workers_per_gather: "4"
      max_parallel_workers: "8"
      max_parallel_maintenance_workers: "4"

      # Autovacuum tuning (high-write workloads)
      autovacuum: "on"
      autovacuum_max_workers: "3"
      autovacuum_vacuum_scale_factor: "0.1"
      autovacuum_analyze_scale_factor: "0.05"
      autovacuum_vacuum_cost_delay: "10ms"
      autovacuum_vacuum_cost_limit: "200"

      # Logging
      log_statement: "mod"
      log_min_duration_statement: "1000"
      log_checkpoints: "on"
      log_lock_waits: "on"
      log_temp_files: "0"
      log_autovacuum_min_duration: "1000"
      log_connections: "on"
      log_disconnections: "on"
      logging_collector: "on"

      # Security
      password_encryption: "scram-sha-256"

      # pgAudit configuration
      pgaudit.log: "ddl, write"
      pgaudit.log_catalog: "off"
      pgaudit.log_parameter: "on"
      pgaudit.log_statement_once: "off"
      pgaudit.log_relation: "on"
      pgaudit.log_rows: "on"

      # Performance monitoring
      track_io_timing: "on"

      # pg_stat_statements
      pg_stat_statements.track: "all"
      pg_stat_statements.max: "10000"

      # auto_explain
      auto_explain.log_min_duration: "1s"
      auto_explain.log_analyze: "on"
      # Vector's parse_pg_auto_explain parses the payload after "plan:" as
      # JSON (Plan / Query Text / Planning Time keys) — the PG default `text`
      # sends every plan to the pg_parse_failures debug sink instead.
      auto_explain.log_format: "json"

      # pg_stat_ch: one event per statement execution into ClickHouse
      # (database pg_stat_ch, native :9000) as the INSERT-only `pg_stat_ch` user.
      # The password is a postmaster GUC with no file/env alternative, so Flux
      # substitutes it at apply time from the pg-stat-ch-clickhouse Secret in
      # flux-system (databases-local postBuild.substituteFrom) — never a
      # literal here. Queue sized for this cluster's 1Gi pods: 8192 slots
      # (~4 MiB) + a 16 MiB string area, far below the 128K/64 MiB defaults.
      # ClickHouse down = events dropped and send_failures counted, never
      # back-pressure on queries; PgStatCh* alerts watch those counters.
      pg_stat_ch.clickhouse_host: "clickhouse-clickhouse.monitoring.svc.cluster.local"
      pg_stat_ch.clickhouse_port: "9000"
      pg_stat_ch.clickhouse_user: "pg_stat_ch"
      pg_stat_ch.clickhouse_password: "${PG_STAT_CH_CLICKHOUSE_PASSWORD}"
      pg_stat_ch.clickhouse_database: "pg_stat_ch"
      pg_stat_ch.queue_capacity: "8192"
      pg_stat_ch.string_area_size: "16"
      pg_stat_ch.flush_interval_ms: "1000"
      pg_stat_ch.batch_max: "8192"

      # Replication slot sync (PostgreSQL 18 native)
      hot_standby_feedback: "on"
      sync_replication_slots: "on"

  monitoring:
    customQueriesConfigMap:
      - name: product-db-monitoring-queries
        key: custom-queries

  bootstrap:
    initdb:
      # The bootstrap role `product` is NOLOGIN and owns nothing once the
      # Database CR hands `product` to product_owner (services/product.yaml).
      database: product
      owner: product
      secret:
        name: product-db-secret
      dataChecksums: true
      walSegmentSize: 64
      encoding: "UTF8"
      localeCType: "C"
      localeCollate: "C"
      postInitSQL:
        # ADR-025 pattern A: OpenBAO rotates every runtime password through
        # vault_rotator, which needs ADMIN OPTION on each (PG18). The roles are
        # created here so the GRANTs can carry ADMIN; the DatabaseRole CRs then
        # adopt them.
        - CREATE ROLE product_runtime WITH LOGIN
        - CREATE ROLE inventory_runtime WITH LOGIN
        - CREATE ROLE cart_runtime WITH LOGIN
        - CREATE ROLE order_runtime WITH LOGIN
        - CREATE ROLE checkout_runtime WITH LOGIN
        - CREATE ROLE payment_runtime WITH LOGIN
        # Password and ordinary attributes converge through DatabaseRole from a
        # per-cluster OpenBAO value. SQL retains only the ADMIN OPTION that the
        # DatabaseRole API cannot express or audit.
        - CREATE ROLE vault_rotator WITH LOGIN CREATEROLE NOINHERIT
        # ALTER ROLE needs CREATEROLE plus ADMIN on the target. INHERIT/SET are
        # deliberately false: the administrator rotates a credential but must
        # not inherit the runtime's data access or become it.
        - GRANT product_runtime TO vault_rotator WITH INHERIT FALSE, SET FALSE, ADMIN TRUE
        - GRANT inventory_runtime TO vault_rotator WITH INHERIT FALSE, SET FALSE, ADMIN TRUE
        - GRANT cart_runtime TO vault_rotator WITH INHERIT FALSE, SET FALSE, ADMIN TRUE
        - GRANT order_runtime TO vault_rotator WITH INHERIT FALSE, SET FALSE, ADMIN TRUE
        - GRANT checkout_runtime TO vault_rotator WITH INHERIT FALSE, SET FALSE, ADMIN TRUE
        - GRANT payment_runtime TO vault_rotator WITH INHERIT FALSE, SET FALSE, ADMIN TRUE
        # Creator of every catalog role (ADR-088). Unmanaged by CNPG on purpose:
        # CNPG revokes undeclared memberships of the roles it manages, and this
        # role is a member of every role it creates. db_authz reaches it via SET
        # ROLE. An existing cluster runs this once by hand (runbook).
        - CREATE ROLE authz_admin NOLOGIN CREATEROLE INHERIT
        # CDC heartbeats (RFC-0030 / ADR-068, owner decision 2026-10-23 on
        # #1325): pg_cron lives in `postgres`; analytics_heartbeat may schedule
        # jobs into the source databases and nothing else. An existing cluster
        # runs these four statements once by hand (runbook).
        - CREATE EXTENSION IF NOT EXISTS pg_cron
        - CREATE ROLE analytics_heartbeat WITH LOGIN
        - GRANT USAGE ON SCHEMA cron TO analytics_heartbeat
        - GRANT EXECUTE ON FUNCTION cron.schedule_in_database(text, text, text, text, text, boolean) TO analytics_heartbeat

  # Roles live in per-service DatabaseRole CRs under services/ (RFC-0012,
  # ADR-013) — do not re-add an inline managed.roles entry except as the
  # deliberate rollback lever: an inline entry with the same role name takes
  # precedence and flips the DatabaseRole to applied: false.

  storage:
    size: 10Gi
    storageClass: standard

  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
