# Consolidated Primary Database Cluster (CloudNativePG)
# Merged from product-db + transaction-shared-db into single HA cluster
# Databases: product, cart, order, payment, checkout, inventory — per-service triplets
# under services/ (RFC-0012, ADR-013); this file is infrastructure only.
# The bootstrap.initdb database/owner/secret are structural placeholders on
# a fresh cluster — the product triplet adopts them declaratively.
# HA: 3 instances, quorum sync ANY 1 (either standby acknowledges)
# DR: WAL archived to RustFS for product-db-replica continuous recovery
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: product-db
  namespace: product
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: product-db-backup-store
        serverName: product-db-cluster

  replicationSlots:
    highAvailability:
      synchronizeLogicalDecoding: true

  postgresql:
    # pg_stat_ch (query telemetry → ClickHouse) arrives as an image-volume
    # extension, not in the operand image: CNPG mounts it at /extensions/pg_stat_ch
    # and appends its lib/ and share/ to dynamic_library_path and
    # extension_control_path, so the preload entry below resolves. The image is
    # built against this exact operand digest (duynhlab/images, pg-stat-ch);
    # move the two together. Changing the image reference replaces the pods.
    extensions:
      - name: pg_stat_ch
        image:
          reference: ghcr.io/duynhlab/images/pg-stat-ch:0.1.0@sha256:0a7595c74478972efc25b43c79cd5c6f7b9f35decb793f22d7722bb3caed6c7b

    shared_preload_libraries:
      - pgaudit
      - pg_stat_statements
      - auto_explain
      - pg_stat_ch

    # Connection isolation (RFC-0012 P4, ADR-015): each service role connects
    # only to its own database. CNPG inserts these BETWEEN its fixed rules
    # (local peer for instance manager/exporter, cert-based hostssl for
    # streaming_replica) and its default host-all catch-all — so the trailing
    # reject preempts the catch-all without touching operator paths.
    # First match wins. `host` (not hostssl) for the pgdog/migration pairs:
    # their TLS is encrypted but unverified (TLS 1.3 measured on Kind 2026-10-01
    # via pg_stat_ssl; PgDog default prefer); tighten to hostssl with RFC-0020's
    # pooler slice. Applied by reload, not restart.
    # Adding a service? Add its allow line ABOVE the reject (the one
    # exception to "never touch instance.yaml" — HBA is cluster infra).
    pg_hba:
      - hostssl payment payment all scram-sha-256
      - host    product product all scram-sha-256
      - host    cart    cart    all scram-sha-256
      - host    order   order   all scram-sha-256
      - host    checkout checkout all scram-sha-256
      - host    inventory inventory all scram-sha-256
      - host    all     all     all reject

    synchronous:
      method: any
      number: 1
      dataDurability: required

    parameters:
      # Connection settings
      max_connections: "200"

      # Memory settings (production-tuned)
      shared_buffers: "256MB"
      effective_cache_size: "1.5GB"
      maintenance_work_mem: "512MB"
      work_mem: "32MB"

      # Query planner (SSD optimization)
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"

      # Checkpoint settings
      checkpoint_completion_target: "0.9"
      checkpoint_timeout: "15min"

      # WAL settings (optimized for backup + replication)
      wal_buffers: "16MB"
      wal_level: "logical"
      wal_compression: "on"
      archive_timeout: "5min"
      max_wal_senders: "10"
      wal_keep_size: "1GB"
      min_wal_size: "2GB"
      max_wal_size: "8GB"

      # Parallelism settings
      max_worker_processes: "8"
      max_parallel_workers_per_gather: "4"
      max_parallel_workers: "8"
      max_parallel_maintenance_workers: "4"

      # Autovacuum tuning (high-write workloads)
      autovacuum: "on"
      autovacuum_max_workers: "3"
      autovacuum_vacuum_scale_factor: "0.1"
      autovacuum_analyze_scale_factor: "0.05"
      autovacuum_vacuum_cost_delay: "10ms"
      autovacuum_vacuum_cost_limit: "200"

      # Logging
      log_statement: "mod"
      log_min_duration_statement: "1000"
      log_checkpoints: "on"
      log_lock_waits: "on"
      log_temp_files: "0"
      log_autovacuum_min_duration: "1000"
      log_connections: "on"
      log_disconnections: "on"
      logging_collector: "on"

      # Security
      password_encryption: "scram-sha-256"

      # pgAudit configuration
      pgaudit.log: "ddl, write"
      pgaudit.log_catalog: "off"
      pgaudit.log_parameter: "on"
      pgaudit.log_statement_once: "off"
      pgaudit.log_relation: "on"
      pgaudit.log_rows: "on"

      # Performance monitoring
      track_io_timing: "on"

      # pg_stat_statements
      pg_stat_statements.track: "all"
      pg_stat_statements.max: "10000"

      # auto_explain
      auto_explain.log_min_duration: "1s"
      auto_explain.log_analyze: "on"
      # Vector's parse_pg_auto_explain parses the payload after "plan:" as
      # JSON (Plan / Query Text / Planning Time keys) — the PG default `text`
      # sends every plan to the pg_parse_failures debug sink instead.
      auto_explain.log_format: "json"

      # pg_stat_ch: one event per statement execution into ClickHouse
      # (database pg_stat_ch, native :9000) as the INSERT-only `pg_stat_ch` user.
      # The password is a postmaster GUC with no file/env alternative, so Flux
      # substitutes it at apply time from the pg-stat-ch-clickhouse Secret in
      # flux-system (databases-local postBuild.substituteFrom) — never a
      # literal here. Queue sized for this cluster's 1Gi pods: 8192 slots
      # (~4 MiB) + a 16 MiB string area, far below the 128K/64 MiB defaults.
      # ClickHouse down = events dropped and send_failures counted, never
      # back-pressure on queries; PgStatCh* alerts watch those counters.
      pg_stat_ch.clickhouse_host: "clickhouse-clickhouse.monitoring.svc.cluster.local"
      pg_stat_ch.clickhouse_port: "9000"
      pg_stat_ch.clickhouse_user: "pg_stat_ch"
      pg_stat_ch.clickhouse_password: "${PG_STAT_CH_CLICKHOUSE_PASSWORD}"
      pg_stat_ch.clickhouse_database: "pg_stat_ch"
      pg_stat_ch.queue_capacity: "8192"
      pg_stat_ch.string_area_size: "16"
      pg_stat_ch.flush_interval_ms: "1000"
      pg_stat_ch.batch_max: "8192"

      # Replication slot sync (PostgreSQL 18 native)
      hot_standby_feedback: "on"
      sync_replication_slots: "on"

  monitoring:
    customQueriesConfigMap:
      - name: product-db-monitoring-queries
        key: custom-queries

  bootstrap:
    initdb:
      database: product
      owner: product
      secret:
        name: product-db-secret
      dataChecksums: true
      walSegmentSize: 64
      encoding: "UTF8"
      localeCType: "C"
      localeCollate: "C"

  # Roles live in per-service DatabaseRole CRs under services/ (RFC-0012,
  # ADR-013) — do not re-add an inline managed.roles entry except as the
  # deliberate rollback lever: an inline entry with the same role name takes
  # precedence and flips the DatabaseRole to applied: false.

  storage:
    size: 10Gi
    storageClass: standard

  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
