apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# product-db cluster (CloudNativePG)
# Databases: product, cart, order, payment, checkout, inventory — each a services/ file (RFC-0012),
# all on the three-role split (RFC-0029, ADR-088)
# Order: secrets (app-ns copies) -> instance -> services (triplets) -> poolers -> monitoring -> backup
resources:
  - secrets/product-db-cart-runtime-secret-cart-ns.yaml
  - secrets/product-db-cart-migrator-secret-cart-ns.yaml
  - secrets/product-db-checkout-runtime-secret-checkout-ns.yaml
  - secrets/product-db-checkout-migrator-secret-checkout-ns.yaml
  - secrets/product-db-inventory-runtime-secret-inventory-ns.yaml
  - secrets/product-db-inventory-migrator-secret-inventory-ns.yaml
  - secrets/product-db-order-runtime-secret-order-ns.yaml
  - secrets/product-db-order-migrator-secret-order-ns.yaml
  - secrets/product-db-payment-runtime-secret-payment-ns.yaml
  - secrets/product-db-payment-migrator-secret-payment-ns.yaml
  # pg-backup-rustfs-credentials: managed by ClusterExternalSecret (configs/secrets/cluster-external-secrets/)
  - objectstore.yaml
  - instance.yaml
  - authz/  # ADR-088: db_authz + role catalog Job/CronJob + pgroles policies
  - services/
  - configmaps/monitoring-queries.yaml
  - poolers/
  - monitoring/podmonitor.yaml
  - backup/backup-daily.yaml
  - backup/backup-every-6h.yaml
  - backup/backup-initial.yaml
