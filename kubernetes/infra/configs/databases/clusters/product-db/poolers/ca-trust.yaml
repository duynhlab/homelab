# The CA every product-db client verifies PgDog against (sslmode=verify-full,
# ADR-089). Issued by the live homelab-ca ClusterIssuer, so its ca.crt matches
# the CA that signs pgdog-product-tls on every rebuild; the trust-manager
# bundle holds a static copy that does not. Only ca.crt is used; the leaf is
# never presented. One per namespace, because a pod mounts Secrets from its own.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: product-db-ca-trust
  namespace: product
spec:
  secretName: product-db-ca-trust
  commonName: product-db-ca-trust.product.svc
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: homelab-ca
---
