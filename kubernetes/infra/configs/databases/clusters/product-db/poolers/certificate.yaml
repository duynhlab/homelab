# Client-side TLS for PgDog (RFC-0029 wave 2, ADR-089). payment requires TLS
# to its database in production, so PgDog presents this certificate to
# clients. TLS is optional for clients: the other product-db services still
# connect in plaintext. payment verifies it (sslmode=verify-full) against
# payment-db-ca-trust, so dnsNames must keep the name payment dials.
# A renewal rolls PgDog: the watch label makes helm-controller reconcile on a
# Secret change, and the HelmRelease puts tls.crt in a pod annotation.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pgdog-product-tls
  namespace: product
spec:
  secretName: pgdog-product-tls
  secretTemplate:
    labels:
      reconcile.fluxcd.io/watch: Enabled
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: homelab-ca
  commonName: pgdog-product.product.svc
  dnsNames:
    - pgdog-product.product.svc
    - pgdog-product.product.svc.cluster.local
