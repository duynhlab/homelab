# Client-side TLS for PgDog (ADR-089). Every client verifies it
# (sslmode=verify-full) against product-db-ca-trust, so dnsNames must keep the
# name the clients dial; PgDog refuses plaintext.
# A renewal rolls PgDog: the watch label makes helm-controller reconcile on a
# Secret change, and the HelmRelease puts tls.crt in a pod annotation.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pgdog-product-tls
  namespace: product
spec:
  secretName: pgdog-product-tls
  secretTemplate:
    labels:
      reconcile.fluxcd.io/watch: Enabled
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: homelab-ca
  commonName: pgdog-product.product.svc
  dnsNames:
    - pgdog-product.product.svc
    - pgdog-product.product.svc.cluster.local
