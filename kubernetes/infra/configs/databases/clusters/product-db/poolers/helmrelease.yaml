# PgDog Connection Pooler for product-db (product, cart, order, payment,
# checkout, inventory)
# Primary only: no database lists a replica, so PgDog cannot split reads.
# ADR-089 makes the primary the default; a replica read must be an explicit
# opt-in profile (planned, docs/databases/poolers.md).
# Prepared statements: extended mode (no prefer_simple_protocol needed)
#
# Passthrough auth (ADR-025): PgDog holds no password list. It asks each client
# for its password over TLS, checks it against product-db once and caches it;
# a changed password replaces the cached one without a reload or a roll.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgdog-product
  namespace: product
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: pgdog
      interval: 5m
      version: "v0.92"
      sourceRef:
        kind: HelmRepository
        name: pgdogdev
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # A renewed certificate is reloaded in place, not rolled (#1350): kubelet
  # updates the mounted Secret, and the tls-reload sidecar sends PgDog SIGHUP,
  # which re-reads the TLS files; open sessions keep their handshake.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: pgdog-product
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: pgdog-product
              spec:
                template:
                  spec:
                    # The sidecar must see the pgdog process to signal it.
                    shareProcessNamespace: true
                    containers:
                      - name: tls-reload
                        # PgDog's own image: it ships sh, sha256sum, pidof and kill.
                        image: ghcr.io/pgdogdev/pgdog:v0.1.61
                        command:
                          - sh
                          - -c
                          - |
                            f=/etc/pgdog-tls/tls.crt
                            last=$(sha256sum "$f")
                            while true; do
                              sleep 30
                              cur=$(sha256sum "$f")
                              if [ "$cur" != "$last" ] && p=$(pidof pgdog); then
                                kill -HUP $p && echo "tls.crt changed: sent SIGHUP to pgdog $p" && last=$cur
                              fi
                            done
                        volumeMounts:
                          - name: pgdog-tls
                            mountPath: /etc/pgdog-tls
                            readOnly: true
                        livenessProbe:
                          exec:
                            command: ["test", "-r", "/etc/pgdog-tls/tls.crt"]
                          periodSeconds: 30
                        readinessProbe:
                          exec:
                            command: ["test", "-r", "/etc/pgdog-tls/tls.crt"]
                          periodSeconds: 30
                        resources:
                          requests:
                            cpu: 5m
                            memory: 8Mi
                          limits:
                            memory: 32Mi
  values:
    replicas: 3
    port: 6432
    openMetricsPort: 9090
    openMetricsNamespace: "pgdog_"

    # Client-side TLS (certificate.yaml). Every client verifies it with
    # verify-full (ADR-089), and a plaintext login is refused.
    tlsClientRequired: true
    # Passthrough needs the client's password in clear, so TLS is mandatory;
    # allow_change lets a rotated password replace the cached one.
    passthroughAuth: enabled_allow_change
    tlsCertificate: /etc/pgdog-tls/tls.crt
    tlsPrivateKey: /etc/pgdog-tls/tls.key
    # Upstream: verify product-db-rw's homelab-ca certificate and host name.
    tlsVerify: verify_full
    tlsServerCaCertificate: /etc/pgdog-server-ca/ca.crt
    extraVolumes:
      - name: pgdog-tls
        secret:
          secretName: pgdog-product-tls
      - name: pgdog-server-ca
        secret:
          secretName: product-db-ca-trust
          items:
            - key: ca.crt
              path: ca.crt
    extraVolumeMounts:
      - name: pgdog-tls
        mountPath: /etc/pgdog-tls
        readOnly: true
      - name: pgdog-server-ca
        mountPath: /etc/pgdog-server-ca
        readOnly: true

    # Drain on rollout: preStop keeps the pod serving while the Service drops
    # it, then SIGINT lets clients finish (shutdown_timeout 60s). Grace covers
    # both, since the chart's default (shutdown + 5s) ignores the preStop.
    preStopSleepSeconds: 10
    terminationGracePeriodSeconds: 75

    lsnCheckDelay: 0
    lsnCheckInterval: 5000

    databases:
      # product DB
      - name: product
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: product
        poolSize: 30
        poolMode: transaction
      # cart DB
      - name: cart
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: cart
        poolSize: 30
        poolMode: transaction
      # order DB
      - name: order
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: order
        poolSize: 30
        poolMode: transaction
      # payment DB
      - name: payment
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: payment
        poolSize: 30
        poolMode: transaction
      # checkout DB
      - name: checkout
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: checkout
        poolSize: 30
        poolMode: transaction
      # inventory DB
      - name: inventory
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: inventory
        poolSize: 30
        poolMode: transaction


    # The chart ships both probes commented out, so the pooler ran with none
    # and Kyverno's require-probes recorded a violation against it on every
    # report — the policy is Audit, so nothing blocked. Without a readiness
    # probe a pooler that is up but not yet accepting connections still gets
    # traffic, which is the failure this pooler exists to absorb.
    # TCP on the pooler port: pgdog serves the Postgres wire protocol, so
    # there is no HTTP endpoint to GET.
    livenessProbe:
      tcpSocket:
        port: 6432
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      tcpSocket:
        port: 6432
      initialDelaySeconds: 5
      periodSeconds: 10

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        # No CPU limit, as elsewhere: throttling hit the login burst of a roll (#1350).
        # null drops the chart's 1000m default; omitting the key would keep it.
        cpu: null
        memory: 128Mi

    serviceMonitor:
      enabled: true
      interval: 15s
      scrapeTimeout: 10s

    podAntiAffinity:
      enabled: true
      type: soft

    podDisruptionBudget:
      enabled: true
      minAvailable: 2
