# PgDog Connection Pooler for product-db (product, cart, order, payment,
# checkout, inventory)
# Primary only: no database lists a replica, so PgDog cannot split reads.
# ADR-089 makes the primary the default; a replica read must be an explicit
# opt-in profile (planned, docs/databases/poolers.md).
# Prepared statements: extended mode (no prefer_simple_protocol needed)
#
# User passwords come from the per-service ESO basic-auth Secrets via Flux
# valuesFrom targetPath (RFC-0012 P2, ADR-014) — no credentials in values.
# helm-controller re-reads valuesFrom only at reconcile time: after a
# password rotation, run `flux reconcile helmrelease pgdog-product -n product`.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgdog-product
  namespace: product
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: pgdog
      interval: 5m
      version: "v0.90"
      sourceRef:
        kind: HelmRepository
        name: pgdogdev
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Indices are positional against values.users below — keep both lists in
  # the same order: [0]=product, [1]=cart, [2]=order, [3]=payment,
  # [4]=checkout, [5]=inventory.
  valuesFrom:
    - kind: Secret
      name: product-db-secret
      valuesKey: password
      targetPath: "users[0].password"
    - kind: Secret
      name: product-db-cart-secret
      valuesKey: password
      targetPath: "users[1].password"
    - kind: Secret
      name: product-db-order-secret
      valuesKey: password
      targetPath: "users[2].password"
    - kind: Secret
      name: product-db-payment-secret
      valuesKey: password
      targetPath: "users[3].password"
    - kind: Secret
      name: product-db-checkout-secret
      valuesKey: password
      targetPath: "users[4].password"
    - kind: Secret
      name: product-db-inventory-secret
      valuesKey: password
      targetPath: "users[5].password"
  values:
    replicas: 3
    port: 6432
    openMetricsPort: 9090
    openMetricsNamespace: "pgdog_"

    lsnCheckDelay: 0
    lsnCheckInterval: 5000

    databases:
      # product DB
      - name: product
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: product
        poolSize: 30
        poolMode: transaction
      # cart DB
      - name: cart
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: cart
        poolSize: 30
        poolMode: transaction
      # order DB
      - name: order
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: order
        poolSize: 30
        poolMode: transaction
      # payment DB
      - name: payment
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: payment
        poolSize: 30
        poolMode: transaction
      # checkout DB
      - name: checkout
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: checkout
        poolSize: 30
        poolMode: transaction
      # inventory DB
      - name: inventory
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: inventory
        poolSize: 30
        poolMode: transaction

    # Passwords injected per-user by spec.valuesFrom (order must match the
    # targetPath indices above).
    users:
      - name: product
        database: product
      - name: cart
        database: cart
      - name: order
        database: order
      - name: payment
        database: payment
      - name: checkout
        database: checkout
      - name: inventory
        database: inventory

    # The chart ships both probes commented out, so the pooler ran with none
    # and Kyverno's require-probes recorded a violation against it on every
    # report — the policy is Audit, so nothing blocked. Without a readiness
    # probe a pooler that is up but not yet accepting connections still gets
    # traffic, which is the failure this pooler exists to absorb.
    # TCP on the pooler port: pgdog serves the Postgres wire protocol, so
    # there is no HTTP endpoint to GET.
    livenessProbe:
      tcpSocket:
        port: 6432
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      tcpSocket:
        port: 6432
      initialDelaySeconds: 5
      periodSeconds: 10

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

    serviceMonitor:
      enabled: true
      interval: 15s
      scrapeTimeout: 10s

    podAntiAffinity:
      enabled: true
      type: soft

    podDisruptionBudget:
      enabled: true
      minAvailable: 2
