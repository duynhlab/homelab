# PgDog Connection Pooler for product-db (product, cart, order, payment,
# checkout, inventory)
# Primary only: no database lists a replica, so PgDog cannot split reads.
# ADR-089 makes the primary the default; a replica read must be an explicit
# opt-in profile (planned, docs/databases/poolers.md).
# Prepared statements: extended mode (no prefer_simple_protocol needed)
#
# User passwords come from the per-service ESO basic-auth Secrets via Flux
# valuesFrom targetPath (RFC-0012 P2, ADR-014) — no credentials in values.
# helm-controller re-reads valuesFrom only at reconcile time: after a
# password rotation, run `flux reconcile helmrelease pgdog-product -n product`.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgdog-product
  namespace: product
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: pgdog
      interval: 5m
      version: "v0.90"
      sourceRef:
        kind: HelmRepository
        name: pgdogdev
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # Indices are positional against values.users below — keep both lists in
  # the same order: [0]=product, [1]=cart, [2]=order, [3]=payment,
  # [4]=checkout, [5]=inventory, each the service's <svc>_runtime login
  # (RFC-0029); migrators never go through PgDog.
  valuesFrom:
    - kind: Secret
      name: product-db-product-runtime-secret
      valuesKey: password
      targetPath: "users[0].password"
    - kind: Secret
      name: product-db-cart-runtime-secret
      valuesKey: password
      targetPath: "users[1].password"
    - kind: Secret
      name: product-db-order-runtime-secret
      valuesKey: password
      targetPath: "users[2].password"
    - kind: Secret
      name: product-db-payment-runtime-secret
      valuesKey: password
      targetPath: "users[3].password"
    - kind: Secret
      name: product-db-checkout-runtime-secret
      valuesKey: password
      targetPath: "users[4].password"
    - kind: Secret
      name: product-db-inventory-runtime-secret
      valuesKey: password
      targetPath: "users[5].password"
    # Not positional. The serving certificate as a pod annotation: a renewal
    # changes the pod template, so the pods roll onto it (the Secret carries
    # reconcile.fluxcd.io/watch). Optional: cert-manager may not have issued
    # it yet on the first install.
    - kind: Secret
      name: pgdog-product-tls
      valuesKey: tls.crt
      targetPath: "podAnnotations.pgdog-tls-crt"
      optional: true
  values:
    replicas: 3
    port: 6432
    openMetricsPort: 9090
    openMetricsNamespace: "pgdog_"

    # Client-side TLS (certificate.yaml). Every client verifies it with
    # verify-full (ADR-089), and a plaintext login is refused.
    tlsClientRequired: true
    tlsCertificate: /etc/pgdog-tls/tls.crt
    tlsPrivateKey: /etc/pgdog-tls/tls.key
    extraVolumes:
      - name: pgdog-tls
        secret:
          secretName: pgdog-product-tls
    extraVolumeMounts:
      - name: pgdog-tls
        mountPath: /etc/pgdog-tls
        readOnly: true

    # Drain on rollout: preStop keeps the pod serving while the Service drops
    # it, then SIGINT lets clients finish (shutdown_timeout 60s). Grace covers
    # both, since the chart's default (shutdown + 5s) ignores the preStop.
    preStopSleepSeconds: 10
    terminationGracePeriodSeconds: 75

    lsnCheckDelay: 0
    lsnCheckInterval: 5000

    databases:
      # product DB
      - name: product
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: product
        poolSize: 30
        poolMode: transaction
      # cart DB
      - name: cart
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: cart
        poolSize: 30
        poolMode: transaction
      # order DB
      - name: order
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: order
        poolSize: 30
        poolMode: transaction
      # payment DB
      - name: payment
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: payment
        poolSize: 30
        poolMode: transaction
      # checkout DB
      - name: checkout
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: checkout
        poolSize: 30
        poolMode: transaction
      # inventory DB
      - name: inventory
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: inventory
        poolSize: 30
        poolMode: transaction

    # Passwords injected per-user by spec.valuesFrom (order must match the
    # targetPath indices above).
    users:
      - name: product_runtime
        database: product
      - name: cart_runtime
        database: cart
      - name: order_runtime
        database: order
      - name: payment_runtime
        database: payment
      - name: checkout_runtime
        database: checkout
      - name: inventory_runtime
        database: inventory

    # The chart ships both probes commented out, so the pooler ran with none
    # and Kyverno's require-probes recorded a violation against it on every
    # report — the policy is Audit, so nothing blocked. Without a readiness
    # probe a pooler that is up but not yet accepting connections still gets
    # traffic, which is the failure this pooler exists to absorb.
    # TCP on the pooler port: pgdog serves the Postgres wire protocol, so
    # there is no HTTP endpoint to GET.
    livenessProbe:
      tcpSocket:
        port: 6432
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      tcpSocket:
        port: 6432
      initialDelaySeconds: 5
      periodSeconds: 10

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

    serviceMonitor:
      enabled: true
      interval: 15s
      scrapeTimeout: 10s

    podAntiAffinity:
      enabled: true
      type: soft

    podDisruptionBudget:
      enabled: true
      minAvailable: 2
