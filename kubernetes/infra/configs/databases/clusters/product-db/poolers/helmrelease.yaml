# PgDog Connection Pooler for product-db (product, cart, order, payment,
# checkout, inventory)
# Primary only: no database lists a replica, so PgDog cannot split reads.
# ADR-089 makes the primary the default; a replica read must be an explicit
# opt-in profile (planned, docs/databases/poolers.md).
# Prepared statements: extended mode (no prefer_simple_protocol needed)
#
# Passthrough auth (ADR-025): PgDog holds no password list. It asks each client
# for its password over TLS, checks it against product-db once and caches it;
# a changed password replaces the cached one without a reload or a roll.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgdog-product
  namespace: product
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: pgdog
      interval: 5m
      version: "v0.92"
      sourceRef:
        kind: HelmRepository
        name: pgdogdev
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    # The serving certificate as a pod annotation: a renewal changes the pod
    # template, so the pods roll onto it (the Secret carries
    # reconcile.fluxcd.io/watch). Optional: cert-manager may not have issued
    # it yet on the first install.
    - kind: Secret
      name: pgdog-product-tls
      valuesKey: tls.crt
      targetPath: "podAnnotations.pgdog-tls-crt"
      optional: true
  values:
    replicas: 3
    port: 6432
    openMetricsPort: 9090
    openMetricsNamespace: "pgdog_"

    # Client-side TLS (certificate.yaml). Every client verifies it with
    # verify-full (ADR-089), and a plaintext login is refused.
    tlsClientRequired: true
    # Passthrough needs the client's password in clear, so TLS is mandatory;
    # allow_change lets a rotated password replace the cached one.
    passthroughAuth: enabled_allow_change
    tlsCertificate: /etc/pgdog-tls/tls.crt
    tlsPrivateKey: /etc/pgdog-tls/tls.key
    # Upstream: verify product-db-rw's homelab-ca certificate and host name.
    tlsVerify: verify_full
    tlsServerCaCertificate: /etc/pgdog-server-ca/ca.crt
    extraVolumes:
      - name: pgdog-tls
        secret:
          secretName: pgdog-product-tls
      - name: pgdog-server-ca
        secret:
          secretName: product-db-ca-trust
          items:
            - key: ca.crt
              path: ca.crt
    extraVolumeMounts:
      - name: pgdog-tls
        mountPath: /etc/pgdog-tls
        readOnly: true
      - name: pgdog-server-ca
        mountPath: /etc/pgdog-server-ca
        readOnly: true

    # Drain on rollout: preStop keeps the pod serving while the Service drops
    # it, then SIGINT lets clients finish (shutdown_timeout 60s). Grace covers
    # both, since the chart's default (shutdown + 5s) ignores the preStop.
    preStopSleepSeconds: 10
    terminationGracePeriodSeconds: 75

    lsnCheckDelay: 0
    lsnCheckInterval: 5000

    databases:
      # product DB
      - name: product
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: product
        poolSize: 30
        poolMode: transaction
      # cart DB
      - name: cart
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: cart
        poolSize: 30
        poolMode: transaction
      # order DB
      - name: order
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: order
        poolSize: 30
        poolMode: transaction
      # payment DB
      - name: payment
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: payment
        poolSize: 30
        poolMode: transaction
      # checkout DB
      - name: checkout
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: checkout
        poolSize: 30
        poolMode: transaction
      # inventory DB
      - name: inventory
        host: product-db-rw.product.svc.cluster.local
        port: 5432
        database: inventory
        poolSize: 30
        poolMode: transaction


    # The chart ships both probes commented out, so the pooler ran with none
    # and Kyverno's require-probes recorded a violation against it on every
    # report — the policy is Audit, so nothing blocked. Without a readiness
    # probe a pooler that is up but not yet accepting connections still gets
    # traffic, which is the failure this pooler exists to absorb.
    # TCP on the pooler port: pgdog serves the Postgres wire protocol, so
    # there is no HTTP endpoint to GET.
    livenessProbe:
      tcpSocket:
        port: 6432
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      tcpSocket:
        port: 6432
      initialDelaySeconds: 5
      periodSeconds: 10

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

    serviceMonitor:
      enabled: true
      interval: 15s
      scrapeTimeout: 10s

    podAntiAffinity:
      enabled: true
      type: soft

    podDisruptionBudget:
      enabled: true
      minAvailable: 2
