# The CA payment verifies PgDog against (sslmode=verify-full, ADR-089). Issued
# by the live homelab-ca ClusterIssuer, so its ca.crt matches the CA that signs
# pgdog-product-tls on every rebuild; the trust-manager bundle holds a static
# copy that does not. Only ca.crt is used; the leaf is never presented.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: payment-db-ca-trust
  namespace: payment
spec:
  secretName: payment-db-ca-trust
  commonName: payment-db-ca-trust.payment.svc
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: homelab-ca
