# Example: Restore product-db from RustFS backup to new cluster
# Use for DR drill or PITR. Apply manually - NOT part of default kustomization.
#
# Prerequisites:
# - At least one successful base backup + WAL archiving
# - Bucket pg-backups-cnpg exists in RustFS
# - Secret pg-backup-rustfs-credentials in product namespace
#
# Usage:
#   kubectl apply -f restore-cluster-example.yaml -n product
#   kubectl get cluster -n product -w
#
# For PITR: Add recoveryTarget under bootstrap.recovery:
#   recoveryTarget:
#     targetTime: "2026-03-13 10:00:00+00"
#
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: product-db-restore
  namespace: product
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  # WAL segment size is baked into the RESTORED data directory (product-db is
  # initdb'd with walSegmentSize: 64), but postgresql.parameters come from THIS
  # manifest — so a restore that omits them gets CNPG's default min_wal_size
  # (80MB) against 64MB segments and Postgres refuses to start:
  #   FATAL: "min_wal_size" must be at least twice "wal_segment_size"
  # Found by the first Drill A run (2026-08-07): this manifest had never been
  # exercised. Mirror the source cluster's WAL sizing here; the rest of its
  # tuning is irrelevant to a throwaway validation cluster.
  postgresql:
    parameters:
      min_wal_size: "2GB"
      max_wal_size: "8GB"
  bootstrap:
    recovery:
      source: product-db-backup
      database: product
      owner: product
      secret:
        name: product-db-secret
  externalClusters:
    - name: product-db-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: product-db-backup-store
          serverName: product-db-cluster
  storage:
    size: 10Gi
    storageClass: standard
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
