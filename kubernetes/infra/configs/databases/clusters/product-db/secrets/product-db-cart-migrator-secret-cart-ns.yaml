# The migrator credential for cart, in the cart namespace (the
# migrate init container).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: product-db-cart-migrator-secret
  namespace: cart
  labels:
    app.kubernetes.io/name: product-db-cart-migrator-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: product-db-cart-migrator-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: product-db-cart-migrator-secret
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/local/databases/product-db/cart-migrator
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/local/databases/product-db/cart-migrator
        property: password
