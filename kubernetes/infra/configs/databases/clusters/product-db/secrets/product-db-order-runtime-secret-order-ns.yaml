# The runtime credential for order, in the order namespace (service pods).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: product-db-order-runtime-secret
  namespace: order
  labels:
    app.kubernetes.io/name: product-db-order-runtime-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: openbao-db
    kind: ClusterSecretStore
  target:
    name: product-db-order-runtime-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: product-db-order-runtime-secret
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: database/static-creds/order-runtime
        property: username
    - secretKey: password
      remoteRef:
        key: database/static-creds/order-runtime
        property: password
