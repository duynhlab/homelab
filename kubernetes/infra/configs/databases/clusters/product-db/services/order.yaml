# order — runtime login + database (RFC-0029, ADR-084, ADR-088).
# order_owner and order_migrator are created by the role catalog Job
# (../authz), which also reads the migrator Secret below; its pgroles policy
# (../authz/policies/order.yaml) owns the grants; CNPG keeps the runtime
# login and the Database. Conventions: docs/databases/authorization.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: product-db-order-runtime-secret
  namespace: product
  labels:
    app.kubernetes.io/name: product-db-order-runtime-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: product-db-order-runtime-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/name: product-db-order-runtime-secret
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/local/databases/product-db/order-runtime
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/local/databases/product-db/order-runtime
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: product-db-order-migrator-secret
  namespace: product
  labels:
    app.kubernetes.io/name: product-db-order-migrator-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: product-db-order-migrator-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/name: product-db-order-migrator-secret
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/local/databases/product-db/order-migrator
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/local/databases/product-db/order-migrator
        property: password
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: product-db-role-order-runtime
  namespace: product
spec:
  cluster:
    name: product-db
  name: order_runtime
  comment: "order: the service; CRUD only"
  login: true
  superuser: false
  createdb: false
  createrole: false
  inherit: true
  replication: false
  bypassrls: false
  connectionLimit: -1
  inRoles: []
  passwordSecret:
    name: product-db-order-runtime-secret
  databaseRoleReclaimPolicy: retain
---
# order_owner owns the database, which on PostgreSQL 15+ is what gives it
# CREATE on the public schema. CNPG retries until the catalog Job creates it.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: order-database
  namespace: product
spec:
  name: order
  owner: order_owner
  cluster:
    name: product-db
  extensions:
    - name: pgaudit
    - name: pg_stat_statements
  databaseReclaimPolicy: retain
