# product — runtime login + database (RFC-0029, ADR-084, ADR-088).
# product_owner and product_migrator are created by the role catalog Job
# (../authz), which also reads the migrator Secret below; its pgroles policy
# (../authz/policies/product.yaml) owns the grants; CNPG keeps the runtime
# login and the Database. Conventions: docs/databases/authorization.md.
#
# product is also the cluster's bootstrap database: bootstrap.initdb
# (instance.yaml) creates database `product` owned by role `product` from
# product-db-secret. That role is bootstrap-only now: NOLOGIN, no pg_hba line,
# and the Database CR below hands the database to product_owner. The
# DatabaseRole and bootstrap.initdb.secret keep pointing at the SAME Secret, or
# two sources for one password would fight.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: product-db-product-runtime-secret
  namespace: product
  labels:
    app.kubernetes.io/name: product-db-product-runtime-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: product-db-product-runtime-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/name: product-db-product-runtime-secret
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/local/databases/product-db/product-runtime
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/local/databases/product-db/product-runtime
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: product-db-product-migrator-secret
  namespace: product
  labels:
    app.kubernetes.io/name: product-db-product-migrator-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: product-db-product-migrator-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/name: product-db-product-migrator-secret
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/local/databases/product-db/product-migrator
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/local/databases/product-db/product-migrator
        property: password
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: product-db-role-product-runtime
  namespace: product
spec:
  cluster:
    name: product-db
  name: product_runtime
  comment: "product: the service; CRUD only"
  login: true
  superuser: false
  createdb: false
  createrole: false
  inherit: true
  replication: false
  bypassrls: false
  connectionLimit: -1
  inRoles: []
  passwordSecret:
    name: product-db-product-runtime-secret
  databaseRoleReclaimPolicy: retain
---
# product-db-secret: bootstrap.initdb's owner credential (instance.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: product-db-secret
  namespace: product
  labels:
    app.kubernetes.io/name: product-db-secret
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: product-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          app.kubernetes.io/name: product-db-secret
          app.kubernetes.io/component: database
          app.kubernetes.io/managed-by: external-secrets
          cnpg.io/reload: "true"
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/local/databases/product-db/product
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/local/databases/product-db/product
        property: password
---
# Written out IN FULL — adoption resets omitted attributes (see payment.yaml).
# Adopts the role initdb created and keeps it unable to log in: it owns nothing
# once the Database CR moves the database to product_owner.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: product-db-role-product
  namespace: product
spec:
  cluster:
    name: product-db
  name: product
  comment: "Bootstrap owner of the initdb database only; never logs in (RFC-0029)"
  login: false
  superuser: false
  createdb: false
  createrole: false
  inherit: true
  replication: false
  bypassrls: false
  connectionLimit: -1
  inRoles: []
  passwordSecret:
    name: product-db-secret
  databaseRoleReclaimPolicy: retain
---
# product_owner owns the database, which on PostgreSQL 15+ is what gives it
# CREATE on the public schema. CNPG retries until the catalog Job creates it,
# then reassigns the initdb-created database from the bootstrap role.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: product-database
  namespace: product
spec:
  name: product
  owner: product_owner
  cluster:
    name: product-db
  extensions:
    - name: pgaudit
    - name: pg_stat_statements
    # auto_explain is a preload-only module (loaded via shared_preload_libraries in
    # instance.yaml) — it has no SQL extension / control file, so `CREATE EXTENSION
    # auto_explain` always fails "extension is not available". Not listed here.
    - name: pgcrypto
    - name: uuid-ossp
    # pg_stat_ch's SQL surface (pg_stat_ch_stats() and friends) lives in ONE
    # database per cluster: the hooks capture every database from the preload,
    # and the stats read shared memory, so the exporter's pg_stat_ch custom
    # query targets this database only.
    - name: pg_stat_ch
  databaseReclaimPolicy: retain
