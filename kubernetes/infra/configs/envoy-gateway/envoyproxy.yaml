# EnvoyProxy — data-plane shape for the `platform` GatewayClass (RFC-0024 P2).
# Configures the managed Envoy fleet in one place:
#   replicas 2 + PDB minAvailable 1   -- HA sizing for a stateless edge proxy
#   resources                         -- CPU/memory requests and limits
#   NodePort 30080/30443              -- fixed node ports for the Kind cluster
#   JSON access log to stdout         -- structured request logging
#   OTLP tracing, 50% sampling        -- distributed tracing export
#   Prometheus metrics endpoint       -- proxy fleet metrics scrape target
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: platform
  namespace: envoy-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        # Two replicas for HA: a stateless edge proxy that scales
        # horizontally; the PDB below keeps one pod serving during voluntary
        # disruptions.
        replicas: 2
        pod:
          labels:
            # LOAD-BEARING (ADR-060). Vector's kubernetes_logs source excludes
            # this selector -- extra_label_selector:
            # "platform.duynhlab.dev/otlp-logs!=true" in
            # controllers/logging/vector/vector.yaml. Since the accessLog below
            # now ALSO ships over OTLP, without this label VictoriaLogs would
            # hold every edge line twice: once from Vector tailing stdout, once
            # from the collector. Vector stops TAILING; stdout keeps being
            # WRITTEN, so `kubectl logs` on the edge pod is unaffected -- which
            # is the whole reason the File sink stays.
            platform.duynhlab.dev/otlp-logs: "true"
        container:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
      envoyPDB:
        minAvailable: 1
      envoyService:
        # NodePort for the Kind extraPortMappings — no LoadBalancer here.
        type: NodePort
        # Pin the nodePorts the Kind config forwards (30080/30443). This
        # Service is their sole owner.
        # A pinned nodePort is an exclusive claim: if any other Service in the
        # cluster already holds 30080 or 30443, the API server rejects the
        # allocation and this Kustomization stays not-ready until the port is
        # free. The symptom is a reconciliation failure, not a traffic failure.
        # Strategic merge key for Service.spec.ports is `port`; the live
        # merge behavior of this patch gets verified on the P0/Kind spike.
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  protocol: TCP
                  nodePort: 30080
                - port: 443
                  protocol: TCP
                  nodePort: 30443
  telemetry:
    # Prometheus metrics endpoint on the proxy fleet (enabled by default; the
    # empty block records intent). envoy_* scrape objects + rules + dashboards
    # land with the P4 telemetry train — this only guarantees the endpoint.
    metrics:
      prometheus: {}
    accessLog:
      # NOTE (ADR-061): these access logs are ClickHouse-only downstream — the
      # collector's logs/victorialogs pipeline filters them out, and Envoy
      # *runtime* logs are collected into VictoriaLogs by a dedicated Vector
      # source instead. spec.logging below pins the runtime level now that
      # those lines are actually stored.
      settings:
        # Structured JSON access log to stdout — Vector's DaemonSet tails pod
        # stdout to ship these lines. Field names cover the standard request
        # shape (time/client/method/uri/status/...) plus the RFC's extras
        # (response_flags, upstream_cluster, route_name) for edge-level
        # debugging.
        - format:
            type: JSON
            json:
              time: "%START_TIME%"
              client: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
              method: "%REQ(:METHOD)%"
              uri: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              status: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              bytes: "%BYTES_SENT%"
              duration: "%DURATION%"
              # %RESPONSE_DURATION%, not %RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%:
              # Envoy Gateway suppresses x-envoy-* response headers by
              # default, so reading that header renders null on every line
              # (caught in local-stack, where 110/110 access-log lines carried
              # null). The command operator reads the timing directly instead
              # of relying on a response header that is never emitted.
              upstream_time: "%RESPONSE_DURATION%"
              upstream: "%UPSTREAM_HOST%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              route_name: "%ROUTE_NAME%"
              host: "%REQ(:AUTHORITY)%"
              request_id: "%REQ(X-REQUEST-ID)%"
              user_agent: "%REQ(USER-AGENT)%"
          # CEL filter: emit everything EXCEPT successful probe traffic
          # (health/readiness paths or kube-probe user agents answered 2xx) —
          # closes observability audit F-2's biggest log volume at source.
          # Conservative expression: failures on probe paths still log.
          matches:
            - "!((request.url_path.startsWith('/health') || request.url_path.startsWith('/ready') || request.useragent.startsWith('kube-probe')) && response.code >= 200u && response.code < 300u)"
          sinks:
            # Two destinations, ONE format and ONE CEL filter: both sinks live in
            # the same settings[] entry, so stdout and OTLP describe the same
            # request set in the same shape. Splitting them into two entries
            # would let the two roads drift.
            - type: File
              file:
                path: /dev/stdout
            # ADR-060: puts edge logs on the same road as application logs, so
            # they reach VictoriaLogs *and* ClickHouse -- the 90-day store where
            # a SQL join against otel_traces on trace_id becomes possible. No
            # new component: this is the collector's existing OTLP receiver, the
            # same one the tracing provider below already uses on :4317.
            - type: OpenTelemetry
              openTelemetry:
                # backendRefs, not host/port: both are marked "Deprecated: Use
                # BackendRefs instead" in the EnvoyProxy CRD shipped with
                # gateway-helm v1.9.0 (verified with `kubectl explain`). ADR-060
                # names the host:port literal; this is the same destination
                # expressed the way the installed API wants it.
                backendRefs:
                  - name: otel-collector-opentelemetry-collector
                    namespace: monitoring
                    port: 4317
                # resourceAttributes, not the deprecated `resources`.
                # service.name is REQUIRED, not decoration: the collector
                # exports logs with `VL-Stream-Fields: "service.name"`, so
                # without it the edge's log-stream identity in VictoriaLogs is
                # empty. The value matches the service.name Envoy Gateway
                # derives for its TRACES (<gateway>.<namespace>), so an edge log
                # and an edge span carry the same identity.
                resourceAttributes:
                  service.name: platform.envoy-gateway
    tracing:
      # PERCENT (0-100), not a ratio: 50 means 50% of traces are sampled.
      #
      # Envoy's default sampler is ParentBased, so an inbound sampled
      # traceparent is always honored — the fleet's sampling model stays
      # consistent end-to-end (RFC-0024 research F-7). Because the edge creates
      # the root span for every proxied request, THIS number governs the whole
      # trace: services wrap their own ratio in ParentBased and honour the root's
      # decision, so their OTEL_SAMPLE_RATE only applies where a service is
      # itself the root.
      #
      # Why 50 (2026-08-31). The previous 10 was never reasoned about — RFC-0024
      # copied it from Kong's tracing_sampling_rate: 0.1 and said so, "a number
      # copy, not a redesign". On a platform built to be studied, a trace that
      # was never sampled is a question that can no longer be answered, and that
      # costs more here than the bytes do. 50 keeps half of production traffic
      # answerable while still halving volume against full sampling. It is not a
      # cost-optimised number and does not pretend to be: a real production
      # cluster at this rate wants the storage math done first, and nothing in
      # this repo has written that down for either the ClickHouse 10Gi/90d or the
      # VictoriaTraces 10Gi/7d volume.
      #
      # This value is currently effective NOWHERE: the LOCAL cluster overrides it
      # to 100 via clusters/local/envoy-gateway-config.yaml, and
      # clusters/production/ is still a stub. It is the number a future prod
      # cluster inherits.
      samplingRate: 50
      provider:
        type: OpenTelemetry
        # EG's tracing provider speaks OTLP gRPC, so the collector is reached
        # on :4317 (not the :4318 HTTP port).
        backendRefs:
          - name: otel-collector-opentelemetry-collector
            namespace: monitoring
            port: 4317
      customTags:
        # Pod identity on every edge span, so a span can be traced back to
        # the exact proxy pod that handled it.
        k8s.pod.name:
          type: Environment
          environment:
            name: ENVOY_POD_NAME
            defaultValue: "-"
        k8s.namespace.name:
          type: Environment
          environment:
            name: ENVOY_POD_NAMESPACE
            defaultValue: "envoy-gateway"
  # ADR-061: pin the proxy runtime-log level explicitly. Unset, stdout carried
  # [debug] lines; now that runtime lines are collected into VictoriaLogs (the
  # dedicated Vector source), the volume is bounded at the source. warn is the
  # documented ProxyLogging default — pinned so a future default change cannot
  # silently flood the store.
  logging:
    level:
      default: warn
