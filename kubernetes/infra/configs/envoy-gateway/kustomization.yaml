# Envoy Gateway edge configuration (RFC-0024 P2). Reconciled by
# envoy-gateway-config-local (clusters/local/envoy-gateway-config.yaml),
# which also carries the LOCAL-only patches (homelab-ca issuer, 100% trace
# sampling).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gatewayclass.yaml
  - envoyproxy.yaml
  - certificate.yaml
  - gateway.yaml
  # Routes — one HTTPRoute per exposed host (+ the new keycloak surface)
  - routes/api.yaml
  - routes/monitoring.yaml
  - routes/infra.yaml
  # - routes/mcp.yaml    # DISABLED with mcp-local (2026-08-21): the backends are
  #   gone, so these HTTPRoutes would resolve and then 503.
  - routes/frontend.yaml
  - routes/backoffice.yaml
  - routes/temporal.yaml
  - routes/keycloak.yaml
  # Policies — CORS, JWT, CIDR, and traffic-management policies
  - policies/security-cors.yaml
  - policies/security-jwt.yaml
  - policies/security-admin-cidr.yaml
  - policies/btp-api.yaml
  - policies/btp-admin.yaml
