# Envoy Gateway edge configuration (RFC-0024 P2) — the Gateway API
# translation of configs/kong/. Reconciled by envoy-gateway-config-local
# (clusters/local/envoy-gateway-config.yaml), which also carries the
# LOCAL-only patches (homelab-ca issuer, 100% trace sampling).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gatewayclass.yaml
  - envoyproxy.yaml
  - certificate.yaml
  - gateway.yaml
  # Routes — every Kong Ingress translated 1:1 (+ the new keycloak surface)
  - routes/api.yaml
  - routes/monitoring.yaml
  - routes/infra.yaml
  - routes/mcp.yaml
  - routes/frontend.yaml
  - routes/temporal.yaml
  - routes/keycloak.yaml
  # Policies — the KongClusterPlugin / KongUpstreamPolicy translations
  - policies/security-cors.yaml
  - policies/security-jwt.yaml
  - policies/security-admin-cidr.yaml
  - policies/btp-api.yaml
  - policies/btp-admin.yaml
