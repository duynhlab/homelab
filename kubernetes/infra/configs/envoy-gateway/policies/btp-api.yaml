# API-route BackendTrafficPolicies — one per API namespace, each setting
# THREE things at once (kubernetes/apps/domains/*-rs.yaml carries the
# per-domain resilience source values):
#
#   1. rateLimit.local sized as per-instance buckets (effective ceiling =
#      configured x replicas — ADR-046 local-first decision): 2/Second
#      (round of 2.5), 50/Minute, 1250/Hour. Envoy applies the STRICTEST
#      matching rule, so all three windows are enforced together.
#      X-RateLimit draft-03 headers enabled per rule (the CORS expose list
#      matches accordingly). No Redis/Valkey at the edge: in-process buckets
#      cannot fail open OR closed.
#   2. requestBuffer 10Mi (413 over the limit).
#   3. retry/timeout/healthCheck (connect-timeout 3s / request-timeout 15s /
#      retries 2, templated per domain in apps/domains/*-rs.yaml).
#
# PLACEMENT NOTE (recorded for review): the resilience settings were
# originally planned as templated BTPs in the apps-layer ResourceSets, and
# the rate limits as a separate btp-api.yaml. Both live HERE and are merged
# because (a) BTP targetRefs attach to HTTPRoutes, which are central in this
# directory — not to Services, so the apps layer has nothing to attach to;
# and (b) Envoy Gateway resolves multiple same-kind policies on one route by
# "oldest wins" — two separate BTPs per route would conflict, not compose.
# This policy is therefore the only resilience config at the edge.
#
# Resilience settings:
#   retry.numRetries 2
#   timeout.tcp.connectTimeout 3s
#   timeout.http.requestTimeout 15s
#   healthCheck.active (HTTP GET /health, healthy successes 2 / unhealthy
#     httpFailures 3 = healthyThreshold 2 / unhealthyThreshold 3;
#     expectedStatuses default 200)
#   healthCheck.passive.consecutive5XxErrors 5 (Envoy outlier detection;
#     remaining knobs keep EG defaults)

---
# user — api-user-public + api-user-private
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: btp-api
  namespace: user
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-user-public
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-user-private
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 2
            unit: Second
          xRateLimitHeaders: DraftVersion03
        - limit:
            requests: 50
            unit: Minute
          xRateLimitHeaders: DraftVersion03
        - limit:
            requests: 1250
            unit: Hour
          xRateLimitHeaders: DraftVersion03
  requestBuffer:
    limit: 10Mi
  retry:
    numRetries: 2
  timeout:
    tcp:
      connectTimeout: 3s
    http:
      requestTimeout: 15s
  healthCheck:
    active:
      type: HTTP
      interval: 5s
      healthyThreshold: 2
      unhealthyThreshold: 3
      http:
        path: /health
    passive:
      consecutive5XxErrors: 5
