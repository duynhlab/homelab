# CORS — applied GLOBALLY, targeting the whole `platform` Gateway so every
# route inherits the same baseline; route-level SecurityPolicies
# (security-jwt.yaml, security-admin-cidr.yaml) declare
# `mergeType: StrategicMerge` so this gateway-level baseline still applies to
# their routes instead of being overridden.
#
# exposeHeaders lists Envoy's local rate limiter response headers,
# X-RateLimit-* (IETF draft-03, enabled per-rule in policies/btp-*.yaml), so
# the SPA can read remaining-quota info (RFC-0024 Design Details -> Rate
# limiting).
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: cors-policy
  namespace: envoy-gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
  cors:
    allowOrigins:
      - "https://local.duynh.me"
      - "https://duynh.me"
      # The operator portal is its own host (routes/backoffice.yaml): its
      # fetches to gateway.duynh.me are cross-origin exactly like the customer
      # SPA's, so the browser needs it listed here or every protected read
      # dies at preflight.
      - "https://backoffice.duynh.me"
      - "http://localhost:3001"
      - "http://localhost:3009"
      - "http://localhost:8000"
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowHeaders:
      - Content-Type
      - Authorization
      - X-Request-ID
      # Checkout confirm (RFC-0015): the SPA sends its idempotency key on the
      # confirm POST — without this the preflight rejects it and the POST is
      # never sent (twin of the local-stack entry).
      - Idempotency-Key
    exposeHeaders:
      - X-Request-ID
      - X-RateLimit-Limit
      - X-RateLimit-Remaining
      - X-RateLimit-Reset
      # Retry-After: the SPA reads it on 429 to show "wait Ns" — not a
      # CORS-safelisted response header, so it must be exposed explicitly.
      - Retry-After
    allowCredentials: true
    maxAge: 1h
