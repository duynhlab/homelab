# Edge JWT — SecurityPolicy remoteJWKS verification against the Keycloak
# realm (RFC-0024 / ADR-045; RFC-0022 is the identity design record).
# Zero provisioned key material: Envoy fetches and refreshes the realm JWKS
# itself, so key rotation needs no edge action.
#
# Targets EXACTLY the seven /private/ API surfaces that require
# authentication: user-private, cart, order, review-private, notification,
# payment-private, checkout. One SecurityPolicy per namespace because
# targetRefs only resolve same-namespace objects.
#
# `mergeType: StrategicMerge` keeps the gateway-level CORS baseline
# (policies/security-cors.yaml) applied to these routes — without it a
# route-level SecurityPolicy would override the gateway policy entirely.
#
# remoteJWKS over PLAIN HTTP (deviation from the RFC's Backend +
# BackendTLSPolicy sketch): Keycloak serves plain HTTP in-cluster
# (KC_HTTP_ENABLED=true, controllers/keycloak/service.yaml), so the JWKS URI
# points at the Service directly and no Backend/BackendTLSPolicy is needed.
# Revisit when internal TLS lands (RFC-0020/RFC-0006 territory).
#
# Preflight handling: Envoy's CORS filter answers OPTIONS preflights before
# JWT auth runs, so a preflight is never rejected for lacking a token.
#
# Services STILL verify tokens (pkg/authmw, fail-closed, authoritative) —
# the edge is the coarse filter (ADR-006 principle).

---
# user — api-user-private
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: jwt-edge
  namespace: user
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-user-private
  jwt:
    providers:
      - name: keycloak
        issuer: https://id.duynh.me/realms/duynhlab
        remoteJWKS:
          uri: http://keycloak.identity.svc.cluster.local:8080/realms/duynhlab/protocol/openid-connect/certs
---
# product — api-product-protected (RFC-0023 slice B). STAFF issuer (ADR-050):
# the operator's catalog writes trust the workforce realm; customer tokens are
# wrong-issuer at the edge.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: jwt-edge-staff
  namespace: product
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-product-protected
  jwt:
    providers:
      - name: keycloak-staff
        issuer: https://id.duynh.me/realms/duynhlab-staff
        remoteJWKS:
          uri: http://keycloak.identity.svc.cluster.local:8080/realms/duynhlab-staff/protocol/openid-connect/certs
---
