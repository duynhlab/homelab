# API routes on the public gateway (gateway.duynh.me) — one HTTPRoute per
# exposed service (12 routes total).
#
# URL shape: /{service}/v1/{audience}/{resource...} — Variant A
# (docs/api/api.md#http-url-model). Pure pass-through, no rewrite (Gateway
# API's default behavior). Only `public` and `private` audiences are
# exposed; `internal` routes stay in-cluster only.
#
# Each HTTPRoute lives in its backend's namespace and attaches to the shared
# `platform` Gateway (https listener; the http listener only serves the 301
# redirect).
#
# PathPrefix is SEGMENT-based, so `/user/v1/private` matches
# `/user/v1/private` and `/user/v1/private/...` but never
# `/user/v1/privatefoo`.
#
# EDGE AUTH (ADR-006 principle, re-homed by ADR-045): routes that require
# authentication get a SecurityPolicy with a Keycloak remoteJWKS provider —
# see policies/security-jwt.yaml. Services STILL validate JWTs (pkg/authmw,
# authoritative) — defense-in-depth.
#
# security-headers: every route carries a ResponseHeaderModifier filter that
# sets a baseline set of response headers. Gateway API `set` always wins —
# the edge value is guaranteed regardless of what the upstream sends.
#
# Rate/size limits + resilience: policies/btp-api.yaml.

---
# User Service — public GET /users/:id: anonymous. Translates api-user-public.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-user-public
  namespace: user
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - gateway.duynh.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /user/v1/public
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: X-Frame-Options
                value: DENY
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
            remove:
              - Server
      backendRefs:
        - name: user
          port: 8080
---
# User Service — private /users/profile: edge JWT (policies/security-jwt.yaml).
# Translates api-user-private (had jwt-edge).
apiVersion: gateway.networking.k8s.io/v1
