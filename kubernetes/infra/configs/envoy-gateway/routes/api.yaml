# API routes on the public gateway (gateway.duynh.me) — 1:1 translation of
# configs/kong/ingress-api.yaml (13 Ingresses -> 13 HTTPRoutes).
#
# URL shape: /{service}/v1/{audience}/{resource...} — Variant A
# (docs/api/api.md#http-url-model). Pure pass-through, no rewrite (Kong
# `strip-path: false` == Gateway API default). Only `public` and `private`
# audiences are exposed; `internal` routes stay in-cluster only.
#
# Each HTTPRoute lives in its backend's namespace and attaches to the shared
# `platform` Gateway (https listener; the http listener only serves the 301
# redirect — Kong's `protocols: https` + redirect annotations).
#
# PathPrefix values drop Kong's trailing slash: Gateway API PathPrefix is
# SEGMENT-based, so `/user/v1/private` matches `/user/v1/private` and
# `/user/v1/private/...` but never `/user/v1/privatefoo` — same match set as
# Kong's Ingress Prefix `/user/v1/private/`.
#
# EDGE AUTH (ADR-006 principle, re-homed by ADR-045): routes that carried the
# `jwt-edge` plugin get a SecurityPolicy with a Keycloak remoteJWKS provider —
# see policies/security-jwt.yaml. Services STILL validate JWTs (pkg/authmw,
# authoritative) — defense-in-depth.
#
# security-headers: every route carries a ResponseHeaderModifier filter
# translating the GLOBAL Kong `security-headers` response-transformer plugin
# (plugins.yaml). Semantic note: Kong's `add` set a header only if the
# upstream did not send it; Gateway API `set` always wins — the edge value is
# now guaranteed (upstream can no longer weaken these headers).
#
# Rate/size limits + resilience: policies/btp-api.yaml (translates
# rate-limiting-api, request-size-limiting-api, and the resilience-default
# KongUpstreamPolicy + konghq.com Service annotations).

---
# Auth Service — public (login, register, refresh, logout, jwks): anonymous.
# KEPT during P2/P3/P4: auth-service still serves login until the P3 identity
# cutover; this route is removed in P5 with the auth-service decommission.
# Translates Ingress api-auth-public.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-auth-public
  namespace: auth
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - gateway.duynh.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth/v1/public
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: X-Frame-Options
                value: DENY
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
            remove:
              - Server
      backendRefs:
        - name: auth
          port: 8080
