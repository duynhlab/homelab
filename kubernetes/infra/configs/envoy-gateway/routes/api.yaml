# Payment webhooks — public, anonymous: the HMAC signature over the raw body
# is the credential (mockpay signs, payment verifies). Rate/size limits still
# apply (btp-api.yaml). Translates api-payment-webhooks — both paths in one
# route, matching the Kong Ingress's two path entries.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-payment-webhooks
  namespace: payment
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - gateway.duynh.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /payment/v1/public/payments/webhooks
        # Deprecated pre-v3 path — kept during the v3 rollout so in-flight
        # mockpay retries keep landing. Remove at contract (ADR-017).
        - path:
            type: PathPrefix
            value: /payment/v1/public/webhooks
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: X-Frame-Options
                value: DENY
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
            remove:
              - Server
      backendRefs:
        - name: payment
          port: 8080
