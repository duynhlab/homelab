# Infrastructure routes — one HTTPRoute per admin surface (3 routes total).
# Each carries:
#   - CIDR fence       -> policies/security-admin-cidr.yaml
#   - admin rate limit -> policies/btp-admin.yaml
# security-headers filter: see routes/api.yaml header note.
---
# Flux Web UI — ui.duynh.me (translates Ingress flux-ui)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-ui
  namespace: flux-system
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - ui.duynh.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: X-Frame-Options
                value: DENY
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
            remove:
              - Server
      backendRefs:
        - name: flux-operator
          port: 9080
---
