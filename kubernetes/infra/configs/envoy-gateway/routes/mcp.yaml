# MCP server routes — one HTTPRoute per MCP server (3 routes total). Used by
# AI clients (Crush, Claude Desktop, VS Code) via Streamable HTTP. Each
# carries:
#   - CIDR fence       -> policies/security-admin-cidr.yaml
#   - admin rate limit -> policies/btp-admin.yaml
# security-headers filter: see routes/api.yaml header note.
---
# VictoriaMetrics MCP — vm-mcp.duynh.me (translates Ingress victoria-metrics-mcp)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-metrics-mcp
  namespace: monitoring
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - vm-mcp.duynh.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: X-Frame-Options
                value: DENY
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
            remove:
              - Server
      backendRefs:
        - name: victoria-metrics-mcp-vmm
          port: 8080
---
