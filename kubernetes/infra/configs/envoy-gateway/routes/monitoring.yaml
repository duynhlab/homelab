# Monitoring routes — one HTTPRoute per admin surface (10 routes total, all
# in the monitoring namespace).
# Each admin surface keeps its dedicated *.duynh.me host, reachable via
# /etc/hosts -> the edge NodePorts.
#
# Each surface carries:
#   - CIDR fence      -> policies/security-admin-cidr.yaml (SecurityPolicy)
#   - admin rate limit-> policies/btp-admin.yaml (BackendTrafficPolicy)
# The security-headers ResponseHeaderModifier sets a baseline set of response
# headers (see routes/api.yaml header for the `set`-semantics note).
---
# Grafana — grafana.duynh.me (translates Ingress grafana)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - grafana.duynh.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: X-Frame-Options
                value: DENY
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
            remove:
              - Server
      backendRefs:
        - name: grafana-service
          port: 3000
