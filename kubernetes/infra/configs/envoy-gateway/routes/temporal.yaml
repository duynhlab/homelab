# Temporal Web UI — temporal.duynh.me. Translates
# configs/temporal/ingress.yaml (Ingress temporal-ui). The official chart
# exposes the UI as the `temporal-web` Service on :8080 (ADR-030 revision).
# This route deliberately gets no admin CIDR SecurityPolicy and no admin BTP
# either — the Temporal UI needs no IP restriction or rate limiting.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal-ui
  namespace: temporal
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - temporal.duynh.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Content-Type-Options
                value: nosniff
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - name: X-Frame-Options
                value: DENY
              - name: Strict-Transport-Security
                value: "max-age=31536000; includeSubDomains"
            remove:
              - Server
      backendRefs:
        - name: temporal-web
          port: 8080
