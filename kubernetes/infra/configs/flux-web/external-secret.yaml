# The Flux Operator web UI's Web Config API document, rendered as a Secret —
# the operator reads it via --web-config-secret-name (terraform/main.tf sets
# web.configSecretName). The only secret material is the flux-web client
# secret, pulled from the SAME OpenBAO path the openbao-bootstrap Job seeds
# and the Keycloak realm import consumes (ADR-062 decision rule: no secret
# literal in git); everything else is plain config carried in the template.
#
# issuerURL is the PUBLIC issuer through the edge: Keycloak advertises
# id.duynh.me endpoints (KC_HOSTNAME), and OIDC libraries reject an issuer
# mismatch, so an in-cluster http URL cannot be used. Reaching it from the pod
# relies on the CoreDNS hairpin (ADR-062) and the flux-web-idp-trust CA
# (certificate.yaml + SSL_CERT_FILE).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-web-config
  namespace: flux-system
  labels:
    app.kubernetes.io/name: flux-web-config
    app.kubernetes.io/component: gitops
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: flux-web-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: flux-web-config
          app.kubernetes.io/component: gitops
          app.kubernetes.io/managed-by: external-secrets
      data:
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://ui.duynh.me
            authentication:
              type: OAuth2
              sessionDuration: 24h
              oauth2:
                provider: OIDC
                clientID: flux-web
                clientSecret: "{{ .flux_web_client_secret }}"
                issuerURL: https://id.duynh.me/realms/duynhlab-staff
                # Explicit scopes, trimmed from the operator's default set for
                # two reasons, both observed as login failures against this
                # Keycloak client:
                #   - `groups` is NOT a client scope (it is a protocol mapper
                #     on the client), so requesting it makes Keycloak reject
                #     the whole auth request (KC-SERVICES0093 "Invalid
                #     scopes"). The groups CLAIM still reaches the ID token via
                #     the client's group-membership mapper regardless of scope,
                #     so impersonation.groups below still resolves.
                #   - `offline_access` makes the code→token exchange fail with
                #     "Offline tokens not allowed" (CODE_TO_TOKEN_ERROR
                #     not_allowed) — the client is not permitted offline
                #     tokens, and the UI does not need them: sessionDuration
                #     above governs the session.
                # Same trim Grafana runs; the groups claim path is identical.
                scopes:
                  - openid
                  - profile
                  - email
                impersonation:
                  # Kubernetes username/groups the UI impersonates — RBAC in
                  # rbac.yaml binds the Keycloak group names directly, the
                  # same taxonomy every ADR-062 tool reads.
                  username: "claims.preferred_username"
                  groups: "claims.groups"
  data:
    - secretKey: flux_web_client_secret
      remoteRef:
        key: secret/data/local/infra/keycloak/oidc-clients
        property: flux_web_client_secret
