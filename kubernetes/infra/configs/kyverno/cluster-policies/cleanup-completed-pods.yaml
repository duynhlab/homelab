# Cleanup completed and evicted Pods older than 24h.
# Reduces metric cardinality and noise in `kubectl get pods`.
#
# policies.kyverno.io/v1 DeletingPolicy since 2026-09-30 (ADR-078 step 4); the
# legacy kyverno.io/v2 ClusterCleanupPolicy is removed in Kyverno 1.20. Same
# behaviour: every 30 minutes, Pods in phase Succeeded or Failed that are older
# than 24h, outside kube-system, flux-system and kyverno. Age uses the Kyverno
# CEL time library (`time.now()`). The cleanup controller's delete permission
# comes from cleanup-controller-rbac.yaml (aggregated ClusterRole), unchanged.
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: cleanup-completed-pods
  annotations:
    policies.kyverno.io/title: Cleanup completed/evicted Pods
    policies.kyverno.io/category: Cleanup
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
spec:
  schedule: "*/30 * * * *"
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: ["*"]
        resources: [pods]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, flux-system, kyverno]
  conditions:
    - name: finished
      expression: "object.status.?phase.orValue('') in ['Succeeded', 'Failed']"
    - name: older-than-24h
      expression: "time.now() - timestamp(object.metadata.creationTimestamp) > duration('24h')"
