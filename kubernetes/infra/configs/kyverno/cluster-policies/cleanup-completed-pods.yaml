# Cleanup completed and evicted Pods older than 24h.
# Reduces metric cardinality and noise in `kubectl get pods`.
apiVersion: kyverno.io/v2
kind: ClusterCleanupPolicy
metadata:
  name: cleanup-completed-pods
  annotations:
    policies.kyverno.io/title: Cleanup completed/evicted Pods
    policies.kyverno.io/category: Cleanup
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Pod
spec:
  match:
    any:
      - resources:
          kinds: [Pod]
  exclude:
    any:
      - resources:
          namespaces:
            - kube-system
            - flux-system
            - kyverno
  conditions:
    all:
      - key: "{{ target.status.phase }}"
        operator: AnyIn
        value: [Succeeded, Failed]
      # Age gate — without it every completed migration/backup Job pod was
      # deleted at the next 30-minute tick, despite this file's own ">24h"
      # header. time_diff returns a duration; both sides parse as durations.
      - key: "{{ time_diff('{{ target.metadata.creationTimestamp }}','{{ time_now_utc() }}') }}"
        operator: GreaterThan
        value: "24h"
  schedule: "*/30 * * * *"
