# Generate a default deny-all-ingress NetworkPolicy into every app-tier namespace.
# Explicit allow policies live in kubernetes/infra/configs/network-policies/.
# NOTE: kindnet DOES enforce NetworkPolicy on Kind K8s 1.30+ (verified on 1.34.3 and 1.35.8) —
# the generated deny-all is LIVE, so every app-tier namespace needs a matching
# allow policy that exposes its operator + intra-ns + cross-ns dependencies (see
# network-policies/). generateExisting backfills namespaces that already exist;
# synchronize keeps the generated policy in sync.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: default-deny-networkpolicy
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/title: Default deny-ingress NetworkPolicy
    policies.kyverno.io/category: Multi-Tenancy, Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace, NetworkPolicy
    policies.kyverno.io/description: >-
      Generates a default `deny-all-ingress` NetworkPolicy into every namespace
      labelled `platform.duynhlab.dev/tier: app`, so each app namespace denies
      ingress by default. Explicit allow policies are managed separately under
      kubernetes/infra/configs/network-policies/.
spec:
  generateExisting: true
  rules:
    - name: generate-deny-all-ingress
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  platform.duynhlab.dev/tier: app
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: deny-all-ingress
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        # Keep the generated NetworkPolicies when this rule/policy is deleted.
        # Without it, removing this legacy policy (ADR-078 step 4 replaces it
        # with a GeneratingPolicy) deletes every deny-all-ingress it created:
        # measured on Kind 2026-09-30, 9 app namespaces had NO default-deny for
        # ~6 s until the new generator re-created them. This flag must be live
        # on the cluster BEFORE the swap, which is why it ships on its own.
        orphanDownstreamOnPolicyDelete: true
        data:
          spec:
            podSelector: {}
            policyTypes:
              - Ingress
