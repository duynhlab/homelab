# Generate a default deny-all-ingress NetworkPolicy into every app-tier namespace.
# Explicit allow policies live in kubernetes/infra/configs/network-policies/.
# NOTE: kindnet DOES enforce NetworkPolicy on Kind K8s 1.30+ (verified on 1.34.3 and 1.35.8) —
# the generated deny-all is LIVE, so every app-tier namespace needs a matching
# allow policy that exposes its operator + intra-ns + cross-ns dependencies (see
# network-policies/).
#
# policies.kyverno.io/v1 GeneratingPolicy since 2026-09-30 (ADR-078 step 4); the
# legacy kyverno.io/v1 ClusterPolicy is removed in Kyverno 1.20.
#
# SOLE OWNER of `deny-all-ingress` in every namespace labelled
# `platform.duynhlab.dev/tier: app`. Until this step the same objects were ALSO
# shipped as static manifests in network-policies/ (both added in one commit,
# 2026-05-30), so Flux and Kyverno fought over one object. The static copies are
# gone, and `make validate` refuses a deny-all-ingress manifest for an app-tier
# namespace so a second owner cannot come back. `identity` is not app-tier, so
# its deny-all stays a static manifest owned by Flux.
#
# - CREATE and UPDATE: a namespace labelled after creation is covered too.
# - synchronize: an edited or deleted deny-all-ingress is put back.
# - generateExisting: the namespaces that already exist are covered at once.
# - orphanDownstreamOnPolicyDelete: deleting or replacing THIS policy leaves the
#   generated NetworkPolicies in place instead of deleting them — a generator
#   swap must never open ingress.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: default-deny-networkpolicy
  annotations:
    policies.kyverno.io/title: Default deny-ingress NetworkPolicy
    policies.kyverno.io/category: Multi-Tenancy, Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Namespace, NetworkPolicy
    policies.kyverno.io/description: >-
      Generates a default `deny-all-ingress` NetworkPolicy into every namespace
      labelled `platform.duynhlab.dev/tier: app`, so each app namespace denies
      ingress by default. Explicit allow policies are managed separately under
      kubernetes/infra/configs/network-policies/.
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: true
    orphanDownstreamOnPolicyDelete:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: app-tier
      expression: "object.metadata.?labels[?'platform.duynhlab.dev/tier'].orValue('') == 'app'"
  variables:
    - name: nsName
      expression: object.metadata.name
    - name: denyAll
      expression: >-
        [
          {
            "apiVersion": dyn("networking.k8s.io/v1"),
            "kind": dyn("NetworkPolicy"),
            "metadata": dyn({
              "name": "deny-all-ingress",
              "namespace": string(variables.nsName)
            }),
            "spec": dyn({
              "podSelector": dyn({}),
              "policyTypes": dyn(["Ingress"])
            })
          }
        ]
  generate:
    - expression: generator.Apply(variables.nsName, variables.denyAll)
