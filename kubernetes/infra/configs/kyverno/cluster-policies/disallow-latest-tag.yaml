# Disallow `:latest` and unpinned image tags.
# Mode: Audit on local; flip to Enforce in production.
# Aligns with shared-workflows that build SHA-tagged images.
#
# policies.kyverno.io/v1 ValidatingPolicy since 2026-09-30 (ADR-078 step 2);
# the legacy kyverno.io/v1 ClusterPolicy is removed in Kyverno 1.20. The three
# legacy rules are three `validations`, each keeping its message, and behaviour
# is unchanged: Pods in every namespace but kube-system, flux-system and
# kyverno; Audit; background on; autogen at its default (on), as the legacy
# policy had it, so controllers are reported too. Reports now carry one result
# per resource (per policy) instead of one per rule; the message says which
# check failed.
#
# - Tag present: the image contains ':' — the same test as the legacy `*:*`
#   pattern, kept as-is including its known looseness (a registry port such as
#   `host:5000/img` also contains ':'). Tightening it is a separate change.
# - No `:latest` in containers, initContainers or ephemeralContainers.
# - ADR-077: a Pod can mount an OCI image as a VOLUME, and the two checks above
#   only look at containers -- a `volumes[].image.reference` could say `:latest`
#   or float on a tag unseen. An image volume is data the kubelet pulls, so it is
#   pinned harder than a container: the reference must carry a digest.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest tag
    policies.kyverno.io/category: Best Practices, Supply Chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Container images must specify an explicit tag and not use `:latest`, and
      image volumes must be pinned by digest. Untagged or floating tags break
      GitOps immutability guarantees.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, flux-system, kyverno]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - message: "Image tag is required (e.g. ':v1.2.3' or ':sha-abc123')."
      expression: "variables.containers.all(c, c.image.contains(':'))"
    - message: "Image tag ':latest' is not allowed; pin to an immutable tag."
      expression: "variables.containers.all(c, !c.image.endsWith(':latest'))"
    - message: "Image volumes must be pinned by digest (reference: <image>:<tag>@sha256:<digest>)."
      expression: >-
        !has(object.spec.volumes) ||
        object.spec.volumes.all(v, !has(v.image) || (has(v.image.reference) && v.image.reference.contains('@sha256:')))
