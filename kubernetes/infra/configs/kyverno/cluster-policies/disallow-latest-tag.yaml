# Disallow `:latest` and unpinned image tags.
# Mode: Audit on local; flip to Enforce in production.
# Aligns with shared-workflows that build SHA-tagged images.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest tag
    policies.kyverno.io/category: Best Practices, Supply Chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Container images must specify an explicit tag and not use `:latest`.
      Untagged or floating tags break GitOps immutability guarantees.
spec:
  validationFailureAction: Audit
  background: true
  failurePolicy: Ignore
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
                - kyverno
      validate:
        message: "Image tag is required (e.g. ':v1.2.3' or ':sha-abc123')."
        pattern:
          spec:
            containers:
              - image: "*:*"
            =(initContainers):
              - image: "*:*"
            =(ephemeralContainers):
              - image: "*:*"
    - name: forbid-latest-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
                - kyverno
      validate:
        message: "Image tag ':latest' is not allowed; pin to an immutable tag."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
            =(initContainers):
              - image: "!*:latest"
            =(ephemeralContainers):
              - image: "!*:latest"
    # ADR-077: a Pod can mount an OCI image as a VOLUME, and the two rules above
    # only look at containers -- a `volumes[].image.reference` could say `:latest`
    # or float on a tag unseen. An image volume is data the kubelet pulls, so it is
    # pinned harder than a container: the reference must carry a digest.
    - name: require-image-volume-digest
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
                - kyverno
      validate:
        message: "Image volumes must be pinned by digest (reference: <image>:<tag>@sha256:<digest>)."
        pattern:
          spec:
            =(volumes):
              - =(image):
                  reference: "*@sha256:*"
