# RE-ENABLING (ADR-078, 2026-09-30): do NOT uncomment the legacy ClusterPolicy
# below — Kyverno 1.20 no longer loads kyverno.io/v1. Vendor the CEL set
# kyverno/policies pod-security-vpol/restricted the way cluster-policies/
# pss-baseline/ vendors the baseline set, scoped to the app namespaces.
# Pod Security Standard — restricted profile (app namespaces only)
#
# DISABLED 2026-08-17. The whole policy is commented out below, verbatim, as
# the record of what ran (see RE-ENABLING above: it is not revivable as-is).
#
# WHY
# The Kind audit ran this policy against a real cluster for the first time and
# it reported all four restricted requirements missing on all ten services. Of
# the four, three are a manifest change and were cheap. The fourth,
# runAsNonRoot, is not available to this platform yet: the service images
# declare no non-root USER and their binary is not world-executable, so a pod
# pinned to a non-root uid dies at exec with "permission denied" and the
# service CrashLoopBackOffs — measured, not predicted. Two further gaps: the
# migrate initContainer had no securityContext hook in the mop chart (since the
# move to the duynh chart it is declared in the domain ResourceSets, so that one
# is now a manifest change here), and the pgdog chart exposes none.
#
# So the policy could only ever report a violation nobody could act on from
# here. It ran in Audit, so it blocked nothing — it produced 63 standing
# findings that trained readers to ignore the report, which is worse than not
# running it.
#
# RE-ENABLE WHEN
#   1. the service images ship a non-root USER with an executable binary
#      (Dockerfile change in the service repos / wolfi-images), AND
#   2. the migrate initContainer in the domain ResourceSets
#      (kubernetes/apps/domains/) carries the same securityContext.
# Then uncomment this file and its entry in kustomization.yaml, keep it in
# Audit until the reports are clean, and only then consider Enforce.
#
# NOTE: the PSS baseline (cluster-policies/pss-baseline/) is untouched and still runs. This disables the stricter
# profile only.
#
