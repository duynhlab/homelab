# Require liveness + readiness probes on app containers.
# Sloth SLO accuracy depends on the edge gateway only routing to ready Pods.
#
# policies.kyverno.io/v1 ValidatingPolicy since 2026-09-30 (ADR-078): the
# legacy kyverno.io/v1 ClusterPolicy is removed in Kyverno 1.20. Behaviour is
# unchanged — the same ten namespaces, Pods only, Audit, background scan on.
#
# History the CEL form keeps honest:
# - Pods only, autogen OFF (spec.autogen below). A ValidatingPolicy autogens
#   Deployment/ReplicaSet/CronJob/... variants BY DEFAULT, and for this policy
#   that is the same trap the legacy autogen fell into (28 `error` results,
#   2026-08-21): it rewrites the owner-reference matchCondition onto the
#   controller's pod template (`object.spec.jobTemplate.spec.template...`),
#   where it means nothing, and every violation is double-counted. Measured on
#   Kind 2026-09-30 before this was set: 14 Deployment + 12 ReplicaSet results
#   next to the 19 Pod ones.
# - Job-owned Pods are out of scope: they are never behind a Service, so an
#   unready one cannot cause the false-positive SLI errors this policy exists
#   to prevent, and a readinessProbe on a batch pod would never pass. That is
#   the matchCondition below; a Pod with no ownerReferences at all (a bare
#   manifest, `kubectl run`) is still checked.
# - The legacy pattern used a global anchor, `"<(periodSeconds)": 300`, which
#   is a condition, not an assertion: every compliant pod was skipped and the
#   reports showed nothing (fixed 2026-09-29). CEL `has()` asserts presence
#   directly; tests/require-probes pins pass, fail and skip.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require liveness and readiness probes
    policies.kyverno.io/category: Best Practices, Reliability
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Application containers must declare both livenessProbe and readinessProbe.
      Missing readinessProbe causes the edge gateway to route to unready Pods, generating
      false-positive SLI errors in Sloth burn-rate alerts.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [inventory, user, product, cart, order, review, notification, shipping, payment, checkout]
  matchConditions:
    - name: not-job-owned
      expression: >-
        !has(object.metadata.ownerReferences) ||
        !object.metadata.ownerReferences.exists(o, o.kind == 'Job')
  validations:
    - message: "Containers must declare both livenessProbe and readinessProbe."
      expression: >-
        object.spec.containers.all(c, has(c.livenessProbe) && has(c.readinessProbe))
