# Require CPU/memory requests and a memory limit on app containers.
#
# policies.kyverno.io/v1 ValidatingPolicy since 2026-09-30 (ADR-078): the
# legacy kyverno.io/v1 ClusterPolicy is removed in Kyverno 1.20. Behaviour is
# unchanged — the same ten namespaces, Pods only, Audit, background scan on,
# and the same fields: requests.cpu, requests.memory, limits.memory (a CPU limit
# is deliberately not required; see the CPU-throttling notes in the charts).
# No exception applies: the legacy postgres-operators waiver for this policy
# was inert and was dropped in ADR-078 step 1 (see exceptions/kustomization.yaml);
# CNPG instance pods pass on their own.
# Autogen stays at the ValidatingPolicy default (on), as the legacy policy had
# it: violations are reported on the Deployment/ReplicaSet too, so the owner of
# the manifest sees them, not only the ephemeral pod.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resources
  annotations:
    policies.kyverno.io/title: Require CPU/memory requests and a memory limit
    policies.kyverno.io/category: Best Practices, Reliability
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container in application namespaces must declare CPU and memory
      requests and a memory limit. Prevents noisy-neighbor evictions of stateful
      workloads (databases, monitoring) sharing the node.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [inventory, user, product, cart, order, review, notification, shipping, payment, checkout]
  validations:
    - message: "Containers must declare resources.requests.{cpu,memory} and resources.limits.memory."
      expression: >-
        object.spec.containers.all(c,
          has(c.resources) &&
          has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          has(c.resources.limits) && 'memory' in c.resources.limits)
