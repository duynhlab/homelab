# PolicyException — OpenBAO requires a capability beyond the baseline default:
# IPC_LOCK for mlock, preventing secret material from swapping to disk.
#
# Narrowed from the former kong-openbao exception at the RFC-0024 P2.3 edge
# cutover: Kong (NET_BIND_SERVICE) is decommissioned, and the Envoy Gateway
# data plane needs no exception — its listeners bind high ports (10080/10443
# behind the Service), so it passes pss-baseline as-is.
#
# Owner: platform-team
# Expires: 2026-12-31
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: openbao
  namespace: kyverno
  annotations:
    platform.duynhlab.dev/owner: platform-team
    platform.duynhlab.dev/expires-at: "2026-12-31"
    platform.duynhlab.dev/justification: "OpenBAO needs IPC_LOCK (mlock) so unsealed secrets never swap to disk."
spec:
  exceptions:
    - policyName: pss-baseline
      ruleNames:
        - baseline
        - autogen-baseline
  match:
    any:
      - resources:
          kinds: [Pod]
          namespaces: [openbao]
