# PolicyException — the CloudNativePG operator needs elevated capabilities
# for postgres lifecycle (initdb, base backups, pg_basebackup as postgres uid).
#
# Owner: platform-team
# Expires: 2026-12-31 (track upstream hardening of operator-managed pods)
# Its require-resources half was DROPPED on 2026-09-30 (ADR-078 step 1), not
# migrated: it was inert. Neither selector matches a pod require-resources
# evaluates — `application=cnpg` matches 0 pods on the cluster (CNPG instance
# pods carry cnpg.io/cluster and app.kubernetes.io/managed-by=cloudnative-pg),
# and the operator pod lives in cloudnative-pg, outside the policy's ten
# namespaces. CNPG instance pods pass require-resources on their own (the
# operator sets resources from the Cluster CR). This object now waives only
# the PSS baseline, until that policy moves too.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: postgres-operators
  namespace: kyverno
  annotations:
    platform.duynhlab.dev/owner: platform-team
    platform.duynhlab.dev/expires-at: "2026-12-31"
    platform.duynhlab.dev/justification: "CNPG operator manages postgres pods with operator-defined securityContext."
spec:
  exceptions:
    - policyName: pss-baseline
      ruleNames:
        - baseline
        - autogen-baseline
  match:
    any:
      - resources:
          kinds:
            - Pod
          namespaces:
            # Only namespaces that actually host a CNPG Cluster (platform-db,
            # product-db + DR replica) plus the operator's own namespace.
            - cloudnative-pg
            - platform
            - product
          selector:
            matchExpressions:
              - key: application
                operator: In
                values: [cnpg]
      - resources:
          kinds:
            - Pod
          namespaces:
            - cloudnative-pg
          selector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [cloudnative-pg]
