# This policy is where the platform actually got burned: on 2026-08-21 the Kind
# audit found it emitting 28 autogen `error` results because autogen rewrote the
# precondition's JMESPath. The fix was `autogen-controllers: none` plus a
# precondition excluding Job-owned Pods -- both of which these fixtures pin.
apiVersion: v1
kind: Pod
metadata:
  name: probes-present
  namespace: product
spec:
  containers:
    - name: app
      image: ghcr.io/duynhlab/product-service/product-service:v1.0.0
      livenessProbe:
        httpGet: {path: /healthz, port: 8080}
        periodSeconds: 10
      readinessProbe:
        httpGet: {path: /readyz, port: 8080}
        periodSeconds: 10
---
apiVersion: v1
kind: Pod
metadata:
  name: readiness-missing
  namespace: product
spec:
  containers:
    - name: app
      image: ghcr.io/duynhlab/product-service/product-service:v1.0.0
      livenessProbe:
        httpGet: {path: /healthz, port: 8080}
        periodSeconds: 10
---
# The seed Jobs. Before the precondition existed these failed the policy, and a
# TTL-collected Job made the finding vanish -- which nearly produced a false
# pass during the audit. Owner kind is what the precondition keys on.
apiVersion: v1
kind: Pod
metadata:
  name: job-owned
  namespace: product
  ownerReferences:
    - apiVersion: batch/v1
      kind: Job
      name: seed-product
      uid: 11111111-1111-4111-8111-111111111111
      controller: true
spec:
  containers:
    - name: seed
      image: ghcr.io/duynhlab/product-service/product-service:v1.0.0
---
# Outside the ten application namespaces: the policy must not reach it at all.
apiVersion: v1
kind: Pod
metadata:
  name: outside-app-namespaces
  namespace: monitoring
spec:
  containers:
    - name: app
      image: ghcr.io/duynhlab/product-service/product-service:v1.0.0
---
# What actually runs in the cluster: a Pod owned by a ReplicaSet. The field
# exists, so the precondition's JMESPath has a list to measure.
apiVersion: v1
kind: Pod
metadata:
  name: rs-owned-probes-present
  namespace: product
  ownerReferences:
    - apiVersion: apps/v1
      kind: ReplicaSet
      name: product-abc123
      uid: 22222222-2222-4222-8222-222222222222
      controller: true
spec:
  containers:
    - name: app
      image: ghcr.io/duynhlab/product-service/product-service:v1.0.0
      livenessProbe:
        httpGet: {path: /healthz, port: 8080}
        periodSeconds: 10
      readinessProbe:
        httpGet: {path: /readyz, port: 8080}
        periodSeconds: 10
---
apiVersion: v1
kind: Pod
metadata:
  name: rs-owned-readiness-missing
  namespace: product
  ownerReferences:
    - apiVersion: apps/v1
      kind: ReplicaSet
      name: product-abc123
      uid: 33333333-3333-4333-8333-333333333333
      controller: true
spec:
  containers:
    - name: app
      image: ghcr.io/duynhlab/product-service/product-service:v1.0.0
      livenessProbe:
        httpGet: {path: /healthz, port: 8080}
        periodSeconds: 10
