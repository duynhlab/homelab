apiVersion: v1
kind: Pod
metadata:
  name: resources-complete
  namespace: product
spec:
  containers:
    - name: app
      image: ghcr.io/duynhlab/product-service/product-service:v1.0.0
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 256Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: memory-limit-missing
  namespace: product
spec:
  containers:
    - name: app
      image: ghcr.io/duynhlab/product-service/product-service:v1.0.0
      resources:
        requests: {cpu: 50m, memory: 64Mi}
---
# The PolicyException path. Same missing limits as above, but in `product` with
# `application: cnpg` -- exactly the selector postgres-operators exempts. This
# pins the exception's blast radius: widen the selector and this test moves.
apiVersion: v1
kind: Pod
metadata:
  name: cnpg-excepted
  namespace: product
  labels:
    application: cnpg
spec:
  containers:
    - name: postgres
      image: ghcr.io/cloudnative-pg/postgresql:18.1
      resources:
        requests: {cpu: 50m, memory: 64Mi}
