apiVersion: v1
kind: Pod
metadata:
  name: resources-complete
  namespace: product
spec:
  containers:
    - name: app
      image: ghcr.io/duynhlab/product-service/product-service:v1.0.0
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 256Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: memory-limit-missing
  namespace: product
spec:
  containers:
    - name: app
      image: ghcr.io/duynhlab/product-service/product-service:v1.0.0
      resources:
        requests: {cpu: 50m, memory: 64Mi}