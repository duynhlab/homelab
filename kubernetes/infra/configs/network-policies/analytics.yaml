# deny-all-ingress for analytics is GENERATED by the Kyverno GeneratingPolicy
# default-deny-networkpolicy (sole owner since ADR-078 step 4); do not add it here.
#
# analytics (RFC-0030 / ADR-069) serves only /protected/ through the edge. It
# has no gRPC port and no in-cluster callers; its own egress to ClickHouse
# (monitoring :9000) is the reader password plus this ingress fence, because
# the CHI has no TLS listener yet.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-callers
  namespace: analytics
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
      ports:
        - protocol: TCP
          port: 8080
