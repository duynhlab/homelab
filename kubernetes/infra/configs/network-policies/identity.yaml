# NOTE: kindnet DOES enforce NetworkPolicy on Kind K8s 1.34+ (verified round 7) —
# these rules are LIVE. Any ingress not explicitly allowed below is dropped.
# identity namespace hosts Keycloak (HTTP :8080 app, :9000 management). Both the
# edge AND the seven services that run pkg/authmw reach :8080 — the edge for its
# route and remoteJWKS, the services because their own verifier is the
# authoritative one (docs/api/api.md § edge exposure) and is fail-closed.
# Keycloak connects DIRECT to platform-db-rw:5432 — no pooler (RFC-0022 OQ#8 /
# ADR-041); the matching ingress allow lives in platform.yaml.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: identity
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-callers
  namespace: identity
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Metrics scrape (VMAgent, monitoring ns) → Keycloak management interface
    # (:9000, /metrics + health).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9000
    # RFC-0024 P2.3 edge cutover: Envoy Gateway edge → Keycloak app HTTP for the
    # id.duynh.me route AND the SecurityPolicy remoteJWKS fetches
    # (/realms/duynhlab/protocol/openid-connect/certs). Verified by
    # scripts/edge-isolation-sweep.sh.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
      ports:
        - protocol: TCP
          port: 8080
    # Services that verify tokens themselves → Keycloak JWKS (:8080).
    #
    # ADDED 2026-08-22, and it closed a real outage this policy was causing. The
    # edge check is COARSE by design; `docs/api/api.md` names the in-service
    # `pkg/authmw` verifier the AUTHORITATIVE one (edge → authmw → role gate), and
    # authmw is fail-closed: a JWKS it cannot fetch means every token is rejected.
    # With no rule here, `authmw` could not reach
    # /realms/duynhlab/protocol/openid-connect/certs and EVERY `private` and
    # `protected` route in the cluster answered 401. Found by the Kind gate's new
    # K4.10 row; it is why K4.5 onward had never passed on a cluster.
    #
    # Scoped to exactly the namespaces that need it.
    #
    # CORRECTED 2026-08-22. This list first read "the seven whose Deployments
    # carry OIDC_JWKS_URL" and said product, shipping and inventory were absent
    # because they had "no in-service verifier". That was wrong: all three
    # construct pkg/authmw in cmd/main.go. What they lacked was the env pair, so
    # they fell back to compiled defaults that hairpin to the public host — the
    # verifier was there all along, just pointed somewhere it could not reach.
    # Enumerating by which manifests happened to set a variable found the
    # symptom, not the set.
    #
    # The ten now listed are every namespace running an in-service verifier
    # against either realm. Still NOT listed: frontend and backoffice (SPAs
    # served by nginx — the browser holds the token, nothing server-side
    # verifies it).
    #
    # Port 8080 only. The management interface (:9000) stays reachable from
    # `monitoring` alone.
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - cart
                  - checkout
                  - inventory
                  - notification
                  - order
                  - payment
                  - product
                  - review
                  - shipping
                  - user
      ports:
        - protocol: TCP
          port: 8080
