# NOTE: kindnet DOES enforce NetworkPolicy on Kind K8s 1.34+ — these rules are
# LIVE. Any ingress not explicitly allowed below is dropped.
#
# East-west inventory is gRPC-only (RFC-0021). RFC-0023 adds ONE http ingress:
# the edge, for the protected Backoffice surface (api-inventory-protected) —
# no service-to-service HTTP is allowed. Kubelet health probes are host-level
# and bypass NetworkPolicy (same stance as checkout).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: inventory
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# inventory-service gRPC (:9090, inventory.v1) — reservations dialed by
# checkout's confirm path and the order saga's stock activities (RFC-0021).
#
# Pod-scoped (app.kubernetes.io/name: inventory) rather than a rule in a
# namespace-wide allow, mirroring allow-product-grpc: keep the allow surface
# limited to the service pods themselves.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inventory-grpc
  namespace: inventory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inventory
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: checkout
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: order
        # product reads availability for the GetProductDetails enrichment
        # (RFC-0021 P2-6, BatchGetAvailability). LIVE since phase 4 turned
        # PRODUCT_AVAILABILITY_SOURCE=inventory on — it was inert before that.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: product
      ports:
        - protocol: TCP
          port: 9090
---
# The edge's protected Backoffice route (RFC-0023, api-inventory-protected):
# Envoy Gateway is inventory's only HTTP caller. jwt-edge screens tokens at
# the edge; the service's authmw + role gate is the authoritative check.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-inventory-protected-http
  namespace: inventory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inventory
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
      ports:
        - protocol: TCP
          port: 8080
