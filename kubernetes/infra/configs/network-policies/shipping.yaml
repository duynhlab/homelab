# deny-all-ingress for shipping is GENERATED by the Kyverno GeneratingPolicy
# default-deny-networkpolicy (sole owner since ADR-078 step 4); do not add it here.
# NOTE: kindnet DOES enforce NetworkPolicy on Kind K8s 1.34+ (verified round 7) —
# these rules are LIVE. Any ingress not explicitly allowed below is dropped.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-callers
  namespace: shipping
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # The edge proxy fleet's namespace: north-south traffic enters
              # here. Verified by scripts/edge-isolation-sweep.sh.
              kubernetes.io/metadata.name: envoy-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: order
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
    # Checkout prices shipping via shipping.v1/GetQuote (RFC-0015 P3) —
    # :9090 only, never the HTTP API.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: checkout
      ports:
        - protocol: TCP
          port: 9090
