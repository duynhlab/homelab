# NOTE: kindnet DOES enforce NetworkPolicy on Kind K8s 1.34+ (verified round 7) —
# these rules are LIVE. Any ingress not explicitly allowed below is dropped.
# user namespace hosts the user service (HTTP :8080).
# Database traffic moved to platform-db, pooled by the CNPG PgBouncer
# Pooler platform-db-pooler-rw (RFC-0018; ADR-026 replaced pgdog-platform).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: user
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-callers
  namespace: user
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Edge gateway → user service HTTP.
    - from:
        - namespaceSelector:
            matchLabels:
              # The edge proxy fleet's namespace: north-south traffic enters
              # here. Verified by scripts/edge-isolation-sweep.sh.
              kubernetes.io/metadata.name: envoy-gateway
      ports:
        - protocol: TCP
          port: 8080
