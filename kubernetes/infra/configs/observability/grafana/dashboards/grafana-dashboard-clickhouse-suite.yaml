# Our own ClickHouse OTel Overview — the entry point that answers "which service
# is in trouble?" against otel_logs/otel_traces. RFC-0027 replaced the Logs and
# Trace Explorer halves of this suite with the upstream versions that ship in the
# clickhouse-datasource plugin (grafana-dashboard-clickhouse-upstream.yaml): they
# cover the same ground and are maintained against the plugin's schema changes.
# JSON via the configMapGenerator in this directory's kustomization; $ds defaults
# to datasource uid `clickhouse`.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: clickhouse-otel-overview
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: "ClickHouse"
  allowCrossNamespaceImport: true
  resyncPeriod: 30s
  configMapRef:
    name: grafana-dashboard-clickhouse-otel-overview
    key: clickhouse-otel-overview.json
