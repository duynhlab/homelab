# The grafana/clickhouse-datasource dashboards, fetched by URL at the same tag as
# the plugin pin in grafana.yaml (Renovate bumps both together). RFC-0027.
# Not fetched: system-dashboards.json (no uid, broken as shipped).
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ch-cluster-analysis
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: "ClickHouse"
  allowCrossNamespaceImport: true
  resyncPeriod: 30s
  url: https://raw.githubusercontent.com/grafana/clickhouse-datasource/v4.22.1/src/dashboards/cluster-analysis.json
  contentCacheDuration: 24h
---
