# Envoy Gateway first-party dashboard suite (RFC-0024 P4 edge slice) — the four
# dashboards EG ships in envoyproxy/gateway v1.9.0
# (charts/gateway-addons-helm/dashboards/), vendored as JSON under
# ./envoy-gateway/ via the configMapGenerator entries in this directory's
# kustomization (clickhouse-suite pattern):
#   - Envoy Global        data plane: rq rate, response classes, latency,
#                         membership, bandwidth (job="envoy-gateway")
#   - Envoy Clusters      per-upstream drill-down keyed by envoy_cluster_name
#   - Envoy Gateway Global control plane: watchables, status updates, xDS
#                         snapshots (job="envoy-gateway-controller")
#   - Resources Monitor   container CPU/memory of the EG components
# global-ratelimit.json is deliberately NOT vendored: rate limiting is local
# (ADR-045) — no RLS service exists to emit ratelimit_service_* series.
#
# Datasource: these dashboards declare a `datasource` template variable with
# `query: prometheus` (no __inputs block, so the operator's `datasources:`
# inputName mapping does not apply). The variable resolves against the
# prometheus-TYPE alias "VictoriaMetrics (Prometheus)"
# (datasource-victoriametrics-prometheus.yaml) — the same mechanism the
# upstream VictoriaMetrics dashboards use. One local patch is recorded in the
# JSON: hardcoded datasource uids from the authoring instance are re-pointed to
# $datasource — 4 spots in envoy-gateway-global.json, 1 in
# envoy-proxy-global.json (new in v1.9.0, which also adds a TLS Certificate
# Expiry panel; the other three dashboards are unchanged from v1.8.3).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envoy-proxy-global
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: "API Gateway"
  allowCrossNamespaceImport: true
  resyncPeriod: 30s
  configMapRef:
    name: grafana-dashboard-envoy-proxy-global
    key: envoy-proxy-global.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envoy-clusters
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: "API Gateway"
  allowCrossNamespaceImport: true
  resyncPeriod: 30s
  configMapRef:
    name: grafana-dashboard-envoy-clusters
    key: envoy-clusters.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envoy-gateway-global
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: "API Gateway"
  allowCrossNamespaceImport: true
  resyncPeriod: 30s
  configMapRef:
    name: grafana-dashboard-envoy-gateway-global
    key: envoy-gateway-global.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envoy-resources-monitor
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: "API Gateway"
  allowCrossNamespaceImport: true
  resyncPeriod: 30s
  configMapRef:
    name: grafana-dashboard-envoy-resources-monitor
    key: resources-monitor.gen.json
