apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: inventory
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: "Observability"
  allowCrossNamespaceImport: true
  resyncPeriod: 30s
  # inventory-service (the platform's sole stock authority): reservation FSM
  # outcomes, availability checks, gRPC RED, DB latency. Reads the inventory:*
  # recording rules (prometheusrules/microservices/inventory.yaml).
  # Live since RFC-0021 phase 4 with three callers — a flat rate is a finding.
  configMapRef:
    name: grafana-dashboard-inventory
    key: inventory.json
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: VictoriaMetrics
