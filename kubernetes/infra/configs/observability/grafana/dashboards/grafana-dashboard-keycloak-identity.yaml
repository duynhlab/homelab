# Keycloak — Identity: the hand-authored identity-provider board answering
# "is Keycloak issuing tokens, failing auths, fast enough, and healthy".
# Failures are an `error` LABEL on the same user event (login / refresh_token /
# code_to_token) — Keycloak emits no login_error event. Five rows:
#   README          how to read the board (error label, shared job, SLO bucket)
#   Overview        logins/min · auth failure ratio · auth p95 ·
#                   250 ms SLO compliance · scrape up            job="keycloak"
#   Latency         realm-endpoint p50/p95/p99, token endpoint
#                   p95/p99, slowest-URIs table (templated uris)
#   Auth events     rate by event, failures by error label,
#                   realm/client split, refresh vs code_to_token
#   Infrastructure  Agroal DB pool, JVM heap, GC pause,
#                   Argon2id hash validations, process uptime
# Local-stack twin: local-stack/observability/grafana/dashboards/Observability/
# keycloak-identity-local.json (same uid and queries — both stacks scrape the
# same job "keycloak" on management :9000, only the datasource input differs).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: keycloak-identity
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: "Observability"
  allowCrossNamespaceImport: true
  resyncPeriod: 30s
  configMapRef:
    name: grafana-dashboard-keycloak-identity
    key: keycloak-identity.json
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: VictoriaMetrics
