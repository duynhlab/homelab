# Kubernetes Cluster Overview — generated by duynhlab/obs-as-code.
#
# Sourced from an OCI artifact rather than a ConfigMap or a URL, which makes it
# the first spec.oci consumer in this repo. The reasons it is worth being first:
#
#   - the board is generated Go, and the artifact is what CI publishes, so there
#     is no JSON copied into this repository to drift from its source
#   - the model is fetched at reconcile time and never stored in etcd
#   - it retires a runtime fetch from duynhlab/grafana-dashboards@main, an
#     unpinned branch of a repository whose own README says not to add
#     dashboards to it (audit rows K0.5 / K5.7)
#
# spec.oci needs grafana-operator >= 5.24.0. The operator is pinned there, and
# the field was confirmed present by unpacking that chart's CRD rather than from
# release notes.
#
# `path` must match the filename inside the artifact exactly, profile directory
# included. A mismatch fails the fetch and reports it on this resource's
# DashboardSynchronized condition — nowhere else. List an artifact's contents
# with:
#
#   flux pull artifact oci://ghcr.io/duynhlab/obs-as-code:v0.2.1 --output /tmp/a
#
# No pullSecretRef: the GHCR package is public and pulls anonymously.
#
# Bumping the board means bumping `reference` here. Once a second board arrives,
# replace that with one kustomize patch over every GrafanaDashboard so a release
# is a single line — see obs-as-code/docs/flux/README.md.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-cluster-overview
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: "Platform / Infrastructure"
  allowCrossNamespaceImport: true
  resyncPeriod: 30s
  oci:
    reference: ghcr.io/duynhlab/obs-as-code:v0.2.1
    path: cluster/dashboards/kubernetes-cluster-overview.json
