# Kubernetes Workloads — generated by duynhlab/obs-as-code (spec.oci, like the
# cluster overview beside it; the delivery rationale lives in that file's
# header and in obs-as-code/docs/flux/README.md).
#
# DEPENDS ON the ownership recording rule in
# prometheusrules/kubernetes/workload-recording-rules.yaml
# (namespace_workload_pod:kube_pod_owner:relabel): the board's
# $workload/$workload_type variables are label_values() over that series, and
# every workload panel joins through it. Without the rule the dropdowns and
# workload panels are empty — that is the failure signature to recognise, and
# the fix is the rule, not the board.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-workloads
  labels:
    app.kubernetes.io/managed-by: obs-as-code
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: "Platform / Infrastructure"
  allowCrossNamespaceImport: true
  # Same reasoning as the overview: OCI fetches are uncached per resync, the
  # artifact is immutable per tag, and resync exists only to revert UI edits.
  resyncPeriod: 10m
  oci:
    reference: ghcr.io/duynhlab/obs-as-code:v0.3.0
    path: cluster/dashboards/kubernetes-workloads.json
