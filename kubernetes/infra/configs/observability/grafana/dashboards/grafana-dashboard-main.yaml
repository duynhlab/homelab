apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: microservices-monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: "Microservices / Golden Signals"
  allowCrossNamespaceImport: true
  resyncPeriod: 30s
  # RFC-0017: sourced from the grafana-dashboards chart (duynhlab/helm-charts)
  # instead of the retired grafana-dashboards repo raw URL.
  configMapRef:
    name: grafana-dashboards-microservices-otel
    key: microservices-otel.json
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: VictoriaMetrics
