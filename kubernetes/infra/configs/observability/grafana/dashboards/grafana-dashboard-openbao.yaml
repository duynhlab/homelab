# OpenBao — the chart's own dashboard (grafana.com 23725). The openbao HelmRelease
# renders it as ConfigMap/openbao-dashboard in this namespace (serverTelemetry.
# grafanaDashboard), so the board moves with the pinned chart version; this CR
# only imports it. Metrics come from the chart's ServiceMonitor on
# /v1/sys/metrics (job `openbao-active`).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: openbao
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: "Secrets"
  allowCrossNamespaceImport: true
  resyncPeriod: 30s
  configMapRef:
    name: openbao-dashboard
    key: dashboard.json
  datasources:
    - inputName: DS_PROMXY
      datasourceName: VictoriaMetrics
