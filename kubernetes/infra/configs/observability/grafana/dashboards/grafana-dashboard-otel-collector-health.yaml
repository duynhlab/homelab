# OTel Collector Health: receiver/exporter/processor throughput, queue depth and
# process resources for the one component every metric, log and trace passes
# through. Pairs with the `OtelCollectorDown` and `ClickHouseExporterUnhealthy`
# alerts, which had no visual surface on the cluster before this.
#
# Ported from the local twin with three changes:
#   - title drops "— Local", and the uid drops it too: `otel-collector-health`.
#     The local file still uses `otel-collector-health-local` as its uid, which
#     diverges from the keycloak-identity convention of one uid for both stacks.
#     Left alone here because compose audit row C18 pins that uid; changing it
#     means re-running the compose gate.
#   - all 26 `job="otel-collector"` selectors became `job=~".*otel-collector.*"`.
#     On the cluster the Helm release names the scrape job
#     `otel-collector-opentelemetry-collector`, so the literal matched nothing
#     and every panel would have rendered empty. The regex matches both stacks
#     and is the same selector `OtelCollectorDown` uses, so board and alert
#     agree by construction. (Prometheus regexes are fully anchored, so the
#     leading and trailing `.*` are load-bearing.)
#   - the datasource variable's `current` is pinned to `Prometheus`, for the
#     two-prometheus-datasource reason described in the red-spanmetrics CR.
#
# The three `otelcol_exporter_send_failed_*` series do not exist until something
# fails; the board already wraps them in `or vector(0)`, so a healthy collector
# reads as 0 rather than "No data".
#
# NOTE: no `datasources:` remap block — the JSON has no `__inputs`.
# Local twin: local-stack/observability/grafana/dashboards/Observability/otel-collector-local.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: otel-collector-health
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: "Observability"
  allowCrossNamespaceImport: true
  resyncPeriod: 30s
  configMapRef:
    name: grafana-dashboard-otel-collector-health
    key: otel-collector-health.json
