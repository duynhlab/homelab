apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: vector
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # folderUID, not a folder title: the as-code artifact (grafana-dashboards)
  # owns this folder with a fixed uid. A title made the operator create a
  # second folder of the same name. The as-code folders arrive one wave later;
  # a dashboard applied first fails with "folder not found" and the operator
  # retries on its own (~1 min, measured) — kstatus reads it as Current, so
  # monitoring-local's wait does not block on it.
  folderUID: observability
  url: https://grafana.com/api/dashboards/21954/revisions/latest/download
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: VictoriaMetrics


