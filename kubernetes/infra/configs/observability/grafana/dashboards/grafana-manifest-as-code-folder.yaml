# Folder for the Dashboard V2 canary boards from duynhlab/grafana-dashboards.
#
# A v2 dashboard names its folder through the `grafana.app/folder` annotation,
# which resolves against a `folder.grafana.app/v1` Folder rather than the
# classic `spec.folder` title string. Grafana 13.2.0 serves folder.grafana.app
# at v1 and v1beta1; v1 is the one used here.
#
# The folder must exist before the boards that name it. The operator applies
# each GrafanaManifest independently and in no order, so a board naming a
# missing folder fails outright with
#   applying resource: creating resource: folders.folder.grafana.app ... not found
# Inside one kustomization that ordering is not guaranteed; if these ever move
# to separate Flux waves, the dashboards wave must dependsOn the folder wave.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: as-code-canary-folder
  labels:
    app.kubernetes.io/managed-by: grafana-dashboards-as-code
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 10m
  template:
    apiVersion: folder.grafana.app/v1
    kind: Folder
    metadata:
      name: as-code-canary
      namespace: default
    spec:
      title: As-Code (V2 canary)
