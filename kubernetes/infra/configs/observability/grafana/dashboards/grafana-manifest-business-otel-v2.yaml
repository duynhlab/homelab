                        name: prometheus
                      spec:
                        expr: histogram_quantile(0.95, sum by (le,op) (rate(auth_password_hash_duration_seconds_bucket[$__rate_interval])))
                        legendFormat: '{{op}}'
                    refId: A
                    hidden: false
                transformations: []
                queryOptions: {}
            vizConfig:
              kind: VizConfig
              group: timeseries
              version: ''
              spec:
                options:
                  legend:
                    displayMode: list
                    placement: bottom
