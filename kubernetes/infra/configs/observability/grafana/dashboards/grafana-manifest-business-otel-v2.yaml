# Microservices — Business KPIs — Dashboard V2 canary from duynhlab/grafana-dashboards.
#
# This is the NEW Grafana resource model, not the classic one. The board is a
# `dashboard.grafana.app/v2` Dashboard carried inside a `GrafanaManifest`, which
# the operator applies through Grafana's own apiserver at /apis. The classic
# `GrafanaDashboard` kind cannot carry it: measured on Kind against this exact
# stack (operator 5.25.0, grafana/grafana:13.2.0), Grafana answers
#
#   400 dashboard appears to be in v2 format. Please use the
#       /apis/dashboard.grafana.app/v2 API OR it should include a object
#       wrapper with an explicit 'apiVersion' ...
#
# and wrapping the payload does not rescue it either — the operator stamps an
# `id` onto the root and Grafana rejects that too. Full write-up and the
# experiment table: docs/observability/grafana/dashboards-v2.md
#
# The spec is INLINE because GrafanaManifest has no content sources at all: no
# oci, no url, no configMapRef — verified against the 5.25.0 CRD, whose spec has
# exactly six fields and none of them is a content source. That is the cost of
# the new model today, and it is why payload size is worth watching (41 KiB
# here, etcd caps objects near 1 MiB).
#
# TEMPORARY. Inlining duplicates JSON that already lives in
# duynhlab/grafana-dashboards, which is the opposite of what as-code is for. It
# is here only because that repo publishes nothing consumable yet: its release
# job is gated on an `as-code` branch that no longer exists. Once it emits
# GrafanaManifest files and publishes from main, this file is DELETED and
# replaced by an OCIRepository plus two Flux Kustomizations, the same wiring
# obs-as-code already uses. Do not add a third board here by copying this one.
#
# Named with a -v2 suffix and parked in its own folder so it cannot collide with
# the helm-charts Business KPIs board, which already owns the uid business-otel. Deleting this file rolls the canary back and touches nothing else.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaManifest
metadata:
  name: business-otel-v2
  labels:
    app.kubernetes.io/managed-by: grafana-dashboards-as-code
