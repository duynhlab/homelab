apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - grafana-dashboard-main.yaml
  - grafana-dashboard-business.yaml
  - grafana-dashboard-slo-overview.yaml
  - grafana-dashboard-slo-detailed.yaml
  - grafana-dashboard-vector.yaml
  - grafana-dashboard-tempo.yaml
  - grafana-dashboard-temporal.yaml
  - grafana-dashboard-cloudnative-pg.yaml
  - grafana-dashboard-pg-query-performance.yaml
  - grafana-dashboard-pg-maintenance.yaml
  - grafana-dashboard-pgdog.yaml
  - grafana-dashboard-redis.yaml
  - grafana-dashboard-kubernetes-cluster-overview.yaml
  # Envoy Gateway first-party dashboards (RFC-0024 P4 edge slice) — JSON vendored
  # from envoyproxy/gateway v1.9.0 via configMapGenerator below
  - grafana-dashboard-envoy-gateway.yaml
  # Envoy Gateway — Edge Overview (hand-authored; JSON via configMapGenerator below)
  - grafana-dashboard-eg-edge.yaml
  # ClickHouse OTel logs+traces SQL (RFC-0019 Phase B) — JSON via configMapGenerator below
  - grafana-dashboard-clickhouse.yaml
  - grafana-dashboard-clickhouse-server-engine.yaml
  # ClickHouse per-service deep dive — JSON via configMapGenerator below
  - grafana-dashboard-clickhouse-deepdive.yaml
  # ClickHouse standard suite: Overview → Logs Explorer → Trace Explorer
  - grafana-dashboard-clickhouse-suite.yaml
  # VictoriaMetrics stack dashboards
  - grafana-dashboard-vmsingle.yaml
  - grafana-dashboard-vmagent.yaml
  - grafana-dashboard-vmalert.yaml
  # Flux GitOps dashboards
  - grafana-dashboard-flux-cluster.yaml
  - grafana-dashboard-flux-controlplane.yaml
  # RFC-0021 overhaul baseline (CP-0 gate)
  - grafana-dashboard-rfc0021-baseline.yaml
  # RFC-0021 P1-9 inventory-service overview
  - grafana-dashboard-inventory.yaml
  # cert-manager — visual surface for the CertManager* alerts (JSON via configMapGenerator below)
  - grafana-dashboard-cert-manager.yaml

# ClickHouse dashboard JSON → ConfigMap (referenced by grafana-dashboard-clickhouse.yaml
# via configMapRef; stable name, so the hash suffix is disabled).
configMapGenerator:
  - name: grafana-dashboard-clickhouse-server-engine
    files:
      - clickhouse-server-engine.json
  - name: grafana-dashboard-clickhouse-otel-sql
    files:
      - clickhouse-otel-sql.json
  - name: grafana-dashboard-clickhouse-service-deepdive
    files:
      - clickhouse-service-deepdive.json
  - name: grafana-dashboard-clickhouse-otel-overview
    files:
      - clickhouse-otel-overview.json
  - name: grafana-dashboard-clickhouse-logs-explorer
    files:
      - clickhouse-logs-explorer.json
  - name: grafana-dashboard-clickhouse-traces-explorer
    files:
      - clickhouse-traces-explorer.json
  - name: grafana-dashboard-rfc0021-baseline
    files:
      - rfc0021-baseline.json
  - name: grafana-dashboard-inventory
    files:
      - inventory.json
  # Temporal — vendored in-repo (was a runtime URL fetch from the deprecated
  # duynhlab/grafana-dashboards repo); see grafana-dashboard-temporal.yaml
  - name: grafana-dashboard-temporal
    files:
      - temporal.json
  - name: grafana-dashboard-cert-manager
    files:
      - cert-manager.json
  # Envoy Gateway first-party dashboards (envoyproxy/gateway v1.9.0,
  # charts/gateway-addons-helm/dashboards/) — see grafana-dashboard-envoy-gateway.yaml
  - name: grafana-dashboard-envoy-proxy-global
    files:
      - envoy-gateway/envoy-proxy-global.json
  - name: grafana-dashboard-envoy-clusters
    files:
      - envoy-gateway/envoy-clusters.json
  - name: grafana-dashboard-envoy-gateway-global
    files:
      - envoy-gateway/envoy-gateway-global.json
  - name: grafana-dashboard-eg-edge
    files:
      - eg-edge.json
  - name: grafana-dashboard-envoy-resources-monitor
    files:
      - envoy-gateway/resources-monitor.gen.json

generatorOptions:
  disableNameSuffixHash: true
