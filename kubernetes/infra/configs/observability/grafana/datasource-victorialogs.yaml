apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victorialogs-datasource
  namespace: monitoring
spec:
  datasource:
    access: proxy
    isDefault: false
    name: VictoriaLogs
    type: victoriametrics-logs-datasource
    uid: victorialogs
    url: http://vlsingle-victoria-logs.monitoring.svc.cluster.local:9428
    jsonData:
      maxLines: "50" # plugin default became 1000 in 0.31; keep Explore light
      # Log -> trace: a record's trace_id field links to the span in VictoriaTraces.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: ${__value.raw}
          urlDisplayLabel: View trace
          datasourceUid: victoriatraces
  plugins:
    - name: victoriametrics-logs-datasource
      version: "0.34.0"
  instanceSelector:
    matchLabels:
      dashboards: grafana
