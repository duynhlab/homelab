apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victorialogs-datasource
  namespace: monitoring
spec:
  datasource:
    access: proxy
    isDefault: false
    name: VictoriaLogs
    type: victoriametrics-logs-datasource
    uid: victorialogs
    url: http://vlsingle-victoria-logs.monitoring.svc.cluster.local:9428
    jsonData:
      maxLines: "50" # plugin default became 1000 in 0.31; keep Explore light
  plugins:
    - name: victoriametrics-logs-datasource
      version: "0.32.0"
  instanceSelector:
    matchLabels:
      dashboards: grafana
