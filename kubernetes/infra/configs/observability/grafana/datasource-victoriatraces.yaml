# VictoriaTraces datasource — queried via the Grafana Jaeger datasource type
# (VictoriaTraces exposes the Jaeger query API at /select/jaeger on :10428;
# there is no native VictoriaTraces datasource plugin). Pilot 3rd backend.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriatraces-datasource
  namespace: monitoring
spec:
  datasource:
    access: proxy
    jsonData:
      nodeGraph:
        enabled: true
      # Grafana builds the LogsQL `trace_id:="<id>"` for a VictoriaLogs target
      # only with filterByTraceID on; without it a span has no Logs link.
      tracesToLogsV2:
        datasourceUid: victorialogs
        filterByTraceID: true
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
      # A metrics link appears only for a listed query. $__tags filters on the
      # span name only: the Jaeger API carries the service in serviceName, not
      # a tag, so a name shared by services (Redis `get`) sums all of them.
      tracesToMetrics:
        datasourceUid: victoriametrics
        spanStartTimeShift: -15m
        spanEndTimeShift: 15m
        tags:
        - key: name
          value: span_name
        queries:
        - name: Request rate
          query: sum(rate(spanmetrics_calls_total{$__tags}[5m]))
        - name: Error rate
          query: sum(rate(spanmetrics_calls_total{$__tags, status_code="STATUS_CODE_ERROR"}[5m]))
        - name: p95 latency (ms)
          query: histogram_quantile(0.95, sum by (le) (rate(spanmetrics_duration_milliseconds_bucket{$__tags}[5m])))
    name: VictoriaTraces
    type: jaeger
    uid: victoriatraces
    url: http://vtsingle-victoria-traces.monitoring.svc.cluster.local:10428/select/jaeger
  instanceSelector:
    matchLabels:
      dashboards: grafana
