# ExternalSecret for Grafana's Keycloak client secret (ADR-062 staff SSO).
# OpenBAO path: secret/data/local/infra/keycloak/oidc-clients — the SAME random
# value the openbao-bootstrap Job seeded and the realm import consumed for the
# `grafana` client, so Grafana and Keycloak agree without a literal in git.
# Consumed by grafana.yaml as GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc-client
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana-oidc-client
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-oidc-client
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: grafana-oidc-client
          app.kubernetes.io/component: observability
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: grafana_client_secret
      remoteRef:
        key: secret/data/local/infra/keycloak/oidc-clients
        property: grafana_client_secret
