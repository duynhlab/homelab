# Grafana service account for the Grafana MCP server (controllers/mcp/grafana-mcp.yaml).
#
# Why a token at all when Grafana runs anonymous-Admin: the token NARROWS
# what the MCP can do. An unauthenticated in-cluster caller inherits
# org_role=Admin from `auth.anonymous` (grafana.yaml); a Viewer token plus the
# server's own --disable-write means a prompt can read dashboards, datasources
# and queries and nothing else.
#
# The operator writes the token into a Secret in ITS OWN namespace only (no
# cross-namespace support), under the key `token` — which is why both this CR
# and the MCP HelmRelease live in `monitoring`, beside the Grafana instance.
#
# `spec.name` is immutable per the CRD's own CEL rule (adding or removing it
# later is rejected), and `expires` is deliberately unset: an expiring token is
# deleted and recreated by the operator, while the consumer reads it through
# env `secretKeyRef`, which does not hot-reload — the pod would keep a revoked
# token until something restarted it.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: grafana-mcp
  namespace: monitoring
spec:
  # Matches metadata.name of the Grafana CR in this namespace (grafana.yaml).
  instanceName: grafana
  name: grafana-mcp
  role: Viewer
  isDisabled: false
  tokens:
    # Explicit secretName: without it the operator generates
    # `<instance>-<cr>-<token>-<random>`, which nothing could reference from git.
    - name: mcp
      secretName: grafana-mcp-token
