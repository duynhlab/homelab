apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Metrics pillar: VictoriaMetrics operator CRs, scrape objects, recording/
# alerting rules, and Karma (alerting rides the metrics pillar — VMAlert/
# VMRule are metric-based).
resources:
  - victoriametrics/
  - karma/
  - servicemonitors/external-secrets.yaml
  - servicemonitors/kube-apiserver.yaml
  - servicemonitors/kube-dns.yaml
  - servicemonitors/otel-collector.yaml
  - servicemonitors/keycloak.yaml
  - servicemonitors/envoy-gateway-controller.yaml
  # Note: CloudNativePG PodMonitors moved to configs/databases/monitoring/ to deploy AFTER database clusters
  - podmonitors/podmonitor-flux-system.yaml
  # Envoy Gateway data plane (proxy fleet, job="envoy-gateway") — RFC-0024 P4
  - podmonitors/envoy-gateway-proxy.yaml
  # ClickHouse server pods (engine-native :9363, per replica) — RFC-0028
  - podmonitors/clickhouse-server.yaml
  # PrometheusRules — organized by domain (see prometheusrules/kustomization.yaml)
  - prometheusrules/
# RFC-0027 / ADR-059: the Tempo ServiceMonitor retired with Tempo (*.yaml.bak).
# It was also the only scrape producing job=~".*tempo.*", which TempoDown alerted on.
