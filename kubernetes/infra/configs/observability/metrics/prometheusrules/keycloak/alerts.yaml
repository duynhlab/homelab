# PrometheusRule for Keycloak alerts (RFC-0022 / RFC-0024 P1).
# Availability first: Keycloak is required for NEW logins and refreshes only —
# already-issued tokens keep verifying locally against cached keys, so it is
# not on the hot path of authenticated requests (RFC-0022 availability model).
#
# Metrics source: Keycloak management interface (:9000, KC_METRICS_ENABLED)
# scraped via the keycloak ServiceMonitor (job="keycloak").
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: keycloak-alerts
  namespace: monitoring
spec:
  groups:
    # --- Availability ---
    - name: keycloak-availability
      interval: 1m
      rules:
        - alert: KeycloakDown
          # absent() covers the target disappearing entirely (Service/pod gone),
          # which `up == 0` alone would miss.
          expr: up{job="keycloak"} == 0 or absent(up{job="keycloak"})
          for: 5m
          labels:
            severity: critical
            category: availability
          annotations:
            summary: "Keycloak identity provider down"
            description: "Keycloak (identity/keycloak) has been unreachable for more than 5 minutes. New logins and token refreshes fail; already-issued access tokens keep verifying until expiry (15 min)."
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/keycloak/KeycloakDown.md"

        - alert: KeycloakRestartLoop
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="identity", container="keycloak"}[15m]) > 2
          for: 0m
          labels:
            severity: warning
            category: availability
          annotations:
            summary: "Keycloak restarting repeatedly ({{ $labels.namespace }}/{{ $labels.pod }})"
            description: "The keycloak container restarted {{ $value | humanize }} times in the last 15 minutes. Check DB connectivity to platform-db-rw:5432, the realm import, and memory limits: kubectl logs -n identity {{ $labels.pod }} --previous"
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/keycloak/KeycloakRestartLoop.md"

    # --- Authentication outcomes (keycloak_user_events_total) ---
    # Keycloak has NO login_error event: failures are the SAME event
    # (login / refresh_token / code_to_token) carrying a non-empty error label.
    # Verified live on the compose stack 2026-08-20 (error="invalid_user_credentials",
    # "user_not_found" on event="login").
    - name: keycloak-auth
      interval: 1m
      rules:
        - alert: KeycloakLoginFailureRatioHigh
          # Failed logins / all logins. The `and` arm guards the denominator:
          # an idle realm dividing 1 failure by ~0 attempts must not page —
          # the ratio only counts when there are >0.05 login events/s (~3/min).
          expr: |
            (
              sum(rate(keycloak_user_events_total{event="login", error!=""}[5m]))
              /
              sum(rate(keycloak_user_events_total{event="login"}[5m]))
            ) > 0.2
            and
            sum(rate(keycloak_user_events_total{event="login"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
            category: errors
          annotations:
            summary: "More than 20% of Keycloak logins are failing"
            description: "{{ $value | humanizePercentage }} of login events carry an error (threshold 20% for 10m with real login traffic). A brute-force/credential-stuffing run, a broken SPA auth flow, or a misconfigured client — split by error and client_id on keycloak_user_events_total to tell which."
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/keycloak/KeycloakLoginFailureRatioHigh.md"

    # --- Latency (Quarkus http_server_requests_seconds, templated uri) ---
    - name: keycloak-latency
      interval: 1m
      rules:
        - alert: KeycloakTokenLatencyHigh
          # The token endpoint (password grant, code_to_token, refresh) is the
          # hot path for every SPA session. uri is templated
          # (/realms/{realm}/protocol/{protocol}/token), so the regex matches
          # one series family. Buckets top out at 2.5s, so a p99 above that
          # clamps to 2.5 — the threshold sits inside the resolvable range.
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(http_server_requests_seconds_bucket{job="keycloak", uri=~".*/token"}[5m]))
            ) > 1
          for: 10m
          labels:
            severity: warning
            category: latency
          annotations:
            summary: "Keycloak token endpoint p99 above 1s"
            description: "p99 latency on /realms/{realm}/protocol/{protocol}/token is {{ $value | humanize }}s (threshold 1s for 10m). Logins and refreshes feel slow platform-wide. The #1 cause is DB connection-pool saturation — check KeycloakDbPoolExhausted and agroal_available_count first."
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/keycloak/KeycloakTokenLatencyHigh.md"

    # --- Database pool (Agroal, datasource="default") ---
    - name: keycloak-database
      interval: 1m
      rules:
        - alert: KeycloakDbPoolExhausted
          # agroal_awaiting_count > 0 means request threads are BLOCKED waiting
          # for a connection — the unambiguous exhaustion signal (verified live
          # 2026-08-20; available_count==0 alone can be a healthy pool at full
          # utilization). Pool saturation is the #1 cause of Keycloak latency
          # spikes; sustained waiting turns into token-endpoint timeouts.
          expr: agroal_awaiting_count{job="keycloak"} > 0
          for: 2m
          labels:
            severity: critical
            category: saturation
          annotations:
            summary: "Keycloak DB connection pool exhausted (threads waiting)"
            description: "{{ $value | humanize }} thread(s) have been waiting for a pooled DB connection for 2 minutes (datasource {{ $labels.datasource }}). Every login/refresh queues behind the pool — check platform-db health, long-running transactions, and the pool max size before Keycloak starts timing out."
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/keycloak/KeycloakDbPoolExhausted.md"
