# PrometheusRule for Kubernetes workload alerts (USE Method: Workloads).
# Monitors deployment/statefulset replica mismatches, failed jobs, HPA saturation, and PVC usage.
#
# Metrics source: kube-state-metrics (kube_*) and kubelet (kubelet_volume_stats_*).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-workload-alerts
  namespace: monitoring
spec:
  groups:
    # --- Workload Health ---
    - name: kubernetes-workload-health
      interval: 1m
      rules:
        - alert: KubeDeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas
            != kube_deployment_status_ready_replicas
          for: 15m
          labels:
            severity: warning
            category: workloads
          annotations:
            summary: "Deployment replicas mismatch ({{ $labels.namespace }}/{{ $labels.deployment }})"
            description: "Deployment {{ $labels.deployment }} in {{ $labels.namespace }} has {{ $value }} unavailable replicas for more than 15 minutes. Check pod events and resource constraints."
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/kubernetes/KubeDeploymentReplicasMismatch.md"

        - alert: KubeStatefulSetReplicasMismatch
          expr: |
            kube_statefulset_status_replicas_ready
            != kube_statefulset_status_replicas
          for: 15m
          labels:
            severity: warning
            category: workloads
          annotations:
            summary: "StatefulSet replicas mismatch ({{ $labels.namespace }}/{{ $labels.statefulset }})"
            description: "StatefulSet {{ $labels.statefulset }} in {{ $labels.namespace }} has not reached desired replica count for more than 15 minutes."
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/kubernetes/KubeStatefulSetReplicasMismatch.md"

        - alert: KubeJobFailed
          expr: |
            kube_job_status_failed > 0
          for: 5m
          labels:
            severity: warning
            category: workloads
          annotations:
            summary: "Job failed ({{ $labels.namespace }}/{{ $labels.job_name }})"
            description: "Job {{ $labels.job_name }} in {{ $labels.namespace }} has failed. Check job logs: kubectl logs -n {{ $labels.namespace }} job/{{ $labels.job_name }}"
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/kubernetes/KubeJobFailed.md"

    # --- Autoscaling Saturation ---
    - name: kubernetes-autoscaling
      interval: 1m
      rules:
        - alert: KubeHPAMaxedOut
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas
            == kube_horizontalpodautoscaler_spec_max_replicas
          for: 15m
          labels:
            severity: warning
            category: saturation
          annotations:
            summary: "HPA at max replicas ({{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }})"
            description: "HPA {{ $labels.horizontalpodautoscaler }} in {{ $labels.namespace }} is running at maximum replicas ({{ $value }}). Service may not be able to handle additional load."
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/kubernetes/KubeHPAMaxedOut.md"

    # --- Storage (USE: Utilization) ---
    #
    # MEASURED 2026-08-31: both rules in this group are INERT on Kind, and the
    # cause is the storage class rather than anything here. `kubelet_volume_stats_*`
    # returns zero series platform-wide, so both expressions evaluate against an
    # empty vector and can never fire.
    #
    # The scrape is not at fault and neither is the expression. VMNodeScrape
    # `kubelet-volume-stats` (victoriametrics/vmnodescrape-kubelet.yaml) targets
    # /metrics with a keep-filter that matches these names, and
    # `kubelet_running_pods` — kept by that same filter — arrives normally on all
    # four nodes. Asking kubelet directly settles it:
    #   kubectl get --raw /api/v1/nodes/homelab-worker/proxy/metrics \
    #     | grep -c '^kubelet_volume_stats'   ->  0
    # `standard` is rancher.io/local-path, whose PVs are hostPath directories, and
    # kubelet does not collect volume stats for hostPath volumes. No CSI driver,
    # no volume stats.
    #
    # KEPT, not deleted, and the distinction matters: unlike the ClickHouse rules
    # deleted on 2026-08-22 for naming series that exist nowhere, these names are
    # standard Kubernetes and will populate on any cluster with a CSI driver that
    # implements NodeGetVolumeStats. Deleting them would trade a local blind spot
    # for a real one everywhere else.
    #
    # Consequence worth stating plainly: this platform currently has NO working
    # PVC-level disk signal. The same gap silently disables
    # CNPGClusterLowDiskSpace{Warning,Critical} for both database clusters, which
    # is the more serious half. KubeNodeDiskPressure (node-alerts.yaml) still works
    # — it reads kube_node_status_condition — and is the only disk alert that can
    # fire here today.
    - name: kubernetes-storage
      interval: 1m
      rules:
        - alert: KubePersistentVolumeFillingUp
          expr: |
            kubelet_volume_stats_available_bytes
            / kubelet_volume_stats_capacity_bytes
            < 0.15
            and kubelet_volume_stats_capacity_bytes > 0
          for: 10m
          labels:
            severity: warning
            category: storage
          annotations:
            summary: "PVC filling up ({{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }})"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} has less than 15% free space ({{ $value | humanizePercentage }} remaining)."
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/kubernetes/KubePersistentVolumeFillingUp.md"

        - alert: KubePersistentVolumeFillingUpCritical
          expr: |
            kubelet_volume_stats_available_bytes
            / kubelet_volume_stats_capacity_bytes
            < 0.05
            and kubelet_volume_stats_capacity_bytes > 0
          for: 5m
          labels:
            severity: critical
            category: storage
          annotations:
            summary: "PVC critically full ({{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }})"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} has less than 5% free space. Immediate action required to prevent data loss."
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/kubernetes/KubePersistentVolumeFillingUpCritical.md"
