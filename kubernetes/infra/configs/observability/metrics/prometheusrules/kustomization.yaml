apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - kubernetes/
  - microservices/
  - postgres/
  - envoy-gateway/
  - keycloak/
  - victoriametrics/
  - observability/
  - valkey/
  - gitops/
  - kyverno/
  - keda/
  - watchdog.yaml

# Only these static sources participate in the native-VMRule cutover.
labels:
  - pairs:
      rules.duynhlab.dev/source: manifests
