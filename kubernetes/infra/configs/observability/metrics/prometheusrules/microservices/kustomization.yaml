apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - alerts.yaml # canonical OTLP-path rules since RFC-0014 P3
  - recording-rules.yaml
  - rfc0021-baseline.yaml # overhaul baseline (CP-0 gate: 7 days of data)
  - inventory.yaml # RFC-0021 P1-9: inventory recording rules + alerts
  - checkout-availability.yaml # inventory is the only availability authority (RFC-0021 P4)
  - rfc0021-write-migration.yaml # RFC-0021 P3-10: commit-lag, outbox, reconciler alerts
  - rfc0021-phase5.yaml # RFC-0021 P5: cancellation, manual_review, projection alerts
  - rfc0021-phase6.yaml # RFC-0021 P6: payment doubt backlog, evidence, recon drift
