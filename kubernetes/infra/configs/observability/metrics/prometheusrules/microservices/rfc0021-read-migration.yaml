# RFC-0021 phase-2 read-migration rules + alert.
#
# The checkout availability read path migrates Product -> Inventory in stages
# behind CHECKOUT_AVAILABILITY_SOURCE (product|shadow|inventory). In `shadow`
# mode checkout emits, per create/confirm, one STRUCTURAL comparison of
# Inventory's answer:
#
#   inventory_shadow_compare_total{result} — emitted by checkout (app="checkout")
#     result ∈ ok       — Inventory knows every requested SKU and answers sanely
#              missing  — a requested SKU is absent from Inventory (backfill gap
#                         or SKU-namespace drift)
#              unknown  — a SKU is present but has no definite status
#              error    — the Inventory RPC failed / timed out
#              skipped  — sampled out or shed by the concurrency cap (expected)
#
# The shadow soak is the CP-2 gate: divergence (missing|unknown|error) must be
# zero or explained before the read flip (which itself waits for the phase-3
# write cutover — RFC README § Rollout). Until an operator sets the flag to
# `shadow` these series read ~0; the rules land now so the signal is ready.
#
# OTLP push path: no job label; vmagent maps service_name->app, so selectors key
# on the checkout-emitted metric name directly.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rfc0021-read-migration-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/component: recording-rules
spec:
  groups:
    - name: rfc0021-read-migration-5m
      interval: 30s
      rules:
        # Shadow-compare outcomes/sec by result — the soak's core signal.
        - record: rfc0021:checkout_shadow_compare:rate5m
          expr: sum by (result) (rate(inventory_shadow_compare_total[5m]))

        # Divergence ratio: non-ok, non-skipped compares over real compares
        # (skipped are sampled/shed, not a verdict). clamp_min avoids 0/0.
        - record: rfc0021:checkout_shadow_divergence:ratio5m
          expr: |
            sum(rate(inventory_shadow_compare_total{result=~"missing|unknown|error"}[5m]))
            /
            clamp_min(sum(rate(inventory_shadow_compare_total{result!="skipped"}[5m])), 1)

    - name: rfc0021-read-migration-alerts
      rules:
        # Sustained shadow divergence means Inventory disagrees with Product on
        # the read path — a backfill gap, SKU-namespace drift, or Inventory
        # errors. This blocks the CP-2 read-flip gate. Warning, not page: shadow
        # is observational and Product still owns the live read.
        - alert: CheckoutInventoryShadowDivergence
          expr: |
            sum(rate(inventory_shadow_compare_total{result=~"missing|unknown|error"}[15m]))
            /
            clamp_min(sum(rate(inventory_shadow_compare_total{result!="skipped"}[15m])), 1)
            > 0.01
          for: 30m
          labels:
            severity: warning
            rfc: "0021"
          annotations:
            summary: "Checkout↔Inventory shadow divergence >1% (RFC-0021 read path)"
            description: >-
              Over 1% of checkout shadow compares returned missing/unknown/error
              for 30m. Inventory is not matching Product on the read path — the
              CP-2 gate is not met and the read flip must not proceed.
            runbook: >-
              Break down rfc0021:checkout_shadow_compare:rate5m by result.
              missing/unknown ⇒ run/re-run the inventory backfill (Job
              inventory-backfill; see RFC-0021 cutover-rollback.md) and confirm
              SKU ids match product ids. error ⇒ check inventory-service health,
              gRPC errors, and the checkout→inventory NetworkPolicy. Roll back by
              reverting CHECKOUT_AVAILABILITY_SOURCE to product (one-line flag).
