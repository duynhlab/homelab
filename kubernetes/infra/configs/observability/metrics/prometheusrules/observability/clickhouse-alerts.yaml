apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: observability-clickhouse-alerts
  namespace: monitoring
  labels:
    prometheus: victoria-metrics
    role: alert-rules
spec:
  groups:
    # Engine health of the OTel OLAP store. Two of the three producers sit on
    # the clickhouse-operator-metrics Service (:8888), scraped via the
    # chart's ServiceMonitor (serviceMonitor.enabled in the operator
    # HelmRelease):
    #   /metrics -> clickhouse_operator_*  (operator control plane)
    #   /chi     -> chi_clickhouse_*       (metrics-exporter: system.metrics,
    #               system.events, asynchronous_metrics, disks, parts, errors)
    #
    # Since RFC-0028 there is a THIRD producer: the server's own Prometheus
    # endpoint (:9363), scraped per pod by podmonitors/clickhouse-server.yaml
    # (job="clickhouse-server", label `replica`). It publishes the
    # ClickHouseMetrics_* / ClickHouseProfileEvents_* / ClickHouseErrorMetric_*
    # families. The exporter aggregates by CHI and therefore cannot say WHICH
    # replica is sick — which is the only question that matters once there are
    # three of them.
    #
    # And a FOURTH, which had no consumer here until 2026-08-31: the Keeper
    # quorum's own endpoint (:7000), scraped by the operator chart's
    # keeperMetrics ServiceMonitor (job="keeper-keeper", label `pod`, and NO
    # `replica` label). It publishes ClickHouseAsyncMetrics_Keeper* — leader
    # state, follower counts, znode count, latency. Everything else in this file
    # observes Keeper from the server's side, one hop away; the two
    # ClickHouseKeeper* rules below ask the quorum directly.
    #
    # EVERY expression in this group was run against the live VictoriaMetrics
    # query API on 2026-08-31, in two forms: unthresholded, which must return
    # series and proves the names resolve; and complete, which must return
    # nothing on a healthy store and proves it will not cry wolf. That pass is
    # what caught three rules here that could never fire — see
    # ClickHouseServerErrorsElevated and the disk pair.
    #
    # vmalert cannot do this for you. A rule whose expression matches nothing
    # reports state=inactive with an empty lastError, character for character
    # identical to a healthy one. `make validate` does not lint rules either and
    # there is no promtool in this repo, so running both forms by hand is the
    # only check that exists. Do it when editing any expr here.
    #
    # The seven rules added 2026-09-08 from the awesome-prometheus-alerts audit
    # (ServerNotScraped, TooManyPartsPerPartition, InsertsRejected,
    # InsertsFailing, ReplicationLag, KeeperSessionLost, ReplicatedDataLoss)
    # have NOT had that pass yet: each carries its own VERIFY-AT-KIND marker
    # stating what the two forms must return. Every one reads the :9363 scrape
    # with a `job="clickhouse-server"` selector for the reason ServerErrorsElevated
    # documents below.
    - name: observability-clickhouse
      interval: 30s
      rules:
        # The exporter fetches system.* tables from the server on every
        # scrape; fetch errors are the earliest "server unreachable" signal
        # we have without a per-pod scrape. `up` on the operator job covers
        # the exporter itself being gone.
        # Series name verified on the Kind cluster 2026-08-22: the exporter does
        # publish chi_clickhouse_metric_fetch_errors. An earlier note in this repo
        # claimed it did not exist -- that was wrong.
        # RFC-0028 re-graded this from critical to warning. At 1x1 one
        # unreachable host WAS the store being down. With three replicas behind
        # a round-robin Service, one unreachable host is a degraded quorum
        # member: reads and writes continue on its peers. What deserves a page
        # is losing them all, which the companion rule below expresses.
        # MEASURED 2026-08-28: this series is per (hostname, fetch_type) —
        # 3 hosts x 7 fetch types = 21 series. The bare expression that stood
        # here would therefore raise up to SEVEN alerts for one sick replica, and
        # each would read as a separate incident. Aggregated by hostname so one
        # unreachable replica is one alert.
        - alert: ClickHouseReplicaUnreachable
          expr: max by (hostname) (chi_clickhouse_metric_fetch_errors) > 0
          for: 5m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseReplicaUnreachable.md"
            summary: "ClickHouse replica unreachable ({{ $labels.hostname }})"
            description: "The metrics-exporter has failed to fetch system tables from {{ $labels.hostname }} for 5 minutes. With three replicas its peers keep serving reads and writes, so this is a degraded topology rather than an outage — but a replica that stays unreachable is one disk failure away from mattering, and it stops catching up on replication."

        # The page-worthy version: no replica is answering, so the store really
        # is down. Since RFC-0028 the collector no longer runs DDL at startup
        # (create_schema: false), so this no longer blocks collector restarts —
        # what it costs is the ClickHouse sink, and the edge access log has
        # nowhere else to go.
        #
        # The VERIFY-AT-KIND marker that stood here asked whether the `hostname`
        # cardinality made a `count(...) >= 3` threshold meaningful. Measured
        # 2026-08-28: it did NOT. The series is per (hostname, fetch_type), so
        # one replica with three failing fetch types would have paged as "every
        # replica unreachable". Expressed as a RATIO instead — the fraction of
        # distinct hosts reporting fetch errors — which is both correct and
        # independent of the replica count, so a scale-out needs no edit here.
        - alert: ClickHouseAllReplicasUnreachable
          expr: |
            count(max by (hostname) (chi_clickhouse_metric_fetch_errors) > 0)
            /
            count(count by (hostname) (chi_clickhouse_metric_fetch_errors))
            == 1
          for: 5m
          labels:
            severity: critical
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseAllReplicasUnreachable.md"
            summary: "ClickHouse: every replica unreachable"
            description: "The metrics-exporter cannot reach any ClickHouse replica — the OTel logs/traces store is down and edge access logs (ClickHouse-only per ADR-061) are being dropped. The collector survives this now that it owns no DDL, but its ClickHouse sink backpressures and then drops; the schema bootstrap Job would also fail until the store returns."

        - alert: ClickHouseOperatorDown
          expr: up{job=~".*clickhouse-operator.*"} == 0
          for: 10m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseOperatorDown.md"
            summary: "ClickHouse operator is down"
            description: "The Altinity operator target (job {{ $labels.job }}) has been down for 10 minutes — CHI reconciles are frozen. The running server keeps serving; config changes and self-healing stop."

        # The :9363 PodMonitor going blind was the one failure this file could
        # not see. ReplicaUnreachable/AllReplicasUnreachable read the exporter,
        # OperatorDown reads `up` on the operator job — but nothing checked `up`
        # for job="clickhouse-server", and every rule below that names a
        # ClickHouse* family (ReadonlyReplica, ServerErrorsElevated, S3Errors,
        # ZooKeeperExceptions, the four replication rules) reads only that
        # scrape. If the PodMonitor selector drifts or the `metrics` container
        # port is renamed, all of them go state=inactive with an empty lastError
        # — the exact signature of a healthy rule. `absent(... == 1)` is the
        # only shape that fires on zero targets AND on every target down; a bare
        # `up == 0` needs a target to exist. Same idiom as EdgeDown and
        # PostgresBackupMetricsMissing.
        # Warning, not critical: AllReplicasUnreachable (exporter side) carries
        # the page when the store is really down, and this pairs with it the
        # way ReplicaUnreachable does. A single dead pod is NOT this rule's job
        # either — the exporter names the host.
        # Audit source (2026-09-08): awesome-prometheus-alerts ClickHouseNodeDown,
        # which is a bare `up == 0` and would miss the zero-target case.
        # VERIFY-AT-KIND: `up{job="clickhouse-server"}` returns 3 series at 1;
        # the complete form returns nothing. Then scale the PodMonitor selector
        # to a wrong label and confirm it fires within 10m of the series aging out.
        - alert: ClickHouseServerNotScraped
          expr: absent(up{job="clickhouse-server"} == 1)
          for: 10m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseServerNotScraped.md"
            summary: "ClickHouse server metrics (:9363) are not being scraped"
            description: "No target under job=\"clickhouse-server\" is up: the per-pod PodMonitor selects nothing or every replica's :9363 endpoint is down. Every ClickHouse* rule in this group — readonly replica, error rates, S3 errors, replication lag, Keeper session — is blind while this fires, and vmalert reports them as healthy. Check the PodMonitor selector and the `metrics` container port on the CHI before trusting any other ClickHouse alert."

        # MergeTree refuses inserts as the disk approaches full; 15% is the
        # act-now line, 5% is minutes from write failures.
        #
        # MEASURED 2026-08-31: the denominator that stood here made BOTH of these
        # rules unfirable. `chi_clickhouse_metric_DiskFreeBytes` carries the label
        # `disk="default"`; `chi_clickhouse_metric_DiskDataBytes` carries NO `disk`
        # label. PromQL only matches two vectors when their label sets agree, so
        # `Free / (Data + Free)` matched nothing and returned an empty vector on
        # every evaluation — for as long as the rules had existed. Both loaded
        # cleanly and both read as coverage. Re-pointed at
        # `chi_clickhouse_metric_DiskTotalBytes`, which does carry `disk="default"`:
        # the ratio now returns 3 series (one per replica) at 0.607, and the
        # thresholded expressions correctly return nothing on a healthy store.
        #
        # The old formulation was also conceptually wrong, not merely broken by
        # labels: `Data` is what ClickHouse stores (~70 MiB) while `Free` is
        # whole-filesystem free space, so `Free / (Data + Free)` would have sat at
        # ~0.9998 forever even with matching labels.
        #
        # WHAT THIS RATIO ACTUALLY MEASURES, which is not the PVC: `standard` is
        # `rancher.io/local-path`, whose PVs are hostPath directories with no
        # quota, so ClickHouse sees the NODE's filesystem. DiskTotalBytes reads
        # 507 GiB identically on all three replicas — not the 10Gi each PVC asks
        # for. The 10Gi is a scheduling request and nothing more, and
        # `allowVolumeExpansion` is unset so it cannot be grown either. Treat a
        # firing here as "the node hosting this replica is filling", which is
        # shared with every other pod on that node. KubeNodeDiskPressure covers
        # the same ground from the kubelet's side and fires later; this pair is
        # the earlier, ClickHouse-attributed warning.
        #
        # `disk="default"` pinned since the RustFS cold tier (03-storage-rustfs.xml,
        # 2026-09-07): the exporter now also publishes these two families for the
        # `s3` and `s3_cache` disks. An object-storage disk reports total and free
        # as the UInt64 ceiling, so an unpinned ratio would carry two extra
        # always-healthy series per replica. VERIFY-AT-KIND: the label set on the
        # new series has not been read off a live cluster yet; run
        # `chi_clickhouse_metric_DiskTotalBytes` grouped by `disk` and record it.
        - alert: ClickHouseDiskAlmostFull
          expr: |
            chi_clickhouse_metric_DiskFreeBytes{disk="default"}
              / chi_clickhouse_metric_DiskTotalBytes{disk="default"} < 0.15
          for: 15m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseDiskAlmostFull.md"
            summary: "Node filesystem under 15% free behind ClickHouse {{ $labels.hostname }}"
            description: "The filesystem backing this replica is filling. MergeTree starts refusing writes near full, and the 90-day table TTL cannot outrun a sustained ingest spike on its own. On local-path storage this is the node's filesystem, shared with every other pod on that node — check the node, not just ClickHouse."

        - alert: ClickHouseDiskCritical
          expr: |
            chi_clickhouse_metric_DiskFreeBytes{disk="default"}
              / chi_clickhouse_metric_DiskTotalBytes{disk="default"} < 0.05
          for: 5m
          labels:
            severity: critical
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseDiskCritical.md"
            summary: "Node filesystem under 5% free behind ClickHouse {{ $labels.hostname }}"
            description: "Write failures are imminent on the OTel logs/traces store. Drop the oldest partitions (ALTER TABLE … DROP PARTITION) or free space on the node. Growing the PVC is NOT an option on local-path: allowVolumeExpansion is unset and the volume has no quota to grow."

        # Early merge-starvation signal: the SERVER-WIDE active part count as a
        # trend. The guards that actually delay and throw —
        # parts_to_delay_insert / parts_to_throw_insert — count active parts in
        # ONE partition, not across the server; the "default 300 per partition
        # throws" this comment used to state was stale, and the live values
        # belong in system.merge_tree_settings, not here. The per-partition
        # dimension is ClickHouseTooManyPartsPerPartition below (2026-09-08).
        # Casing verified on the Kind cluster 2026-08-22:
        # chi_clickhouse_metric_PartsActive, exactly as written.
        - alert: ClickHouseTooManyParts
          expr: chi_clickhouse_metric_PartsActive > 300
          for: 10m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseTooManyParts.md"
            summary: "ClickHouse active parts high ({{ $labels.hostname }})"
            description: "Active part count is sustained above 300 — merges are not keeping up with inserts. Left alone this ends in delayed, then rejected inserts."

        # The guard's own dimension. parts_to_delay_insert and
        # parts_to_throw_insert count active parts in ONE partition, and otel.*
        # partitions are calendar days — so a bad hour of tiny inserts piles
        # parts into today's partition while PartsActive, spread over ~90
        # partitions per table, barely moves. MaxPartCountForPartition is the
        # server's max over every partition of every MergeTree table.
        # ClickHouse's own description of the metric says values above 300
        # indicate "misconfiguration, overload, or massive data loading", and
        # that is the threshold — not the 100 the audit source
        # (awesome-prometheus-alerts ClickHouseTooManyPartsPerPartition) uses,
        # which at the collector's batch cadence would page for a backlog
        # merges clear on their own. Per replica from :9363 because parts are
        # local state: a replica that fell behind on merges holds more parts
        # than its peers for the same data.
        # VERIFY-AT-KIND: unthresholded, 3 series (single digits expected on a
        # healthy store). Also read the live guards —
        #   SELECT name, value FROM system.merge_tree_settings
        #   WHERE name IN ('parts_to_delay_insert','parts_to_throw_insert')
        # — and record them here so 300 has a stated distance from what throws.
        - alert: ClickHouseTooManyPartsPerPartition
          expr: max by (replica) (ClickHouseAsyncMetrics_MaxPartCountForPartition{job="clickhouse-server"}) > 300
          for: 10m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseTooManyPartsPerPartition.md"
            summary: "ClickHouse partition with too many parts ({{ $labels.replica }})"
            description: "One partition on this replica holds more than 300 active parts for 10 minutes — the dimension parts_to_delay_insert and parts_to_throw_insert actually enforce. Today's otel.* partition is the usual culprit: small, frequent inserts outrunning merges. Delayed inserts come next, then Too many parts rejections."

        # Retention SLI for the three daily-partitioned OTel tables. With a
        # 90-day DELETE TTL, a healthy table can briefly hold 91-92 active date
        # partitions around UTC boundaries and asynchronous TTL merges. More
        # than 93 for six hours means expiration is no longer advancing. Pin
        # active="1": the exporter publishes another series for inactive parts.
        # `max` removes the replica/hostname dimension without tripling the
        # count. Live Kind audit 2026-09-14: all three tables returned 6.
        - alert: ClickHouseOtelTTLLagging
          expr: |
            max by (database, table) (
              chi_clickhouse_table_partitions{
                database="otel",
                table=~"otel_logs|otel_traces|otel_traces_trace_id_ts",
                active="1"
              }
            ) > 93
          for: 6h
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseOtelTTLLagging.md"
            summary: "ClickHouse OTel TTL is not retiring partitions ({{ $labels.table }})"
            description: "The daily-partitioned otel.{{ $labels.table }} table has retained more than 93 active partitions for 6 hours despite its 90-day DELETE TTL. Ingestion can remain healthy while retention, TTL merges, or object-store access is stuck; verify partition ages and TTL merge errors before forcing any materialization."

        # Event-counter names verified on the Kind cluster 2026-08-22, and THREE
        # of the four alerts that stood here were deleted because the series they
        # named do not exist. The exporter publishes 166 chi_clickhouse_event_*
        # series and 920 chi_*/clickhouse series in total; a name search for
        # RejectedInserts, FailedInsertQuery, FailedMerges -- and for `Failed`
        # anywhere in a chi_ series -- returns nothing.
        #
        # CORRECTION (2026-08-28, RFC-0028): the deletions were right in outcome
        # but wrong in reasoning, and the reasoning is what gets reused. The
        # exporter builds chi_clickhouse_event_* from system.events, which OMITS
        # every counter still at zero -- so absence on a quiet lab proves the
        # event never fired, not that the name is wrong. Two of those three names
        # are in fact real ClickHouse ProfileEvents (RejectedInserts,
        # FailedInsertQuery); only FailedMerges is fiction. The server's own
        # :9363 endpoint publishes every ProfileEvent unconditionally, zeros
        # included, so those two are re-pointable at
        # ClickHouseProfileEvents_{RejectedInserts,FailedInsertQuery} and
        # verifiable at rest. Recorded as a follow-up rather than widened into
        # that PR — closed 2026-09-08 by ClickHouseInsertsRejected and
        # ClickHouseInsertsFailing directly below ClickHouseInsertsDelayed.
        #
        # This is exactly the failure the VERIFY-AT-KIND convention was invented
        # for: an expression naming a series that does not exist loads cleanly,
        # never fires, and is indistinguishable from a healthy alert. Three of
        # these had been sitting here reading as coverage.
        #
        # What still covers the condition, with real series: the chain is
        # too-many-parts -> delayed inserts -> rejected inserts, and its first two
        # links are alerted above by ClickHouseTooManyParts (PartsActive) and by
        # ClickHouseInsertsDelayed below. Losing the terminal link costs little,
        # because nothing reaches it without passing the first two.
        - alert: ClickHouseInsertsDelayed
          # chi_clickhouse_metric_DelayedInserts, NOT the event_ family: this is a
          # gauge of currently-delayed inserts, so `> 0 for 10m` is the right shape
          # and rate() over it would be meaningless.
          expr: chi_clickhouse_metric_DelayedInserts > 0
          for: 10m
          labels:
            severity: info
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseInsertsDelayed.md"
            summary: "ClickHouse throttling inserts ({{ $labels.hostname }})"
            description: "Inserts are being slowed by the parts_to_delay_insert guard — the step before outright rejection. Watch the parts and merges panels."

        # The terminal link of parts -> delayed -> rejected, restored on the
        # names the 2026-08-28 CORRECTION above called verifiable: the :9363
        # endpoint publishes every ProfileEvent at zero, so both series exist
        # at rest and `rate() > 0` is checkable at the gate. The compose twin
        # (local-stack/observability/vmalert/rules/clickhouse.yaml) has carried
        # both under these exact names since 2026-08-13; the cluster lacked
        # them only because the exporter could not prove the names existed.
        # Warning, not critical: the collector's sending_queue and
        # retry_on_failure absorb a rejection burst, and ClickHouseExporterUnhealthy
        # fires when they stop absorbing — that one is the page.
        # RejectedInserts is the too-many-parts guard specifically.
        # FailedInsertQuery is every INSERT that errored for ANY reason — a
        # schema mismatch after a collector upgrade, a readonly replica, a bad
        # password — so it is the broader net and the runbook starts by asking
        # which. The schema Job runs DDL only, so it does not trip it.
        # Audit source (2026-09-08): awesome-prometheus-alerts
        # ClickHouseRejectedInsertQueries; `max by (replica)` and the job filter
        # are ours, and `rate() > 0` replaces the source's `increase[1m] > 2`
        # because two rejections a minute is already a broken pipeline.
        # VERIFY-AT-KIND: both unthresholded forms return 3 series at 0.
        - alert: ClickHouseInsertsRejected
          expr: max by (replica) (rate(ClickHouseProfileEvents_RejectedInserts{job="clickhouse-server"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseInsertsRejected.md"
            summary: "ClickHouse rejecting inserts ({{ $labels.replica }})"
            description: "The parts_to_throw_insert guard has been rejecting INSERTs on this replica for 5 minutes (Too many parts). The collector retries, then drops; ClickHouseInsertsDelayed and ClickHouseTooManyPartsPerPartition should already be firing. Merges are not keeping up — check merge failures and memory before touching the guard."

        - alert: ClickHouseInsertsFailing
          expr: max by (replica) (rate(ClickHouseProfileEvents_FailedInsertQuery{job="clickhouse-server"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseInsertsFailing.md"
            summary: "ClickHouse INSERT queries failing ({{ $labels.replica }})"
            description: "INSERT queries on this replica have been erroring for 5 minutes — telemetry rows are being refused at the door. This counter covers every cause: too many parts (see ClickHouseInsertsRejected), a readonly replica, a schema that no longer matches what the collector sends, or credentials. Break it down by error code with ClickHouseErrorMetric_* or system.query_log."

        # system.errors is broad by design: a sustained error rate across the
        # server is worth a look even when no specific alert fired.
        #
        # MEASURED 2026-08-31: the series this rule was written against —
        # `chi_clickhouse_system_errors_value` — does not exist. Zero series, so
        # the rule had never been able to fire. It is the same failure the three
        # sibling alerts were deleted for on 2026-08-22, and the reason those were
        # deleted rather than repointed was that no working name existed. One does
        # now: the :9363 scrape RFC-0028 added publishes the
        # `ClickHouseErrorMetric_<CODE>` family unconditionally, zeros included,
        # plus a ready-made total `ClickHouseErrorMetric_ALL` — a cumulative
        # counter, so rate() is the right shape. MEASURED at 137 / 226 / 220
        # across the three replicas, and the thresholded expression correctly
        # returns nothing on a healthy store.
        #
        # `max by (replica)` rather than a bare `sum`, and this CHANGES WHAT THE
        # ALERT MEANS — worth stating plainly rather than smuggling in behind a
        # bug fix. The old expression was a fleet census: three replicas at 3/s
        # each would have summed to 9/s and fired. This one is a worst-replica
        # outlier: the same load never trips it, because no single replica clears
        # 5. The trade is deliberate. The metric is now per-replica, the actionable
        # question at three replicas is WHICH one is spraying errors, and a sum
        # answers that with a number nobody can act on — the same reasoning that
        # aggregated ClickHouseReplicaUnreachable by hostname. The summary
        # interpolates `replica` so the aggregation actually buys something.
        #
        # THRESHOLD, honestly: 5/s is a production-scale number this lab cannot
        # exercise. MEASURED 2026-08-31 over 3h of history, the largest real burst
        # on this cluster — visible simultaneously on all three replicas, most
        # likely a schema-job or health-probe storm — worked out to ~0.17/s. Firing
        # here would take roughly 3000 errors in ten minutes on one replica. Kept
        # at 5 rather than tuned down to something this cluster can reach: the
        # counter folds in entirely routine codes (a mistyped query raises
        # UNKNOWN_IDENTIFIER, an auth probe raises AUTHENTICATION_FAILED), so a
        # lab-scale threshold would be noise at info severity and worse than
        # silence.
        #
        # Counter, not gauge: ClickHouseErrorMetric_ALL resets to 0 when a pod
        # restarts. rate() handles the reset arithmetically, and `for: 10m`
        # absorbs the one distorted sample a fresh boot can produce when startup
        # errors land in a very short elapsed window.
        #
        # The `job=` filter is a deliberate departure from this file's convention
        # of leaving family-specific metrics unfiltered, and the collision it
        # guards against is REAL rather than hypothetical. MEASURED 2026-08-31:
        # ClickHouseMetrics_KeeperOutstandingRequests is published under BOTH
        # job="clickhouse-server" and job="keeper-keeper". The
        # ClickHouseAsyncMetrics_Keeper* names this file's new rules use are
        # keeper-only today, but the sibling ClickHouseMetrics_Keeper* family
        # already overlaps. Since job="keeper-keeper" carries `pod` and NO
        # `replica` label, an unfiltered `by (replica)` over an overlapping family
        # would silently mint a `replica=""` series and report an anonymous fourth
        # member. One label selector, and the question never comes up.
        - alert: ClickHouseServerErrorsElevated
          expr: max by (replica) (rate(ClickHouseErrorMetric_ALL{job="clickhouse-server"}[5m])) > 5
          for: 10m
          labels:
            severity: info
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseServerErrorsElevated.md"
            summary: "ClickHouse error rate elevated ({{ $labels.replica }})"
            description: "This replica is accumulating errors across every system.errors code faster than 5/s for 10 minutes. The counter is deliberately broad and includes harmless codes — a mistyped query raises UNKNOWN_IDENTIFIER too — which is why this is info and not a page. Break it down by code with the ClickHouseErrorMetric_* series, or the top-N errors table on the server-engine dashboard."

        # Cold tier on RustFS (2026-09-07). While RustFS is unreachable or the
        # bucket/credentials are wrong: INSERTs still land on the hot volume and
        # queries pruned to the last 7 days succeed, but anything touching a cold
        # partition fails, and background moves, cold-part merges and cold-part
        # TTL drops fail and retry. The server counts every such failure under
        # the S3_ERROR code, which the :9363 endpoint publishes per code as
        # ClickHouseErrorMetric_S3_ERROR the same way it publishes _ALL above.
        # `max by (replica)` for the same reason as ServerErrorsElevated: one
        # alert per sick replica, not per code. VERIFY-AT-KIND: the family is
        # proven (every error code is exported); this exact series appears only
        # once an S3 error has happened, so run the unthresholded form after the
        # first deliberate RustFS outage and record the result here.
        - alert: ClickHouseS3Errors
          expr: max by (replica) (rate(ClickHouseErrorMetric_S3_ERROR{job="clickhouse-server"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseS3Errors.md"
            summary: "ClickHouse cannot reach its RustFS cold tier ({{ $labels.replica }})"
            description: "This replica has been failing S3 requests for 10 minutes: the RustFS Service is unreachable, or the clickhouse-otel bucket or its credentials are wrong. Hot-window queries and INSERTs are unaffected; queries over partitions older than 7 days fail, and TTL moves and cold-part drops retry until it clears. A replica that restarts during the outage stays down on the disk access check until RustFS returns."

        - alert: ClickHouseOperatorReconcileErrors
          expr: rate(clickhouse_operator_host_reconciles_errors[15m]) > 0
          for: 15m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseOperatorReconcileErrors.md"
            summary: "ClickHouse operator reconcile errors"
            description: "Host reconciles are erroring — the CHI may be stuck between spec and reality. Check operator logs and recent CHI changes."

        # The consumer-side view: the OTel Collector's clickhouse exporter.
        # Complements OtelCollectorDown (otel-collector-alerts.yaml) — the collector
        # can be perfectly up while its ClickHouse exporter backpressures.
        - alert: ClickHouseExporterUnhealthy
          expr: |
            sum(rate(otelcol_exporter_send_failed_log_records{exporter="clickhouse"}[5m])) > 0
              or sum(rate(otelcol_exporter_send_failed_spans{exporter="clickhouse"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseExporterUnhealthy.md"
            summary: "OTel → ClickHouse export failing"
            description: "The Collector's clickhouse exporter has been failing sends for 10 minutes — OTel logs/traces are not landing in the OLAP store (VictoriaLogs/VictoriaTraces keep their own copies)."

        # Enabled by RFC-0028 — the replication this rule was written for now
        # exists — but deliberately moved OFF the chi_clickhouse_event_* family
        # it was originally written against.
        #
        # The reason matters beyond this rule. The Altinity exporter builds
        # chi_clickhouse_event_* from system.events, and system.events OMITS any
        # counter still at zero. So a chi_clickhouse_event_* name can never be
        # confirmed on a healthy cluster: absence proves the event has not fired
        # and says nothing about whether the name is right. That is the same test
        # that condemned three sibling alerts on 2026-08-22 — and at least two of
        # those names (RejectedInserts, FailedInsertQuery) are real ClickHouse
        # events which were simply idle on a quiet lab. Restoring them on
        # verifiable names was recorded as a follow-up, not smuggled in here —
        # and landed 2026-09-08 as ClickHouseInsertsRejected / InsertsFailing.
        #
        # The server's own :9363 endpoint writes every ProfileEvent
        # unconditionally, zeros included, so this name IS checkable at the gate
        # and carries a per-replica label as a bonus.
        # VERIFIED AT KIND 2026-08-28, positively rather than by name lookup: the
        # keeper drills drove it to 35 / 27 / 30 across the three replicas, and
        # VictoriaMetrics carries those values. The series is real and it moves.
        - alert: ClickHouseZooKeeperExceptions
          expr: rate(ClickHouseProfileEvents_ZooKeeperHardwareExceptions[5m]) > 0
          for: 5m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseZooKeeperExceptions.md"
            summary: "ClickHouse Keeper exceptions ({{ $labels.replica }})"
            description: "Network-level Keeper exceptions on the replication path from this replica. A replica that cannot reach the quorum stops accepting writes and stops fetching parts from its peers — it drifts silently while still answering reads. Check the quorum: kubectl -n monitoring get pods -l clickhouse-keeper.altinity.com/chk=keeper."

        # The quorum's own view of itself, which nothing in this file read until
        # now. Everything above is the SERVER's opinion of Keeper — fetch errors,
        # ZooKeeper exceptions, a read-only replica — so every existing signal is
        # a symptom observed one hop away. These two ask the quorum directly.
        #
        # The data was already being collected and simply had no consumer: the
        # operator chart's keeperMetrics ServiceMonitor has been scraping the CHK
        # since RFC-0028 (job="keeper-keeper", 3 targets, 30s), and the CHK enables
        # prometheus/* plus the named port for exactly this reason. MEASURED
        # 2026-08-31: ClickHouseAsyncMetrics_KeeperIsLeader is 3 series with
        # precisely one at 1, and KeeperSyncedFollowers is 3 series where the
        # LEADER reports 2 and both followers report 0.
        #
        # That last detail decides the aggregator. Followers do not know the
        # synced-follower count and publish 0, so min() and avg() would both read
        # a healthy quorum as broken. max() takes the leader's answer, which is
        # the only one that exists.
        #
        # `OR on() vector(0)` is not decoration. If every keeper pod disappears,
        # so does every series, and a bare `count(...) == 0` would evaluate
        # against an empty vector and stay silent through the exact outage it was
        # written for — which is the whole defect this commit exists to fix. The
        # idiom matches prometheusrules/postgres/cnpg/cluster-offline.yaml.
        # VERIFIED 2026-08-31 against a deliberately nonexistent metric name: the
        # guarded form returns 0 and the comparison fires.
        #
        # What is NOT verified: the firing condition, same honest caveat as
        # ClickHouseReadonlyReplica below. Confirming it needs two of three keeper
        # pods held down past the 30s session timeout, which was not done here.
        # The expressions are proven to return series and proven to stay silent on
        # a healthy quorum; they are not proven to have paged anyone. The 5m `for`
        # is likewise a design estimate sized against the 30s scrape interval, not
        # a measured recovery window.
        #
        # Two known gaps, recorded so the next reader does not have to rediscover
        # them from an empty search:
        #
        # 1. Split brain is unhandled. `count(IsLeader == 1) > 1` is never checked,
        #    so two disjoint ensembles each electing a leader — a mangled
        #    raft_configuration, a node re-added without updating its peers — would
        #    pass silently. Raft's term guarantees make it unlikely, not
        #    impossible, and it is one more rule if it ever seems worth it.
        # 2. Three more keeper series are scraped and unused, all measured
        #    2026-08-31: ClickHouseAsyncMetrics_KeeperZnodeCount (~1151),
        #    Keeper{Avg,Min,Max}Latency (all 0), and
        #    ClickHouseMetrics_KeeperOutstandingRequests (0). No threshold for any
        #    of them is guessable on an idle lab — latency is pegged at zero and
        #    znode count has no defined ceiling — so they are deliberately left
        #    alone. Two alerts that hold up beat four that were invented.
        - alert: ClickHouseKeeperNoLeader
          expr: |
            (count(ClickHouseAsyncMetrics_KeeperIsLeader == 1) OR on() vector(0)) == 0
          # 5m, not the 2m a raft election would justify on its own. Elections are
          # sub-second, but a leader pod restart hides the new leader until the
          # next 30s scrape, and an operator upgrade rolls all three pods in
          # sequence — this file already records that operator bumps cause a
          # one-time rolling restart. 5m rides that out and matches the `for` every
          # other critical in this group uses.
          for: 5m
          labels:
            severity: critical
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseKeeperNoLeader.md"
            summary: "ClickHouse Keeper has no leader — replicated writes are blocked"
            description: "No Keeper reports itself leader, so the quorum is gone: every ReplicatedMergeTree table becomes read-only, INSERTs fail, and replicas stop fetching parts. SELECTs keep working, which is why nothing else looks wrong. Check the pods (kubectl -n monitoring get po -l clickhouse-keeper.altinity.com/chk=keeper) and ask each one directly: echo mntr | nc 127.0.0.1 2181 — healthy is exactly one leader with zk_synced_followers 2. Do not delete Keeper PVCs; they hold the raft log."

        # VERIFY-AT-KIND: the `< 2` literal hardcodes a 3-node ensemble. It is
        # correct for the CHK as it stands (replicasCount: 3 in
        # configs/clickhouse-keeper/clickhousekeeperinstallation.yaml) and wrong the day
        # anyone scales that number: at 5 keepers a healthy leader reports 4
        # synced followers, so losing two — genuinely degraded, quorum barely
        # intact — would not trip `< 2` until three of four were gone.
        #
        # Flagged rather than solved, deliberately, because the obvious
        # scale-invariant forms are all worse until tested. `KeeperFollowers -
        # KeeperSyncedFollowers > 0` catches an out-of-sync follower but goes
        # blind when a pod is deleted, because a departed follower leaves the
        # leader's view and both terms fall together. Comparing against
        # `count(up{job=~".*keeper.*"})` has the same hole: the target disappears
        # with the pod, so the threshold shrinks to match the outage. A correct
        # version needs the CHK's DECLARED replica count as the denominator, which
        # means sourcing it from kube-state-metrics rather than from Keeper — a
        # bigger change than this fix, and one that deserves its own drill.
        #
        # If you scale the CHK, change this literal in the same commit. The
        # AllReplicasUnreachable rule above escaped the same trap by switching to
        # a ratio; this one has not, and pretending otherwise is how the trap gets
        # reset.
        - alert: ClickHouseKeeperQuorumDegraded
          expr: |
            (max(ClickHouseAsyncMetrics_KeeperSyncedFollowers) OR on() vector(0)) < 2
          # Matched to ClickHouseKeeperNoLeader's 5m on purpose. A total quorum
          # loss makes both conditions true at the same instant, and the pair is
          # meant to land as one incident — the way ReplicaUnreachable and
          # AllReplicasUnreachable already do at 5m each. At 10m this would have
          # arrived as a warning eight minutes into an outage that had already
          # paged critical, reading like a second, lesser event.
          for: 5m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseKeeperQuorumDegraded.md"
            summary: "ClickHouse Keeper quorum degraded — no redundancy left"
            description: "The Keeper leader has fewer than two synced followers, so the 3-node quorum has lost a member. Writes still work; losing one more takes the quorum down and turns every replicated table read-only. Usually a pod or PVC problem rather than a Keeper problem — treat it as Kubernetes first. This fires alongside ClickHouseKeeperNoLeader on a total loss, by design: the pair reads the same way as the ReplicaUnreachable/AllReplicasUnreachable pair above."

        # The engine's own answer to "did this replica lose the quorum", from the
        # per-pod :9363 scrape RFC-0028 enabled. A read-only replica still serves
        # SELECTs, so nothing else in this file would notice.
        # VERIFIED AT KIND 2026-08-28: three series, one per replica, all 0 on a
        # healthy store, and the PodMonitor shows three `clickhouse-server`
        # targets up. Before this change zero ClickHouse* series existed at all,
        # because nothing scraped :9363.
        # What is NOT verified: the firing condition. Deleting all three keepers
        # did not produce a read-only replica — the pods were recreated fast
        # enough that no ClickHouse session expired (measured: is_readonly stayed
        # 0 throughout, SELECTs kept serving). So the name and the plumbing are
        # proven; the alert's trigger has not been exercised, and saying so is
        # more useful than implying it was.
        - alert: ClickHouseReadonlyReplica
          expr: ClickHouseMetrics_ReadonlyReplica > 0
          for: 5m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseReadonlyReplica.md"
            summary: "ClickHouse replica is read-only ({{ $labels.replica }})"
            description: "This replica has lost its ClickHouse Keeper session and can no longer accept writes or fetch parts. Reads still succeed, so the topology looks healthy from the outside while one of three copies falls behind. Check the keeper quorum first: kubectl -n monitoring get pods -l clickhouse-keeper.altinity.com/chk=keeper."

        # --- Replication, measured from each replica's own :9363 endpoint ---
        #
        # Three rules from the awesome-prometheus-alerts audit (2026-09-08),
        # each a replicated-topology failure nothing above observes directly.
        # Everything else here about replication is a symptom seen from one
        # side: KeeperNoLeader is the quorum's view of itself, ZooKeeperExceptions
        # is a rate of network errors, ReadonlyReplica is the end state. None
        # of them can say "this replica is twenty minutes behind its peers" —
        # which, behind a 3-replica round-robin Service, means a third of
        # Grafana queries read stale data with no error anywhere.

        # ReplicasMaxAbsoluteDelay: the largest absolute_delay over every
        # Replicated table on this replica, in seconds — how far its applied
        # replication log trails the freshest replica. 300s is the audit
        # source's threshold, kept as is: at the collector's batch cadence a
        # healthy replica sits at 0-2s, and five minutes behind means the fetch
        # queue is stuck (network, disk, a part that fails to fetch), not busy.
        # The exporter publishes the same number as
        # chi_clickhouse_metric_ReplicasMaxAbsoluteDelay per hostname; :9363 is
        # read here for the `replica` label and for consistency with the rest
        # of the per-replica rules.
        # VERIFY-AT-KIND: unthresholded, 3 series at ~0. Then hold one
        # replica's pod down for >5m and confirm its peers do NOT fire (delay is
        # measured on the replica that is behind, which is the one that is
        # down) while the fetch queue drains on its return.
        - alert: ClickHouseReplicationLag
          expr: max by (replica) (ClickHouseAsyncMetrics_ReplicasMaxAbsoluteDelay{job="clickhouse-server"}) > 300
          for: 10m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseReplicationLag.md"
            summary: "ClickHouse replica more than 5 minutes behind ({{ $labels.replica }})"
            description: "This replica's replication log trails the freshest replica by {{ $value | humanizeDuration }}. Queries the round-robin Service sends here return stale data with no error; the collector keeps writing to the others. Check system.replicas for queue_size and the oldest queue entry's last_exception — a single un-fetchable part blocks everything behind it."

        # ZooKeeperSession is a gauge of live Keeper sessions on this server:
        # exactly 1 when healthy — ClickHouse's own description says it "should
        # be no more than one" — and 0 while the session is lost or being
        # re-established. It sits between the two signals this file already
        # had. ZooKeeperExceptions is a rate and goes quiet the moment the
        # server stops retrying; ReadonlyReplica needs a table to actually flip,
        # which the 2026-08-28 keeper drills never produced because every
        # session re-established inside session_timeout_ms (30000). This gauge
        # drops to 0 the instant the connection is gone, so it is the one
        # replication signal a Keeper pod restart DOES exercise, and its
        # healthy value is checkable at rest.
        # 2m, not 5m: a session re-establishes in seconds, and against a 30s
        # scrape two consecutive misses already mean something.
        # The job= filter is load-bearing — see ServerErrorsElevated for the
        # ClickHouseMetrics_* overlap with job="keeper-keeper".
        # VERIFY-AT-KIND: unthresholded, 3 series all exactly 1; then delete
        # one keeper pod and watch the gauge on each replica for the dip.
        - alert: ClickHouseKeeperSessionLost
          expr: max by (replica) (ClickHouseMetrics_ZooKeeperSession{job="clickhouse-server"}) < 1
          for: 2m
          labels:
            severity: warning
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseKeeperSessionLost.md"
            summary: "ClickHouse replica has no Keeper session ({{ $labels.replica }})"
            description: "This replica has had no live ClickHouse Keeper session for 2 minutes. Past session_timeout_ms (30s) every Replicated table on it turns readonly (ClickHouseReadonlyReplica follows) and it stops fetching parts. Check the quorum (ClickHouseKeeperNoLeader / QuorumDegraded) and this pod's network path to keeper-keeper:2181 — system.zookeeper_connection on the replica shows is_expired and the host it last reached."

        # ReplicatedDataLoss: the replica needed a part, asked every peer
        # including the offline ones, and none had it. ClickHouse gives up and
        # moves on, so the rows are gone; the only trace is this counter and a
        # log line. Critical at the first increment — there is no rate at which
        # losing telemetry rows is acceptable — and `increase[10m]` rather than
        # rate() so one event stays visible for ten minutes against a 30s
        # scrape. On this platform the way to get here is losing one replica's
        # PVC while its peers had already TTL-dropped the part, or a broken
        # part detached on every copy — check in that order.
        # Audit source (2026-09-08): awesome-prometheus-alerts
        # ClickHouseReplicatedDataLoss, widened from [1m] to [10m].
        # VERIFY-AT-KIND: unthresholded `ClickHouseProfileEvents_ReplicatedDataLoss`
        # returns 3 series at 0 (ProfileEvents are published at zero).
        - alert: ClickHouseReplicatedDataLoss
          expr: max by (replica) (increase(ClickHouseProfileEvents_ReplicatedDataLoss{job="clickhouse-server"}[10m])) > 0
          for: 1m
          labels:
            severity: critical
            category: observability
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/clickhouse/ClickHouseReplicatedDataLoss.md"
            summary: "ClickHouse replicated data loss on {{ $labels.replica }}"
            description: "A part this replica needed exists on no replica, online or offline — the rows are gone and ClickHouse has stopped trying. Find the part in this replica's logs (ReplicatedDataLoss / 'No active replica has part'), then check the other two for a matching detached or TTL-dropped part. Nothing recovers this automatically; the question is how many rows and whether VictoriaLogs/VictoriaTraces still hold the window."
