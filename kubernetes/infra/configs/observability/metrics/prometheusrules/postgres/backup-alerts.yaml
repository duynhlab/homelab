# PrometheusRule for PostgreSQL backup alerts (CNPG clusters)
# Reference: docs/databases/runbooks/postgres-backup-restore.md
#
# Metrics come from the Barman Cloud CNPG-I plugin (barman_cloud_cloudnative_pg_io_*),
# exposed by the instance-manager exporter. The pre-plugin cnpg_collector_* backup
# metrics are no longer emitted for plugin-managed backups (plugin migration guide,
# "Verify your metrics"). Freshness threshold follows the actual schedule: every-6h
# ScheduledBackup + 2h grace = 8h. The replica cluster has no ScheduledBackup, so the
# missing-series alert covers only the writable clusters (platform, product).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres-backup-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/component: alerting-rules
spec:
  groups:
    - name: postgres-backup
      interval: 5m
      rules:
        # CNPG: Last successful backup too old (> 8 hours = 6h schedule + 2h grace)
        - alert: PostgresBackupTooOld
          expr: |
            barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 0
            and (time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 28800
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL backup too old ({{ $labels.namespace }}/{{ $labels.cluster }})"
            description: "Last successful backup was more than 8 hours ago against a six-hour schedule. Check ScheduledBackup runs, the Barman Cloud plugin, and RustFS connectivity."
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/databases/runbooks/postgres-backup-restore.md"
        # CNPG: Backup failed recently
        - alert: PostgresBackupFailed
          expr: |
            (time() - barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp) < 3600
            and barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp > barman_cloud_cloudnative_pg_io_last_available_backup_timestamp
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL backup failed ({{ $labels.namespace }}/{{ $labels.cluster }})"
            description: "Backup failed in the last hour. Check cluster logs and S3 connectivity."
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/databases/runbooks/postgres-backup-restore.md"
        # Plugin health: backup metrics disappeared for a writable cluster. Catches a
        # broken plugin/sidecar/scrape path that the freshness alert cannot see
        # (no series = no alert). The generic KubeDeploymentReplicasMismatch covers
        # the barman-cloud controller deployment itself.
        - alert: PostgresBackupMetricsMissing
          expr: |
            absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="platform"})
            or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="product"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL backup metrics missing ({{ $labels.namespace }})"
            description: "No barman_cloud_cloudnative_pg_io_last_available_backup_timestamp series for a writable CNPG cluster. Backup freshness/failure alerts are blind: check the Barman Cloud plugin controller, instance sidecars, and metrics scraping."
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/databases/runbooks/postgres-backup-restore.md"
