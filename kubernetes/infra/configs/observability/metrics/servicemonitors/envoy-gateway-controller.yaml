# ServiceMonitor for the Envoy Gateway CONTROL PLANE (RFC-0024 P2).
# The gateway-helm chart has no ServiceMonitor toggle, so this is hand-rolled.
# The controller exposes Prometheus metrics on the `metrics` port (:19001) of
# the chart's `envoy-gateway` Service:
#   - watch/reconcile + xDS translation errors (control-plane health)
#   - status-update and provider queue depths
# DATA-PLANE (envoy_*) metrics are scraped separately by
# podmonitors/envoy-gateway-proxy.yaml (job="envoy-gateway"), alongside
# prometheusrules/envoy-gateway/ and the first-party dashboards.
# job label forced to `envoy-gateway-controller` so alert/recording rules get
# a stable selector.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-gateway-controller
  namespace: monitoring
spec:
  endpoints:
    - interval: 30s
      path: /metrics
      port: metrics
      scrapeTimeout: 10s
      relabelings:
        - targetLabel: job
          replacement: envoy-gateway-controller
  namespaceSelector:
    matchNames:
      - envoy-gateway
  selector:
    matchLabels:
      control-plane: envoy-gateway
