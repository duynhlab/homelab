# VMAgent - VictoriaMetrics scraping agent
# Replaces the Prometheus scraping capability.
# Auto-discovers VMServiceScrape/VMPodScrape (including those auto-converted
# from Prometheus ServiceMonitor/PodMonitor CRDs by the VM Operator).
# Docs: https://docs.victoriametrics.com/operator/resources/vmagent/
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  # Discover scrape targets in all namespaces
  selectAllByDefault: true

  remoteWrite:
    - url: "http://vmsingle-victoria-metrics.monitoring.svc:8428/api/v1/write"

  # NO cpu limit, and this is the reference note for the nine other places that
  # lost one on 2026-09-06.
  #
  # Measured: vmagent throttled **63.8%** of CFS periods while the four nodes ran
  # at 4-13% CPU with no pressure, requests sat at 5-10% of allocatable, and
  # vmagent's own average draw was 1m against a 200m limit. The throttling had
  # nothing to do with contention. A container limited to 200m gets 20ms of CPU
  # per 100ms period; a scrape cycle spends that in the first few ms and then
  # sleeps through the rest, with the machine idle. grafana proves the obvious
  # fix wrong -- it had already been raised 100m -> 300m for exactly this, and
  # was still throttled 39.8%.
  #
  # Removing the limit costs nothing to schedule: `requests` is what the
  # scheduler reserves and it is unchanged, so this fits the same machines it fit
  # before, laptops included. Under contention CFS shares derived from requests
  # still arbitrate, and an unlimited container only borrows CPU that is
  # otherwise idle. Accepted risk: a runaway process takes idle CPU instead of
  # being capped -- neighbours degrade rather than starve. Same call the Temporal
  # history service already documents.
  #
  # memory limits are NOT touched anywhere ELSE: that ceiling is real, it
  # prevents OOM, and ClickHouse sizes its own budget from it. vmagent is the one
  # exception, and it is the interesting one.
  #
  # 256Mi -> 512Mi, forced by the CPU change rather than chosen alongside it.
  # Uncapping CPU let vmagent start its 47 service-discovery routines and 78
  # targets at full speed instead of dribbling through them at 36% of a 200m
  # quota, and the startup burst then allocated past 256Mi before GC caught up:
  # **OOMKilled six times, exit 137**, within minutes of the rollout. Throttled,
  # it had sat at 129Mi and looked fine.
  #
  # The general lesson, and the reason this comment is long: removing a CPU limit
  # can turn a latent memory ceiling into a crash loop, because the workload now
  # does in seconds what it used to do in minutes. Check memory headroom on
  # anything you uncap. The other eight containers in this change were measured
  # first and sit at 8-38% of their limits, so vmagent was the only one that
  # needed it.
  #
  # Kyverno is satisfied -- require-resources asks for requests.{cpu,memory} and
  # limits.memory, never limits.cpu.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      # 512Mi -> 768Mi (2026-10-01): OOMKilled at a ~493Mi steady peak (#1158).
      memory: 768Mi

  # RFC-0014 P1 (D-3): OTLP-pushed series carry resource-attr labels
  # (service_name, k8s_namespace_name after Prometheus-naming translation);
  # copy them onto the app/namespace labels every alert, recording rule and
  # dashboard groups by. regex (.+) guards scraped series (empty source label
  # never matches, so their existing app/namespace values are untouched).
  #
  # The namespace rule is NON-CLOBBERING (fixed 2026-08-27): it fires only
  # when the series does not already carry a `namespace` label. The Temporal
  # SDK stamps its own `namespace` datapoint attribute (the TEMPORAL namespace
  # "mop"); the old unconditional replace overwrote it with the k8s namespace,
  # which blanked every SDK-side panel of the temporal dashboard on the
  # cluster while the identical compose twin worked (no k8s labels there).
  # k8s context stays available on those series as k8s_namespace_name + app.
  # Mechanics: source labels join with ";", so `^;(.+)$` matches exactly
  # "namespace empty AND k8s_namespace_name present".
  inlineRelabelConfig:
    - action: replace
      source_labels: [service_name]
      regex: "(.+)"
      target_label: app
    - action: replace
      source_labels: [namespace, k8s_namespace_name]
      regex: ";(.+)"
      target_label: namespace

  extraArgs:
    # Scrape interval matches the existing Prometheus config
    promscrape.suppressDuplicateScrapeTargetErrors: "true"
    # RFC-0014 P1 (D-1/D-2): OTLP ingest on :8429/opentelemetry/v1/metrics.
    # usePrometheusNaming: http.server.request.duration (s) → PromQL name
    # http_server_request_duration_seconds_*. promoteAll* defaults to TRUE
    # upstream — the explicit false + allowlist is the churn-bomb guard
    # (SDK-default service.instance.id/process.pid would re-mint every series
    # each restart). Scope metadata off: otel_scope_* labels have no consumer.
    opentelemetry.usePrometheusNaming: "true"
    opentelemetry.promoteAllResourceAttributes: "false"
    opentelemetry.promoteResourceAttributes: "service.name,service.version,k8s.namespace.name,k8s.pod.name,deployment.environment.name"
    opentelemetry.promoteScopeMetadata: "false"
