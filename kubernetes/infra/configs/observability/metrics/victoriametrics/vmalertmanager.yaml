apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  selectAllByDefault: true
  replicaCount: 1

  configRawYaml: |
    global:
      resolve_timeout: 5m
      # Local/dev placeholder — a syntactically valid (non-delivering) webhook so
      # the Alertmanager config loads. Real webhook is injected out-of-band into
      # OpenBAO (never committed to this public repo). See debugs BUGS-1.
      slack_api_url: 'https://hooks.slack.com/services/T00000000/B00000000/devLocalPlaceholderXXXXXXXX'

    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'slack-default'
      routes:
        - receiver: 'slack-critical'
          matchers:
            - severity="critical"
          continue: true
        - receiver: 'watchdog-null'
          matchers:
            - alertname="Watchdog"

    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal: ['alertname', 'namespace']
      - source_matchers:
          - alertname="KubeNodeNotReady"
        target_matchers:
          - severity=~"warning|critical"
        equal: ['node']
      - source_matchers:
          - alertname="VMServiceDown"
        target_matchers:
          - severity="warning"
        equal: ['job']
      # One incident, one page. Checkout fails CLOSED when inventory cannot
      # answer: every affected basket gets a real 503, so the Sloth
      # availability/error-rate budgets keep burning (correct — a failed
      # request is a failed request) and CheckoutHighErrorRate /
      # CheckoutHighOverallErrorRate go to page. But the two rules below
      # already page with the SKU ids and the actual fix, so on-call was
      # woken twice for one cause. The precise alert wins; the generic
      # burn-rate page is inhibited while it fires.
      #
      # Scoped deliberately, NOT by severity alone:
      #   - source: the two named checkout-availability alerts only
      #   - target: sloth_severity="page" (never the ticket alert — the
      #     business-hours budget record must survive) AND only the two SLOs a
      #     503 can burn. Latency is untouched: a fast 503 burns no latency
      #     budget, so a latency page during this incident is a DIFFERENT
      #     problem and must still reach someone.
      #   - equal: ['service'] — Sloth stamps service=<name> on every
      #     generated alert; the source rules now carry service=checkout
      #     (checkout-availability.yaml) so the pair only matches within one
      #     service. A blanket severity-only inhibit would hide unrelated
      #     incidents in other services.
      - source_matchers:
          - alertname=~"CheckoutAvailabilityErrors|CheckoutAvailabilityUnknownSKU"
        target_matchers:
          - sloth_severity="page"
          - sloth_slo=~"availability|error-rate"
        equal: ['service']

    receivers:
      - name: 'slack-default'
        slack_configs:
          - channel: '#alerts'
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
            text: |-
              {{ range .Alerts }}
              *Alert:* {{ .Labels.alertname }} - {{ .Labels.severity }}
              *Namespace:* {{ .Labels.namespace }}
              *Description:* {{ .Annotations.description }}
              {{ end }}
      - name: 'slack-critical'
        slack_configs:
          - channel: '#alerts-critical'
            send_resolved: true
            title: ':rotating_light: [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
            text: |-
              {{ range .Alerts }}
              *Alert:* {{ .Labels.alertname }} - {{ .Labels.severity }}
              *Namespace:* {{ .Labels.namespace }}
              *Description:* {{ .Annotations.description }}
              {{ end }}
      - name: 'watchdog-null'

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
