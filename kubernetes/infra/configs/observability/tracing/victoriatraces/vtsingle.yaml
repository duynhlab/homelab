# VTSingle - VictoriaTraces single-node trace storage (Operator-managed).
# Pilot: a THIRD tracing backend alongside Tempo + Jaeger (the OTel Collector
# fans the same OTLP traces to all three). VictoriaTraces stores traces in the
# VictoriaLogs engine — no object storage needed — and consolidates tracing onto
# the same VM Operator as metrics (VMSingle) + logs (VLSingle).
#
# Single port :10428 serves OTLP-HTTP ingest (/insert/opentelemetry/v1/traces),
# the Jaeger query API (/select/jaeger, used by the Grafana Jaeger datasource),
# LogsQL (/select/logsql/query), and /metrics (operator auto-creates a VMServiceScrape).
# Image is pinned (v0.x, pre-1.0 / fast-moving). Docs: https://docs.victoriametrics.com/victoriatraces/
apiVersion: operator.victoriametrics.com/v1
kind: VTSingle
metadata:
  name: victoria-traces
  namespace: monitoring
spec:
  retentionPeriod: "7d"

  # RFC-0027 / ADR-059: serves the Jaeger service-dependency graph at
  # /select/jaeger/api/dependencies, which Grafana's `jaeger` datasource renders
  # natively through its Dependency graph query type. Without this flag the
  # endpoint answers 200 with an empty array (measured 2026-08-24), so the
  # service map would read as broken rather than as switched off. This replaces
  # Tempo's service-graphs processor — topology and call counts, not per-edge
  # failure or latency; for those, query the spans in ClickHouse.
  extraArgs:
    servicegraph.enableTask: "true"
  # removePvcAfterDelete removed: VTSingleSpec (operator v1) never defined it —
  # the API server pruned it silently (VMSingle-only field, caught by the
  # CRDs-catalog schema check in flux-validate.sh).
  useStrictSecurity: true

  image:
    repository: victoriametrics/victoria-traces
    tag: v0.11.0

  storage:
    resources:
      requests:
        storage: 10Gi

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi
