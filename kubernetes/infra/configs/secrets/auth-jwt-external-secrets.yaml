# RFC-0009 Phase 4 — RS256 signing key material from OpenBAO (secret/local/auth/jwt-signing).
# private_key -> auth namespace, injected as JWT_PRIVATE_KEY_PEM (auth signs access JWTs).
# The public-key edge credential (ExternalSecret auth-issuer-jwt, kong namespace) was
# deleted with the Kong cutover (RFC-0024 P2.3): Envoy Gateway verifies edge JWTs via
# remoteJWKS — no provisioned key material at the edge. This ExternalSecret retires with
# auth-service itself in RFC-0024 P5.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-jwt-signing
  namespace: auth
  labels:
    app.kubernetes.io/name: auth-jwt-signing
    app.kubernetes.io/component: auth
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: auth-jwt-signing
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: private-key
      remoteRef:
        key: secret/data/local/auth/jwt-signing
        property: private_key
