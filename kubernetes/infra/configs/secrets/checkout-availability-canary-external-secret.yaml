# Checkout availability-canary bucket key (RFC-0021 W8): keys the per-user HMAC
# that decides which users read availability from inventory while the canary is
# partly open. Synced from OpenBAO so the value never sits in a manifest; the
# checkout Deployment consumes it via secretKeyRef (see the checkout ResourceSet).
# OpenBAO path: secret/data/local/services/checkout/availability-canary (seeded by openbao-bootstrap).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: checkout-availability-canary
  namespace: checkout
  labels:
    app.kubernetes.io/name: checkout-availability-canary
    app.kubernetes.io/component: checkout
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: checkout-availability-canary
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: salt
      remoteRef:
        key: secret/data/local/services/checkout/availability-canary
        property: salt
