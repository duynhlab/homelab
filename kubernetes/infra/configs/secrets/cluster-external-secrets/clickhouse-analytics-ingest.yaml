# ClusterExternalSecret for the PeerDB ClickHouse writer (RFC-0030 /
# ADR-069). One OpenBAO path (secret/local/infra/clickhouse/analytics_ingest)
# lands as the `clickhouse-analytics-ingest` Secret in two places:
#   monitoring   the CHI defines the `analytics_ingest` user from it, granted
#                ALL on the analytics database only (+ S3, temp tables)
#   peerdb       the ClickHouse peer the mirrors write through
# Explicit namespace list, like clickhouse-pg-stat-ch: no label-selected
# namespace may inherit a ClickHouse credential by accident.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: clickhouse-analytics-ingest
  labels:
    app.kubernetes.io/name: clickhouse-analytics-ingest
    app.kubernetes.io/component: olap
    app.kubernetes.io/managed-by: external-secrets
spec:
  namespaces:
    - monitoring
    - peerdb

  refreshTime: 1h

  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: openbao
      kind: ClusterSecretStore
    target:
      name: clickhouse-analytics-ingest
      creationPolicy: Owner
      deletionPolicy: Retain
      template:
        type: Opaque
        metadata:
          labels:
            app.kubernetes.io/name: clickhouse-analytics-ingest
            app.kubernetes.io/component: olap
            app.kubernetes.io/managed-by: external-secrets
        data:
          username: "{{ .username }}"
          password: "{{ .password }}"
    data:
      - secretKey: username
        remoteRef:
          key: secret/data/local/infra/clickhouse/analytics_ingest
          property: username
      - secretKey: password
        remoteRef:
          key: secret/data/local/infra/clickhouse/analytics_ingest
          property: password
