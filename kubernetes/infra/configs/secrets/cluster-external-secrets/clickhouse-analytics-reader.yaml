# ClusterExternalSecret for the analytics-service ClickHouse reader (RFC-0030 /
# ADR-069). One OpenBAO path (secret/local/infra/clickhouse/analytics_reader)
# lands as the `clickhouse-analytics-reader` Secret in two places:
#   monitoring   the CHI defines the `analytics_reader` user from it, granted
#                SELECT on the reviewed analytics.*_live views only
#   analytics    the service reads CLICKHOUSE_USER/CLICKHOUSE_PASSWORD from it
# Explicit namespace list, like clickhouse-pg-stat-ch: no label-selected
# namespace may inherit a ClickHouse credential by accident.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: clickhouse-analytics-reader
  labels:
    app.kubernetes.io/name: clickhouse-analytics-reader
    app.kubernetes.io/component: olap
    app.kubernetes.io/managed-by: external-secrets
spec:
  namespaces:
    - monitoring
    - analytics

  refreshTime: 1h

  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: openbao
      kind: ClusterSecretStore
    target:
      name: clickhouse-analytics-reader
      creationPolicy: Owner
      deletionPolicy: Retain
      template:
        type: Opaque
        metadata:
          labels:
            app.kubernetes.io/name: clickhouse-analytics-reader
            app.kubernetes.io/component: olap
            app.kubernetes.io/managed-by: external-secrets
        data:
          username: "{{ .username }}"
          password: "{{ .password }}"
    data:
      - secretKey: username
        remoteRef:
          key: secret/data/local/infra/clickhouse/analytics_reader
          property: username
      - secretKey: password
        remoteRef:
          key: secret/data/local/infra/clickhouse/analytics_reader
          property: password
