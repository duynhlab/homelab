# ClusterExternalSecret for the pg_stat_ch ClickHouse writer. One OpenBAO path
# (secret/local/infra/clickhouse/pg_stat_ch) lands as the `clickhouse-pg-stat-ch`
# Secret in two places that need it for two different reasons:
#   monitoring   the CHI defines the `pg_stat_ch` user from it (INSERT-only)
#   flux-system  databases-local substitutes ${PG_STAT_CH_CLICKHOUSE_PASSWORD}
#                into the CNPG Cluster parameter from it (postBuild.substituteFrom)
# The Secret key is the variable name Flux substitutes, hence the upper-case
# key beside the plain `password` the CHI reads. Explicit namespace list rather
# than the platform.duynhlab/clickhouse label: flux-system must not inherit the
# admin credential that label also delivers.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: clickhouse-pg-stat-ch
  labels:
    app.kubernetes.io/name: clickhouse-pg-stat-ch
    app.kubernetes.io/component: olap
    app.kubernetes.io/managed-by: external-secrets
spec:
  namespaces:
    - monitoring
    - flux-system

  refreshTime: 1h

  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: openbao
      kind: ClusterSecretStore
    target:
      name: clickhouse-pg-stat-ch
      creationPolicy: Owner
      deletionPolicy: Retain
      template:
        type: Opaque
        metadata:
          labels:
            app.kubernetes.io/name: clickhouse-pg-stat-ch
            app.kubernetes.io/component: olap
            app.kubernetes.io/managed-by: external-secrets
        data:
          username: "{{ .username }}"
          password: "{{ .password }}"
          PG_STAT_CH_CLICKHOUSE_PASSWORD: "{{ .password }}"
    data:
      - secretKey: username
        remoteRef:
          key: secret/data/local/infra/clickhouse/pg_stat_ch
          property: username
      - secretKey: password
        remoteRef:
          key: secret/data/local/infra/clickhouse/pg_stat_ch
          property: password
