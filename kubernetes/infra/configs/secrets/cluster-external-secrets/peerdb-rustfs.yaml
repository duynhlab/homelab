# ClusterExternalSecret for PeerDB's ClickHouse staging bucket
# (analytics-service-cdc, RFC-0030 / ADR-066). Creates the Secret in any
# namespace labeled platform.duynhlab/s3-peerdb: "true" (currently: peerdb).
#
# Reuses the shared RustFS key, like Pyroscope and ClickHouse: RustFS 1.0.1 has
# no per-bucket identity tooling here yet. Owner decision 2026-10-23 (#1315):
# accepted as a recorded isolation gap, docs/security/policy-exceptions.md.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: peerdb-rustfs
  labels:
    app.kubernetes.io/name: peerdb-rustfs-credentials
    app.kubernetes.io/component: cdc
    app.kubernetes.io/managed-by: external-secrets
spec:
  namespaceSelector:
    matchLabels:
      platform.duynhlab/s3-peerdb: "true"
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: openbao
      kind: ClusterSecretStore
    target:
      name: peerdb-rustfs-credentials
      creationPolicy: Owner
      deletionPolicy: Retain
      template:
        type: Opaque
        metadata:
          labels:
            app.kubernetes.io/name: peerdb-rustfs-credentials
            app.kubernetes.io/component: cdc
            app.kubernetes.io/managed-by: external-secrets
    data:
      - secretKey: ACCESS_KEY_ID
        remoteRef:
          key: secret/data/local/infra/rustfs/backup-cnpg
          property: access_key_id
      - secretKey: ACCESS_SECRET_KEY
        remoteRef:
          key: secret/data/local/infra/rustfs/backup-cnpg
          property: secret_access_key
