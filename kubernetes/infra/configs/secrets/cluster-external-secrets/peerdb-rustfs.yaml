# ClusterExternalSecret for PeerDB's ClickHouse staging bucket
# (analytics-service-cdc, RFC-0030 / ADR-066). Creates the Secret in any
# namespace labeled platform.duynhlab/s3-peerdb: "true" (currently: peerdb).
#
# The `peerdb` IAM user (OpenBAO secret/local/infra/rustfs/peerdb), scoped by
# the RustFS setup Job to the `analytics-service-cdc` bucket only — the
# identity half of ADR-066's isolation obligation (#1315).
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: peerdb-rustfs
  labels:
    app.kubernetes.io/name: peerdb-rustfs-credentials
    app.kubernetes.io/component: cdc
    app.kubernetes.io/managed-by: external-secrets
spec:
  namespaceSelector:
    matchLabels:
      platform.duynhlab/s3-peerdb: "true"
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: openbao
      kind: ClusterSecretStore
    target:
      name: peerdb-rustfs-credentials
      creationPolicy: Owner
      deletionPolicy: Retain
      template:
        type: Opaque
        metadata:
          labels:
            app.kubernetes.io/name: peerdb-rustfs-credentials
            app.kubernetes.io/component: cdc
            app.kubernetes.io/managed-by: external-secrets
    data:
      - secretKey: ACCESS_KEY_ID
        remoteRef:
          key: secret/data/local/infra/rustfs/peerdb
          property: access_key_id
      - secretKey: ACCESS_SECRET_KEY
        remoteRef:
          key: secret/data/local/infra/rustfs/peerdb
          property: secret_access_key
