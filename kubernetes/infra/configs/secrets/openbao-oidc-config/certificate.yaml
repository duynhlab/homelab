# Live-CA trust anchor for the OIDC discovery fetch (ADR-062 fix).
#
# WHY NOT the trust-manager bundle: homelab-ca-bundle is built from
# configs/cert-manager/ca-source/homelab-ca.crt — a STATIC copy committed to
# git on purpose (staged CA rollover). But every `make down && make up`
# regenerates the homelab-ca keypair, so on a rebuilt Kind cluster the
# committed copy can never match the CA that actually signed
# platform-edge-tls — the discovery fetch then fails
# `x509: ECDSA verification failure ... candidate authority "homelab-ca"`
# (measured 2026-08-26). This Certificate is issued by the LIVE homelab-ca
# ClusterIssuer, so its secret's ca.crt is the current cluster's CA by
# construction, on every rebuild. The leaf itself is unused — only ca.crt is.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-idp-trust
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-idp-trust
    app.kubernetes.io/component: secrets
spec:
  secretName: openbao-idp-trust
  commonName: openbao-idp-trust.openbao.svc
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: homelab-ca
