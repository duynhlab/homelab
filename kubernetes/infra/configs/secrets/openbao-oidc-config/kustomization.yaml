apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# OpenBAO staff OIDC configurator (ADR-062). Reconciled by
# openbao-oidc-config-local AFTER envoy-gateway-config — the discovery fetch
# hairpins https://id.duynh.me through the edge (CoreDNS rewrite), so both
# Keycloak and the Gateway must be serving before auth/oidc/config can be
# written. Deliberately NOT part of ./configs/secrets (the bootstrap wave).
resources:
  - certificate.yaml
  - oidc-config.yaml
