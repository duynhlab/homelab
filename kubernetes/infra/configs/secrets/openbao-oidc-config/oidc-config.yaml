# openbao-oidc-config — point OpenBAO's auth/oidc at the staff realm and map
# the team groups to policies (ADR-062). Second user of the ADR-025 pattern-A
# configurator shape (see openbao-db-config): the bootstrap Job cannot do this
# because auth/oidc/config validates the discovery URL at write time and
# Keycloak (plus the edge hairpin id.duynh.me resolves through) comes up
# several Flux waves later — and root is revoked by then. This Job
# authenticates via Kubernetes auth (role oidc-configurator, created by the
# bootstrap) — NO root token. Idempotent + retries until the discovery
# endpoint answers.
#
# Trust: the trust-manager Bundle projects homelab-ca-bundle (system CAs +
# homelab-ca) into this namespace (needs-trust label on the openbao ns); it is
# passed as oidc_discovery_ca_pem so the hairpinned discovery fetch trusts the
# edge's locally-signed wildcard. On a cluster with a publicly-trusted edge
# cert the bundle still works — it contains the default CAs too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-oidc-configurator
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-oidc-configurator
    app.kubernetes.io/component: secrets
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-oidc-config
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao-oidc-config
    app.kubernetes.io/component: secrets
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-oidc-config
        app.kubernetes.io/component: secrets
    spec:
      serviceAccountName: openbao-oidc-configurator
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oidc-config
          image: openbao/openbao:2.6.2
          env:
            - name: HOME
              value: /tmp
            # Pinned to the ACTIVE node, not the round-robin `openbao` Service:
            # this Job WRITES, and a standby answers a write with a 307 to the
            # active pod's IP which this client cannot follow (same class as
            # the openbao-db-config hang; see that file's comment).
            - name: BAO_ADDR
              value: http://openbao-active.openbao.svc.cluster.local:8200
          command:
            - sh
            - -c
            - |
              set -e
              echo "Logging in to OpenBAO via k8s auth (oidc-configurator)..."
              JWT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              n=0
              until BAO_TOKEN="$(bao write -field=token auth/kubernetes/login role=oidc-configurator jwt="$JWT" 2>/dev/null)"; [ -n "$BAO_TOKEN" ]; do
                n=$((n + 1)); [ "$n" -ge 30 ] && { echo "ERROR: k8s-auth login failed after 150s"; exit 1; }
                echo "  login not ready, retry 5s..."; sleep 5
              done
              export BAO_TOKEN

              echo "Reading the openbao client secret from KV..."
              CLIENT_SECRET="$(bao kv get -field=openbao_client_secret secret/local/infra/keycloak/oidc-clients)"

              echo "Writing auth/oidc/config (retries until Keycloak answers through the hairpin)..."
              # OpenBAO fetches https://id.duynh.me/realms/duynhlab-staff/.well-known/...
              # server-side at write time — CoreDNS resolves the host to the edge
              # Service, the edge terminates TLS with the platform wildcard, and
              # the CA bundle below makes that chain trusted.
              n=0
              until bao write auth/oidc/config \
                  oidc_discovery_url="https://id.duynh.me/realms/duynhlab-staff" \
                  oidc_discovery_ca_pem="$(cat /trust/ca-bundle.pem)" \
                  oidc_client_id="openbao" \
                  oidc_client_secret="$CLIENT_SECRET" \
                  default_role="staff" 2>/dev/null; do
                n=$((n + 1)); [ "$n" -ge 60 ] && { echo "ERROR: auth/oidc/config failed after 300s (Keycloak or the edge hairpin unreachable?)"; exit 1; }
                echo "  discovery not ready yet, retry 5s..."; sleep 5
              done

              echo "Writing auth/oidc/role/staff..."
              # Retried for the mid-run leader-election case, like the db pilot.
              n=0
              until bao write auth/oidc/role/staff \
                  user_claim="preferred_username" \
                  groups_claim="groups" \
                  oidc_scopes="openid,profile" \
                  allowed_redirect_uris="https://openbao.duynh.me/ui/vault/auth/oidc/oidc/callback,http://localhost:8200/ui/vault/auth/oidc/oidc/callback,http://localhost:8250/oidc/callback" \
                  token_policies="default" \
                  token_ttl=1h; do
                n=$((n + 1)); [ "$n" -ge 12 ] && { echo "ERROR: role write failed after 60s"; exit 1; }
                echo "  role write failed, retry 5s..."; sleep 5
              done

              echo "Finding the OIDC mount accessor..."
              ACCESSOR="$(bao auth list | awk '$1 == "oidc/" {print $3}')"
              [ -n "$ACCESSOR" ] || { echo "ERROR: oidc mount accessor not found"; exit 1; }

              # Teams -> policies. dev-team gets NO group on purpose (ADR-062:
              # no OpenBAO access); a dev-team login still works and holds only
              # the default policy from the role above.
              for TEAM in infra-team sre-team; do
                echo "External identity group ${TEAM}..."
                bao write "identity/group/name/${TEAM}" type="external" policies="${TEAM}"
                GID="$(bao read -field=id "identity/group/name/${TEAM}")"
                if bao read -format=json "identity/group/name/${TEAM}" | grep -q "$ACCESSOR"; then
                  echo "  alias already present"
                else
                  bao write identity/group-alias name="${TEAM}" mount_accessor="$ACCESSOR" canonical_id="$GID"
                fi
              done

              echo "openbao-oidc-config complete: OIDC button live, groups map to team policies."
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: trust
              mountPath: /trust
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: trust
          configMap:
            name: homelab-ca-bundle
        - name: tmp
          emptyDir: {}
