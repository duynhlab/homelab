# Temporal server alerts. Scraped via the four ServiceMonitors the official
# temporalio chart renders (server.metrics.serviceMonitor in helmrelease.yaml) —
# one per server role, frontend/history/matching/worker. The retired operator's
# single scrapeConfig-managed ServiceMonitor is gone with cluster.yaml
# (ADR-030 revision); `job=~".*temporal.*"` still matches all of them.
#
# The error-rate metric names (service_requests/service_error_with_type,
# persistence_requests/persistence_error_with_type) were verified against a
# live server 1.31.2 /metrics dump (local-stack, 2026-08-18) — the official
# dashboards' `service_errors` name does not exist there. Ratios use
# clamp_min on the denominator so they never divide by zero / false-fire when
# idle. Final population check is on `make up` (Kind, chart-scraped).
#
# Worker-side (SDK) workflow/activity RED metrics are emitted by pkg/temporalx
# (OTel MetricsHandler) and arrive via OTLP push through the otel-collector
# (the order-worker PodMonitor was retired at RFC-0014 P3); the
# `temporal-worker` group below alerts on them. The Temporal dashboard
# (grafana-dashboard-temporal.yaml, vendored in-repo) carries a Server row
# visualizing both alert groups — the server-general.json follow-up is closed.
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: temporal-alerts
  namespace: monitoring
  labels:
    prometheus: victoria-metrics
    role: alert-rules
spec:
  groups:
    - name: temporal
      interval: 30s
      rules:
        - alert: TemporalServerDown
          expr: up{job=~".*temporal.*"} == 0
          for: 5m
          labels:
            severity: critical
            category: platform
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/temporal/TemporalServerDown.md"
            summary: "Temporal server target down ({{ $labels.instance }})"
            description: "Temporal server target {{ $labels.instance }} (job {{ $labels.job }}) has been down for >5m — durable workflow execution is impaired."

        - alert: TemporalServiceErrorRateHigh
          # service_error_with_type is the real counter — `service_errors` does
          # not exist on temporal server 1.31.2 (verified against a live
          # :8000/metrics dump on 2026-08-18; the bare name left this alert
          # unable to fire since it landed).
          expr: |
            sum(rate(service_error_with_type[5m])) / clamp_min(sum(rate(service_requests[5m])), 1) > 0.05
          for: 10m
          labels:
            severity: warning
            category: platform
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/temporal/TemporalServiceErrorRateHigh.md"
            summary: "Temporal service error rate high (>5%)"
            description: "Temporal frontend/service error ratio has exceeded 5% for >10m — RPCs into the cluster are failing; check the history/matching/frontend services and persistence."

        - alert: TemporalPersistenceErrorRateHigh
          expr: |
            sum(rate(persistence_error_with_type[5m])) / clamp_min(sum(rate(persistence_requests[5m])), 1) > 0.02
          for: 10m
          labels:
            severity: warning
            category: platform
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/temporal/TemporalPersistenceErrorRateHigh.md"
            summary: "Temporal persistence error rate high (>2%)"
            description: "Temporal persistence error ratio has exceeded 2% for >10m — platform-db (CNPG) may be degraded; durable state writes are at risk."

    # Worker-side (SDK) RED metrics from BOTH Temporal workers, arriving via
    # OTLP push through the otel-collector (the order-worker PodMonitor was
    # retired at RFC-0014 P3). Names are the Temporal Go SDK OTel metrics
    # (pkg/temporalx). Since ADR-063 the metrics handler exports monotonic
    # counters (UseMonotonicCounters), so the OTLP→Prometheus path names them
    # with a `_total` suffix — the fleet's 49-name set was MEASURED on the
    # compose gate 2026-08-27, not inferred. Denominators use clamp_min so the
    # ratios never divide by zero / false-fire when the worker is idle.
    - name: temporal-worker
      interval: 30s
      rules:
        - alert: TemporalWorkflowFailureRateHigh
          expr: |
            sum(rate(temporal_workflow_failed_total[10m]))
              / clamp_min(sum(rate(temporal_workflow_completed_total[10m])) + sum(rate(temporal_workflow_failed_total[10m])), 1) > 0.05
          for: 10m
          labels:
            severity: warning
            category: platform
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/temporal/TemporalWorkflowFailureRateHigh.md"
            summary: "Temporal workflow failure rate high (>5%)"
            description: "More than 5% of workflows reached a failed terminal state over 10m — the order-fulfillment saga is compensating/rolling back; check the worker logs and the activities it calls."

        - alert: TemporalActivityFailureRateHigh
          expr: |
            sum(rate(temporal_activity_execution_failed_total[10m]))
              / clamp_min(sum(rate(temporal_activity_execution_latency_seconds_count[10m])), 1) > 0.05
          for: 10m
          labels:
            severity: warning
            category: platform
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/temporal/TemporalActivityFailureRateHigh.md"
            summary: "Temporal activity failure rate high (>5%)"
            description: "More than 5% of activity executions failed over 10m — a downstream call (product/shipping/notification/cart) is erroring; retries are firing and may exhaust."

        - alert: TemporalWorkerRequestErrorRateHigh
          expr: |
            sum(rate(temporal_request_failure_total[5m])) / clamp_min(sum(rate(temporal_request_total[5m])), 1) > 0.05
          for: 10m
          labels:
            severity: warning
            category: platform
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/temporal/TemporalWorkerRequestErrorRateHigh.md"
            summary: "Temporal worker→server request error rate high (>5%)"
            description: "The worker's RPCs to the Temporal frontend are failing (>5% over 10m) — check connectivity to temporal-frontend and the server's health."

        - alert: TemporalWorkerTaskSlotsExhausted
          expr: |
            min(temporal_worker_task_slots_available) == 0
          for: 10m
          labels:
            severity: warning
            category: platform
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/temporal/TemporalWorkerTaskSlotsExhausted.md"
            summary: "Temporal worker task slots exhausted"
            description: "A worker task-slot pool has been at zero available slots for >10m — the worker is saturated and cannot accept new workflow/activity tasks; consider raising concurrency or replicas."

        # --- Leading indicators (ADR-055). Both ship WITH the KEDA scaler because
        # autoscaling without them is a system that hides its own saturation.
        #
        # Schedule-to-start is an SDK histogram (pkg/temporalx via OTLP): how long
        # a task waited in the queue before a worker picked it up. FOUR rules share
        # one alert name; `severity` and `task_kind` separate them (the Sloth
        # page/ticket pairs are the precedent for reusing a name).
        #
        # BOTH task kinds, not just workflow tasks. Measured on a loaded cluster
        # (seeded + saga + scripts/k6/load.js): the activity histogram carries 224
        # series across the real activity types -- AuthorizePayment, CapturePayment,
        # ClearCart, CommitInventory, Complete -- against 32 for the workflow-task
        # one. Workflow tasks are short and largely sticky-queue served; activity
        # backlog is where these two workers actually saturate, and it is what the
        # scaler's targetQueueSize is sizing against. A workflow-only rule would
        # have left the dominant case unalerted.
        #
        # Grouped by task_queue -- the SDK label, underscore in the NAME, hyphen in
        # the value (`order-fulfillment`). Not to be confused with the server's
        # `taskqueue` used by the backlog rule below.
        #
        # Same thresholds for both kinds: schedule-to-start should sit near zero
        # whenever workers are provisioned, and on Kind the exact bar matters less
        # than the shape.
        - alert: TemporalScheduleToStartLatencyHigh
          expr: |
            histogram_quantile(0.99, sum by (le, task_queue) (rate(temporal_workflow_task_schedule_to_start_latency_seconds_bucket[5m]))) > 0.2
          for: 10m
          labels:
            severity: warning
            category: platform
            task_kind: workflow
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/temporal/TemporalScheduleToStartLatencyHigh.md"
            summary: "Temporal workflow-task schedule-to-start p99 > 200ms ({{ $labels.task_queue }})"
            description: "Workflow tasks on queue {{ $labels.task_queue }} waited more than 200ms (p99) for a worker over 10m — the workers are under-provisioned for the load. With ADR-055 the KEDA scaler should already be adding replicas; if it is not, check the ScaledObject."

        - alert: TemporalScheduleToStartLatencyHigh
          expr: |
            histogram_quantile(0.99, sum by (le, task_queue) (rate(temporal_workflow_task_schedule_to_start_latency_seconds_bucket[5m]))) > 1
          for: 5m
          labels:
            severity: critical
            category: platform
            task_kind: workflow
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/temporal/TemporalScheduleToStartLatencyHigh.md"
            summary: "Temporal workflow-task schedule-to-start p99 > 1s ({{ $labels.task_queue }})"
            description: "Workflow tasks on queue {{ $labels.task_queue }} waited more than 1s (p99) for a worker over 5m — sagas are visibly stalling; the scaler is at its ceiling, blocked, or the workers cannot poll."

        - alert: TemporalScheduleToStartLatencyHigh
          expr: |
            histogram_quantile(0.99, sum by (le, task_queue) (rate(temporal_activity_schedule_to_start_latency_seconds_bucket[5m]))) > 0.2
          for: 10m
          labels:
            severity: warning
            category: platform
            task_kind: activity
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/temporal/TemporalScheduleToStartLatencyHigh.md"
            summary: "Temporal activity schedule-to-start p99 > 200ms ({{ $labels.task_queue }})"
            description: "Activity tasks on queue {{ $labels.task_queue }} waited more than 200ms (p99) for a worker over 10m — the activity slots are the bottleneck, which is the usual shape for these workers. With ADR-055 the KEDA scaler should already be adding replicas; if it is not, check the ScaledObject."

        - alert: TemporalScheduleToStartLatencyHigh
          expr: |
            histogram_quantile(0.99, sum by (le, task_queue) (rate(temporal_activity_schedule_to_start_latency_seconds_bucket[5m]))) > 1
          for: 5m
          labels:
            severity: critical
            category: platform
            task_kind: activity
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/temporal/TemporalScheduleToStartLatencyHigh.md"
            summary: "Temporal activity schedule-to-start p99 > 1s ({{ $labels.task_queue }})"
            description: "Activity tasks on queue {{ $labels.task_queue }} waited more than 1s (p99) for a worker over 5m — the saga's steps are visibly stalling; the scaler is at its ceiling, blocked, or the workers cannot poll."

        # Backlog is a SERVER metric (matching service; the SDK emits no backlog
        # series), scraped through the chart's ServiceMonitors. The label is
        # `taskqueue` -- measured live, NOT the SDK's `task_queue` -- and its value
        # uses underscores: order_fulfillment.
        #
        # SUM BY (taskqueue, task_type, worker_version), and each of those three is
        # load-bearing. Measured on the live cluster, ONE app queue holds 17 series:
        #   partition     0, 1, 2, 3, __sticky__   -- the queue's backlog is SPREAD
        #                                             across partitions
        #   task_type     Workflow | Activity      -- separate pools
        #   worker_version <version> | __unversioned__ -- different populations
        # `sum` collapses ONLY the partitions, which is what makes the number
        # comparable to the scaler's. With the three `""` sentinels set, KEDA's
        # temporal scaler takes getDeploymentBacklogCount ->
        # DescribeWorkerDeploymentVersion -> sumDeploymentBacklog (temporal_scaler.go
        # 256-293, v2.20.2), which sums ApproximateBacklogCount across the version's
        # task queues -- already aggregated over partitions. (Not
        # DescribeTaskQueueEnhanced: that is the getBuildIDBacklogCount branch, for
        # the deprecated `buildId` metadata.) `max by (taskqueue)` would read one
        # partition's share and need roughly 4x the backlog to trip; a bare
        # `sum by (taskqueue)` would add the versioned series to __unversioned__.
        # Grouping rather than filtering keeps the unversioned system queues
        # (temporal_sys_*) alerting on their own series instead of dropping them.
        #
        # ONE DELIBERATE DIFFERENCE from the scaler: this splits task_type, the
        # scaler does not. `queueTypes` is unset in both templates, so
        # sumDeploymentBacklog's type filter is nil and KEDA scales on
        # Workflow + Activity COMBINED. Splitting is the right call for a page --
        # it names the starved pool -- but it means the alert is not literally
        # "twice targetQueueSize": KEDA reaches maxReplicaCount at a combined 15,
        # while this needs 10 in a single pool. In the mixed case the alert
        # therefore trails the scaler rather than leading it, which is the correct
        # direction for a rule whose job is to say the scaler is NOT coping.
        #
        # 10 tasks for 10m is two targetQueueSize units (5) in one pool: a backlog
        # that size that long means the scaler is not keeping up, is at
        # maxReplicaCount, or is not scaling this queue at all.
        - alert: TemporalTaskQueueBacklogGrowing
          expr: |
            sum by (taskqueue, task_type, worker_version) (approximate_backlog_count{job=~".*temporal.*"}) > 10
          for: 10m
          labels:
            severity: warning
            category: platform
          annotations:
            runbook_url: "https://github.com/duynhlab/homelab/blob/main/docs/observability/runbooks/temporal/TemporalTaskQueueBacklogGrowing.md"
            summary: "Temporal task-queue backlog > 10 for 10m ({{ $labels.taskqueue }} / {{ $labels.task_type }})"
            description: "Task queue {{ $labels.taskqueue }} has held more than 10 pending {{ $labels.task_type }} tasks for 10m on version {{ $labels.worker_version }} — consumers cannot keep up. Twice the ADR-055 targetQueueSize, so either the KEDA ScaledObject is at maxReplicaCount, not rendered for this version, or its poll is failing."
