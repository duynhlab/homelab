# Custom Search Attributes on namespace `mop` — the cluster half of the
# contract that local-stack's temporal-bootstrap service registers on compose
# (same commands, same names). Services reference these in
# StartWorkflowOptions.TypedSearchAttributes — order-service stamps OrderId on
# the fulfillment saga, checkout-service stamps SessionId on the
# abandoned-checkout watch — and a start referencing an UNREGISTERED attribute
# is rejected by the server, which is why apps-local dependsOn
# temporal-config-local (this Kustomization runs wait:true, so app rollout
# waits for this Job to complete).
#
# The chart cannot do this: its namespace job only runs `namespace create`
# (verified against temporal-1.7.0/templates/server-namespace-job.yaml), so the
# attributes get their own run-once Job in the config half.
#
# Idempotent: `search-attribute create` reports an already-registered name and
# exits 0, so re-running is safe. A Job's template is immutable, so
# kustomize.toolkit.fluxcd.io/force is set: when an apply fails on an immutable
# field (a template edit such as the admin-tools bump Renovate opens with every
# Temporal release), Flux deletes and re-creates the Job instead of failing
# temporal-config-local and, through dependsOn, apps-local. An unchanged
# reconcile leaves the completed Job alone. To re-run it without an edit:
#   kubectl delete job temporal-search-attributes -n temporal
#   flux reconcile kustomization temporal-config-local -n flux-system
# No ttlSecondsAfterFinished, so the completed Job stays put.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-search-attributes
  namespace: temporal
  labels:
    app.kubernetes.io/component: workflow-engine
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-search-attributes
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create
          # Matches the chart's appVersion (helmrelease.yaml), so the CLI is
          # never older than the server it talks to.
          image: temporalio/admin-tools:1.32.0
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal-frontend.temporal.svc.cluster.local:7233
          command:
            - sh
            - -c
            # The namespace is created by the chart's namespace job, which the
            # HelmRelease waits on — but this Job races that wait on a fresh
            # cluster, so tolerate a not-yet-registered namespace via the
            # OnFailure backoff rather than a bespoke retry loop.
            - |
              set -e
              temporal operator search-attribute create --namespace mop \
                --name OrderId --type Keyword --name SessionId --type Keyword
              temporal operator search-attribute list --namespace mop
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
