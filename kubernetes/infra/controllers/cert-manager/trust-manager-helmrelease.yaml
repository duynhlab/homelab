# trust-manager — distributes CA bundles across namespaces.
# Sister project to cert-manager (same Jetstack/Venafi org).
# Reads sources from the cert-manager namespace (= trust namespace) and
# writes ConfigMaps named `homelab-ca-bundle` to every namespace labeled
# `platform.duynhlab.dev/needs-trust=true`.
# Chart docs: https://cert-manager.io/docs/trust/trust-manager/installation/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trust-manager
  namespace: cert-manager
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: trust-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      version: "v0.26.0"
  install:
    crds: CreateReplace
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  values:
    # Trust namespace = where Bundle sources (Secret/ConfigMap) are read from.
    # Defaults to the release namespace; pinned explicit for clarity.
    app:
      trust:
        namespace: cert-manager
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # Default CA package left at the chart's own image (0.26.0 ships
    # trust-pkg-debian-trixie 20250419-deb13u1.1, the Mozilla set without the
    # compromised eMudhra roots) so a chart bump carries the bundle with it;
    # `useDefaultCAs: true` Bundles still resolve immediately. The earlier pin
    # to a 2023 bookworm package would have kept those roots in homelab-ca-bundle.
    secretTargets:
      enabled: false
