# Altinity ClickHouse operator (RFC-0019 Phase B).
# Installs the ClickHouseInstallation / ClickHouseInstallationTemplate /
# ClickHouseKeeperInstallation CRDs and the cluster-scoped controller that
# reconciles them into running ClickHouse StatefulSets. The operator is
# cluster-scoped (watches all namespaces) but its pod lives in `monitoring`
# alongside the rest of the observability stack.
#
# Installed in the controllers wave (like temporal-operator / cnpg) so its CRDs
# exist before the clickhouse-local Kustomization applies the ClickHouseInstallation
# CR. The CHI itself is a separate wave (clickhouse.yaml) that also dependsOn
# secrets-local for the ESO-managed clickhouse-credentials Secret.
#
# Chart pins the operator/metrics image via appVersion (no :latest).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
  namespace: monitoring
  labels:
    app.kubernetes.io/component: controller
spec:
  interval: 30m
  releaseName: clickhouse-operator
  targetNamespace: monitoring
  chart:
    spec:
      chart: altinity-clickhouse-operator
      version: "0.27.3"
      sourceRef:
        kind: HelmRepository
        name: altinity
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    # Scrape both surfaces with the chart's own ServiceMonitor template.
    # ANSWERED AT KIND 2026-08-21: it renders ONE ServiceMonitor with **two
    # endpoints**, and the split is by PORT rather than by path -- both use
    # `path: /metrics`:
    #     port=ch-metrics  path=/metrics  interval=30s   <- metrics-exporter, the
    #                                                      engine view of the CHI
    #     port=op-metrics  path=/metrics  interval=30s   <- operator control plane
    # So the earlier plan here -- hand-roll a ServiceMonitor with two endpoints[]
    # because the chart "only scrapes /metrics" -- is not needed: the premise that
    # /chi is a second *path* on one port was wrong. Confirmed by the data, not
    # just the object: 914 `chi_*` series are present.
    serviceMonitor:
      enabled: true
      keeperMetrics:
        # RFC-0028: a CHK quorum now exists, so the keeper surface is worth
        # scraping — an invisible quorum is one nobody can alert on.
        #
        # This flip is INERT on its own, and that is the trap: operator-generated
        # Keeper Services publish only the zk/raft ports, so the CHK must both
        # enable `prometheus/*` settings AND name a prometheus port in a
        # serviceTemplate. Both live in configs/clickhouse/clickhousekeeperinstallation.yaml.
        # Without them this ships a ServiceMonitor with zero targets, which reads
        # as coverage — the same class of defect as an alert on a series that
        # does not exist.
        enabled: true
        # The chart's default selector also matches the per-host Service tiers,
        # so each keeper pod would be scraped more than once. Narrowed to the
        # CR-scope Service.
        # VERIFIED AT KIND 2026-08-28: exactly three `keeper-keeper` targets in
        # vmagent, one per pod, all up. Without the narrowed selector the same
        # pods would have been scraped through several Service tiers, and
        # over-counting looks identical to correct in a dashboard.
        selector:
          clickhouse-keeper.altinity.com/app: chop
          clickhouse-keeper.altinity.com/Service: chk
    operator:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
    metrics:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
