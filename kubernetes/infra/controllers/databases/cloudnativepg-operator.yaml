apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cloudnative-pg
spec:
  chart:
    spec:
      chart: cloudnative-pg
      interval: 10m
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
      # Pinned so the chart-managed CRDs (crds.create: true) stay coherent
      # with the pinned operator image below (0.29.0 = appVersion 1.30.0).
      version: 0.29.0
  interval: 10m
  releaseName: cloudnative-pg
  targetNamespace: cloudnative-pg
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    config:
      create: true
      data: {}
      name: cnpg-controller-manager-config
      secret: false
      clusterWide: true
      maxConcurrentReconciles: 10
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 10001
      runAsUser: 10001
      seccompProfile:
        type: RuntimeDefault
    crds:
      create: true
    image:
      pullPolicy: IfNotPresent
      repository: ghcr.io/cloudnative-pg/cloudnative-pg
      tag: 1.30.0
    monitoring:
      podMonitorEnabled: true
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    # 100m starved it into a restart loop, and the way that presents is the
    # reason these numbers carry a comment. The operator serves the CNPG
    # admission webhooks (`mbackup.cnpg.io` and friends, failurePolicy: Fail),
    # and its own liveness/startup probe is an HTTPS GET on /readyz with
    # timeoutSeconds: 1. A TLS handshake plus /readyz cannot reliably finish
    # inside 1s on 0.1 core, so kubelet killed it -- measured 2026-08-21:
    # `Container manager failed startup probe` x4 and `failed liveness probe` x5
    # inside 57 minutes, exit 137 after a clean shutdown (so not an OOM), pod
    # 0/1 with 9 restarts.
    #
    # With no healthy endpoint behind cnpg-webhook-service, Flux dry-runs fail:
    #   Backup/platform/platform-db-initial dry-run failed (InternalError):
    #   failed calling webhook "mbackup.cnpg.io": ... connect: connection refused
    # and databases-local parks, taking temporal, keycloak, apps and the DR
    # Kustomization with it -- 8 Kustomizations reporting "dependency is not
    # ready" and 10 services in CrashLoopBackOff, none of them naming a webhook.
    # Third instance of this pattern in one day; see the External Secrets
    # webhook (#857) and rustfs (#852).
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 100Mi
    webhook:
      livenessProbe:
        initialDelaySeconds: 3
      mutating:
        create: true
        failurePolicy: Fail
      port: 9443
      readinessProbe:
        initialDelaySeconds: 3
      startupProbe:
        failureThreshold: 6
        periodSeconds: 5
      validating:
        create: true
        failurePolicy: Fail
