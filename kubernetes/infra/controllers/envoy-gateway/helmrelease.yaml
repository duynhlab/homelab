# Envoy Gateway control plane (RFC-0024 P2, ADR-044) — the platform edge.
# Chart: envoyproxy/gateway-helm — the envoy-gateway controller Deployment
# (xDS server + Gateway API reconciler). Data-plane Envoy Deployments are
# created per Gateway by this controller, shaped by the EnvoyProxy CR in
# configs/envoy-gateway/envoyproxy.yaml.
#
# Namespace: `envoy-gateway` (platform short-name convention), not the
# upstream default envoy-gateway-system. Created in
# controllers/namespaces.yaml.
#
# CRDs: this chart carries them in a `crds` subchart, but
# controllers/gateway-api-crds/ owns both the Gateway API standard-channel CRDs
# and the EG extension CRDs as vendored manifests applied with server-side
# apply. The subchart is rejected on channel — it ships only the Gateway API
# *experimental* channel and exposes no channel toggle (see that directory's
# README and ADR-044 amendment 2026-08-18). The subchart is disabled outright
# via `crds.enabled: false`; `crds: Skip` stays as a second line of defence.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway
spec:
  interval: 10m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: envoy-gateway-oci
    namespace: flux-system
  install:
    crds: Skip
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    # `crds.enabled: false` drops the whole `crds` subchart as a chart
    # dependency (Chart.yaml `condition: crds.enabled`), which covers both its
    # crds/ directory and its templated safe-upgrades
    # ValidatingAdmissionPolicy. `safeUpgradePolicy.enabled: false` is kept
    # deliberately redundant: it is the documented upstream switch for
    # externally managed Gateway API CRDs, and it keeps the VAP suppressed even
    # if the dependency is ever re-enabled. Either way that object has exactly
    # one declared owner — controllers/gateway-api-crds/, which ships it with
    # the CRDs it guards.
    crds:
      enabled: false
      gatewayAPI:
        safeUpgradePolicy:
          enabled: false
    # Control-plane resources (homelab-friendly). The chart default is
    # unbounded; bound like the other operators. Data-plane (Envoy proxy)
    # resources are set in the EnvoyProxy CR, not here.
    deployment:
      envoyGateway:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            # 512Mi -> 768Mi for v1.9.0: the `EndpointSliceIndex` runtime flag
            # now defaults on and indexes EndpointSlices in the controller,
            # which upstream flags as a memory increase to budget for before
            # upgrading (the alternative is runtimeFlags.disabled).
            memory: 768Mi
    # No chart-native ServiceMonitor toggle exists (verified against the
    # gateway-helm values docs) — the control-plane scrape (metrics :19001)
    # is hand-rolled in
    # configs/observability/metrics/servicemonitors/envoy-gateway-controller.yaml
    # with job label `envoy-gateway-controller`.
