# KEDA — the platform's first autoscaling actuator (RFC-0026 / ADR-055).
# Chart: https://github.com/kedacore/charts/tree/main/keda
#
# What it is here for: the Temporal workers. KEDA's `temporal` scaler calls
# DescribeTaskQueue(stats=true) on the frontend and returns the backlog for ONE
# worker version, which is a signal this platform already graphs
# (approximate_backlog_count) and has never been able to act on — every worker
# was pinned at replicaCount 1 with no HPA anywhere. The ScaledObjects themselves
# are not written by hand: the Worker Controller renders one per running version
# from a WorkerResourceTemplate (kubernetes/apps/{order-fulfillment,checkout-abandon}-scaler.yaml).
#
# Why not HPA + prometheus-adapter, upstream's default recommendation for
# continuously loaded queues: not because the signal is missing — the self-hosted
# matching service exposes approximate_backlog_count per worker_build_id /
# worker_deployment_name / task_type / partition, and this platform alerts on it
# — but because the HPA path needs two things this platform does not have: an
# external-metrics adapter in front of VictoriaMetrics (KEDA ships its own), and
# a relabeling layer, since upstream's recipe expects
# temporal_approximate_backlog_count with temporal_worker_deployment_name /
# temporal_worker_build_id / temporal_namespace selectors while this server emits
# different names and labels. The Cloud-only limitations upstream lists (stale
# OpenMetrics timestamps, 5-minute queue unload) do not apply here. Traded away
# in return: scale-from-zero (the Floor rule keeps minReplicaCount 1) and
# slot-utilisation damping (KEDA 2.20 reads backlog only). ADR-055 § Alternatives.
#
# Three Deployments come out of this release — operator, metrics-apiserver
# (the external.metrics.k8s.io adapter the HPAs KEDA creates read from) and the
# admission webhooks. Every one of them passes this cluster's Kyverno admission:
#   - `disallow-latest-tag` matches every namespace except a short exclude list,
#     so the tags must be explicit — they default to the chart's appVersion
#     (2.20.2), never `latest`. pullPolicy is pinned to IfNotPresent because the
#     chart's default `Always` re-pulls three images on every pod start for no
#     gain on a Kind node.
#   - `pss-baseline` matches this namespace too; the chart's defaults already
#     run non-root, drop ALL capabilities, read-only root fs, RuntimeDefault
#     seccomp — nothing to override.
#   - `require-resources` does NOT match the `keda` namespace (it matches the
#     ten app namespaces only), so the blocks below are Kind sizing, not policy:
#     the chart defaults to 100m/100Mi requests and 1 CPU / 1000Mi limits per
#     pod, which is more than this node can spare for a poller that talks to
#     two task queues.
#
# The `keda` namespace comes from controllers/namespaces.yaml, the single source
# of truth for namespaces in this repo. TLS for the metrics adapter and webhooks
# is self-generated by the operator (certificates.autoGenerated) — no
# cert-manager dependency, unlike the Worker Controller.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: keda
      sourceRef:
        kind: HelmRepository
        name: keda
        namespace: flux-system
      version: "2.20.2"
  install:
    createNamespace: false
    # The chart templates its CRDs (crds.install below); these keep helm-controller
    # from fighting it on upgrade.
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    image:
      pullPolicy: IfNotPresent

    crds:
      install: true

    # One KEDA per cluster, watching every namespace: the two WorkerResourceTemplates
    # live in `order` and `checkout`, and a future worker may live anywhere.
    watchNamespace: ""

    # --- Kind sizing (see header) ---
    resources:
      operator:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi
      metricServer:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi
      webhooks:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 192Mi

    # ServiceMonitors for the operator and the metrics adapter. vmagent runs
    # selectAllByDefault, so a plain ServiceMonitor is scraped with no extra
    # labels. keda_scaler_metrics_value / keda_scaler_detail_errors_total feed the
    # KEDA board (grafana/dashboards/keda.json) and the Keda* alert group
    # (prometheusrules/keda/alerts.yaml).
    prometheus:
      operator:
        enabled: true
        serviceMonitor:
          enabled: true
      metricServer:
        enabled: true
        serviceMonitor:
          enabled: true
