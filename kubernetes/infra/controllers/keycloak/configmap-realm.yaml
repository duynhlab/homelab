# Keycloak realm import — the deterministic `duynhlab` realm (RFC-0022, executed
# as RFC-0024 P1). Mounted at /opt/keycloak/data/import; `start --import-realm`
# imports it only when the realm does not exist yet, so a clean rebuild always
# converges to this exact state (changes to an already-imported realm need a
# DB wipe or manual admin action — greenfield rebuild contract, RFC-0022).
#
# THAT ONE-SHOT IMPORT IS WHY A MISSING redirectUri COSTS A WHOLE CLUSTER.
# `customer-spa` shipped with only the localhost origins, so a storefront login
# at https://local.duynh.me answered `invalid_redirect_uri` — and the fix could
# not be reconciled in, because the realm already existed. Recovering meant
# `make down && make up`. Both clients now carry their cluster origin next to
# the dev one; keep it that way, and check this list before any bring-up that a
# browser flow depends on.
#
# Encodes the owner-approved decisions verbatim (RFC-0022 Open questions #1-#4,
# #10):
#   * accessTokenLifespan 900 (15 min, both clients)
#   * customer posture: SSO idle 14 d / max 30 d with Remember Me
#   * refresh rotation/reuse-revocation ON (revokeRefreshToken + maxReuse 0)
#   * audience `duynhlab-platform` via client scope `platform-api`
#     (oidc-audience-mapper, access token only)
#   * registration OFF — deterministic demo users only
#
# ADR-050 split: this ConfigMap now carries TWO realms. `duynhlab` is the
# CUSTOMER realm (client customer-spa only). `duynhlab-staff` is the
# WORKFORCE realm: operator `duyne`, role backoffice_admin, client
# admin-portal (cluster origin https://backoffice.duynh.me; the dev origin
# http://localhost:3009 stays listed so a developer can run the portal against
# this realm — :3002 is Grafana), with
# the staff posture as REALM policy: registration off, brute-force on,
# SSO idle 30 min / max 10 h. p@ss1234 is the dev-only demo placeholder,
# never a committed prod value.
#
# Demo-user UUID scheme (fixed subjects, RFC-0022 OQ#10 — seeds and services
# reference these as string user_id): a11ce000-0000-4000-8000-00000000000N
# where N = 1 alice, 2 bob, 3 carol, 4 david, 5 eve — customers only since
# ADR-050 (the operator lives in duynhlab-staff as d0e00000-…-001 `duyne`).
# password123 is the local demo password (dev-only realm-import placeholder,
# never a committed prod value).
#
# ADR-062: the staff realm additionally carries the team groups
# (infra-team/sre-team/dev-team) and two CONFIDENTIAL clients (`grafana`,
# `openbao`), each with an oidc-group-membership-mapper emitting the `groups`
# claim — the single authority for infra-tool authorization. Their secrets are
# NOT in this file: `${GRAFANA_CLIENT_SECRET}` / `${OPENBAO_CLIENT_SECRET}`
# are Keycloak realm-import placeholders resolved from the Deployment's env
# (Secret keycloak-oidc-clients, ESO-synced from OpenBAO, value generated
# randomly by the openbao-bootstrap Job). Realm events (login + admin) are on
# so access changes land in VictoriaLogs via the JSON console log.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
data:
  duynhlab-realm.json: |
    {
      "realm": "duynhlab",
      "enabled": true,
      "registrationAllowed": false,
      "rememberMe": true,
      "accessTokenLifespan": 900,
      "ssoSessionIdleTimeout": 1209600,
      "ssoSessionMaxLifespan": 2592000,
      "ssoSessionIdleTimeoutRememberMe": 1209600,
      "ssoSessionMaxLifespanRememberMe": 2592000,
      "revokeRefreshToken": true,
      "refreshTokenMaxReuse": 0,
      "roles": {
        "realm": [
          {
            "name": "customer",
            "description": "May access private customer APIs; owner-scoped by sub"
          }
        ]
      },
      "clients": [
        {
          "clientId": "customer-spa",
          "name": "Customer SPA",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "redirectUris": [
            "https://local.duynh.me/*",
            "http://localhost:3001/*",
            "http://localhost:3000/*"
          ],
          "webOrigins": [
            "https://local.duynh.me",
            "http://localhost:3001",
            "http://localhost:3000"
          ],
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "basic",
            "email"
          ],
          "protocolMappers": [
            {
              "name": "platform-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.custom.audience": "duynhlab-platform",
                "access.token.claim": "true",
                "id.token.claim": "false",
                "introspection.token.claim": "true"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "id": "a11ce000-0000-4000-8000-000000000001",
          "username": "alice",
          "email": "alice@example.com",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ],
          "realmRoles": [
            "customer"
          ],
          "firstName": "Alice",
          "lastName": "Johnson",
          "requiredActions": []
        },
        {
          "id": "a11ce000-0000-4000-8000-000000000002",
          "username": "bob",
          "email": "bob@example.com",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ],
          "realmRoles": [
            "customer"
          ],
          "firstName": "Bob",
          "lastName": "Smith",
          "requiredActions": []
        },
        {
          "id": "a11ce000-0000-4000-8000-000000000003",
          "username": "carol",
          "email": "carol@example.com",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ],
          "realmRoles": [
            "customer"
          ],
          "firstName": "Carol",
          "lastName": "White",
          "requiredActions": []
        },
        {
          "id": "a11ce000-0000-4000-8000-000000000004",
          "username": "david",
          "email": "david@example.com",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ],
          "realmRoles": [
            "customer"
          ],
          "firstName": "David",
          "lastName": "Brown",
          "requiredActions": []
        },
        {
          "id": "a11ce000-0000-4000-8000-000000000005",
          "username": "eve",
          "email": "eve@example.com",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "password123",
              "temporary": false
            }
          ],
          "realmRoles": [
            "customer"
          ],
          "firstName": "Eve",
          "lastName": "Davis",
          "requiredActions": []
        }
      ]
    }
  duynhlab-staff-realm.json: |
    {
      "realm": "duynhlab-staff",
      "enabled": true,
      "registrationAllowed": false,
      "rememberMe": false,
      "bruteForceProtected": true,
      "accessTokenLifespan": 900,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 36000,
      "revokeRefreshToken": true,
      "refreshTokenMaxReuse": 0,
      "eventsEnabled": true,
      "eventsExpiration": 604800,
      "eventsListeners": ["jboss-logging"],
      "adminEventsEnabled": true,
      "adminEventsDetailsEnabled": true,
      "groups": [
        {
          "name": "infra-team",
          "path": "/infra-team"
        },
        {
          "name": "sre-team",
          "path": "/sre-team"
        },
        {
          "name": "dev-team",
          "path": "/dev-team"
        }
      ],
      "roles": {
        "realm": [
          {
            "name": "backoffice_admin",
            "description": "May access protected business APIs (RFC-0023 / ADR-050)"
          }
        ]
      },
      "clients": [
        {
          "clientId": "admin-portal",
          "name": "Backoffice Admin Portal (RFC-0023, staff realm per ADR-050)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "redirectUris": [
            "https://backoffice.duynh.me/*",
            "http://localhost:3009/*"
          ],
          "webOrigins": [
            "https://backoffice.duynh.me",
            "http://localhost:3009"
          ],
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "basic",
            "email"
          ],
          "protocolMappers": [
            {
              "name": "platform-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.custom.audience": "duynhlab-platform",
                "access.token.claim": "true",
                "id.token.claim": "false",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "grafana",
          "name": "Grafana (staff SSO per ADR-062)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "${GRAFANA_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": [
            "https://grafana.duynh.me/login/generic_oauth",
            "http://localhost:3000/login/generic_oauth"
          ],
          "webOrigins": [
            "https://grafana.duynh.me",
            "http://localhost:3000"
          ],
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "basic",
            "email"
          ],
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "flux-web",
          "name": "Flux Operator web UI (staff SSO per ADR-062)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "${FLUX_WEB_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": [
            "https://ui.duynh.me/oauth2/callback"
          ],
          "webOrigins": [
            "https://ui.duynh.me"
          ],
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "basic",
            "email"
          ],
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "openbao",
          "name": "OpenBAO UI + CLI (staff SSO per ADR-062)",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "${OPENBAO_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "redirectUris": [
            "https://openbao.duynh.me/ui/vault/auth/oidc/oidc/callback",
            "http://localhost:8200/ui/vault/auth/oidc/oidc/callback",
            "http://localhost:8250/oidc/callback"
          ],
          "webOrigins": [
            "https://openbao.duynh.me",
            "http://localhost:8200"
          ],
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "basic",
            "email"
          ],
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "claim.name": "groups",
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        }
      ],
      "users": [
        {
          "id": "d0e00000-0000-4000-8000-000000000001",
          "username": "duyne",
          "email": "duyne@example.com",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            {
              "type": "password",
              "value": "p@ss1234",
              "temporary": false
            }
          ],
          "realmRoles": [
            "backoffice_admin"
          ],
          "groups": [
            "/infra-team"
          ],
          "firstName": "Duy",
          "lastName": "Ne",
          "requiredActions": []
        }
      ]
    }
