# Keycloak identity provider (RFC-0022, executed as RFC-0024 P1).
#
# Persistence: DIRECT to platform-db-rw:5432, never through the transaction
# pooler — Keycloak's Agroal pool needs long-lived connections + server-side
# prepared statements, which transaction pooling breaks (RFC-0022 OQ#8 /
# ADR-041). Credentials come from the identity-ns copy of
# platform-db-keycloak-secret (ESO).
#
# Realm: `start --import-realm` imports the mounted duynhlab-realm.json on the
# first start against an empty realm set (RFC-0022 greenfield rebuild contract);
# subsequent starts skip existing realms.
#
# TLS terminates at the edge in P2 (Envoy Gateway, RFC-0024) — inside the
# cluster Keycloak serves plain HTTP :8080 (app) and :9000 (management:
# health + metrics). KC_HOSTNAME pins the public issuer
# (https://id.duynh.me/realms/duynhlab); KC_HOSTNAME_BACKCHANNEL_DYNAMIC lets
# in-cluster callers use the internal Service URL without breaking the issuer.
#
# replicas: 1 — no HA topology in the first implementation (RFC-0022 Non-Goals).
# PSS: full restricted-grade securityContext even though the identity namespace
# is baseline-only — cheap and future-proof.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
        # Bare `app` label: Vector's add_labels derives the VictoriaLogs
        # stream `service` from it — without it the stream falls back to the
        # pod name and every rollout starts a new log stream.
        app: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.2@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067
          args: ["start", "--import-realm"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://platform-db-rw.platform.svc.cluster.local:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: platform-db-keycloak-secret
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-db-keycloak-secret
                  key: password
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-bootstrap-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-bootstrap-admin
                  key: password
            # ADR-062: confidential-client secrets for the staff realm's
            # `grafana` and `openbao` clients. The realm import resolves the
            # ${GRAFANA_CLIENT_SECRET}/${OPENBAO_CLIENT_SECRET} placeholders in
            # configmap-realm.yaml from these env vars — the values live only
            # in OpenBAO (random, generated by the openbao-bootstrap Job) and
            # reach this pod through the keycloak-oidc-clients ExternalSecret.
            - name: GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-oidc-clients
                  key: grafana_client_secret
            - name: OPENBAO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-oidc-clients
                  key: openbao_client_secret
            - name: FLUX_WEB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-oidc-clients
                  key: flux_web_client_secret
            - name: KC_HOSTNAME
              value: https://id.duynh.me
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            # keycloak_user_events_total (LOGIN/LOGIN_ERROR/...) — the
            # login-KPI counter the RFC-0022 signals need. Tags: default is
            # realm-only (cardinality guard); clientId is safe here (2 clients
            # per realm) and splits customer-spa vs admin-portal.
            - name: KC_EVENT_METRICS_USER_ENABLED
              value: "true"
            - name: KC_EVENT_METRICS_USER_TAGS
              value: realm,clientId
            # Histograms + SLO buckets (ms) make
            # http_server_requests_seconds_bucket quantile-queryable
            # (p95 target <250ms on auth endpoints).
            - name: KC_HTTP_METRICS_HISTOGRAMS_ENABLED
              value: "true"
            - name: KC_HTTP_METRICS_SLOS
              value: 10,50,250,500,1000,2500
            # OpenTelemetry tracing (GA since KC 26.1): OTLP gRPC straight to
            # the collector (no egress NetworkPolicy exists — nothing to
            # open). tracing-enabled is a BUILD-TIME option: the first start
            # after this change re-augments the server in place (slower boot;
            # the 5-min startupProbe below already covers it). Browsers reach
            # Keycloak directly, so these spans are their own trace roots.
            - name: KC_TRACING_ENABLED
              value: "true"
            - name: KC_TRACING_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317
            - name: KC_TRACING_SAMPLER_TYPE
              value: parentbased_traceidratio
            - name: KC_TRACING_SAMPLER_RATIO
              value: "0.1" # fleet parity (services sample 10% in prod)
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=production # vmagent promote allowlist
            # JSON console logs — level becomes a queryable VictoriaLogs field
            # (Vector's cluster transform lifts `level`; full field-merge
            # parity with local is a follow-up).
            - name: KC_LOG_CONSOLE_OUTPUT
              value: json
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          # Keycloak start + first-boot realm import is slow (JVM + build +
          # import + DB migration): the startupProbe gives it up to 5 min
          # before liveness takes over.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          # No JAVA_OPTS here, so Quarkus sizes the heap from the container
          # limit — this number is an input to how much Keycloak allocates, not
          # only a ceiling it may reach.
          #
          # Trimmed conservatively: 690Mi measured on 2026-09-02, so 1536Mi is
          # ~2.2x observed. Kept well above the 1280Mi used for ClickHouse
          # because Keycloak is the single dependency of every SSO path on the
          # platform — a heap too small here GC-thrashes under login load, and
          # the blast radius is every UI at once.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
