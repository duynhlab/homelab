# ExternalSecret for the staff realm's confidential-client secrets (ADR-062).
# OpenBAO path: secret/data/local/infra/keycloak/oidc-clients
#
# Feeds GRAFANA_CLIENT_SECRET / OPENBAO_CLIENT_SECRET on the Deployment, which
# the realm import consumes as ${...} placeholders in configmap-realm.yaml.
# The values are random per-cluster strings generated by the openbao-bootstrap
# Job — no secret literal exists in git (ADR-062 decision rule). Grafana's and
# OpenBAO's own consumers of the same values ship with their PRs (train 3/4).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-oidc-clients
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak-oidc-clients
    app.kubernetes.io/component: identity
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-oidc-clients
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: keycloak-oidc-clients
          app.kubernetes.io/component: identity
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: grafana_client_secret
      remoteRef:
        key: secret/data/local/infra/keycloak/oidc-clients
        property: grafana_client_secret
    - secretKey: openbao_client_secret
      remoteRef:
        key: secret/data/local/infra/keycloak/oidc-clients
        property: openbao_client_secret
