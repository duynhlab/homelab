# ExternalSecret for the Keycloak bootstrap admin (RFC-0022 / RFC-0024 P1).
# OpenBAO path: secret/data/local/infra/keycloak/admin
#
# Feeds KC_BOOTSTRAP_ADMIN_USERNAME/PASSWORD on the Deployment. Keycloak only
# creates this account on the first start against an empty database; it is a
# temporary admin — replace with a permanent one and delete it on a real
# cluster (Keycloak warns until the bootstrap admin is removed).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak-bootstrap-admin
    app.kubernetes.io/component: identity
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-bootstrap-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: keycloak-bootstrap-admin
          app.kubernetes.io/component: identity
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/local/infra/keycloak/admin
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/local/infra/keycloak/admin
        property: password
