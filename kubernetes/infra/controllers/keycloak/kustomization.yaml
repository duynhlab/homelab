apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Keycloak identity provider (RFC-0022, executed as RFC-0024 P1).
# Reconciled by its own Flux Kustomization (keycloak-local) — this dir is
# deliberately excluded from controllers/kustomization.yaml.
resources:
  - external-secret.yaml
  - configmap-realm.yaml
  - deployment.yaml
  - service.yaml
