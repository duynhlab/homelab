# Keycloak Service (RFC-0022 / RFC-0024 P1).
# :8080 = application HTTP (OIDC endpoints; the P2 edge route targets this),
# :9000 = management interface (health + /metrics — scraped by the keycloak
# ServiceMonitor in configs/observability/metrics/servicemonitors/).
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: management
      port: 9000
      targetPort: management
      protocol: TCP
