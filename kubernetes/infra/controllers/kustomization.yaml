apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml # Apply namespaces FIRST (must live under controllers/ for default Kustomize load rules)
  - metrics/
  - logging/
  - databases/
  # tracing/ — moved to its own Kustomization (tracing-local) so it can dependsOn clickhouse-local (the collector's clickhouse exporter runs CREATE TABLE at startup) and secrets-local (its non-optional secretKeyRef on the ESO-managed clickhouse-credentials). Kept here would deadlock controllers-local (wait:true) ↔ secrets-local. The ESO reason predates RFC-0027 and still holds — only the Secret changed, from Tempo's tempo-rustfs-credentials to ClickHouse's. See debugs.md Bug 6.
  # profiling/ — moved to its own Kustomization (profiling-local) for the same reason (Pyroscope needs pyroscope-rustfs-credentials + RustFS).
  # caching/ — moved to its own Kustomization (caching-local) so it can dependsOn monitoring-local (ServiceMonitor CRD)
  # storage/ — moved to its own Kustomization (storage-local) so it can dependsOn secrets-local (ESO Secret rustfs-credentials)
  - secrets/
  - cert-manager/
  - clickhouse-operator/ # Altinity ClickHouse operator (CHI CRDs + controller); CHI CR applied by clickhouse-local
  # temporal/ — excluded: its own Kustomization (temporal-local) so
  # it can dependsOn platform-db + the ServiceMonitor CRD, and apps-local can
  # dependsOn a Ready server.
  # - temporal/
  # keycloak/ — excluded like temporal/ above: its own Kustomization (keycloak-local)
  # so it can dependsOn databases-local (keycloak DB on platform-db) + secrets-local
  # (ESO bootstrap-admin Secret). Namespace `identity` stays here (namespaces.yaml).
  # - keycloak/
  # keda/ — excluded like temporal/ above: its own Kustomization (keda-local) so
  # it can dependsOn monitoring-local (ServiceMonitor CRD) and so temporal-local
  # and apps-local can dependsOn the ScaledObject CRD being present (ADR-055).
  # - keda/
  # gateway-api-crds/ — excluded like temporal/ above: its own Kustomization
  # (gateway-api-crds-local) so envoy-gateway-local can dependsOn applied CRDs
  # (RFC-0024 P2).
  # - gateway-api-crds/
  # envoy-gateway/ — excluded like temporal/ above: its own Kustomization
  # (envoy-gateway-local) so it can dependsOn gateway-api-crds-local +
  # cert-manager-local (RFC-0024 P2).
  # - envoy-gateway/
  - kyverno/
