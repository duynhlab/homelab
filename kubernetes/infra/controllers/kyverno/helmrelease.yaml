# Kyverno — Kubernetes-native policy engine
# Chart: https://github.com/kyverno/kyverno/tree/main/charts/kyverno
#
# Adoption strategy: see docs/platform/kyverno.md
# - failurePolicy=Ignore by default during rollout (Tier 0/1 audit window)
# - background scan ON (catch resources applied before Kyverno was installed)
# - admission controller exempts flux-system to prevent reconciliation loops
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      version: "3.8.2"
  install:
    crds: CreateReplace
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # PolicyExceptions accepted ONLY from the kyverno namespace (where the
    # registry-tracked exceptions live) — pinned explicitly rather than
    # relying on the chart default; "*" would let any namespace waive policy.
    features:
      policyExceptions:
        enabled: true
        namespace: kyverno
    # Single-replica admission for KinD; bump to 3 for production HA
    admissionController:
      replicas: 1
      rbac:
        clusterRole:
          extraResources:
            # Allow Kyverno to read images from in-cluster registries (verifyImages)
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get", "list", "watch"]
      # Webhook tuning — never block kube-system / flux-system to prevent
      # platform-wide outages during webhook unavailability.
      initContainer:
        resources:
          requests: { cpu: 10m, memory: 64Mi }
          limits: { cpu: 100m, memory: 128Mi }
      container:
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: 500m, memory: 512Mi }
      # Scrape: the chart's own toggle (default false), one per controller.
      # metricsService.create already defaults to true on :8000. The VM
      # operator converts the ServiceMonitor to a VMServiceScrape and VMAgent
      # picks it up via selectAllByDefault.
      serviceMonitor:
        enabled: true
    backgroundController:
      replicas: 1
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 300m, memory: 256Mi }
      # Scrape: the chart's own toggle (default false), one per controller.
      # metricsService.create already defaults to true on :8000. The VM
      # operator converts the ServiceMonitor to a VMServiceScrape and VMAgent
      # picks it up via selectAllByDefault.
      serviceMonitor:
        enabled: true
    cleanupController:
      replicas: 1
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 200m, memory: 128Mi }
      # Scrape: the chart's own toggle (default false), one per controller.
      # metricsService.create already defaults to true on :8000. The VM
      # operator converts the ServiceMonitor to a VMServiceScrape and VMAgent
      # picks it up via selectAllByDefault.
      serviceMonitor:
        enabled: true
    reportsController:
      replicas: 1
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: 300m, memory: 256Mi }
      # Scrape: the chart's own toggle (default false), one per controller.
      # metricsService.create already defaults to true on :8000. The VM
      # operator converts the ServiceMonitor to a VMServiceScrape and VMAgent
      # picks it up via selectAllByDefault.
      serviceMonitor:
        enabled: true
    # Dashboard: chart-native, same reasoning as cert-manager's servicemonitor
    # toggle -- prefer the chart over a vendored JSON copy that then drifts.
    # The chart renders a ConfigMap plus a GrafanaDashboard CR whose
    # matchLabels already equal this platform's Grafana instanceSelector.
    grafana:
      enabled: true
      namespace: monitoring
      grafanaDashboard:
        create: true
        folder: GitOps
        allowCrossNamespaceImport: true

    # Exclude critical platform namespaces from admission webhooks.
    # Without this, a Kyverno outage can break Flux reconciliation,
    # cert-manager webhooks, or operator startup.
    config:
      excludeKyvernoNamespace: true
      resourceFilters:
        - "[Event,*,*]"
        - "[Node,*,*]"
        - "[Node/*,*,*]"
        - "[APIService,*,*]"
        - "[APIService/*,*,*]"
        - "[TokenReview,*,*]"
        - "[SubjectAccessReview,*,*]"
        - "[SelfSubjectAccessReview,*,*]"
        - "[Binding,*,*]"
        - "[Pod/binding,*,*]"
        - "[ReplicaSet,*,*]"
        - "[ReplicaSet/*,*,*]"
        - "[EphemeralReport,*,*]"
        - "[ClusterEphemeralReport,*,*]"
        # Platform namespaces — admission excluded (background scan still runs)
        - "[*,kube-system,*]"
        - "[*,kube-public,*]"
        - "[*,kube-node-lease,*]"
        - "[*,flux-system,*]"
        - "[*,kyverno,*]"
        - "[*,cert-manager,*]"
        - "[*,external-secrets-system,*]"
    # Observability lives per controller, not at the top level -- see the
    # serviceMonitor blocks above. This file used to carry a top-level
    # `metricsService` + `serviceMonitor` pair here; chart 3.8.2 has no such
    # keys (each of the four controllers owns its own), so Helm accepted them
    # and ignored them. The cluster ran with **zero** ServiceMonitors and zero
    # kyverno_* series, while the manifest read as if metrics were solved.
