# Vector Agent HelmRelease
# Ships Kubernetes logs to VictoriaLogs, and the same logs to ClickHouse (otel_logs)
# through the collector's otlp/vector receiver
# Includes PostgreSQL auto_explain parsing pipeline for CloudNativePG clusters
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector
  namespace: kube-system
spec:
  chart:
    spec:
      chart: vector
      sourceRef:
        kind: HelmRepository
        name: vector
        namespace: flux-system
      version: '0.58.0'
  dependsOn:
    - name: victoria-metrics-operator
      namespace: monitoring
  interval: 10m
  releaseName: vector
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    role: Agent
    # A log collector must cover every node, control plane included. Without
    # this the DaemonSet skips the tainted control-plane node, and on Kind that
    # is exactly where the edge lives: kind-up.sh labels the control plane
    # `ingress-ready=true` (it owns the 80/443 extraPortMappings), and
    # clusters/local/envoy-gateway-config.yaml pins both Envoy proxy replicas
    # there. The gateway access log -- the first thing you reach for when a
    # route misbehaves -- never reached VictoriaLogs, while the Envoy *control*
    # plane pod on a worker was collected normally and masked the gap.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: true
        address: 0.0.0.0:8686

      # ========================================================================
      # SOURCES
      # ========================================================================
      sources:
        kubernetes_logs:
          type: kubernetes_logs
          extra_field_selector: ""
          # RFC-0014 P4: pods that ship their own logs over OTLP (otelzap tee
          # -> collector -> VictoriaLogs) carry this label — Vector must not
          # tail them too, or every line lands twice. Flipping a service's
          # otel_logs_enabled input to "false" flips the label with it, and
          # Vector resumes instantly (the RFC's rollback path).
          extra_label_selector: "platform.duynhlab.dev/otlp-logs!=true"
          exclude_paths_glob_patterns:
            - "**/*.gz"
            - "**/*.tmp"
            - "**/*.log.*"
            - "**/containers/*/checkpoints/**"
        # ADR-061: the proxy pods are excluded from kubernetes_logs above (they
        # carry otlp-logs=true), which also silenced Envoy's *runtime* logs —
        # startup, config rejects, upstream warnings had no collector at all.
        # This source tails ONLY the EG proxy pods (existence selector on the
        # owning-gateway label — app pods never match it) and the
        # filter_envoy_runtime transform keeps just the runtime lines.
        envoy_proxy_logs:
          type: kubernetes_logs
          extra_field_selector: ""
          extra_label_selector: "gateway.envoyproxy.io/owning-gateway-name"
          exclude_paths_glob_patterns:
            - "**/*.gz"
            - "**/*.tmp"
            - "**/*.log.*"
            - "**/containers/*/checkpoints/**"
        internal_metrics:
          type: internal_metrics

      # ========================================================================
      # TRANSFORMS
      # ========================================================================
      transforms:
        # ----------------------------------------------------------------------
        # Transform: filter_envoy_runtime (ADR-061) — keep only Envoy RUNTIME
        # lines from the proxy pods. The discriminator is the access-log format
        # contract we declare in configs/envoy-gateway/envoyproxy.yaml: access
        # logs are JSON and always start with "{"; runtime lines always start
        # with "[ts][level][component]". Access logs already travel OTLP →
        # ClickHouse, so letting a "{" line through here would double-store it.
        # ----------------------------------------------------------------------
        filter_envoy_runtime:
          type: filter
          inputs:
            - envoy_proxy_logs
          condition: '!starts_with(string!(.message), "{")'

        # ----------------------------------------------------------------------
        # Transform: add_labels (stream fields for VictoriaLogs)
        # ----------------------------------------------------------------------
        add_labels:
          type: remap
          inputs:
            - kubernetes_logs
            # ADR-061: edge runtime lines get the same stream fields (`service`
            # is `envoy`, from the proxy pods' name label).
            - filter_envoy_runtime
          source: |
            # Same order as to_otlp: the standard name label, then legacy `app`.
            if exists(.kubernetes.pod_labels."app.kubernetes.io/name") {
              .service = to_string!(.kubernetes.pod_labels."app.kubernetes.io/name")
            } else if exists(.kubernetes.pod_labels."app") {
              .service = to_string!(.kubernetes.pod_labels."app")
            } else if exists(.kubernetes.pod_name) {
              .service = to_string!(.kubernetes.pod_name)
            } else {
              .service = "system"
            }
            
            # Extract namespace from kubernetes.pod_namespace
            if exists(.kubernetes.pod_namespace) {
              .namespace = to_string!(.kubernetes.pod_namespace)
            } else {
              .namespace = "kube-system"
            }
            
            # Extract pod_name from kubernetes.pod_name
            if exists(.kubernetes.pod_name) {
              .pod_name = to_string!(.kubernetes.pod_name)
            } else {
              .pod_name = "unknown-pod"
            }
            
            # Extract container_name from kubernetes.container_name
            if exists(.kubernetes.container_name) {
              .container_name = to_string!(.kubernetes.container_name)
            } else {
              .container_name = "unknown-container"
            }
            
            # Extract stream (stdout/stderr) - kept as a log field for filtering
            if exists(.stream) {
              .stream = to_string!(.stream)
            } else {
              .stream = "stdout"
            }
            
            # Parse JSON message and extract level field
            if exists(.message) {
              parsed, err = parse_json(.message)
              if err == null && exists(parsed.level) {
                .level = to_string!(parsed.level)
              }
            }

            # Envoy Gateway's edge access log is structured JSON on stdout, and
            # configs/envoy-gateway/envoyproxy.yaml states the purpose:
            # response_flags, upstream_cluster and route_name are emitted "for
            # edge-level debugging". Left inside .message they are an opaque
            # string -- you cannot filter by route, upstream or status, which is
            # the entire reason the format was declared. The JSON is already
            # parsed just above for .level, so promoting its keys to fields
            # costs no second parse. Scoped to the proxy container: the Envoy
            # *control* plane pod logs tab-separated text, not JSON.
            if .container_name == "envoy" && exists(.kubernetes.pod_labels."gateway.envoyproxy.io/owning-gateway-name") {
              access, aerr = parse_json(.message)
              if aerr == null {
                . = merge(., object!(access))
              }
            }

        # ----------------------------------------------------------------------
        # Transform: to_otlp -- the same pod logs, shaped as OTLP for ClickHouse
        # ----------------------------------------------------------------------
        # Everything add_labels sends to VictoriaLogs also goes to otel_logs in
        # ClickHouse, through the collector's dedicated otlp/vector receiver
        # (sink otel_clickhouse below). The opentelemetry sink's `otlp` codec
        # needs the event in OTLP's own shape, which is what this builds.
        # OpenBao audit lines (JSON with type request|response) get their main
        # fields as attributes; the full record stays in the body.
        to_otlp:
          type: remap
          inputs:
            - add_labels
          source: |
            labels = object(.kubernetes.pod_labels) ?? {}
            # string(), not to_string(): to_string(null) is "" and would stop the
            # fallback chain at the first missing label.
            svc = string(labels."app.kubernetes.io/name") ?? string(labels."app") ?? string(.container_name) ?? "unknown"
            msg = to_string(.message) ?? encode_json(.message)
            now_ns = to_unix_timestamp(now(), unit: "nanoseconds")
            ts_ns = now_ns
            if is_timestamp(.timestamp) {
              ts_ns = to_unix_timestamp!(.timestamp, unit: "nanoseconds")
            }
            sev = upcase(to_string(.level) ?? "")

            attrs = [
              {"key": "log.iostream", "value": {"stringValue": to_string(.stream) ?? "stdout"}},
              {"key": "log.source", "value": {"stringValue": "vector"}}
            ]
            if .namespace == "openbao" {
              a, err = parse_json(msg)
              if err == null && is_object(a) && includes(["request", "response"], a.type) {
                sev = "INFO"
                attrs = push(attrs, {"key": "event.name", "value": {"stringValue": "openbao.audit." + string!(a.type)}})
                attrs = push(attrs, {"key": "openbao.request.path", "value": {"stringValue": to_string(a.request.path) ?? ""}})
                attrs = push(attrs, {"key": "openbao.request.operation", "value": {"stringValue": to_string(a.request.operation) ?? ""}})
                attrs = push(attrs, {"key": "openbao.request.mount_type", "value": {"stringValue": to_string(a.request.mount_type) ?? ""}})
                attrs = push(attrs, {"key": "openbao.auth.display_name", "value": {"stringValue": to_string(a.auth.display_name) ?? ""}})
                attrs = push(attrs, {"key": "openbao.error", "value": {"stringValue": to_string(a.error) ?? ""}})
              }
            }

            . = {
              "resourceLogs": [{
                "resource": {"attributes": [
                  {"key": "service.name", "value": {"stringValue": svc}},
                  {"key": "k8s.namespace.name", "value": {"stringValue": to_string(.namespace) ?? ""}},
                  {"key": "k8s.pod.name", "value": {"stringValue": to_string(.pod_name) ?? ""}},
                  {"key": "k8s.container.name", "value": {"stringValue": to_string(.container_name) ?? ""}},
                  {"key": "k8s.node.name", "value": {"stringValue": to_string(.kubernetes.pod_node_name) ?? ""}}
                ]},
                "scopeLogs": [{
                  "scope": {"name": "vector.kubernetes_logs"},
                  "logRecords": [{
                    "timeUnixNano": ts_ns,
                    "observedTimeUnixNano": now_ns,
                    "severityText": sev,
                    "body": {"stringValue": msg},
                    "attributes": attrs
                  }]
                }]
              }]
            }

        # ======================================================================
        # PostgreSQL auto_explain Pipeline (CloudNativePG)
        # ======================================================================
        # Architecture: CloudNativePG Postgres → Vector → VictoriaLogs
        #
        # Data Flow:
        #   1. parse_pg_json: Parse CloudNativePG JSON-formatted logs
        #   2. filter_pg_auto_explain: Filter for auto_explain execution plans
        #   3. parse_pg_auto_explain: Extract plan JSON + metadata
        #   4. Sinks: Route to VictoriaLogs (plans + failures)
        #
        # CloudNativePG Log Structure:
        #   - Outer JSON: CloudNativePG wrapper (timestamp, record)
        #   - Inner JSON: PostgreSQL auto_explain output (embedded in record.message)
        #   - Format: "duration: X.X ms  plan: {...}"
        # ======================================================================

        # ----------------------------------------------------------------------
        # Transform: parse_pg_json - Parse CloudNativePG JSON Logs
        # ----------------------------------------------------------------------
        parse_pg_json:
          type: remap
          inputs:
            - kubernetes_logs
          source: |
            # Only parse PostgreSQL (CloudNativePG) postgres container logs
            # CloudNativePG automatically formats PostgreSQL logs as JSON
            if .kubernetes.container_name == "postgres" && exists(.kubernetes.pod_labels."cnpg.io/cluster") {
              parsed, err = parse_json(.message)
              if err == null {
                .log = parsed
                del(.message)
              }
            }

        # ----------------------------------------------------------------------
        # Transform: filter_pg_auto_explain - Filter for auto_explain Logs
        # ----------------------------------------------------------------------
        filter_pg_auto_explain:
          type: filter
          inputs:
            - parse_pg_json
          condition: |
            # Check if log has the expected structure and contains "plan:"
            # This identifies auto_explain output which embeds JSON plans
            exists(.log.record.message) &&
            contains(string(.log.record.message) ?? "", "plan:")

        # ----------------------------------------------------------------------
        # Transform: parse_pg_auto_explain - Extract & Structure Execution Plan
        # ----------------------------------------------------------------------
        parse_pg_auto_explain:
          type: remap
          inputs:
            - filter_pg_auto_explain
          drop_on_error: true
          drop_on_abort: true
          reroute_dropped: true
          source: |
            # Step 1: Extract message from already-parsed PostgreSQL JSON structure
            msg_val, err = get(.log, ["record", "message"])
            if err != null {
              cluster = .kubernetes.pod_labels."cnpg.io/cluster" || "unknown"
              pod = .kubernetes.pod_name || "unknown"
              log({
                "level": "warn",
                "component": "pg_auto_explain_parser",
                "error_type": "missing_field",
                "field": "log.record.message",
                "cluster": cluster,
                "pod": pod,
                "message": "PostgreSQL log missing expected log.record.message field"
              }, level: "warn")
              abort
            }
            log_message = string!(msg_val)

            # Step 2: Verify plan exists in message
            if !contains(log_message, "plan:") {
              abort
            }

            # Step 3: Extract JSON plan from message string
            parts = split!(log_message, "plan:", limit: 2)
            if length(parts) != 2 {
              cluster = .kubernetes.pod_labels."cnpg.io/cluster" || "unknown"
              log({
                "level": "error",
                "component": "pg_auto_explain_parser",
                "error_type": "split_failure",
                "cluster": cluster,
                "message": "Failed to split log message at 'plan:' delimiter"
              }, level: "error")
              abort
            }

            # Step 4: Parse the execution plan JSON
            json_string = strip_whitespace!(string!(parts[1]))
            parsed_plan, err = parse_json(json_string)
            if err != null {
              cluster = .kubernetes.pod_labels."cnpg.io/cluster" || "unknown"
              log({
                "level": "error",
                "component": "pg_auto_explain_parser",
                "error_type": "json_parse_failure",
                "cluster": cluster,
                "error": string!(err),
                "json_preview": slice!(json_string, start: 0, end: 100),
                "message": "Failed to parse execution plan JSON"
              }, level: "error")
              abort
            }

            # Step 5: Extract core metadata from PostgreSQL log
            .query_id = to_string(.log.record.query_id) ?? "unknown"
            .cluster_name = .kubernetes.pod_labels."cnpg.io/cluster" || "unknown"
            .namespace = .kubernetes.pod_namespace || .kubernetes.namespace_name || "unknown"
            .pod_name = .kubernetes.pod_name || "unknown"
            .database = .log.record.database_name || "unknown"
            .user = .log.record.user_name || "unknown"

            # Step 6: Extract query duration from log message
            duration_match, err = parse_regex(log_message, r'duration: (?P<duration>[\d.]+) ms')
            if err == null {
              .duration_ms = to_float!(duration_match.duration)
            }

            # Step 7: Extract execution plan and query text
            plan_object, err = get(parsed_plan, ["Plan"])
            if err == null && plan_object != null {
              .plan_json = encode_json(plan_object)
            }
            .query_text = get!(parsed_plan, ["Query Text"]) || ""

            # Step 8: Extract timing metrics (optional fields)
            planning_time, err = get(parsed_plan, ["Planning Time"])
            if err == null && planning_time != null {
              .planning_time_ms = planning_time
            }

            execution_time, err = get(parsed_plan, ["Execution Time"])
            if err == null && execution_time != null {
              .execution_time_ms = execution_time
            }

            # Step 9: Create human-readable message for log display
            if exists(.duration_ms) {
              .message = "Query plan for queryid=" + string!(.query_id) + " (duration=" + to_string!(.duration_ms) + "ms)"
            } else {
              .message = "Query plan for queryid=" + string!(.query_id) + " (duration=unknown)"
            }

            # Step 10: Cleanup - Remove Kubernetes metadata to reduce storage
            del(.kubernetes)
            del(.log)

      # ========================================================================
      # SINKS
      # ========================================================================
      sinks:
        # ----------------------------------------------------------------------
        # Sink: VictoriaLogs - All Logs (jsonline ingestion)
        # ----------------------------------------------------------------------
        # Docs: https://docs.victoriametrics.com/victorialogs/data-ingestion/vector
        victorialogs_all:
          type: http
          inputs:
            - add_labels
          uri: http://vlsingle-victoria-logs.monitoring.svc:9428/insert/jsonline
          encoding:
            codec: json
          framing:
            method: newline_delimited
          batch:
            max_events: 1000
            timeout_secs: 5
          buffer:
            type: memory
            max_events: 10000
            when_full: drop_newest
          request:
            headers:
              VL-Time-Field: timestamp
              VL-Msg-Field: message
              VL-Stream-Fields: namespace,service,pod_name,container_name
              AccountID: "0"
              ProjectID: "0"
          healthcheck:
            enabled: false

        # ----------------------------------------------------------------------
        # Sink: ClickHouse (otel_logs) via the collector -- the second log path
        # ----------------------------------------------------------------------
        otel_clickhouse:
          type: opentelemetry
          inputs:
            - to_otlp
          protocol:
            type: http
            uri: http://otel-collector-opentelemetry-collector.monitoring.svc:4319/v1/logs
            method: post
            encoding:
              codec: otlp
          buffer:
            type: memory
            max_events: 10000
            when_full: drop_newest
          healthcheck:
            enabled: false

        # ----------------------------------------------------------------------
        # Sink: VictoriaLogs - PostgreSQL Query Plans (structured)
        # ----------------------------------------------------------------------
        victorialogs_pg_plans:
          type: http
          inputs:
            - parse_pg_auto_explain
          uri: http://vlsingle-victoria-logs.monitoring.svc:9428/insert/jsonline
          encoding:
            codec: json
            only_fields:
              - cluster_name
              - namespace
              - database
              - query_id
              - pod_name
              - user
              - query_text
              - plan_json
              - duration_ms
              - planning_time_ms
              - execution_time_ms
              - message
              - timestamp
          framing:
            method: newline_delimited
          batch:
            max_events: 100
            timeout_secs: 5
          buffer:
            type: memory
            max_events: 1000
            when_full: drop_newest
          request:
            headers:
              VL-Time-Field: timestamp
              VL-Msg-Field: plan_json
              VL-Stream-Fields: cluster_name,namespace,database,query_id
              AccountID: "0"
              ProjectID: "0"
          healthcheck:
            enabled: false

        # ----------------------------------------------------------------------
        # Sink: VictoriaLogs - PostgreSQL Parsing Failures (debugging)
        # ----------------------------------------------------------------------
        victorialogs_pg_parse_failures:
          type: http
          inputs:
            - parse_pg_auto_explain.dropped
          uri: http://vlsingle-victoria-logs.monitoring.svc:9428/insert/jsonline
          encoding:
            codec: json
          framing:
            method: newline_delimited
          batch:
            max_events: 100
            timeout_secs: 10
          buffer:
            type: memory
            max_events: 500
            when_full: drop_newest
          request:
            headers:
              VL-Time-Field: timestamp
              VL-Msg-Field: message
              VL-Stream-Fields: kubernetes.container_name,kubernetes.pod_name
              AccountID: "0"
              ProjectID: "0"
          healthcheck:
            enabled: false

        # ----------------------------------------------------------------------
        # Sink: Prometheus Exporter (internal metrics)
        # ----------------------------------------------------------------------
        prometheus_exporter:
          type: prometheus_exporter
          inputs:
            - internal_metrics
          address: 0.0.0.0:9090
          default_namespace: vector

    # ==========================================================================
    # Resources (increased for dual-sink + parsing workload)
    # ==========================================================================
    resources:
      limits:
        # 200m: 50m throttled continuously (KubePodCPUThrottlingHigh, audit).
        cpu: 200m
        # 512Mi: at 256Mi three of four pods OOMKilled during a fresh bring-up
        # (2026-09-30), peaking at 220-245 MiB while the in-memory sink buffers
        # (up to 10k events) filled; steady state is 45-72 MiB.
        memory: 512Mi
      requests:
        cpu: 20m
        memory: 64Mi

    podMonitor:
      enabled: true
      port: prometheus-expo
