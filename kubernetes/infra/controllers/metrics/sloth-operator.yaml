apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sloth
  namespace: monitoring
spec:
  chart:
    spec:
      chart: sloth
      sourceRef:
        kind: HelmRepository
        name: sloth
        namespace: flux-system
      version: '>=0.15.0'
  dependsOn:
    - name: victoria-metrics-operator
      namespace: monitoring
    - name: grafana-operator
      namespace: monitoring
  interval: 10m
  releaseName: sloth
  targetNamespace: monitoring
  timeout: 5m
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    global:
      imageRegistry: ""
    image:
      registry: ghcr.io
      repository: slok/sloth
      tag: v0.16.0
    resources:
      limits:
        # `null`, not "absent". Deleting the key is not enough here: the sloth
        # chart ships `resources.limits.cpu: 50m` as a DEFAULT, and Helm's value
        # coalescing puts it straight back. Verified on the cluster -- after the
        # key was simply removed, the running pod still carried `cpu: 50m` and was
        # throttled 44.7%, while the other nine containers in this change came up
        # genuinely uncapped. An explicit null is how Helm is told to drop an
        # inherited key. Rationale for removing it at all: victoriametrics/vmagent.yaml.
        cpu: null
        memory: 128Mi
      requests:
        cpu: 20m
        memory: 32Mi
    sloth:
      resyncInterval: "5m"
      workers: 2
      labelSelector: ""
      namespace: "monitoring"
      extraLabels:
        team: platform
      defaultSloPeriod: "30d"
      debug:
        enabled: true
      logger: default
    commonPlugins:
      enabled: false
      image:
        repository: registry.k8s.io/git-sync/git-sync
        tag: v4.7.1
      gitRepo:
        url: https://github.com/slok/sloth-common-sli-plugins
        branch: main
        resources:
          limits:
            memory: 100Mi
          requests:
            cpu: 10m
            memory: 50Mi
    metrics:
      enabled: true
      prometheusLabels: {}
    customSloConfig:
      enabled: false
