# Cluster-wide Namespace definitions (single source of truth).
# Lives under controllers/ so Kustomize can reference it without `../` (default
# load restrictor allows only files inside the kustomization root).
# Flux path `./controllers` includes this file first via kustomization.yaml.
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    platform.duynhlab/backup: "cnpg"
    platform.duynhlab.dev/tier: app
  name: cart
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    # No backup label: checkout's data lives on product-db in the product
    # namespace, which is already backed up (same reasoning as payment).
    platform.duynhlab.dev/tier: app
  name: checkout
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
  name: cache-system
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
  name: cloudnative-pg
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
  name: database
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    # Platform component namespace (like temporal) — no app-tier label.
    # Envoy Gateway control plane + per-Gateway Envoy proxy fleet (RFC-0024 P2).
  name: envoy-gateway
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    platform.duynhlab.dev/needs-trust: "true"
    # Receive the RustFS S3 credentials for Pyroscope profile storage (ClusterExternalSecret).
    # The `platform.duynhlab/s3: "tempo"` selector went with Tempo (RFC-0027 / ADR-059) —
    # its ClusterExternalSecret is tempo-rustfs.yaml.bak, so the label selected nothing.
    platform.duynhlab/s3-pyroscope: "true"
    # Receive the ClickHouse admin credentials (ClusterExternalSecret → clickhouse-credentials)
    platform.duynhlab/clickhouse: "true"
  name: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    platform.duynhlab.dev/tier: app
  name: notification
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    platform.duynhlab.dev/tier: app
  name: inventory
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    platform.duynhlab.dev/tier: app
  name: order
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    platform.duynhlab.dev/tier: app
  name: payment
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    platform.duynhlab/backup: "cnpg"
    platform.duynhlab.dev/tier: app
  name: platform
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    platform.duynhlab/backup: "cnpg"
    platform.duynhlab.dev/tier: app
  name: product
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    platform.duynhlab.dev/tier: app
  name: review
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
  name: rustfs
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    platform.duynhlab.dev/tier: app
  name: shipping
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    platform.duynhlab/backup: "cnpg"
    platform.duynhlab.dev/tier: app
  name: user
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    # ADR-062: trust-manager projects the homelab-ca-bundle ConfigMap here —
    # the openbao-oidc-config Job passes it as oidc_discovery_ca_pem so the
    # OIDC discovery fetch trusts the edge's locally-signed wildcard.
    platform.duynhlab.dev/needs-trust: "true"
  name: openbao
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
  name: external-secrets-system
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
  name: cert-manager
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
  name: kyverno
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    # Deliberately NOT platform.duynhlab.dev/tier: app. That label is what the
    # default-deny-networkpolicy ClusterPolicy selects on, and this is
    # infrastructure like monitoring or rustfs -- labelling it `app` would
    # generate a deny-all-ingress here and the UI would answer nothing through
    # the edge with no manifest to point at.
  name: policy-reporter
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
  name: frontend
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    # Same shape as `frontend`: a static Nginx bundle, not a domain service, so
    # no app-tier label — the operator's browser talks to the services through
    # the edge (ADR-048), never to anything in this namespace.
  name: backoffice
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
  name: temporal
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: local
    # No app-tier label: Keycloak is a platform component (like temporal),
    # not a domain service — the app-tier default-deny generation and
    # pss-restricted-apps policy do not apply here (RFC-0022 / RFC-0024 P1).
  name: identity
