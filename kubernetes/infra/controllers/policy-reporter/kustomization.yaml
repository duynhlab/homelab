apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Policy Reporter: the browsable read side of Kyverno's PolicyReports, plus the
# Kyverno plugin that resolves a report row back to the policy and rule that
# produced it. Delivered by its own Flux Kustomization (policy-reporter-local)
# rather than from controllers-local — see clusters/local/policy-reporter.yaml
# for why.
resources:
  - helmrelease.yaml
