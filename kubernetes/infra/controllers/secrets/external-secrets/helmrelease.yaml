# External Secrets Operator HelmRelease
# Chart: external-secrets/external-secrets
# Docs: https://external-secrets.io/
#
# External Secrets Operator (ESO) synchronizes secrets from external
# providers (Vault, AWS Secrets Manager, etc.) into Kubernetes Secrets.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets-system
spec:
  chart:
    spec:
      chart: external-secrets
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      version: "2.9.0"
  interval: 10m
  timeout: 10m
  releaseName: external-secrets
  targetNamespace: external-secrets-system

  install:
    crds: CreateReplace
    createNamespace: false
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3

  values:
    # Install CRDs with the chart
    installCRDs: true

    # Replicas for HA (1 for dev)
    replicaCount: 1

    # Resource limits
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    # ServiceAccount configuration
    serviceAccount:
      create: true
      name: external-secrets

    # Webhook configuration.
    #
    # 50m starved it, and the way that failure presents is the reason these
    # numbers are worth a comment. This webhook is on the ADMISSION path for
    # ExternalSecret / ClusterSecretStore, so when it cannot answer inside the
    # API server's 5s budget, Flux dry-runs fail with
    #   ClusterSecretStore/... dry-run failed (InternalError): failed calling
    #   webhook "validate.clustersecretstore.external-secrets.io": context
    #   deadline exceeded
    # and secrets-local parks, taking cert-manager, databases, keycloak,
    # temporal, storage, tracing, profiling, clickhouse and apps with it -- 14
    # Kustomizations reporting "dependency is not ready" and not one of them
    # naming a webhook. Measured on 2026-08-21: 51m used against a 50m limit,
    # pod Ready=false, and the internal 300s cert-validation loop stretching to
    # 138s, 216s, then 934s between log lines as throttling worsened.
    webhook:
      create: true
      replicaCount: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 300m
          memory: 128Mi

    # Cert controller for webhook certificates. Same starvation, same day:
    # 50m used against a 50m limit and Ready=false. It rotates the webhook's
    # serving certificate, so when it stalls the webhook eventually cannot serve
    # at all -- the failure above, but permanent rather than intermittent.
    certController:
      create: true
      replicaCount: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi

    # Metrics for Prometheus
    metrics:
      service:
        enabled: true
        port: 8080

    # Pod security context
    podSecurityContext:
      runAsNonRoot: true

    # Container security context
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
