apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rustfs
  namespace: rustfs
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: rustfs
      sourceRef:
        kind: HelmRepository
        name: rustfs
        namespace: flux-system
      version: "0.12.0"
  releaseName: rustfs
  targetNamespace: rustfs
  
  # Force clean install on failures
  install:
    crds: Skip
    createNamespace: true
    remediation:
      retries: 3
  
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  
  values:
    # Standalone mode
    mode:
      standalone:
        enabled: true
      distributed:
        enabled: false
    
    # CRITICAL: Disable ingress completely
    ingress:
      enabled: false
      traefikAnnotations: {}  # Explicitly clear Traefik annotations
    
    # Disable Gateway API (might also create Traefik resources)
    # CRITICAL: Chart 0.0.82 creates TraefikService when gatewayClass=traefik
    # regardless of gatewayApi.enabled. Set gatewayClass to nginx to avoid
    # "no matches for kind TraefikService" error when cluster has no Traefik CRDs.
    gatewayApi:
      enabled: false
      gatewayClass: nginx
    
    # Service config
    service:
      type: ClusterIP
      endpoint:
        port: 9000
      console:
        port: 9001
    
    # Credentials — sourced from OpenBAO via ExternalSecret (see external-secret.yaml).
    # The chart rejects the well-known default rustfsadmin/rustfsadmin since v0.3.0;
    # we keep credentials in OpenBAO and reference the synced Secret by name.
    #
    # RPC auth (app >= 1.0.0-beta.10, fail-closed): the server refuses RPC when
    # RUSTFS_RPC_SECRET is unset AND either credential equals "rustfsadmin"
    # (crates/credentials resolve_rpc_secret). With RUSTFS_RPC_SECRET unset it
    # derives the RPC secret from the access/secret key pair via HMAC-SHA256 —
    # the upstream-documented path. Our OpenBAO-seeded creds are non-default,
    # so no explicit RUSTFS_RPC_SECRET is needed (and the 0.12.0 chart has no
    # values key for it; it would have to ride the existingSecret's envFrom).
    # Logging. The 0.12.0 chart ships log_level "info" and leaves every
    # log_rotation sub-key commented out, so no size cap is rendered at all.
    # On 2026-08-21 that combination filled the whole 100 GB podman machine:
    # 34 GB of log in two hourly files (19 GB + 15 GB, ~17 GB/hour), and not
    # one line of it was an error -- it was span noise from the s3s crate, a
    # new/close pair per S3 request signature. Barman WAL archiving, Tempo and
    # Pyroscope push objects continuously, so the volume tracks traffic rather
    # than incidents. `warn` cuts that class at the source.
    #
    # Hourly rotation was already working (the files were named by hour); what
    # was missing is a cap on SIZE, which is why a single hour reached 19 GB.
    # Invariant to keep: size * keep_files must stay BELOW logStorageSize,
    # because local-path is hostPath-backed -- `requests.storage` is advisory
    # and enforces nothing. 50 MB * 3 = 150 MB < 256Mi.
    #
    # The keys live under `config.rustfs`, not `config`. Placed one level too
    # shallow -- as they were on the first attempt -- Helm accepts them and
    # renders nothing: the ConfigMap kept RUSTFS_OBS_LOGGER_LEVEL="info" and no
    # rotation keys at all, while the log volume carried on to 8.8 GB. Verify a
    # change here by reading the rendered ConfigMap, never the values file:
    #   kubectl -n rustfs get cm rustfs-config -o jsonpath='{.data}' | tr , '\n' | grep LOG
    config:
      rustfs:
        log_level: "warn"
        log_rotation:
          size: 50
          time: hour
          keep_files: 3

    secret:
      existingSecret: rustfs-credentials
    
    # Storage (Kind cluster uses "standard" StorageClass, not "local-path")
    storageclass:
      name: standard
      dataStorageSize: 1Gi
      logStorageSize: 256Mi
    
    # Resources. The old 100m/128Mi limits starved the S3 storage engine under
    # concurrent Pyroscope block.bin + Tempo trace PUTs — request handling stalled
    # past the liveness deadline ("context deadline exceeded") and kubelet killed
    # the container in a CrashLoop. Bumped to give headroom for object writes. (Bug 18)
    resources:
      requests:
        cpu: 250m
        memory: 128Mi
      limits:
        # 500m chronically throttled → Pyroscope 422s + slow backups. Raised to
        # 1.5 CPU, but the Zalando->CNPG migration added 3 CNPG clusters' Barman
        # WAL/backup traffic on top of Tempo + Pyroscope, re-saturating it (live
        # ~1281m/1500m → S3 PUT "context deadline exceeded" → Pyroscope 422 again).
        # Raise to 2.5 CPU (host has ample cores).
        cpu: "2500m"
        # 512Mi was the ceiling it died at: the 2026-08-21 full-disk event ended
        # with the kernel OOM-killing rustfs at anon-rss 520416kB, i.e. exactly
        # at the limit, while it was writing the 17 GB/hour log flood above.
        memory: 1Gi