# Run-once Job to create RustFS buckets at bring-up.
#
# The setup-pg-backup-buckets CronJob (helmrelease-cronjobs.yaml) only fires on
# its */30 schedule, so tempo-traces / pyroscope-profiles may not exist for up
# to 30 min after RustFS is up — Tempo/Pyroscope then crash-loop on a missing
# bucket. This Job creates the buckets immediately. It lives in the
# ./controllers/storage path (storage-local, wait: true), so Flux blocks on it;
# tracing-local / profiling-local dependsOn storage-local. Idempotent (HeadBucket before
# CreateBucket) — the CronJob keeps them present thereafter.
#
# That dependency is only worth anything if a Complete Job PROVES the buckets
# exist, which is exactly what the first version did not do: its wait loop fell
# through after ten failed attempts and created buckets against a server that
# had not opened /data yet, then exited 0. Flux released Tempo onto a bucket
# that was never written. So the script below must fail rather than proceed —
# it gates on an authenticated ListBuckets (serving), not on reachability, and
# HeadBuckets every bucket after creating it. Keep the two copies of this script in step.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-setup-buckets-init
  namespace: rustfs
  annotations:
    # A Job's pod template is IMMUTABLE, so editing the bucket list here makes
    # Flux's apply fail with "field is immutable" and takes storage-local down
    # with it -- which then blocks everything that dependsOn it. Hit exactly that
    # when RFC-0027 removed the two Tempo buckets.
    #
    # This is the Flux-native fix (flux.io "running jobs" use case): force lets
    # the controller delete and recreate the resource when an immutable field
    # changes. It is set PER RESOURCE on purpose -- `spec.force` on the
    # Kustomization would extend the same delete-and-recreate semantics to
    # everything else in storage-local, including RustFS itself, and the Flux
    # docs warn about exactly that on stateful workloads.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-setup-buckets-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws
          # public.ecr.aws, not docker.io or quay.io: the minio/mc repository was removed
          # from Docker Hub, and quay.io/minio/mc started answering anonymous pulls with 401
          # (2026-09-25 Kind bring-up: storage-local and twelve waves behind it stalled).
          # The AWS CLI speaks the same S3 API to RustFS and ECR Public needs no auth.
          image: public.ecr.aws/aws-cli/aws-cli:2.37.3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -e
              ENDPOINT="http://rustfs-svc.rustfs.svc.cluster.local:9000"
              BUCKETS="pg-backups-cnpg pyroscope-profiles clickhouse-otel"
              ATTEMPTS=60
              s3() { aws --endpoint-url "$ENDPOINT" s3api "$@"; }

              # Gate on the server actually SERVING, not on it being reachable. On
              # 2026-08-07 the old loop fell through after ten failed attempts, reported
              # three buckets created, and the Job went Complete while RustFS only opened
              # /data 70s later and found it empty; Flux read that Complete as its gate and
              # released a consumer onto a bucket that did not exist. ListBuckets needs an
              # authenticated answer from a server with its disk formatted, so it is the gate.
              echo "=== Waiting for RustFS to serve ==="
              ready=""
              i=0
              while [ "$i" -lt "$ATTEMPTS" ]; do
                i=$((i + 1))
                if s3 list-buckets >/dev/null 2>&1; then
                  echo "RustFS is serving (attempt $i)."
                  ready=yes
                  break
                fi
                echo "Attempt $i: RustFS not serving yet, retrying in 5s..."
                sleep 5
              done

              # Fail instead of proceeding. A non-zero exit is what makes the retry (Job
              # backoffLimit / next CronJob run) happen, and what stops Flux from treating an
              # ungated run as a satisfied dependency.
              if [ -z "$ready" ]; then
                echo "FATAL: RustFS did not serve within $((ATTEMPTS * 5))s — refusing to report success." >&2
                exit 1
              fi

              echo "=== Creating buckets ==="
              for b in $BUCKETS; do
                if s3 head-bucket --bucket "$b" >/dev/null 2>&1; then
                  echo "  exists  $b"
                else
                  s3 create-bucket --bucket "$b" >/dev/null
                  echo "  created $b"
                fi
              done

              # Verify each bucket individually and fail on any miss: a create call that
              # answered is not proof, a per-bucket HeadBucket that must succeed is.
              echo "=== Verifying ==="
              missing=""
              for b in $BUCKETS; do
                if s3 head-bucket --bucket "$b" >/dev/null 2>&1; then
                  echo "  ok      $b"
                else
                  echo "  MISSING $b"
                  missing="$missing $b"
                fi
              done
              if [ -n "$missing" ]; then
                echo "FATAL: bucket(s) absent after creation:$missing" >&2
                exit 1
              fi
              echo "=== Done ==="
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_SECRET_KEY
          # The AWS CLI is Python: one run peaks at ~80 MiB (measured), where mc
          # fitted in 64.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
