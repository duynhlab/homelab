# Run-once Job to create RustFS buckets at bring-up.
#
# The setup-pg-backup-buckets CronJob (helmrelease-cronjobs.yaml) only fires on
# its */30 schedule, so tempo-traces / pyroscope-profiles may not exist for up
# to 30 min after RustFS is up — Tempo/Pyroscope then crash-loop on a missing
# bucket. This Job creates the buckets immediately. It lives in the
# ./controllers/storage path (storage-local, wait: true), so Flux blocks on it;
# tracing-local / profiling-local dependsOn storage-local. Idempotent (HeadBucket before
# CreateBucket) — the CronJob keeps them present thereafter. It also provisions
# one IAM user + bucket-scoped policy per consumer and proves the isolation
# (own bucket reachable, a neighbour's denied) before it reports Complete.
#
# That dependency is only worth anything if a Complete Job PROVES the buckets
# exist, which is exactly what the first version did not do: its wait loop fell
# through after ten failed attempts and created buckets against a server that
# had not opened /data yet, then exited 0. Flux released Tempo onto a bucket
# that was never written. So the script below must fail rather than proceed —
# it gates on an authenticated ListBuckets (serving), not on reachability, and
# HeadBuckets every bucket after creating it. Keep the two copies of this script in step.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-setup-buckets-init
  namespace: rustfs
  annotations:
    # A Job's pod template is IMMUTABLE, so editing the bucket list here makes
    # Flux's apply fail with "field is immutable" and takes storage-local down
    # with it -- which then blocks everything that dependsOn it. Hit exactly that
    # when RFC-0027 removed the two Tempo buckets.
    #
    # This is the Flux-native fix (flux.io "running jobs" use case): force lets
    # the controller delete and recreate the resource when an immutable field
    # changes. It is set PER RESOURCE on purpose -- `spec.force` on the
    # Kustomization would extend the same delete-and-recreate semantics to
    # everything else in storage-local, including RustFS itself, and the Flux
    # docs warn about exactly that on stateful workloads.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-setup-buckets-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws
          # public.ecr.aws, not docker.io or quay.io: the minio/mc repository was removed
          # from Docker Hub, and quay.io/minio/mc started answering anonymous pulls with 401
          # (2026-09-25 Kind bring-up: storage-local and twelve waves behind it stalled).
          # The AWS CLI speaks the same S3 API to RustFS and ECR Public needs no auth.
          image: public.ecr.aws/aws-cli/aws-cli:2.39.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -e
              ENDPOINT="http://rustfs-svc.rustfs.svc.cluster.local:9000"
              BUCKETS="pg-backups-cnpg pyroscope-profiles clickhouse-otel analytics-service-cdc"
              ATTEMPTS=60
              s3() { aws --endpoint-url "$ENDPOINT" s3api "$@"; }

              # Gate on the server actually SERVING, not on it being reachable. On
              # 2026-08-07 the old loop fell through after ten failed attempts, reported
              # three buckets created, and the Job went Complete while RustFS only opened
              # /data 70s later and found it empty; Flux read that Complete as its gate and
              # released a consumer onto a bucket that did not exist. ListBuckets needs an
              # authenticated answer from a server with its disk formatted, so it is the gate.
              echo "=== Waiting for RustFS to serve ==="
              ready=""
              i=0
              while [ "$i" -lt "$ATTEMPTS" ]; do
                i=$((i + 1))
                if s3 list-buckets >/dev/null 2>&1; then
                  echo "RustFS is serving (attempt $i)."
                  ready=yes
                  break
                fi
                echo "Attempt $i: RustFS not serving yet, retrying in 5s..."
                sleep 5
              done

              # Fail instead of proceeding. A non-zero exit is what makes the retry (Job
              # backoffLimit / next CronJob run) happen, and what stops Flux from treating an
              # ungated run as a satisfied dependency.
              if [ -z "$ready" ]; then
                echo "FATAL: RustFS did not serve within $((ATTEMPTS * 5))s — refusing to report success." >&2
                exit 1
              fi

              echo "=== Creating buckets ==="
              for b in $BUCKETS; do
                if s3 head-bucket --bucket "$b" >/dev/null 2>&1; then
                  echo "  exists  $b"
                else
                  s3 create-bucket --bucket "$b" >/dev/null
                  echo "  created $b"
                fi
              done

              # Verify each bucket individually and fail on any miss: a create call that
              # answered is not proof, a per-bucket HeadBucket that must succeed is.
              echo "=== Verifying ==="
              missing=""
              for b in $BUCKETS; do
                if s3 head-bucket --bucket "$b" >/dev/null 2>&1; then
                  echo "  ok      $b"
                else
                  echo "  MISSING $b"
                  missing="$missing $b"
                fi
              done
              if [ -n "$missing" ]; then
                echo "FATAL: bucket(s) absent after creation:$missing" >&2
                exit 1
              fi

              # Per-consumer identities (ADR-066 isolation obligation, #1315). One IAM
              # user and one canned policy per bucket, scoped to that bucket only; the
              # consumer keys arrive in the env from Secret/rustfs-consumer-credentials
              # (ExternalSecret, OpenBAO secret/local/infra/rustfs/<consumer>). Every
              # call is create-or-replace, so the CronJob re-provisions after a PVC
              # rebuild. The admin API is plain JSON under /rustfs/admin/v3, signed as
              # SigV4 for service s3 with the root key.
              echo "=== Provisioning per-consumer identities ==="
              CONSUMERS="cnpgbackup:pg-backups-cnpg pyroscope:pyroscope-profiles clickhouse:clickhouse-otel peerdb:analytics-service-cdc"
              # No double dollar and no dollar-paren-NAME in this script: the kubelet
              # rewrites both in command/args before sh runs (2026-10-29 Kind gate: a
              # double dollar became one and users got their variable NAMES as keys).
              admin() { curl -fsS --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" --aws-sigv4 "aws:amz:us-east-1:s3" "$@"; }
              key_of() { printenv "$(printf '%s_%s' "$1" "$2" | tr '[:lower:]' '[:upper:]')" || true; }
              for pair in $CONSUMERS; do
                u=${pair%%:*}; b=${pair##*:}
                ak=$(key_of "$u" ACCESS_KEY); sk=$(key_of "$u" SECRET_KEY)
                if [ -z "$ak" ] || [ -z "$sk" ] || [ "$ak" = "$(printf '%s_ACCESS_KEY' "$u" | tr '[:lower:]' '[:upper:]')" ]; then
                  echo "FATAL: no credentials in the env for consumer $u" >&2
                  exit 1
                fi
                policy=$(printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::%s"]},{"Effect":"Allow","Action":["s3:GetObject","s3:GetObjectVersion","s3:PutObject","s3:DeleteObject","s3:DeleteObjectVersion","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$b" "$b")
                admin -X PUT "$ENDPOINT/rustfs/admin/v3/add-canned-policy?name=$u" -H 'Content-Type: application/json' --data-binary "$policy" >/dev/null
                admin -X PUT "$ENDPOINT/rustfs/admin/v3/add-user?accessKey=$ak" -H 'Content-Type: application/json' --data-binary "{\"secretKey\":\"$sk\",\"status\":\"enabled\"}" >/dev/null
                admin -X PUT "$ENDPOINT/rustfs/admin/v3/set-user-or-group-policy?policyName=$u&userOrGroup=$ak&isGroup=false" >/dev/null
                echo "  user $ak -> policy $u -> bucket $b"
              done

              # Prove the isolation, not just the provisioning: each consumer key must
              # reach its own bucket and be refused on a neighbour's.
              echo "=== Verifying isolation ==="
              bad=""
              for pair in $CONSUMERS; do
                u=${pair%%:*}; b=${pair##*:}
                ak=$(key_of "$u" ACCESS_KEY); sk=$(key_of "$u" SECRET_KEY)
                other=""
                for p in $CONSUMERS; do
                  if [ "$p" != "$pair" ]; then other=${p##*:}; break; fi
                done
                if AWS_ACCESS_KEY_ID="$ak" AWS_SECRET_ACCESS_KEY="$sk" s3 head-bucket --bucket "$b" >/dev/null 2>&1; then own=ok; else own=DENIED; bad="$bad $u"; fi
                if AWS_ACCESS_KEY_ID="$ak" AWS_SECRET_ACCESS_KEY="$sk" s3 head-bucket --bucket "$other" >/dev/null 2>&1; then nb=ALLOWED; bad="$bad $u"; else nb=denied; fi
                echo "  $u: $b=$own $other=$nb"
              done
              if [ -n "$bad" ]; then
                echo "FATAL: isolation check failed for:$bad" >&2
                exit 1
              fi
              echo "=== Done ==="
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: RUSTFS_SECRET_KEY
            - name: CNPGBACKUP_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-consumer-credentials
                  key: CNPGBACKUP_ACCESS_KEY
            - name: CNPGBACKUP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-consumer-credentials
                  key: CNPGBACKUP_SECRET_KEY
            - name: PYROSCOPE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-consumer-credentials
                  key: PYROSCOPE_ACCESS_KEY
            - name: PYROSCOPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-consumer-credentials
                  key: PYROSCOPE_SECRET_KEY
            - name: CLICKHOUSE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-consumer-credentials
                  key: CLICKHOUSE_ACCESS_KEY
            - name: CLICKHOUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-consumer-credentials
                  key: CLICKHOUSE_SECRET_KEY
            - name: PEERDB_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-consumer-credentials
                  key: PEERDB_ACCESS_KEY
            - name: PEERDB_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-consumer-credentials
                  key: PEERDB_SECRET_KEY
          # The AWS CLI is Python: one run peaks at ~80 MiB (measured), where mc
          # fitted in 64.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
