# Official Temporal chart; persistence is CNPG platform-db (ADR-030).
# The chart lacks worker probes and admintools readiness: HelmRelease Ready
# does not prove those processes are ready. Recheck before widening admission.
# Operations: docs/api/temporal.md#temporal-infrastructure.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
  namespace: temporal
  labels:
    app.kubernetes.io/component: workflow-engine
spec:
  interval: 30m
  # Allow cold pulls and the serial schema -> frontend -> namespace startup.
  # A 5m timeout can stall temporal-local and block the app dependency wave.
  timeout: 15m
  # Release name `temporal` + chart name `temporal` ⇒ fullname `temporal`, which
  # is what keeps the Service names (temporal-frontend, …) stable.
  releaseName: temporal
  chart:
    spec:
      chart: temporal
      version: "1.7.0" # appVersion 1.32.0 (>= 1.29.1 → Worker Versioning capable)
      sourceRef:
        kind: HelmRepository
        name: temporalio
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  values:
    server:
      replicaCount: 1
      # Shared default for frontend / matching / worker. `history` overrides it
      # below -- it is the only service that carries the 512 history shards, and
      # measurement says it needs an order of magnitude more than its siblings.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      # History owns 512 shards and needs more headroom than the other services.
      # Observed 363Mi RSS was during incomplete shard acquisition, not steady state;
      # socket-buffer pressure also counts toward the memory limit. No CPU cap.
      # Missing schema_version on cold start is an ordering failure, not an OOM.
      history:
        resources:
          requests:
            cpu: 300m
            memory: 384Mi
          limits:
            memory: 1Gi
      metrics:
        # vmagent runs selectAllByDefault, so a plain ServiceMonitor is scraped
        # with no extra labels; the temporal PrometheusRule matches
        # job=~".*temporal.*".
        serviceMonitor:
          enabled: true
          interval: 30s
      config:
        persistence:
          # Immutable after first deployment. The chart reads this under persistence;
          # placing it at server.config is a silent no-op.
          numHistoryShards: 512
          datastores:
            default:
              sql:
                pluginName: postgres12
                databaseName: temporal
                connectAddr: platform-db-rw.platform.svc.cluster.local:5432
                connectProtocol: tcp
                user: temporal
                existingSecret: platform-db-temporal-secret
                secretKey: password
                createDatabase: false # pre-created by CNPG postInitSQL; role has no CREATEDB
                manageSchema: true
                # Shared by four services and two datastores: up to 8 x 20 = 160
                # connections against platform-db's 197 usable slots, shared with other clients.
                # Keep some idle capacity without reserving all 160 connections.
                maxConns: 20
                maxIdleConns: 10
                maxConnLifetime: 1h
            visibility:
              sql:
                pluginName: postgres12
                databaseName: temporal_visibility
                connectAddr: platform-db-rw.platform.svc.cluster.local:5432
                connectProtocol: tcp
                user: temporal
                existingSecret: platform-db-temporal-secret
                secretKey: password
                createDatabase: false
                manageSchema: true
                # Same reasoning as the default datastore above; the
                # visibility store is the other half of the 8-pool ceiling.
                maxConns: 20
                maxIdleConns: 10
                maxConnLifetime: 1h
        # Replaces the retired TemporalNamespace CRD: the chart's namespace job
        # registers `mop` with the same 7-day retention the platform ran before.
        namespaces:
          create: true
          # Chart 1.7.0 split this from schema.useHelmHooks and defaults it true.
          useHelmHooks: false
          namespace:
            - name: mop
              retention: 168h

    # Schema/namespace jobs are plain resources under Flux (no Helm hooks).
    schema:
      useHelmHooks: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

    # tctl/temporal CLI pod — used for namespace + search-attribute operations.
    admintools:
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi

    web:
      enabled: true
      replicaCount: 1
      # Chart 1.7.0 defaults to 2.54.1; pinned to match local-stack.
      image:
        tag: 2.55.0
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
