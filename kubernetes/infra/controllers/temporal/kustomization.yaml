apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Chart + the operator tooling that lives with it. Its PrometheusRule is
# configs/temporal (temporal-config-local), the same split
# envoy-gateway-local/envoy-gateway-config-local uses; the temporal-ui route
# lives in configs/envoy-gateway/routes/temporal.yaml.
#
# helmrelease.yaml.bak is the retired operator: the `.bak` suffix keeps it out of
# here and out of `make validate` without commenting the file into unreadability.
resources:
  - helmrelease.yaml
  # RFC-0026 / ADR-054: the Worker Controller. CRDs chart first — the manager's
  # HelmRelease dependsOn it. These replace the ADR-030 cutover CronJob, which is
  # deleted rather than kept: the controller sets the Current version itself, so a
  # suspended Job template would be a second, contradicting writer of that setting.
  - worker-controller-crds-helmrelease.yaml
  - worker-controller-helmrelease.yaml
