# RFC-0021 P3 — make a Worker Deployment Version Current (manual one-shot template).
#
# ADR-030 versions the order saga with Worker Deployment Versioning: each worker
# build declares a deployment name + Build ID, the server pins every workflow to
# the version that STARTED it, and routes its tasks only to workers of that
# version. Which version is CURRENT — the one new workflows start on — is a server
# side setting, and this is how it gets set.
#
# WHY THIS IS NOT A RECONCILED JOB.
#
#   1. It is a DECISION, not a desired state. ADR-030 runs two worker versions side
#      by side during the cutover while the old one drains, and the CLI also offers a
#      ramping version. A Job re-asserting "current = X" on every reconcile would
#      fight an operator mid-ramp.
#
#   2. Reconciled from THIS path it would deadlock. The file sits in
#      controllers/temporal, applied by temporal-local with wait: true — and
#      apps-local dependsOn temporal-local. By default the command fails until a
#      worker of that version has polled (verified on CLI 1.7.3:
#      "no Worker Deployment found with name 'order-fulfillment'; does your Worker
#      Deployment have pollers?"), and that worker is deployed by apps-local. So the
#      Job would exhaust its backoffLimit, hold temporal-local NotReady, and block
#      the wave that would have satisfied it. `--allow-no-pollers` exists, so this is
#      the default behaviour rather than an impossibility — but setting a version
#      Current before any worker serves it is exactly the silent hang the rest of this
#      change exists to prevent.
#
# So it ships the way the inventory backfill does: a SUSPENDED CronJob used purely
# as a run-on-demand template. A suspended plain Job is unsafe under Flux —
# resuming it races the next reconcile, which resets suspend:true and would kill
# the run mid-flight — while a suspended CronJob lets Flux own the template and the
# operator instantiate a real Job outside Flux:
#
#   kubectl -n temporal create job order-set-current-$(date +%s) \
#     --from=cronjob/temporal-worker-set-current-version
#
# Check it landed:
#   kubectl -n temporal exec deploy/temporal-admintools -- \
#     temporal worker deployment describe --namespace mop \
#       --address temporal-frontend.temporal.svc.cluster.local:7233 \
#       --name order-fulfillment
#
# (`describe` takes --name; only set-current-version takes --deployment-name.)
#
# BUILD_ID must equal the order-worker image tag AND its TEMPORAL_WORKER_BUILD_ID.
# scripts/flux-validate.sh enforces all three, because a mismatch pins new
# workflows to a version no worker serves — and that fails silently: no error, no
# failed activity, no alert, the cutover simply stops progressing.
#
# Full procedure — including the ordering this Job depends on, ramping, and what a
# rollback can and cannot do — is in the write-cutover runbook:
# docs/proposals/rfc/RFC-0021/cutover-rollback.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: temporal-worker-set-current-version
  namespace: temporal
  labels:
    app.kubernetes.io/component: workflow-engine
    platform.duynhlab.dev/rfc: "0021"
spec:
  # Never scheduled. Feb 31st does not exist — a belt-and-braces guard in case
  # `suspend` is ever flipped by accident.
  schedule: "0 0 31 2 *"
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 2
      # Bounds a run rather than letting a pod wait forever — the CLI prompts
      # without --yes, and a prompt with no TTY would otherwise hang indefinitely.
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: temporal-worker-set-current-version
        spec:
          restartPolicy: Never
          # Matches the inventory-backfill precedent this header cites.
          securityContext:
            runAsNonRoot: true
            # The image declares its USER by NAME (temporal), which the kubelet
            # cannot verify against runAsNonRoot — without a numeric uid the pod
            # dies in CreateContainerConfigError before the entrypoint runs.
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: admintools
              # Same image and CLI version the chart deploys, so the client can
              # never be older than the server it talks to.
              image: temporalio/admin-tools:1.31.2
              imagePullPolicy: IfNotPresent
              args:
                - temporal
                - worker
                - deployment
                - set-current-version
                - --address
                - temporal-frontend.temporal.svc.cluster.local:7233
                - --namespace
                - mop
                - --deployment-name
                - order-fulfillment
                - --build-id
                - "1.8.0"
                # Non-interactive: without --yes the CLI prompts for confirmation and
                # the pod would sit there until activeDeadlineSeconds above.
                - --yes
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 128Mi
