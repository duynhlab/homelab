apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Tracing stack: the OTel Collector (pipeline) is the only thing this layer
# still deploys. Both trace SINKS -- VictoriaTraces (VTSingle) and ClickHouse --
# are delivered by the configs layer, not here.
resources:
  - otel-collector/otel-collector.yaml
# RFC-0027 / ADR-058 + ADR-059: Tempo and Jaeger retired. Their manifests stay
# beside this file as *.yaml.bak — the suffix keeps them out of here and out of
# `make validate` without commenting the files into unreadability.
