# Conformance overlay for the end-to-end gate (ADR-076):
#
#   docker compose -f compose.yaml -f compose.weaver.yaml up -d
#   … run the gate traffic …
#   make -C .. e2e-conformance   # POST /stop, GET /report, POST /shutdown, verdict
#
# Weaver >= 0.27 with --output=http: /stop returns once the report is ready,
# GET /report serves it, POST /shutdown ends the process (exit 1 = a violation).
# The client owns the run, so there is no inactivity timeout.
#
# The collector gets a second config that copies every signal to Weaver's
# live-check; the base pipelines are untouched. WEAVER_REGISTRY points at the
# registry to check against — the pkg checkout next to this repo by default.
services:
  otel-collector:
    command: ["--config=/etc/otelcol/config.yaml", "--config=/etc/otelcol/weaver.yaml"]
    volumes:
      - ./observability/otel-collector-weaver.yaml:/etc/otelcol/weaver.yaml:ro
    depends_on:
      weaver: { condition: service_started }

  weaver:
    image: otel/weaver:v0.28.0
    environment:
      HOME: /tmp
    command:
      - registry
      - live-check
      - --registry=/registry
      - --input-source=otlp
      - --otlp-grpc-address=0.0.0.0
      - --otlp-grpc-port=4317
      - --admin-port=4320
      - --format=json
      - --output=http # the report is served on GET /report: no volume, no file permissions
      - --fail-on=violation
    volumes:
      - ${WEAVER_REGISTRY:-../../pkg/semconv/registry}:/registry:ro
    ports:
      - "127.0.0.1:4320:4320" # admin: /health, POST /stop, GET /report, POST /shutdown
