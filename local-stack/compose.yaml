# Local end-to-end test stack for the duynhlab e-commerce platform.
#
# Brings up: Postgres (13 DBs) + Valkey cache + per-service golang-migrate migrations
# + 10 Go services + Temporal (server 1.31.2 on Postgres, as in the cluster)
# + Keycloak (realm `duynhlab`, RFC-0024 P3 identity cutover) + the
# order-fulfillment worker + an Envoy Gateway standalone edge (same Gateway API
# resources as the cluster edge) + the React frontend.
#
# Build contexts point at sibling repos (../../<service>), so all repos must be
# checked out next to homelab/. Run from this directory:
#   docker compose up -d --build
# `docker compose` is the documented command; podman with its compose provider
# (`podman compose`, or podman's socket exported as DOCKER_HOST) is a supported
# local substitute and needs no change to this file.
# Then open the SPA at http://localhost:3001 (API gateway at http://localhost:8080,
# Temporal UI at http://localhost:8233).
#
# A checkout starts the OrderFulfillmentWorkflow: it reserves stock (product),
# creates a shipment (shipping), confirms the order, notifies, and clears the
# cart — with reverse-order compensation on failure. Watch it in the Temporal UI.
#
# Tracing fans into VictoriaTraces (via an OTel Collector) — audit it in Grafana
# at http://localhost:3002 (Explore → VictoriaTraces). Profiling is enabled — each
# service pushes pprof to the local Pyroscope (:4040, Grafana → Explore → Pyroscope).
# Identity (RFC-0024 P3): the SPA logs in against Keycloak (http://localhost:8081,
# realm `duynhlab`, keycloak-js PKCE) and services verify realm tokens via OIDC_*
# (pkg authmw). The realm is the only token issuer: there is no
# auth-service here, and no service, worker, or route refers to one. Its
# cluster surface retired with RFC-0024 P5; the repo is archived.
# Demo login: alice / password123 (by username, on the Keycloak login page).

x-svc-env: &svc-env
  ENV: development
  TRACING_ENABLED: "true"
  OTEL_COLLECTOR_ENDPOINT: otel-collector:4318 # host:port; the OTLP-HTTP SDK appends /v1/traces
  OTEL_SAMPLE_RATE: "1.0"                       # sample everything locally (prod default 0.1)
  # RFC-0014 P3: OTLP is the only metrics pipeline (pkg v0.17.0 defaults it
  # on; OTEL_METRICS_ENABLED=false is the kill switch).
  DEPLOYMENT_ENVIRONMENT: local
  # RFC-0014 P4: app logs ship over OTLP fleet-wide (otelzap tee); Vector
  # skips these containers. =false is the kill switch (re-add the container
  # to Vector's tailing by removing it from exclude_containers too).
  OTEL_LOGS_ENABLED: "true"
  PROFILING_ENABLED: "true"                     # local Pyroscope (disable to skip profiling)
  PYROSCOPE_ENDPOINT: http://pyroscope:4040
  LOG_LEVEL: info
  LOG_FORMAT: json
  PORT: "8080"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_SSLMODE: disable
  # RFC-0024 P3: services verify Keycloak realm tokens (pkg authmw).
  # Split-horizon issuer: the browser reaches Keycloak at the published
  # http://localhost:8081, and start-dev (no --hostname) derives `iss` from the
  # request host — so tokens carry iss=http://localhost:8081/realms/duynhlab and
  # services must expect exactly that string. Their JWKS fetch, however, runs
  # inside the compose network where localhost:8081 is not Keycloak, hence the
  # explicit keycloak:8080 override (empty OIDC_JWKS_URL would derive it from
  # the issuer). OIDC_AUDIENCE rides the service default (duynhlab-platform).
  OIDC_ISSUER: http://localhost:8081/realms/duynhlab
  OIDC_JWKS_URL: http://keycloak:8080/realms/duynhlab/protocol/openid-connect/certs

x-svc-healthcheck: &svc-healthcheck
  test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 15s

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  cache:
    image: valkey/valkey:9-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Keycloak (RFC-0024 P3: the platform IdP, realm `duynhlab`) ----
  # Same image pin as the cluster Deployment; `start-dev` instead of `start`
  # is the deliberate compose divergence (HTTP, no --hostname: the issuer is
  # derived from the request host — see the OIDC_ISSUER note in x-svc-env).
  # ./keycloak/*.json are verbatim copies of the cluster ConfigMap's realm
  # JSONs (ADR-050 split): `duynhlab` = customers only (fixed demo-user UUIDs
  # a11ce000-…{1..5}, client customer-spa), `duynhlab-staff` = workforce
  # (operator duyne, client admin-portal, registration off, brute-force on).
  # Both carry audience duynhlab-platform; redirect URIs already point at the
  # localhost dev origins. --import-realm only imports when a realm does not
  # exist yet — `docker compose down -v` re-converges to this state.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2@sha256:9d1f1b2b7261ff53c66cb1092dfcdc34a5fb77e81f9e6a6e75b8b6a795de8067
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      # Dev-only bootstrap admin (cluster: keycloak-bootstrap-admin via ESO).
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true" # health lives on the management port :9000
      KC_HTTP_PORT: "8080"
      # Observability (mirrors the cluster Deployment; vmagent job `keycloak`
      # scrapes :9000 in-network — deliberately not published, like temporal).
      KC_METRICS_ENABLED: "true"
      # keycloak_user_events_total (LOGIN/LOGIN_ERROR/...) — the login-KPI
      # counter. Tags: default is realm-only to cap cardinality; clientId is
      # safe here (2 clients per realm) and needed to split SPA vs portal.
      KC_EVENT_METRICS_USER_ENABLED: "true"
      KC_EVENT_METRICS_USER_TAGS: "realm,clientId"
      # Histograms + SLO buckets (ms) make http_server_requests_seconds_bucket
      # quantile-queryable (p95 target <250ms).
      KC_HTTP_METRICS_HISTOGRAMS_ENABLED: "true"
      KC_HTTP_METRICS_SLOS: "10,50,250,500,1000,2500"
      # OpenTelemetry tracing (GA since KC 26.1): OTLP gRPC to the collector.
      # The browser reaches Keycloak directly (not via the edge), so these
      # spans are their own trace roots. JDBC spans ride along by default.
      KC_TRACING_ENABLED: "true"
      KC_TRACING_ENDPOINT: http://otel-collector:4317
      KC_TRACING_SAMPLER_TYPE: parentbased_traceidratio
      KC_TRACING_SAMPLER_RATIO: "1.0" # sample everything locally (prod 0.1)
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local # vmagent promote allowlist
      # JSON console logs: Vector's parse_json merge makes level/loggerName/
      # event fields queryable in VictoriaLogs instead of raw Quarkus text.
      KC_LOG_CONSOLE_OUTPUT: json
    volumes:
      - ./keycloak/duynhlab-realm.json:/opt/keycloak/data/import/duynhlab-realm.json:ro
      - ./keycloak/duynhlab-staff-realm.json:/opt/keycloak/data/import/duynhlab-staff-realm.json:ro
    ports:
      - "8081:8080" # browser-facing origin http://localhost:8081 (SPA login + iss)
    # The image ships no curl/wget; probe /health/ready on the management port
    # with bash's /dev/tcp (the documented Keycloak container healthcheck).
    # YAML double-quote escaping: \\r\\n below reaches the shell as literal
    # \r\n, which `echo -e` then expands into the HTTP line breaks.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s # JVM start + first-boot realm import is slow
    depends_on:
      postgres: { condition: service_healthy }

  # ---- Temporal (drives the order-fulfillment saga) ----
  # Server and storage engine match the cluster: server 1.31.2 (chart 1.6.0's
  # appVersion) on Postgres through the `postgres12` plugin, databases `temporal`
  # and `temporal_visibility`. That is what makes Temporal testable end to end
  # here — workflow history, timers and Worker Deployment Versioning state all
  # survive `docker compose restart temporal`. The previous `start-dev` server
  # kept everything in memory, so a restart took the namespace from 9 live
  # executions to 0 and no drain rehearsal could span one.
  #
  # Five containers replace the single dev-server, in this order:
  #   temporal-schema (run-once) -> temporal -> temporal-bootstrap (run-once)
  # plus temporal-admintools and temporal-ui. Services depend on the bootstrap,
  # not the server, because the `mop` namespace does not exist until it runs.
  #
  # `temporalio/server` carries no client binary — only `temporal-server` and
  # busybox — so every `temporal ...` command runs in temporal-admintools:
  #   docker compose exec -T temporal-admintools temporal workflow list --namespace mop
  #
  # `docker compose down` still wipes this: `postgres` has no data volume, by
  # design. Use `restart` to exercise durability.
  temporal-schema:
    image: temporalio/admin-tools:1.31.2
    # A healthy postgres can still refuse the first connection during bring-up;
    # retry rather than failing every Temporal-dependent service behind it.
    restart: on-failure:5
    environment:
      SQL_PASSWORD: postgres # temporal-sql-tool reads the password from here, not a flag
    # The two databases are created by postgres/init.sql, mirroring the cluster
    # where CNPG postInitSQL owns creation and Temporal runs with
    # `createDatabase: false`. Re-running is safe: setup-schema skips a database
    # whose version already exceeds the initial one, and update-schema then finds
    # no pending updates.
    command:
      - sh
      - -c
      - |
        set -e
        for db in temporal temporal_visibility; do
          [ "$$db" = temporal ] && dir=temporal || dir=visibility
          temporal-sql-tool --plugin postgres12 --ep postgres -p 5432 -u postgres --db "$$db" \
            setup-schema -v 0.0
          temporal-sql-tool --plugin postgres12 --ep postgres -p 5432 -u postgres --db "$$db" \
            update-schema -d "/etc/temporal/schema/postgresql/v12/$$dir/versioned"
        done
    depends_on:
      postgres: { condition: service_healthy }

  temporal:
    image: temporalio/server:1.31.2
    # on-failure: a restart dies FATALLY after ~50s roughly half the time, when
    # ringpop cannot bootstrap ("join duration of 50.6s exceeded max 30s"). Seen
    # first in the 2026-08-13 audit: `restart temporal` (A14) answered the row,
    # then exited(1) about 50s later — long after the row had reported PASS —
    # silently taking every timer with it.
    #
    # Measured 2026-08-17 over eight restarts: FOUR crashed, four did not. The
    # count of stale rows in `cluster_membership` does not predict it (12 clean,
    # 16 crash, 20 crash, 24 clean), so the earlier note here — that the retry
    # succeeds "once the stale entry has aged out" — was wrong twice over: the
    # rows carry a two-DAY record_expiry and never age out inside a run, and
    # they are not what decides the outcome. It is not resource starvation
    # either: the container has no CPU or memory limit, has never been
    # OOM-killed, and the podman VM has 8 vCPU / 16 GB. The mechanism is still
    # open; what is established is the rate and that on-failure recovers it.
    #
    # CONSEQUENCE FOR THE AUDIT, not just for compose: any row that depends on a
    # Temporal timer and runs AFTER A14 is racing a coin flip. A13 came back
    # `expired|lazy` — inconclusive — on the run where the engine died.
    restart: on-failure:5
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      # Cluster runs 512 (helmrelease.yaml). 4 is a deliberate local divergence:
      # shard count partitions throughput, not behaviour, and local-stack does no
      # load testing. Immutable once the databases are initialised.
      NUM_HISTORY_SHARDS: "4"
      LOG_LEVEL: warn # Vector tails this container; info-level server logs swamp VictoriaLogs
      TEMPORAL_LOG_FORMAT: zapjson # structured, so VictoriaLogs parses fields instead of raw text
      # The entrypoint derives TEMPORAL_BROADCAST_ADDRESS from the hostname when
      # this is a wildcard, so ring membership still works and the healthcheck
      # below can use localhost.
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      # Server metrics (service_*, persistence_*) on :8000 — the image's config
      # template only renders a global.metrics.prometheus listener when this
      # env var is set. In-network only (vmagent job `temporal`); deliberately
      # not published to the host, like every other scrape surface here. This
      # is what lets the local stack validate the cluster's three server-side
      # Temporal alerts (TemporalServerDown / ServiceErrorRate / Persistence).
      PROMETHEUS_ENDPOINT: 0.0.0.0:8000
    # Required, not optional: the server refuses to start when
    # DYNAMIC_CONFIG_FILE_PATH does not resolve, and the image ships no such file.
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    ports:
      - "7233:7233" # frontend gRPC
    # `nc` because this image carries no CLI — only `temporal-server` and busybox.
    # It is also namespace-independent, which matters: a `--namespace mop` probe
    # would deadlock, since `mop` is created by temporal-bootstrap, which in turn
    # waits on this healthcheck.
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }
      temporal-schema: { condition: service_completed_successfully }

  # Registers `mop` with the cluster's retention (168h). Gate Temporal-dependent
  # services on this completing, not on the server being healthy.
  temporal-bootstrap:
    image: temporalio/admin-tools:1.31.2
    restart: on-failure:5 # the frontend can accept a TCP probe just before it serves the API
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    command:
      - sh
      - -c
      - |
        set -e
        if temporal operator namespace describe --namespace mop >/dev/null 2>&1; then
          echo "namespace mop already registered"
        else
          temporal operator namespace create --namespace mop --retention 168h \
            --description "duynhlab platform workflows (order-fulfillment saga)"
        fi
        # Custom Search Attributes (business-key lookup in UI/CLI: OrderId for
        # the saga, SessionId for the abandoned-checkout watch). Part of the
        # namespace contract — services set them in StartWorkflowOptions, and
        # a start referencing an unregistered attribute is REJECTED, so this
        # must run before any workflow traffic. Mirrors the cluster's
        # temporal-search-attributes Job. `create` is idempotent per name
        # (already-exists is reported and skipped, exit 0).
        temporal operator search-attribute create --namespace mop \
          --name OrderId --type Keyword --name SessionId --type Keyword
    depends_on:
      temporal: { condition: service_healthy }

  # The CLI target. `temporalio/server` ships only the server binary and busybox,
  # so every `temporal ...` invocation — the e2e runbook's workflow queries, the
  # versioning drill, ad-hoc debugging — runs here:
  #   docker compose exec -T temporal-admintools temporal workflow list --namespace mop
  # This mirrors `kubectl exec deploy/temporal-admintools` on the cluster, and the
  # tag tracks the cluster's admin-tools pin so the client is never older than the
  # server it talks to.
  temporal-admintools:
    image: temporalio/admin-tools:1.31.2 # default entrypoint sleeps; nothing to run
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      # `mop` is the only namespace here, so default to it. Without this the CLI
      # silently queries `default` and returns an empty list rather than an error
      # — an easy way to mis-read a green run as a failure.
      TEMPORAL_NAMESPACE: mop
    depends_on:
      temporal: { condition: service_healthy }

  temporal-ui:
    image: temporalio/ui:2.53.3
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080" # keeps the documented http://localhost:8233
    depends_on:
      temporal: { condition: service_healthy }

  # ---- Observability: traces → VictoriaTraces; span-derived RED metrics → VictoriaMetrics ----
  # Services emit OTLP-HTTP to the collector (:4318). The collector (a) re-exports traces to
  # VictoriaTraces' custom ingest path (the std OTLP SDK can't target it directly, so the
  # collector is required), and (b) runs the spanmetrics connector to derive RED metrics
  # (calls/duration by service) which it remote-writes to VictoriaMetrics. Audit traces in
  # Grafana Explore → VictoriaTraces; view the RED dashboard backed by VictoriaMetrics.
  # Mirrors the in-cluster topology (services → otel-collector → VictoriaTraces/Grafana),
  # with spanmetrics standing in for Tempo's metrics-generator locally.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0 # contrib: spanmetrics connector lives here; 0.159.0 matches cluster (OTel logs schema 1.3.0, no TimestampTime)
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318" # OTLP-HTTP (also handy for a host-side telemetrygen smoke test)
    depends_on:
      victoria-traces: { condition: service_started }
      victoria-metrics: { condition: service_started }
      victoria-logs: { condition: service_started }
      clickhouse: { condition: service_healthy }

  victoria-traces:
    image: victoriametrics/victoria-traces:v0.11.0
    command:
      - "-httpListenAddr=:10428"
      - "-storageDataPath=/victoria-traces-data"
      - "-retentionPeriod=7d"
    volumes:
      - victoria-traces-data:/victoria-traces-data
    ports:
      - "10428:10428" # OTLP ingest + Jaeger query API + LogsQL + vmui

  # RFC-0019 Phase B: ClickHouse OLAP for long-retention SQL over OTel logs+traces.
  # Runs ALONGSIDE VictoriaTraces/VictoriaLogs (supplementary, not a replacement);
  # the collector fans logs+traces here too. otel_logs/otel_traces auto-created by
  # the exporter (create_schema). Dev: default user, no password.
  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_PASSWORD: otel # dev password (CH ≥25.3 requires one for default); cluster uses an ESO secret
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Built-in Prometheus endpoint (engine self-view; scraped by vmagent).
      # The cluster deliberately does NOT enable this at 1×1 — there the
      # Altinity exporter carries the engine signals; locally there is no
      # operator, so this endpoint IS the engine view.
      - ./observability/clickhouse/metrics.xml:/etc/clickhouse-server/config.d/metrics.xml:ro
    ports:
      - "8123:8123" # HTTP interface (SQL over curl — the C6 audit check)
      - "9000:9000" # native protocol (collector clickhouse exporter)
      - "9363:9363" # Prometheus /metrics (vmagent scrape; C20 audit check)
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password=otel", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Log pipeline sink (mirrors the in-cluster VLSingle). Receives BOTH paths:
  #   1. Vector (below) tailing every container's stdout -> jsonline ingest
  #   2. the application fleet's OTLP logs via the collector -> OTLP ingest
  # so the Vector-vs-OTel comparison from the pilot is visible locally. The edge
  # is on path 2 since ADR-060: it keeps writing its JSON access log to stdout
  # (so `docker logs` works) but Vector no longer tails it -- the OpenTelemetry
  # access-log sink carries those lines instead.
  victoria-logs:
    image: victoriametrics/victoria-logs:v1.52.0
    command:
      - "-httpListenAddr=:9428"
      - "-storageDataPath=/victoria-logs-data"
      - "-retentionPeriod=7d"
    volumes:
      - victoria-logs-data:/victoria-logs-data
    ports:
      - "9428:9428" # OTLP logs ingest + LogsQL query + vmui

  # Vector — mirrors the in-cluster DaemonSet: tails all container logs (docker
  # socket, read-only) and ships structured lines to VictoriaLogs. See
  # observability/vector.yaml.
  vector:
    image: timberio/vector:0.50.0-alpine
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./observability/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      victoria-logs: { condition: service_started }

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.150.0
    command:
      - "-storageDataPath=/victoria-metrics-data"
      # RFC-0014 P1 (D-1/D-2): OTLP ingest shaping. usePrometheusNaming turns
      # http.server.request.duration (unit s) into http_server_request_duration_seconds_*;
      # promoteAll defaults to TRUE upstream, so the allowlist below must ship with
      # an explicit false or SDK defaults churn a full series set per restart.
      - "-opentelemetry.usePrometheusNaming"
      - "-opentelemetry.promoteAllResourceAttributes=false"
      - "-opentelemetry.promoteResourceAttributes=service.name,service.version,k8s.namespace.name,k8s.pod.name,deployment.environment.name"
      - "-opentelemetry.promoteScopeMetadata=false"
      - "-retentionPeriod=7d"
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
    ports:
      - "8428:8428" # remote-write (/api/v1/write) + PromQL + vmui

  # ---- Scrape + alert loop (the local counterpart of the cluster's
  # VM-operator stack) ----------------------------------------------------
  # vmagent scrapes what OTLP cannot carry: `up` for the backends themselves.
  # Without it no series says "ClickHouse is down" — the store's absence only
  # shows up as collector export failures. Jobs live in
  # observability/vmagent/prometheus.yml (the local ServiceMonitor analogue).
  vmagent:
    image: victoriametrics/vmagent:v1.150.0
    command:
      - "-promscrape.config=/etc/vmagent/prometheus.yml"
      - "-remoteWrite.url=http://victoria-metrics:8428/api/v1/write"
    volumes:
      - ./observability/vmagent/prometheus.yml:/etc/vmagent/prometheus.yml:ro
    ports:
      - "8429:8429" # vmagent UI + /api/v1/targets (C20 audit check)
    depends_on:
      victoria-metrics: { condition: service_started }

  # vmalert evaluates the ported cluster alert rules against local series, so
  # an alert expression is exercised here BEFORE it matters in the cluster.
  # No notifier on purpose: the UI/API on :8880 is the validation surface;
  # routing (alertmanager) is a later decision, recorded in
  # local-stack/docs/observability.md § Non-goals.
  vmalert:
    image: victoriametrics/vmalert:v1.150.0
    command:
      - "-datasource.url=http://victoria-metrics:8428"
      - "-remoteWrite.url=http://victoria-metrics:8428"
      - "-remoteRead.url=http://victoria-metrics:8428"
      - "-rule=/etc/vmalert/rules/*.yaml"
      - "-external.label=env=local"
      # vmalert refuses to start with alerting rules and no notifier at all;
      # blackhole is the explicit "evaluate, expose on the UI/API, route
      # nowhere" mode this stack wants (routing is a recorded non-goal).
      - "-notifier.blackhole"
    volumes:
      - ./observability/vmalert/rules:/etc/vmalert/rules:ro
    ports:
      - "8880:8880" # vmalert UI + /api/v1/alerts (C21 audit check)
    depends_on:
      victoria-metrics: { condition: service_started }

  # ---- Continuous profiling: Pyroscope (single-binary, ephemeral local storage) ----
  # The Go services push pprof data here (PROFILING_ENABLED=true + PYROSCOPE_ENDPOINT
  # in x-svc-env). View flame graphs in Grafana → Explore → Pyroscope.
  pyroscope:
    image: grafana/pyroscope:2.2.1
    ports:
      - "4040:4040" # Pyroscope UI/API; services reach it in-network at pyroscope:4040
    volumes:
      - pyroscope-data:/data

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # clickhouse: RFC-0019 Phase B (SQL over otel_logs/otel_traces).
      # victoriametrics-logs: same version as the cluster datasource CR pins
      # (datasource-victorialogs.yaml) — closes the "logs only via vmui" gap.
      # Plugin install happens at container start and needs outbound internet
      # once (cached in the grafana volume afterwards).
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.20.0,victoriametrics-logs-datasource 0.29.0
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3002:3000" # http://localhost:3002 → Explore (traces) + RED dashboard
    depends_on:
      victoria-traces: { condition: service_started }
      victoria-metrics: { condition: service_started }
      pyroscope: { condition: service_started }
      clickhouse: { condition: service_healthy }

  # ---- golang-migrate migrations (one-shot, per service DB; app image `migrate`) ----
  user-migrate:
    build: { context: ../../user-service }
    command: ["migrate"]
    environment: { <<: *svc-env, SERVICE_NAME: user, DB_NAME: user }
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  product-migrate:
    build: { context: ../../product-service }
    command: ["migrate"]
    environment: { <<: *svc-env, SERVICE_NAME: product, DB_NAME: product }
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  cart-migrate:
    build: { context: ../../cart-service }
    command: ["migrate"]
    environment: { <<: *svc-env, SERVICE_NAME: cart, DB_NAME: cart }
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  order-migrate:
    build: { context: ../../order-service }
    command: ["migrate"]
    environment: { <<: *svc-env, SERVICE_NAME: order, DB_NAME: order }
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  review-migrate:
    build: { context: ../../review-service }
    command: ["migrate"]
    environment: { <<: *svc-env, SERVICE_NAME: review, DB_NAME: review }
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  shipping-migrate:
    build: { context: ../../shipping-service }
    command: ["migrate"]
    environment: { <<: *svc-env, SERVICE_NAME: shipping, DB_NAME: shipping }
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  notification-migrate:
    build: { context: ../../notification-service }
    command: ["migrate"]
    environment: { <<: *svc-env, SERVICE_NAME: notification, DB_NAME: notification }
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  payment-migrate:
    build: { context: ../../payment-service }
    command: ["migrate"]
    environment: { <<: *svc-env, SERVICE_NAME: payment, DB_NAME: payment }
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  # checkout has no seed job — no demo data (RFC-0015 P1).
  checkout-migrate:
    build: { context: ../../checkout-service }
    command: ["migrate"]
    environment: { <<: *svc-env, SERVICE_NAME: checkout, DB_NAME: checkout }
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  inventory-migrate:
    build: { context: ../../inventory-service }
    command: ["migrate"]
    environment: { <<: *svc-env, SERVICE_NAME: inventory, DB_NAME: inventory }
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  # ---- Dev-only demo seeds (one-shot). Seeding lives OUTSIDE the migration
  # chain (prod never seeds); each runs its service's `seed` subcommand after
  # that service's migrate. ----
  user-seed:
    build: { context: ../../user-service }
    command: ["seed"]
    environment: { <<: *svc-env, SERVICE_NAME: user, DB_NAME: user }
    depends_on:
      postgres: { condition: service_healthy }
      user-migrate: { condition: service_completed_successfully }
    restart: "no"
  product-seed:
    build: { context: ../../product-service }
    command: ["seed"]
    environment: { <<: *svc-env, SERVICE_NAME: product, DB_NAME: product }
    depends_on:
      postgres: { condition: service_healthy }
      product-migrate: { condition: service_completed_successfully }
    restart: "no"
  cart-seed:
    build: { context: ../../cart-service }
    command: ["seed"]
    environment: { <<: *svc-env, SERVICE_NAME: cart, DB_NAME: cart }
    depends_on:
      postgres: { condition: service_healthy }
      cart-migrate: { condition: service_completed_successfully }
    restart: "no"
  order-seed:
    build: { context: ../../order-service }
    command: ["seed"]
    environment: { <<: *svc-env, SERVICE_NAME: order, DB_NAME: order }
    depends_on:
      postgres: { condition: service_healthy }
      order-migrate: { condition: service_completed_successfully }
    restart: "no"
  review-seed:
    build: { context: ../../review-service }
    command: ["seed"]
    environment: { <<: *svc-env, SERVICE_NAME: review, DB_NAME: review }
    depends_on:
      postgres: { condition: service_healthy }
      review-migrate: { condition: service_completed_successfully }
    restart: "no"
  shipping-seed:
    build: { context: ../../shipping-service }
    command: ["seed"]
    environment: { <<: *svc-env, SERVICE_NAME: shipping, DB_NAME: shipping }
    depends_on:
      postgres: { condition: service_healthy }
      shipping-migrate: { condition: service_completed_successfully }
    restart: "no"
  notification-seed:
    build: { context: ../../notification-service }
    command: ["seed"]
    environment: { <<: *svc-env, SERVICE_NAME: notification, DB_NAME: notification }
    depends_on:
      postgres: { condition: service_healthy }
      notification-migrate: { condition: service_completed_successfully }
    restart: "no"
  inventory-seed:
    build: { context: ../../inventory-service }
    command: ["seed"]
    environment: { <<: *svc-env, SERVICE_NAME: inventory, DB_NAME: inventory }
    depends_on:
      postgres: { condition: service_healthy }
      inventory-migrate: { condition: service_completed_successfully }
    restart: "no"

  # ---- Backend services ----
  user:
    build: { context: ../../user-service }
    environment:
      <<: *svc-env
      SERVICE_NAME: user
      OTEL_SERVICE_NAME: user
      DB_NAME: user
      # ADR-050: the protected group verifies the STAFF realm (split-horizon).
      OIDC_STAFF_ISSUER: http://localhost:8081/realms/duynhlab-staff
      OIDC_STAFF_JWKS_URL: http://keycloak:8080/realms/duynhlab-staff/protocol/openid-connect/certs
    healthcheck: *svc-healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      user-migrate: { condition: service_completed_successfully }
      user-seed: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  shipping:
    build: { context: ../../shipping-service }
    # gRPC ShippingService always runs on :9090; HTTP :8080 is unchanged.
    # order reaches it at dns:///shipping:9090.
    environment:
      <<: *svc-env
      SERVICE_NAME: shipping
      OTEL_SERVICE_NAME: shipping
      DB_NAME: shipping
      GRPC_PORT: "9090"
      # ADR-050: the protected group verifies the STAFF realm (split-horizon).
      OIDC_STAFF_ISSUER: http://localhost:8081/realms/duynhlab-staff
      OIDC_STAFF_JWKS_URL: http://keycloak:8080/realms/duynhlab-staff/protocol/openid-connect/certs
    healthcheck: *svc-healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      shipping-migrate: { condition: service_completed_successfully }
      shipping-seed: { condition: service_completed_successfully }

  review:
    build: { context: ../../review-service }
    environment:
      <<: *svc-env
      SERVICE_NAME: review
      OTEL_SERVICE_NAME: review
      DB_NAME: review
    healthcheck: *svc-healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      review-migrate: { condition: service_completed_successfully }
      review-seed: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  notification:
    build: { context: ../../notification-service }
    environment:
      <<: *svc-env
      SERVICE_NAME: notification
      OTEL_SERVICE_NAME: notification
      DB_NAME: notification
    healthcheck: *svc-healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      notification-migrate: { condition: service_completed_successfully }
      notification-seed: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  product:
    build: { context: ../../product-service }
    environment:
      <<: *svc-env
      SERVICE_NAME: product
      OTEL_SERVICE_NAME: product
      DB_NAME: product
      CACHE_ENABLED: "true"
      CACHE_HOST: cache
      CACHE_PORT: "6379"
      REVIEW_GRPC_ADDR: dns:///review:9090
      # /details availability comes from inventory (soft-fail: an unreachable
      # inventory answers status=unknown, never a guess). Mandatory since product
      # 1.11.0 deleted PRODUCT_AVAILABILITY_SOURCE -- there is no "off" position,
      # because product has no stock of its own left to fall back to.
      INVENTORY_GRPC_ADDR: dns:///inventory:9090
      # product serves BatchGetCurrentPrices on gRPC :9090 (checkout's price
      # re-validation). The saga's ReserveStock/ReleaseStock left in 1.7.0.
      GRPC_PORT: "9090"
      # ADR-050: the protected catalog group verifies the STAFF realm
      # (split-horizon: the issuer is the browser-facing origin, the JWKS fetch
      # runs in-network).
      OIDC_STAFF_ISSUER: http://localhost:8081/realms/duynhlab-staff
      OIDC_STAFF_JWKS_URL: http://keycloak:8080/realms/duynhlab-staff/protocol/openid-connect/certs
    healthcheck: *svc-healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      product-migrate: { condition: service_completed_successfully }
      product-seed: { condition: service_completed_successfully }
      cache: { condition: service_healthy }
      review: { condition: service_healthy }
      # New since slice B: the protected catalog group builds a staff-realm
      # verifier at startup, so the realm has to exist first — same reason every
      # other protected service waits on it.
      keycloak: { condition: service_healthy }

  cart:
    build: { context: ../../cart-service }
    environment:
      <<: *svc-env
      SERVICE_NAME: cart
      OTEL_SERVICE_NAME: cart
      DB_NAME: cart
    healthcheck: *svc-healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      cart-migrate: { condition: service_completed_successfully }
      cart-seed: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  # ---- Inventory (RFC-0021): sole stock authority. East-west gRPC-only
  # (:9090, inventory.v1) — saga (reserve/commit/release), checkout
  # (availability), product /details. RFC-0023 adds its first HTTP business
  # surface: /inventory/v1/protected on :8080 behind the edge (Backoffice).
  # Keycloak dependency = the authmw JWKS verifier, like every verifying svc.
  inventory:
    build: { context: ../../inventory-service }
    environment:
      <<: *svc-env
      SERVICE_NAME: inventory
      OTEL_SERVICE_NAME: inventory
      DB_NAME: inventory
      GRPC_PORT: "9090"
      # ADR-050: the protected group verifies the STAFF realm (split-horizon
      # like OIDC_ISSUER above — issuer is the browser-facing origin, JWKS
      # fetch is in-network).
      OIDC_STAFF_ISSUER: http://localhost:8081/realms/duynhlab-staff
      OIDC_STAFF_JWKS_URL: http://keycloak:8080/realms/duynhlab-staff/protocol/openid-connect/certs
    healthcheck: *svc-healthcheck
    depends_on:
      keycloak: { condition: service_healthy }
      postgres: { condition: service_healthy }
      inventory-migrate: { condition: service_completed_successfully }
      inventory-seed: { condition: service_completed_successfully }

  # ---- Checkout (RFC-0015): session orchestrator — client-only, reached only
  # through the edge (no host port, platform convention). Snapshots the cart via
  # cart.v1/GetCart and re-validates prices via product.v1/GetProducts.
  checkout:
    build: { context: ../../checkout-service }
    environment:
      <<: *svc-env
      SERVICE_NAME: checkout
      OTEL_SERVICE_NAME: checkout
      DB_NAME: checkout
      CART_GRPC_ADDR: dns:///cart:9090
      PRODUCT_GRPC_ADDR: dns:///product:9090
      # P2 confirm handoff (ADR-018) + abandonment signals (ADR-019). Temporal
      # being down only degrades expiry to the lazy backstop — never a crash.
      ORDER_GRPC_ADDR: dns:///order:9090
      # P3 quote authority for PUT …/shipping (fee + tax composition).
      SHIPPING_GRPC_ADDR: dns:///shipping:9090
      # Inventory is the ONLY availability authority. The phase-2 shadow mode and
      # the CHECKOUT_AVAILABILITY_SOURCE flag that selected it were both deleted in
      # checkout 0.5.0 — there is no "off" position, because there is nothing left
      # to fall back to. An unreachable inventory fails CLOSED (503 + Retry-After).
      INVENTORY_GRPC_ADDR: dns:///inventory:9090
      TEMPORAL_HOSTPORT: temporal:7233
      TEMPORAL_NAMESPACE: mop
      TASK_QUEUE: checkout
    healthcheck: *svc-healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      checkout-migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      cart: { condition: service_healthy }
      product: { condition: service_healthy }
      order: { condition: service_healthy }
      shipping: { condition: service_healthy }
      temporal-bootstrap: { condition: service_completed_successfully }

  # ---- Checkout Temporal worker (AbandonedCheckoutWorkflow, ADR-019) ----
  checkout-worker:
    build: { context: ../../checkout-service }
    command: ["worker"]
    # Fail-fast like order-worker: an unreachable Temporal after the in-binary
    # dial retry exits the process; compose restarts it through bring-up races.
    restart: on-failure
    environment:
      <<: *svc-env
      SERVICE_NAME: checkout
      OTEL_SERVICE_NAME: checkout-worker
      DB_NAME: checkout
      TEMPORAL_HOSTPORT: temporal:7233
      TEMPORAL_NAMESPACE: mop
      TASK_QUEUE: checkout
    healthcheck: *svc-healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      checkout-migrate: { condition: service_completed_successfully }
      temporal-bootstrap: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy } # RFC-0024 P3: same OIDC_* env as the API service

  # ---- Mock payment provider (a second deployment of the payment binary via
  # the `mockpay` subcommand — the real network hop behind payment's provider
  # port). Standalone: no DB, no migrations.
  mockpay:
    build: { context: ../../payment-service }
    command: ["mockpay"]
    environment:
      <<: *svc-env
      SERVICE_NAME: mockpay
      OTEL_SERVICE_NAME: mockpay
      # Emit signed webhooks back through the edge (mirrors a real provider
      # calling the public webhook URL). Secret must match payment's.
      MOCKPAY_WEBHOOK_SECRET: whsec_local_demo
      MOCKPAY_WEBHOOK_URL: http://gateway:8000/payment/v1/public/payments/webhooks/mockpay
    healthcheck: *svc-healthcheck

  payment:
    # No seed job: payments are created by flows, not demo data.
    build: { context: ../../payment-service }
    environment:
      <<: *svc-env
      SERVICE_NAME: payment
      OTEL_SERVICE_NAME: payment
      DB_NAME: payment
      # Real provider hop: payment calls mockpay over HTTP (empty = in-memory stub).
      MOCKPAY_URL: http://mockpay:8080
      # Shared HMAC secret for verifying mockpay webhook signatures (must match
      # the value mockpay signs with — wired on mockpay when it starts emitting).
      MOCKPAY_WEBHOOK_SECRET: whsec_local_demo
      # ADR-050: the protected group verifies the STAFF realm (split-horizon).
      OIDC_STAFF_ISSUER: http://localhost:8081/realms/duynhlab-staff
      OIDC_STAFF_JWKS_URL: http://keycloak:8080/realms/duynhlab-staff/protocol/openid-connect/certs
    healthcheck: *svc-healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      payment-migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      mockpay: { condition: service_healthy }

  order:
    build: { context: ../../order-service }
    environment:
      <<: *svc-env
      SERVICE_NAME: order
      OTEL_SERVICE_NAME: order
      DB_NAME: order
      CART_SERVICE_URL: http://cart:8080
      SHIPPING_SERVICE_URL: http://shipping:8080
      # ADR-050: the protected group verifies the STAFF realm (split-horizon).
      OIDC_STAFF_ISSUER: http://localhost:8081/realms/duynhlab-staff
      OIDC_STAFF_JWKS_URL: http://keycloak:8080/realms/duynhlab-staff/protocol/openid-connect/certs
      # When set, order calls shipping over gRPC (Phase 1 pilot); unset = REST fallback.
      SHIPPING_GRPC_ADDR: dns:///shipping:9090
      NOTIFICATION_GRPC_ADDR: dns:///notification:9090
      # CreateOrder commits the order (pending) then starts the Temporal saga,
      # which drives confirm + notification + cart-clear. The worker runs in the
      # order-worker service below.
      TEMPORAL_HOSTPORT: temporal:7233
      TEMPORAL_NAMESPACE: mop
      TASK_QUEUE: order-fulfillment
      # Payment gRPC target for the order-details enrichment (GetPayment). The
      # saga's payment steps (authorize-early/capture-late + void/refund) are
      # always on; the worker uses its own PAYMENT_GRPC_ADDR for the money ops.
      PAYMENT_GRPC_ADDR: dns:///payment:9090
      # RFC-0021 P5: inventory gRPC target for the /details reservation
      # snapshot (soft-fail read; the worker has its own copy for the saga).
      INVENTORY_GRPC_ADDR: dns:///inventory:9090
    healthcheck: *svc-healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      order-migrate: { condition: service_completed_successfully }
      order-seed: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
      cart: { condition: service_healthy }
      shipping: { condition: service_healthy }
      temporal-bootstrap: { condition: service_completed_successfully }

  # ---- Order fulfillment worker (Temporal: runs the saga's activities) ----
  order-worker:
    build: { context: ../../order-service }
    command: ["worker"]
    # The worker is fail-fast by design: an unreachable Temporal/downstream at
    # startup (after the in-binary dial retry) exits the process. Mirror the
    # K8s pod restart so a bring-up race self-heals instead of leaving the
    # saga dead until a manual restart.
    restart: on-failure
    environment:
      <<: *svc-env
      SERVICE_NAME: order
      OTEL_SERVICE_NAME: order-worker
      DB_NAME: order
      CART_SERVICE_URL: http://cart:8080
      SHIPPING_GRPC_ADDR: dns:///shipping:9090
      NOTIFICATION_GRPC_ADDR: dns:///notification:9090
      # Payment gRPC target for the saga's authorize/capture/void/refund steps.
      # The worker dials this unconditionally (lazy); the workflow input decides
      # whether the steps actually run.
      PAYMENT_GRPC_ADDR: dns:///payment:9090
      # RFC-0021: the saga's only stock authority since P4 removed the
      # product-service branch.
      INVENTORY_GRPC_ADDR: dns:///inventory:9090
      TEMPORAL_HOSTPORT: temporal:7233
      TEMPORAL_NAMESPACE: mop
      TASK_QUEUE: order-fulfillment
    healthcheck: *svc-healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      order-migrate: { condition: service_completed_successfully }
      temporal-bootstrap: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy } # RFC-0024 P3: same OIDC_* env as the API service
      inventory: { condition: service_healthy }
      shipping: { condition: service_healthy }
      notification: { condition: service_healthy }
      cart: { condition: service_healthy }
      payment: { condition: service_healthy }

  # ---- Gateway (Envoy Gateway, STANDALONE mode — ADR-046) ----
  # Same Gateway API dialect as the cluster edge
  # (kubernetes/infra/configs/envoy-gateway/): GatewayClass + Gateway +
  # HTTPRoute + SecurityPolicy + BackendTrafficPolicy, in ./gateway/eg/. One
  # container runs BOTH halves: the `envoy-gateway` control plane reads those
  # files (no Kubernetes API server) and starts Envoy as a child process (no
  # Deployment). Read ./gateway/eg/standalone.yaml first — it explains the two
  # writable-path requirements below.
  #
  # The control plane refuses to start without its own xDS TLS material: it
  # serves xDS to its Envoy child over mTLS and self-signs that pair. In
  # Kubernetes a certgen Job writes those certs as Secrets before the
  # controller runs; here the same binary does it with `certgen --local`.
  # It is a separate service because the image is distroless — no shell, so
  # `certgen && server` cannot be chained inside one container.
  gateway-certgen:
    image: envoyproxy/gateway:v1.9.0@sha256:6f40c7b218b4ff1c4cb481923ed2c9a7634580365913434dd5dda9e954c0114b
    command: ["certgen", "--local", "--overwrite", "--config-home", "/var/lib/eg"]
    volumes:
      - envoy-gateway-data:/var/lib/eg
    restart: "no"

  gateway:
    image: envoyproxy/gateway:v1.9.0@sha256:6f40c7b218b4ff1c4cb481923ed2c9a7634580365913434dd5dda9e954c0114b
    # The image ENTRYPOINT is /usr/local/bin/envoy-gateway, so `command` is just
    # its arguments.
    command: ["server", "--config-path", "/config/standalone.yaml"]
    volumes:
      - ./gateway/eg:/config:ro
      # Writable state, and NOT optional. In Host infrastructure mode the
      # control plane self-signs the xDS TLS material for its own Envoy child
      # process AND obtains the Envoy BINARY at runtime (upstream uses func-e,
      # which downloads it into dataHome on first start — so a cold boot needs
      # outbound internet). The named volume caches that download across
      # `docker compose down` + `up`; `down -v` re-downloads it.
      # /var/lib/eg exists world-writable in the image for this purpose, which
      # is what lets the container keep running as its non-root uid 65532.
      - envoy-gateway-data:/var/lib/eg
    ports:
      - "8080:8000" # unchanged: the Envoy listener is on 8000 (see gateway/eg/gateway.yaml)
      - "8099:8081" # control-plane /readyz — the only machine-readable "config loaded" signal
    # NO healthcheck, and it is not an oversight: the image is
    # gcr.io/distroless/base-nossl:nonroot, which ships no shell and no
    # wget/curl, so every form of Compose healthcheck (CMD, CMD-SHELL, bash
    # /dev/tcp) is impossible. Consequence: `frontend` can only wait for
    # `service_started` below, so the SPA may be reachable a few seconds before
    # the edge accepts requests — a page load in that window fails its API
    # calls and needs a refresh. Gate on the edge from the host instead:
    #   curl -sf -o /dev/null http://localhost:8080/product/v1/public/products
    depends_on:
      user: { condition: service_healthy }
      product: { condition: service_healthy }
      cart: { condition: service_healthy }
      order: { condition: service_healthy }
      review: { condition: service_healthy }
      shipping: { condition: service_healthy }
      notification: { condition: service_healthy }
      payment: { condition: service_healthy }
      checkout: { condition: service_healthy }
      # The realm must be reachable before the edge starts: Envoy fetches the
      # JWKS for the jwt_authn filter and a private route cannot be served
      # until it has one.
      keycloak: { condition: service_healthy }
      # xDS certificates must exist before the control plane boots.
      gateway-certgen: { condition: service_completed_successfully }
      # No shared rate-limit datastore is wired up: Envoy's local rate limiter
      # is an in-process token bucket (gateway/eg/backendtrafficpolicy.yaml)
      # and needs no counter store. Valkey still serves product-service's cache.

  # ---- Frontend (built with the gateway origin baked in) ----
  frontend:
    build:
      context: ../../frontend
      args:
        API_BASE_URL: http://localhost:8080
        # RFC-0024 P3 (frontend#90): keycloak-js login — the Dockerfile turns
        # these ARGs into VITE_* at build time. Browser-facing origin, so
        # localhost:8081 (not the in-network keycloak:8080).
        KEYCLOAK_URL: http://localhost:8081
        KEYCLOAK_REALM: duynhlab
        KEYCLOAK_CLIENT_ID: customer-spa
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      # service_started, not service_healthy: the Envoy Gateway image is
      # distroless and cannot run a Compose healthcheck at all (see the gateway
      # service). The cost is a startup race — the SPA can be served before the
      # edge accepts requests, so a page loaded in that window shows failed API
      # calls until it is refreshed.
      gateway: { condition: service_started }

  # The Backoffice Portal (RFC-0023). Everything it needs was already here —
  # the `duynhlab-staff` realm import, the `admin-portal` client with
  # http://localhost:3009 as its redirect origin, the operator `duyne`, the CORS
  # entry in gateway/eg/securitypolicy.yaml, and the staff-protected routes that
  # Phase A17-A20 drive with curl. Only the SPA container was missing, so the
  # whole protected surface was verified by request and never by browser.
  #
  # Port 3009 was reserved for running this SPA outside Compose (`npm run dev`),
  # which is why the realm and the CORS policy already name it; serving the
  # container on the same port keeps one origin for both ways of running it.
  admin:
    build:
      context: ../../admin-service
      args:
        API_BASE_URL: http://localhost:8080
        # Same build-arg contract as the storefront: the Dockerfile turns these
        # into VITE_* at build time. Browser-facing origin, so localhost:8081.
        KEYCLOAK_URL: http://localhost:8081
        # The workforce realm (ADR-050), not the customer one. A customer-realm
        # token is rejected at the edge as wrong-issuer, which is the fence this
        # portal sits behind.
        KEYCLOAK_REALM: duynhlab-staff
        KEYCLOAK_CLIENT_ID: admin-portal
    ports:
      - "3009:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      # Same startup race as the storefront: the distroless gateway image cannot
      # run a Compose healthcheck, so this can only wait for it to start.
      gateway: { condition: service_started }

volumes:
  envoy-gateway-data:
  victoria-traces-data:
  victoria-logs-data:
  victoria-metrics-data:
  pyroscope-data:
  clickhouse-data:
