# Not a routable backend: the OTLP gRPC sink the EnvoyProxy CR's tracing
# provider exports edge spans to. In the cluster this is a Kubernetes Service
# reference; standalone has no Services, so the collector gets a Backend like
# everything else.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: otel-collector
spec:
  endpoints:
    - fqdn:
        hostname: otel-collector
        port: 4317
