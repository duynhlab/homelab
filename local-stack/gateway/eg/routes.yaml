---
# payment — provider webhooks, anonymous. TWO path matches in ONE rule, which is
# how Gateway API expresses "either of these paths, same backend": `matches` is a
# list and its entries are ORed. The second path is the deprecated pre-v3 alias,
# kept during the expand phase so an in-flight provider retry aimed at the old
# URL still lands (removed at contract, ADR-017). `mockpay` posts to the first
# at http://gateway:8000/payment/v1/public/payments/webhooks/mockpay.
#
# Anonymous on purpose, and it is the one route where that is a security
# decision rather than an absence of one: the credential is the provider's HMAC
# over the RAW request body, which the payment service verifies. An edge JWT
# here would be unsatisfiable — a payment provider has no realm token — so the
# webhook would 401 and the saga would stall waiting for a callback that could
# never arrive.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-payment-webhooks
spec:
  parentRefs:
    - name: platform
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /payment/v1/public/payments/webhooks
        - path:
            type: PathPrefix
            value: /payment/v1/public/webhooks
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: payment
---
# checkout — private only. Edge JWT. Confirm sends Idempotency-Key, which the
# CORS policy must allow (securitypolicy.yaml) or the browser preflight kills
# the POST before it is sent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
