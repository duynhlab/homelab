# HTTPRoutes — the entire local edge surface: 12 routes over 10 backends.
#
# What this exposes: /{service}/v1/{public|private}/... pass-through. There is no
# path rewrite anywhere in this file, which is Gateway API's default — a
# `PathPrefix` match forwards the URI as received, and stripping the prefix would
# require an explicit URLRewrite filter. That default is what lets the services
# keep mounting their handlers on the full public path, so one URI names the same
# endpoint from the browser, from a curl on the host, and inside the container.
#
# Route NAMES are chosen to match the cluster's HTTPRoutes
# (kubernetes/infra/configs/envoy-gateway/routes/api.yaml), because the name is
# not decoration: Envoy Gateway derives the Envoy route and cluster names from
# the HTTPRoute that produced them, so the name surfaces in `%ROUTE_NAME%` and
# `%UPSTREAM_CLUSTER%` in every access-log line. Keeping the names aligned makes
# a log field mean the same thing in both environments. The namespace segment
# inside those derived names differs — routes live in one namespace here and in
# per-application namespaces in the cluster — so compare the route name, not the
# whole string.
#
# EVERY route is AUDIENCE-SCOPED. This is the whole point of the file, not a
# style choice: `internal` is a real audience served by these same containers
# (POST /product/v1/internal/products creates catalog rows with no auth of its
# own; DELETE /cart/v1/internal/cart/{userId} takes the victim's id from the
# PATH). A bare `/product/` or `/cart/` prefix therefore publishes them. Audit
# row A8 exists because that once happened. Never add a route whose PathPrefix
# stops before the audience segment.
#
# PathPrefix has no trailing slash, and that is safe because Gateway API matches
# by SEGMENT, not by string prefix: `/user/v1/private` matches
# `/user/v1/private` and `/user/v1/private/...` but never `/user/v1/privatefoo`.
# This is the property the audience scoping above rests on — a string-prefix
# matcher would make `/cart/v1/private` also match a hypothetical
# `/cart/v1/privateinternal`, and every "is this prefix tight enough" question
# would need re-answering per path.
#
# Which routes carry edge JWT is declared once, in securitypolicy.yaml — the
# seven `private` routes. Everything else is anonymous by design:
#   auth public      login/register/refresh/logout/jwks (P3: still auth-service)
#   user public      GET /users/{id}
#   product public   catalog reads
#   review public    review lists
#   shipping public  track + estimate
#   payment public   provider webhooks — the HMAC over the raw body is the
#                    credential; an edge JWT would break mockpay.
#
# No ResponseHeaderModifier security-header filters here, unlike the cluster
# routes. HSTS is the clearest case for why: it instructs a browser to refuse
# plain HTTP to this origin for the stated duration, and this listener IS plain
# HTTP, so sending it would either be ignored or would poison `localhost` for
# every other local service on that origin. Documented divergence, not an
# oversight.
# There is deliberately NO /auth/v1/ route. Identity is the realm's job: the SPA
# obtains tokens from Keycloak directly (Authorization Code + PKCE against
# http://localhost:8081) and the edge verifies them against the realm's JWKS, so
# the edge never fronts an authentication service. Any /auth/v1/… request
# therefore 404s here because no route matches — which is what the audit asserts.
# user — public reads.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-user-public
spec:
  parentRefs:
    - name: platform
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /user/v1/public
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: user
---
# user — private profile. Edge JWT.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
