      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: review
---
# shipping — public track + estimate only. Internal shipment writes
# (/shipping/v1/internal/...) stay east-west, order-service only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-shipping
spec:
  parentRefs:
    - name: platform
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /shipping/v1/public
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: shipping
---
# notification — private only. Edge JWT. /notification/v1/internal/* stays
# east-west (the order saga calls it over gRPC anyway).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-notification
spec:
  parentRefs:
    - name: platform
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /notification/v1/private
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: notification
---
# payment — private payments API. Edge JWT. /payment/v1/internal/ (refunds,
# reconciliation) is not routed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-payment-private
spec:
  parentRefs:
    - name: platform
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /payment/v1/private
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: payment
---
# payment — provider webhooks, anonymous. Two paths in one route, as Kong had:
# the second is the deprecated pre-v3 alias kept so in-flight mockpay retries
# keep landing (remove at contract, ADR-017). `mockpay` posts to the first one
# at http://gateway:8000/payment/v1/public/payments/webhooks/mockpay.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-payment-webhooks
spec:
  parentRefs:
    - name: platform
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /payment/v1/public/payments/webhooks
        - path:
            type: PathPrefix
            value: /payment/v1/public/webhooks
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: payment
---
# checkout — private only. Edge JWT. Confirm sends Idempotency-Key, which the
# CORS policy must allow (securitypolicy.yaml) or the browser preflight kills
# the POST before it is sent.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-checkout-private
spec:
  parentRefs:
    - name: platform
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /checkout/v1/private
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: checkout
