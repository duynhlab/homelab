# SecurityPolicies — edge JWT and CORS.
#
# What this exposes: (1) which routes demand a Keycloak realm token before
# Envoy will forward the request, and (2) which browser origins may call the
# edge at all.
#
# ---- Edge JWT ----------------------------------------------------------------
# This is why local-stack can no longer run Kong. Kong OSS matches a token to a
# consumer credential by its `iss` claim and verifies with a STATIC public key
# provisioned in kong.yml; it cannot fetch a JWKS. After the RFC-0024 P3
# identity cutover the fleet's tokens are minted by Keycloak, so every private
# route 401'd at the Kong edge and the audit's private-route rows could not
# pass. Envoy fetches and refreshes the realm JWKS itself — zero key material
# in git, and key rotation needs no edge action.
#
# `issuer` must be the string the token actually carries. Keycloak `start-dev`
# has no --hostname, so it derives `iss` from the request host, and the browser
# (and scripts/keycloak-token.sh) reach it at the published origin — hence
# http://localhost:8081/..., NOT http://keycloak:8080/... The JWKS FETCH,
# however, runs from inside the Compose network where localhost:8081 is the
# gateway container itself, so the URI must name the service. That split is the
# same one x-svc-env documents for OIDC_ISSUER / OIDC_JWKS_URL; getting it
# backwards fails one way at boot (JWKS unreachable) and the other way at
# request time (`Jwt issuer is not configured`).
#
# Plain HTTP to Keycloak, matching the cluster (KC_HTTP_ENABLED=true), so no
# Backend + BackendTLSPolicy is needed for the JWKS hop.
#
# No `audiences`: same as the cluster. Audience enforcement is the service's
# job (pkg/authmw checks aud=duynhlab-platform and is authoritative); the edge
# is the coarse filter (ADR-006 principle, re-homed by ADR-045). Do not "tighten"
# this without changing the cluster policy too — divergence is worse than
# duplication here.
#
# `mergeType: StrategicMerge` keeps the gateway-level CORS baseline below
# applied to these seven routes; without it a route-level SecurityPolicy
# replaces the gateway one outright and the SPA's preflights start failing on
# exactly the routes it needs most.
#
# Preflight: Envoy's CORS filter answers OPTIONS before JWT auth runs, which is
# what Kong's `run_on_preflight: false` bought explicitly.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: jwt-edge
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-user-private
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-cart
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-order
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-review-private
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-notification
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-payment-private
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: api-checkout-private
  jwt:
    providers:
      - name: keycloak
        issuer: http://localhost:8081/realms/duynhlab
        remoteJWKS:
          uri: http://keycloak:8080/realms/duynhlab/protocol/openid-connect/certs
---
# ---- CORS -------------------------------------------------------------------
# Needed, not optional: the SPA is served from http://localhost:3001 and calls
# the edge on http://localhost:8080 — different port, therefore a different
# origin, therefore every non-simple request is preflighted. Attached to the
# Gateway so all 12 routes inherit it (Gateway API has no global filter; this
# is the EG-native equivalent of Kong's global cors plugin).
#
# Header lists are the SPA's actual needs:
#   Authorization    realm access token on every private call
#   Content-Type     JSON bodies
#   Idempotency-Key  checkout confirm (RFC-0015 P3) — without it the preflight
#                    rejects the POST and the request is never sent
#   X-Request-ID     client-supplied correlation id when present
# and on the way out, the rate-limit headers the local rate limiter emits are
# X-RateLimit-* (IETF draft-03), NOT Kong's RateLimit-* — a real behavioral
# difference the SPA sees. Retry-After is not CORS-safelisted, so the 429
# "wait Ns" hint has to be exposed explicitly.
#
# localhost:3000 is allowed because the realm's customer-spa client permits it
# as a redirect origin (`npm run dev` outside Compose).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: cors-policy
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: platform
  cors:
    allowOrigins:
      - "http://localhost:3001"
      - "http://localhost:3000"
    allowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowHeaders:
      - Content-Type
      - Authorization
      - X-Request-ID
      - Idempotency-Key
    exposeHeaders:
      - X-Request-ID
      - X-RateLimit-Limit
      - X-RateLimit-Remaining
      - X-RateLimit-Reset
      - Retry-After
    allowCredentials: true
    maxAge: 1h
