# Grafana datasource for the local stack — VictoriaLogs through the official
# victoriametrics-logs-datasource plugin (installed via GF_INSTALL_PLUGINS in
# compose.yaml, same 0.29.0 the cluster pins). Mirrors the in-cluster datasource
# (kubernetes/infra/configs/observability/grafana/datasource-victorialogs.yaml)
# including the uid, so panels port between stacks unchanged. Before this file
# existed, local logs were reachable only through VictoriaLogs' own vmui.
apiVersion: 1
datasources:
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    uid: victorialogs
    access: proxy
    url: http://victoria-logs:9428
