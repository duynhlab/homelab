# Vector for the local stack — mirrors the in-cluster DaemonSet pipeline
# (kubernetes_logs -> transforms -> VictoriaLogs) using the docker_logs source.
# Tails every compose container's stdout/stderr, lifts the service name and
# parses JSON log lines, then ships to VictoriaLogs' jsonline ingest — the same
# sink the cluster uses.
#
# This is the path for anything without an OTel SDK: the databases and the
# infrastructure containers. It runs alongside the OTLP log export into the same
# VictoriaLogs instance; the two are told apart by their stream fields (Vector
# rows carry `service`/`container_name`, OTLP rows carry the `service.name`
# resource attribute).
#
# The EDGE is no longer on this road. ADR-060 gave Envoy Gateway an
# OpenTelemetry access-log sink, so its lines arrive over OTLP with
# `service.name=platform.envoy-gateway`. One consequence worth knowing before
# someone reports the edge's logs as missing: the JSON format maps its keys to
# log-record ATTRIBUTES rather than a body, so a free-text search finds nothing
# and VictoriaLogs renders `_msg` as "missing _msg field". Query by stream
# instead -- `_stream:{"service.name"="platform.envoy-gateway"}` -- and every
# field (`status`, `route_name`, `response_flags`, ...) is there.

sources:
  docker:
    type: docker_logs
    # Anything that ships its own logs over OTLP must NOT be tailed here too,
    # or every line lands in VictoriaLogs twice. This list is the compose
    # equivalent of the cluster's label selector
    # (extra_label_selector: "platform.duynhlab.dev/otlp-logs!=true") and it is
    # just as load-bearing: nothing errors when an entry is missing, the store
    # simply holds the line twice.
    #
    # `OTEL_LOGS_ENABLED: "true"` lives in the *svc-env anchor, so it applies to
    # ALL TEN services and BOTH workers -- keep this list in step with that
    # anchor, not with a remembered service count.
    #
    # The `gateway` entry is ADR-060: the edge now has an OpenTelemetry
    # access-log sink beside its File sink, so it too travels the OTLP road.
    # Its stdout keeps being written, so `docker logs` on the edge still works.
    exclude_containers:
      - local-stack-user-1
      - local-stack-product-1
      - local-stack-cart-1
      - local-stack-order-1
      - local-stack-order-worker-1
      - local-stack-review-1
      - local-stack-shipping-1
      - local-stack-notification-1
      - local-stack-payment-1
      - local-stack-checkout-1
      - local-stack-checkout-worker-1
      - local-stack-inventory-1
      - local-stack-gateway-1

transforms:
  shape:
    type: remap
    inputs: [docker]
    source: |
      # Service name from the compose service label; fall back to container name.
      .service = .label."com.docker.compose.service"
      if .service == null { .service = .container_name }
      # Parse JSON log lines; keep plain-text lines (e.g. gin's [GIN] lines) as
      # raw messages. The edge's JSON access log used to be parsed here; it
      # travels over OTLP since ADR-060.
      parsed, err = parse_json(string!(.message))
      if err == null {
        . = merge!(., object!(parsed))
      }
      # Drop noisy fields Vector adds that the cluster pipeline doesn't keep.
      del(.label); del(.image); del(.host); del(.source_type)

sinks:
  victorialogs:
    type: http
    inputs: [shape]
    uri: http://victoria-logs:9428/insert/jsonline?_stream_fields=service,container_name&_msg_field=message&_time_field=timestamp
    encoding:
      codec: json
    framing:
      method: newline_delimited
    request:
      headers:
        Content-Type: application/stream+json
