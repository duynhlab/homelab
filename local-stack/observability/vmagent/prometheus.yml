# vmagent scrape config — the local counterpart of the cluster's
# ServiceMonitor/PodMonitor CRs (kubernetes/infra/configs/observability/
# metrics/{servicemonitors,podmonitors}/). Static targets because Compose has
# no service discovery; job names are chosen so the alert exprs' job matchers
# mean the same thing in both stacks.
#
# Deliberately NOT scraped here:
#   - the application services — their metrics arrive over OTLP through the
#     collector (RFC-0014 P3: OTLP is the only app-metrics pipeline);
#     scraping them too would double-ingest.
#   - victoria-* backends — singletons whose own /metrics matter less locally
#     than the two targets below; add them if a local investigation needs it.
global:
  scrape_interval: 15s
  external_labels:
    env: local

scrape_configs:
  # The engine that stores OTel logs+traces SQL. Its built-in Prometheus
  # endpoint (observability/clickhouse/metrics.xml) is the local engine view;
  # `up{job="clickhouse"}` is a REAL server-liveness signal here, unlike the
  # cluster where liveness is inferred from the Altinity exporter's fetches.
  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

  # The collector's :8888 self-telemetry — otelcol_* series, identical names
  # to the cluster, so OtelCollectorDown and ClickHouseExporterUnhealthy map
  # 1:1 from the cluster catalog.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # The edge, both halves (dashboards: Observability/envoy-gateway-local):
  #
  # envoy-gateway — the CONTROL PLANE's own metrics server (xds_snapshot_*,
  # watchable_*, status updater, go_*): is the thing that programs the proxy
  # healthy and keeping up.
  - job_name: envoy-gateway
    static_configs:
      - targets: ["gateway:19001"]

  # envoy — the DATA PLANE. Native envoy_* stats (downstream rq/cx per
  # listener, per-cluster upstream rq/latency/membership) served through the
  # bootstrap-merged :19005 listener (gateway/eg/envoyproxy.yaml) because Host
  # mode ships no prometheus listener of its own. These are the edge's own
  # counters, as distinct from the span-derived RED the collector computes;
  # a request the edge rejects before a span exists (JWT 401, no route) is
  # visible only here.
  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["gateway:19005"]

  # Temporal server — service_* / persistence_* families on the listener the
  # PROMETHEUS_ENDPOINT env enables (compose.yaml, temporal service). Job name
  # `temporal` so the cluster alert expr `up{job=~".*temporal.*"}` means the
  # same thing on both stacks. SDK-side temporal_* metrics do NOT come from
  # here — workers push those over OTLP like every app metric.
  - job_name: temporal
    static_configs:
      - targets: ["temporal:8000"]
