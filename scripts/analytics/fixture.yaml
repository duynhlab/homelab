# Applied by scripts/analytics/serving-fixture.sh, never by Flux: the
# fixture-backed serving layer for the analytics dark launch (RFC-0030 G8).
# __ORDERS__ is substituted by the script.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: analytics-fixture-seed
  namespace: monitoring
  labels:
    app.kubernetes.io/name: analytics-fixture
    app.kubernetes.io/component: fixture
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-fixture
        app.kubernetes.io/component: fixture
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: seed
          image: clickhouse/clickhouse-server:26.9
          command: ["bash", "-ec"]
          # The database must be Replicated and exist on every replica (the
          # service reaches the load balancer, which fans out across all three);
          # the schema Job does the same for otel and pg_stat_ch. A plain
          # database left by an earlier attempt is dropped first. Tables and
          # views then land through the Replicated DDL from one replica.
          args:
            - |
              lb=clickhouse-clickhouse.monitoring.svc.cluster.local
              cli() { clickhouse-client --host "$1" --password "$CLICKHOUSE_PASSWORD" "${@:2}"; }
              for h in $(cli "$lb" -q "SELECT DISTINCT host_name FROM system.clusters WHERE cluster='otel'"); do
                host="$h.monitoring.svc.cluster.local"
                engine=$(cli "$host" -q "SELECT engine FROM system.databases WHERE name='analytics'")
                if [ -n "$engine" ] && [ "$engine" != Replicated ]; then
                  echo "dropping non-Replicated analytics on $h ($engine)"; cli "$host" -q "DROP DATABASE analytics SYNC"
                fi
                cli "$host" -q "CREATE DATABASE IF NOT EXISTS analytics ENGINE = Replicated('/clickhouse/databases/analytics', '{shard}', '{replica}')"
                echo "analytics database Replicated on $h"
              done
              # Replicated DDL fans the CREATE out, but a plain MergeTree engine is not
              # converted: the data would live on one replica only. Use the Replicated
              # engine here; compose keeps the plain one (no Keeper).
              sed 's/ENGINE = ReplacingMergeTree(/ENGINE = ReplicatedReplacingMergeTree(/' /fixture/serving.sql > /tmp/serving.sql
              cli "$lb" --multiquery --param_orders=__ORDERS__ --queries-file /tmp/serving.sql
              for h in $(cli "$lb" -q "SELECT DISTINCT host_name FROM system.clusters WHERE cluster='otel'"); do
                echo "$h: $(cli "$h.monitoring.svc.cluster.local" -q "SELECT count() FROM system.tables WHERE database='analytics'") analytics objects"
              done
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: password
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "256Mi"
      volumes:
        - name: fixture
          configMap:
            name: analytics-fixture
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-heartbeat
  namespace: monitoring
  labels:
    app.kubernetes.io/name: analytics-heartbeat
    app.kubernetes.io/component: fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-heartbeat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-heartbeat
        app.kubernetes.io/component: fixture
    spec:
      securityContext:
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: heartbeat
          image: clickhouse/clickhouse-server:26.9
          command: ["sh", "/fixture/heartbeat.sh"]
          env:
            - name: CLICKHOUSE_HOST
              value: clickhouse-clickhouse.monitoring.svc.cluster.local
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: password
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "64Mi"
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f heartbeat.sh"]
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f heartbeat.sh"]
            periodSeconds: 10
      volumes:
        - name: fixture
          configMap:
            name: analytics-fixture
